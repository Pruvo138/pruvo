name: D1 uzlastirici (katalog sapmasi)

# ══════════════════════════════════════════════════════════════════════════════
# NEDEN VAR — OLCULEN SESSIZLIK (31 Tem 2026, adli rapor)
# ══════════════════════════════════════════════════════════════════════════════
# D1 ile urunler.json arasinda sapma olustugunda (bayat bir kosum yeni partiyi
# silmesi, bir senkronun kacmasi, `--no-verify` push, GitHub web arayuzunden
# duzenleme, baska makineden push) SITE urunu gosterir ama EGE (WhatsApp botu)
# D1'den okudugu icin GOREMEZ = sessiz satis kaybi.
#
# OLCULEN PENCERE: sapmayi kapatan TEK mekanizma "baska birinin urun push'u"
# idi -> min 2,0 dk · medyan 3,9 dk · max 24,2 dk; parti akisi durursa pencere
# SINIRSIZ. Fark edilme tesadufe kalmisti (iki vaka da elle bakilirken goruldu).
#
# BU IS: yayin yolundan TAMAMEN AYRI (deploy.yml'e `needs` ile bagli DEGIL, ayri
# is akisi, `push` tetikleyicisi YOK) -> yayin yoluna maliyeti 0 sn. 15 dakikada
# bir katalogu OLCER; sapma varsa ONARIR ve onarimi DOGRULAR.
#
# NEDEN "ONAR" (yalniz alarm DEGIL): alarm-only sapmayi bir insan gelene kadar
# acik birakir; olculen zarar sinifi tam da "kimse bakmadigi icin surer" tipidir.
# Onarim RISKSIZ DEGIL ama KAPILI: `d1-sync.py` icindeki BAYATLIK KAPISI bayat bir
# agactan gelen HER YAZMAYI (silme + upsert) reddeder; yazma ancak agac uzak main'in
# UCUNDA iken gecer (bu is her zaman uctan kosar; kosum sirasinda yeni bir push
# gelirse kapi fail-closed durdurur ve is KIRMIZI olur). Yani uzlastirici, kacagi
# UREten yolun kendisinden gecemez.
#
# 🔴 BU IS ARTIK EMNIYET AGININ TA KENDISI (KraL karari 31 Tem): bayat yazicilarin
# TAMAMI bloklandigi icin D1'i guncelleyecek iki yol kaldi — (1) uctan kosan
# pre-push hook'u / CI adimi, (2) bu uzlastirici. (1) atlanir ya da basarisiz olursa
# sapmayi KAPATAN tek sey budur. Olculdu (offline, uctan uca): uctaki kosumun D1
# adimi atlandiginda 42 eksik id bu adim sirasiyla yakalanip kapatildi (EKSIK 42 -> 0).
#
# NEDEN --durum (K5 DEGIL): tools/canli-saglik-kapisi.py K5 ekseni ayni yone bakar
# ama KAPSAMI EN YENI 20 URUNLE (ve konfigursuzlerle) SINIRLI bir orneklemdir.
# `d1-sync.py --durum` icerik ekseni TUM katalogu (bugun 15.921 id) urun_hash
# duzeyinde karsilastirir -> bu sapma sinifi icin kapsam KAT KAT genis.
#
# NEDEN yayin adimi da var: silinmis bir satir geri yazilinca TASLAK (yayinda=0)
# dogar; taslak urunu Ege GOSTERMEZ. Onarim ancak canlida 200 donen taslaklar
# yayina alininca fiilen kapanir (atomik yayin sozlesmesi, deploy.yml `yayin` isi).

# 🔴 CRON DAKIKASI NEDEN 7/22/37/52 (OLCULDU, 31 Tem 2026 — `*/15` HIC ATESLENMEDI)
# ─────────────────────────────────────────────────────────────────────────────
# Bu is akisi 31 Tem 11:38:52Z'de `*/15 * * * *` ile main'e girdi. 16:14Z'de olculdu:
#   gh api repos/Pruvo138/pruvo/actions/runs?event=schedule -> total_count = 0
# Yani 4 sa 36 dk boyunca BEKLENEN ~18 tetiklemenin SIFIRI kostu; is akisi `active`,
# dosya main'de, depo hareketli. `*/15` tam olarak dakika 0/15/30/45'e duser — GitHub'in
# en yogun tetikleme dakikalari; dokumantasyonun kendi tavsiyesi bu dakikalardan
# KACINMAKTIR, cunku kuyruk kisitlaninca zamanlanmis kosum DUSER (yeniden denenmez).
# COZUM: `*/15` yerine ACIK DAKIKA LISTESI ve sabit ofset -> 7,22,37,52.
#   * 15 dakikalik CADANS AYNEN KORUNUR (4 tetikleme/saat), yalniz faz kayar.
#   * Ceyrek-saat sinirlarinin hicbirine denk gelmez.
# Bu secim tools/cron-nabiz-kapisi.py A1 ekseniyle KILITLIDIR: `*/15`e geri cevrilirse
# nobetci KIRMIZI yanar. A3 ekseni de "son 3 saatte hic zamanlanmis kosum yok" halini
# alarm sayar -> bu isin bir daha SESSIZCE olmesi mumkun degil.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  # Elle kosturma yolu HER ZAMAN acik (cron kacarsa/kuyruk duserse insan tetikleyebilir).
  workflow_dispatch:

permissions:
  contents: read

# Yayin is akisiyla (deploy.yml `group: pages`) AYRI grup: uzlastirici hicbir
# yayin adimini beklemez ve hicbir yayin adimini bekletmez.
concurrency:
  group: d1-uzlastirici
  cancel-in-progress: true

jobs:
  uzlastir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # npx wrangler (d1-sync'in D1 istemcisi) icin.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ═══════════════════════════════════════════════════════════════════════
      # UCA TAZELE — "dogustan bayat checkout" halinin ONARIMI (OLCULDU 31 Tem)
      # ═══════════════════════════════════════════════════════════════════════
      # Zamanlanmis kosum `github.sha`'yi (tetikleme anindaki main ucu) checkout eder.
      # Kuyruk + kurulum gecikmesi boyunca main ilerlerse agac DOGUSTAN bayattir.
      # OLCULDU (kosum 30664207786, 20:47:18Z): checkout ca0376e7c448, uzak uc
      # 2d4975f4bf85; on-kosul 20:51:07Z'de (3 dk 49 sn sonra) BAYAT dedi ve
      # OLCUM/ONARIM/TEYIT adimlarinin HEPSI `skipped` oldu -> kosum SUCCESS, denetim SIFIR.
      # Bu adim agaci uzak main'in UCUNA getirir: 15 dakikalik cadans, donmus bir SHA'nin
      # degil GUNCEL katalogun denetimi olur.
      - name: Uca tazele — agaci uzak main ucuna getir (donmus github.sha DEGIL)
        run: |
          git fetch --depth=1 origin main
          git reset --hard FETCH_HEAD
          git rev-parse HEAD

      # ON-KOSUL: tazeleme TUTTU mu? Tutmadiysa OLCUM DE ONARIM DA yapilmaz (bayat
      # agacla "sapma var" demek SAHTE ALARM, onarmak ise KACAGIN TA KENDISI olurdu).
      # Bu adim artik bir MUHTEMELLIK degil TAZELEMENIN TEYIDIDIR.
      - name: On-kosul — tazeleme tuttu mu (agac uzak main'in ucunda mi)
        id: bayatlik
        run: |
          if python3 tools/d1-sync.py --bayatlik; then
            echo "uc=evet" >> "$GITHUB_OUTPUT"
          else
            echo "uc=hayir" >> "$GITHUB_OUTPUT"
            echo "BAYAT AGAC — tazelemeden SONRA da uc degil (kosum sirasinda yeni push). Bu kosum olcum/onarim YAPMAZ." >> "$GITHUB_STEP_SUMMARY"
          fi

      # OLCUM: sayi ekseni + ICERIK ekseni (urun_hash) — tam kapsam, salt-okuma.
      # Sapma varsa d1-sync --durum SIFIR-DISI doner; burada onu YUTMUYORUZ, bir
      # sonraki adima "sapma var mi" bilgisi olarak tasiyoruz (adim kirmizi olsa
      # is kirmizi olur ve onarim hic kosmazdi).
      - name: Olcum — D1 == urunler.json (sayi + icerik ekseni)
        if: steps.bayatlik.outputs.uc == 'evet'
        id: olcum
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dbbe2a8620c3c3a57c586b8a98142fb9
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret yok — uzlastirici OLCEMEDI." >> "$GITHUB_STEP_SUMMARY"
            echo "sapma=olculemedi" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          rc=0
          python3 tools/d1-sync.py --durum > durum-once.txt 2>&1 || rc=1
          cat durum-once.txt
          if [ "$rc" = "0" ]; then
            echo "sapma=yok" >> "$GITHUB_OUTPUT"
            echo "D1 == urunler.json ✅ (sapma yok)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "sapma=var" >> "$GITHUB_OUTPUT"
            echo "🔴 D1 SAPMASI OLCULDU — onarim kosuyor:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -30 durum-once.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # ONARIM: ayni bayatlik kapisindan gecer (d1-sync icindeki kapi silmeyi ancak
      # agac UCTA iken uygular). Kosum sirasinda yeni bir push gelirse kapi devreye girer.
      #
      # 🔴 NEDEN SURUCU ILE (OLCULDU 31 Tem, kosum 30650256818): on-kosul 17:12:47.458Z'de
      # "UC" dedi; 28,79 sn SONRA onarim adimi bayatlik kapisina takildi (uzak uc
      # 0db2aafbb580'e ilerlemisti) ve 21 bayat hash'in 0'i yazildi. Kok neden KOD/AKIS
      # (on-kosul ile yazma arasindaki TOCTOU yarisi), ALTYAPI DEGIL: log'da wrangler
      # hatasi / D1 7429 CPU tavani / ag hatasi YOKTU.
      # tools/uzlastirici-onarim.py her denemede agaci UCA TAZELER ve YALNIZ bayatlik
      # kapisi reddinde geri cekilip TEKRAR dener (olculen: 15 sn, 45 sn; tek denemede
      # carpisma %1,47 -> uc denemede 3,2e-6). BASKA her hata (wrangler/D1/sema/kod)
      # YENIDEN DENENMEZ, rc 1 ile GORUNUR kalir.
      - name: Onarim — uzlastirici surucusu (uca tazele + yaris yeniden denemesi)
        if: steps.olcum.outputs.sapma == 'var'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dbbe2a8620c3c3a57c586b8a98142fb9
        run: python3 tools/uzlastirici-onarim.py

      # Geri yazilan satir TASLAK dogar; Ege taslagi GORMEZ. Canlida 200 donen
      # taslaklari yayina al -> onarim fiilen musteriye ulasir.
      - name: Onarim sonrasi atomik yayin (canlida 200 donen taslaklar)
        if: steps.olcum.outputs.sapma == 'var'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dbbe2a8620c3c3a57c586b8a98142fb9
        run: python3 tools/yayin-kapisi.py --yayinla

      # TEYIT: onarim IDDIA degil, KANIT olsun. Hala sapma varsa is KIRMIZI kalir
      # (GitHub bildirimi) — sessizce yesil donmek bu kacagi dogurmus olan hataydi.
      - name: Teyit — onarimdan sonra sapma SIFIR mi
        if: steps.olcum.outputs.sapma == 'var'
        id: teyit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dbbe2a8620c3c3a57c586b8a98142fb9
        run: |
          python3 tools/d1-sync.py --durum
          echo "✅ Onarim DOGRULANDI (D1 == urunler.json)" >> "$GITHUB_STEP_SUMMARY"

      # ═══════════════════════════════════════════════════════════════════════
      # DAMGA — "denetim FIILEN yapildi" kaydi (tools/cron-nabiz-kapisi.py A0 ekseni)
      # ═══════════════════════════════════════════════════════════════════════
      # 🔴 NEDEN: bir kosumun YESIL olmasi denetim yapildigi ANLAMINA GELMEZ. OLCULDU
      # (kosum 30664207786, 20:47:18Z): conclusion=success · olcum/onarim/teyit adimlarinin
      # HEPSI `skipped`. Alarm ekseni bu yuzden "cron atesledi mi"dan "son basarili
      # UZLASTIRMA ne kadar eski"ye tasindi; bu adim o eksenin KAYNAGIDIR.
      #
      # NEDEN ARTIFACT, depoda IZLENEN dosya DEGIL: uzlastirici 15 dakikada bir main'e
      # PUSH etseydi main'in ucu surekli oynardi — 17:12Z kosumunu DUSUREN sey tam olarak
      # main ucunun yazma penceresinde ilerlemesiydi. Damga mekanizmasi, olcmesi gereken
      # hastaligi URETEMEZ. Artifact ise: depoya yazmaz · makine-okunur (ad + created_at +
      # expired + workflow_run TEK API cagrisinda) · saklamasi OLCULDU 24 saat (esik N=9
      # saatin 2,67 kati) · ve YALNIZ bu adim kosarsa dogar.
      #
      # KOSMA KOSULU (fail-closed): sapma YOKTU (olcum fiilen kostu) YA DA sapma vardi ve
      # TEYIT gecti. Onceki adimlardan biri duserse GitHub bu adimi zaten atlar -> damga
      # DOGMAZ -> bir sonraki nabiz olcumu KIRMIZI yanar. Tazeleme tutmadiysa (uc=hayir)
      # olcum `skipped` olur, `sapma` bos kalir ve damga YINE dogmaz.
      - name: Damga — son basarili uzlastirma kaydi
        if: steps.olcum.outputs.sapma == 'yok' || steps.teyit.outcome == 'success'
        run: |
          python3 tools/cron-nabiz-kapisi.py --damga-yaz uzlastirma-damgasi.json
          cat uzlastirma-damgasi.json
      - name: Damgayi yukle (artifact — nabiz kapisinin A0 ekseni bunu okur)
        if: steps.olcum.outputs.sapma == 'yok' || steps.teyit.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: uzlastirma-damgasi
          path: uzlastirma-damgasi.json
          if-no-files-found: error

      # ═══════════════════════════════════════════════════════════════════════
      # GORUNURLUK — sapma OLDUYSA kosum KIRMIZI yanar (onarim BASARILI olsa bile)
      # ═══════════════════════════════════════════════════════════════════════
      # NEDEN: "sessizce onarip yesil donmek" bu isin var olma sebebinin ta kendisini
      # gizler. Sapma OLMASI, ustteki bir yolun (pre-push kancasi / CI D1 adimi / elle
      # push) KACIRDIGININ kanitidir; onarildi diye o kacak yok olmaz. Bugun (31 Tem)
      # D1'de 56 kayitta icerik ekseni bayat bulundu ve ELLE senkronlandi — hicbir yerde
      # kirmizi yanmadigi icin fark edilmesi TESADUFE kalmisti.
      # MALIYET SIFIR: bu is akisi yayin yolundan TAMAMEN AYRI (deploy.yml'e `needs` ile
      # bagli DEGIL, `push` tetikleyicisi YOK) -> buradaki kirmizi hicbir yayini durdurmaz,
      # yalnizca GitHub bildirimi dusurur.
      - name: "Sapma gorunurlugu: sapma olduysa kosum KIRMIZI (yayin ETKILENMEZ)"
        if: steps.olcum.outputs.sapma == 'var'
        run: |
          echo "🔴 D1 SAPMASI OLDU — onarim kosturuldu ve teyit edildi; kosum GORUNURLUK icin KIRMIZI."
          echo "### 🔴 D1 sapmasi olustu ve onarildi (kosum bilerek KIRMIZI)" >> "$GITHUB_STEP_SUMMARY"
          echo "Sapma sayilari (onarimdan ONCE olculen):" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "icerik ekseni|hash UYUSMAZ|EKSIK|FAZLA|urun sayisi" durum-once.txt >> "$GITHUB_STEP_SUMMARY" || echo "(sapma satirlari ayiklanamadi — tam cikti olcum adiminda)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Sapmanin KENDISI bir ust-yol kacagidir (pre-push kancasi / CI D1 adimi / elle push)." >> "$GITHUB_STEP_SUMMARY"
          exit 1
