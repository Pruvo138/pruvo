name: D1 uzlastirici (katalog sapmasi)

# ══════════════════════════════════════════════════════════════════════════════
# NEDEN VAR — OLCULEN SESSIZLIK (31 Tem 2026, adli rapor)
# ══════════════════════════════════════════════════════════════════════════════
# D1 ile urunler.json arasinda sapma olustugunda (bayat bir kosum yeni partiyi
# silmesi, bir senkronun kacmasi, `--no-verify` push, GitHub web arayuzunden
# duzenleme, baska makineden push) SITE urunu gosterir ama EGE (WhatsApp botu)
# D1'den okudugu icin GOREMEZ = sessiz satis kaybi.
#
# OLCULEN PENCERE: sapmayi kapatan TEK mekanizma "baska birinin urun push'u"
# idi -> min 2,0 dk · medyan 3,9 dk · max 24,2 dk; parti akisi durursa pencere
# SINIRSIZ. Fark edilme tesadufe kalmisti (iki vaka da elle bakilirken goruldu).
#
# BU IS: yayini BLOKLAMAZ (deploy.yml'e `needs` ile bagli DEGIL) -> yayin yoluna
# maliyeti 0 sn. Katalogu OLCER; sapma varsa ONARIR ve onarimi DOGRULAR.
#
# 🔴 "PUSH TETIKLEYICISI YOK" BEYANI 4 AGU'DA BAYATLADI, DUZELTILDI: bu dosyada eskiden
# "yayin yolundan TAMAMEN AYRI (… `push` tetikleyicisi YOK)" yaziyordu. `needs` kismi
# HALA DOGRU; ikinci kism ARTIK DEGIL — asagidaki `workflow_call` tetikleyicisi var ve
# deploy.yml'in BLOKLAMAYAN `d1-kadans` kolu bu is akisini HER PUSH'ta cagiriyor. Bu
# depoda yorumdaki beyan olcumun kaynagi sayilir; bayat beyan yanlis guven verir.
# DOGRU BEYAN: "yayini BLOKLAMAZ" (yapisal: `deploy: needs` kapanisinda YOK) —
# "yayin yolundan tetiklenmez" DEGIL.
#
# NEDEN "ONAR" (yalniz alarm DEGIL): alarm-only sapmayi bir insan gelene kadar
# acik birakir; olculen zarar sinifi tam da "kimse bakmadigi icin surer" tipidir.
# Onarim RISKSIZ DEGIL ama KAPILI: `d1-sync.py` icindeki BAYATLIK KAPISI bayat bir
# agactan gelen HER YAZMAYI (silme + upsert) reddeder; yazma ancak agac uzak main'in
# UCUNDA iken gecer (bu is her zaman uctan kosar; kosum sirasinda yeni bir push
# gelirse kapi fail-closed durdurur ve is KIRMIZI olur). Yani uzlastirici, kacagi
# UREten yolun kendisinden gecemez.
#
# 🔴 BU IS ARTIK EMNIYET AGININ TA KENDISI (KraL karari 31 Tem): bayat yazicilarin
# TAMAMI bloklandigi icin D1'i guncelleyecek iki yol kaldi — (1) uctan kosan
# pre-push hook'u / CI adimi, (2) bu uzlastirici. (1) atlanir ya da basarisiz olursa
# sapmayi KAPATAN tek sey budur. Olculdu (offline, uctan uca): uctaki kosumun D1
# adimi atlandiginda 42 eksik id bu adim sirasiyla yakalanip kapatildi (EKSIK 42 -> 0).
#
# NEDEN --durum (K5 DEGIL): tools/canli-saglik-kapisi.py K5 ekseni ayni yone bakar
# ama KAPSAMI EN YENI 20 URUNLE (ve konfigursuzlerle) SINIRLI bir orneklemdir.
# `d1-sync.py --durum` icerik ekseni TUM katalogu (bugun 15.921 id) urun_hash
# duzeyinde karsilastirir -> bu sapma sinifi icin kapsam KAT KAT genis.
#
# NEDEN yayin adimi da var: silinmis bir satir geri yazilinca TASLAK (yayinda=0)
# dogar; taslak urunu Ege GOSTERMEZ. Onarim ancak canlida 200 donen taslaklar
# yayina alininca fiilen kapanir (atomik yayin sozlesmesi, deploy.yml `yayin` isi).

# 🔴 CRON DAKIKASI NEDEN 7/22/37/52 (OLCULDU, 31 Tem 2026 — `*/15` HIC ATESLENMEDI)
# ─────────────────────────────────────────────────────────────────────────────
# Bu is akisi 31 Tem 11:38:52Z'de `*/15 * * * *` ile main'e girdi. 16:14Z'de olculdu:
#   gh api repos/Pruvo138/pruvo/actions/runs?event=schedule -> total_count = 0
# Yani 4 sa 36 dk boyunca BEKLENEN ~18 tetiklemenin SIFIRI kostu; is akisi `active`,
# dosya main'de, depo hareketli. `*/15` tam olarak dakika 0/15/30/45'e duser — GitHub'in
# en yogun tetikleme dakikalari; dokumantasyonun kendi tavsiyesi bu dakikalardan
# KACINMAKTIR, cunku kuyruk kisitlaninca zamanlanmis kosum DUSER (yeniden denenmez).
# COZUM: `*/15` yerine ACIK DAKIKA LISTESI ve sabit ofset -> 9,24,39,54.
#   * Ceyrek-saat sinirlarinin hicbirine denk gelmez.
#
# 🔴 DUZELTME — "15 dk CADANS AYNEN KORUNUR" IDDIASI CURUTULDU (OLCULDU 4 Agu 2026)
# Burada eskiden "15 dakikalik CADANS AYNEN KORUNUR (4 tetikleme/saat)" yaziyordu.
# FIILI dagilim: 4745 dk pencerede BEKLENEN 316 kosum, GERCEKLESEN 16 (%5,06); bosluk
# medyani 214,8 dk, EN UZUN ARDISIK BOSLUK 1053 dk = 17,6 saat. paket-tazelik-alarmi.yml
# (ofset 13,28,43,58) AYNI oranda dusuyor ve IKISI AYNI DAKIKALARDA, PARTI HALINDE
# atesleniyor -> ofset sorunu COZMEDI, hal DEPO/HESAP duzeyinde. Ofset yine de KALIR:
# `*/15`in SIFIR teslimine gore (%0) daha iyidir, ama "cadans korunur" DEMEK DEGILDIR.
#
# Bu secim tools/cron-nabiz-kapisi.py A1 ekseniyle KILITLIDIR: `*/15`e geri cevrilirse
# nobetci KIRMIZI yanar. A3 ekseni son zamanlanmis kosumun yasini OLCULEN cadanstan
# turetilen esikle (N=9 sa) tartar; A5 ekseni ise cron METNI yerine FIILI TESLIM
# SAYISINI olcer (48 saatte 4 kosumun altina duserse KIRMIZI) -> bu isin bir daha
# SESSIZCE olmesi ya da sessizce SEYRELMESI mumkun degil.
#
# 🔴 KADANS KURTARMA — CRON ARTIK TEK KOL DEGIL (4 Agu 2026, OLCULDU)
# ─────────────────────────────────────────────────────────────────────────────
# Ustteki duzeltmenin sonucu net: ofsetli acik dakika listesi teslimi DUZELTMEDI
# (48 saatte 192 nominal tetiklemenin 7'si = %3,65; en uzun bosluk 1053 dk = 17,6 sa)
# ve hal DEPO/HESAP duzeyinde oldugu icin dakikayi bir daha oynatmak COZUM DEGIL.
# Bu yuzden is akisi `workflow_call` ile de tetiklenebilir hale getirildi: `deploy.yml`
# icindeki BLOKLAMAYAN `d1-kadans` job'u her push'ta bu AYNI DOSYAYI cagirir. Depo saatte
# onlarca push aldigi icin uzlastirma fiilen 15 dakikadan sik kosar ve GitHub'in
# zamanlanmis kuyruguna HIC bagimli olmaz.
#   · Govde KOPYALANMADI: iki kol da bu dosyadan kosar ([[ikiz-tanim-sessiz-ayrisma]]).
#   · Cron KALDI (ikinci kol): push'suz gecelerde kapsamayi o saglar.
#   · Eszamanlilik: asagidaki `concurrency` grubunu deploy.yml'deki cagiran job da
#     BEYAN EDER -> ayni anda IKI uzlastirma kosamaz (D1'e cift yazim penceresi kapali).
#     tools/cron-nabiz-kapisi.py::kadans_kablosu grup adini BU DOSYADAN okur ve ikisinin
#     ayrismasini KIRMIZI yakar.
#   · 🔴 CRON SAGLIGI AYRI OLCULUR: bu kolun yazdigi damgayi (`event=push`) A0 ekseni
#     "cron teslimi" SAYMAZ. Kadans (denetim yapildi mi) ile cron sagligi (kim yapti)
#     ayri eksenlerdir; karistirmak alarmin elle sondurulmesi demekti.
on:
  schedule:
    - cron: "9,24,39,54 * * * *"
  # Elle kosturma yolu HER ZAMAN acik (cron kacarsa/kuyruk duserse insan tetikleyebilir).
  workflow_dispatch:
  # deploy.yml `d1-kadans` job'u (BLOKLAMAYAN kol) bu is akisini cagirir.
  workflow_call:
    inputs:
      # ═══════════════════════════════════════════════════════════════════════
      # KOL AYRIMI — "yayin sagligi" ile "D1 sapmasi" AYRI SORULARDIR (4 Agu 2026)
      # ═══════════════════════════════════════════════════════════════════════
      # OLCULEN KUSUR: asagidaki sapma gorunurlugu adimi sapma bulunca BILEREK `exit 1`
      # verir. Kadans kolu `deploy: needs`'te OLMADIGI icin yayini DURDURMUYOR — ama
      # cagiran kosumun (deploy.yml) GENEL `conclusion`'ini `failure` yapiyordu. Sonuc:
      # TEK bir kirmizi IKI ayri soruyu birden cevapliyordu ("yayin calisti mi" +
      # "D1 sapmasi var mi"). Bu depoda olculmus sinif: TOPLU SONUC TEKIL EKSENI GIZLER
      # ([[hukum-yanlis-birimde]]) — "kosum kirmizi" ≠ "deploy olmadi". Bir insan ya da
      # nobetci "deploy kosumu yesil mi" refleksiyle bakarsa YANLIS okur; tersi de olur —
      # yayin GERCEKTEN bozuldugunda kirmiziya alismis olur.
      #
      # BU BAYRAK O AYRIMI YAPAR — ama sapmayi SESSIZLESTIRMEZ (en kolay ve en yanlis
      # cozum o olurdu). `true` iken sapma kendi kanalindan (`d1-sapma-damgasi` artifact'i
      # -> .github/workflows/d1-sapma-alarmi.yml, AYRI KOSUM, AYRI conclusion) KIRMIZI
      # yakar; cagiran kosumun conclusion'i YALNIZ yayin sagligini gosterir.
      #
      # 🔴 VARSAYILAN `false` — CRON/ELLE KOLUNUN DAVRANISI AYNEN KORUNUR: o kosumun TEK
      # isi bu denetimdir, orada `exit 1` MESRUDUR ve tek sinyal iki soruyu karistirmaz.
      # Bayrak YALNIZ deploy.yml `d1-kadans` job'u tarafindan `true` gecilir.
      kadans_kolu:
        description: >-
          deploy.yml `d1-kadans` kolundan mi cagrildi. true ise ONARILAN sapma bu kosumu
          KIRMIZI yakmaz (cagiran kosumun conclusion'i yayin sagligi olarak kalir), sapma
          `d1-sapma-damgasi` artifact'i ile AYRI alarm kanalina tasinir. ONARILAMAYAN
          sapma her iki kolda da KIRMIZI yakar.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  uzlastir:
    runs-on: ubuntu-latest
    # ═══════════════════════════════════════════════════════════════════════
    # ESZAMANLILIK — IS DUZEYINDE (is akisi duzeyinde DEGIL). 4 Agu 2026 kararı.
    # ═══════════════════════════════════════════════════════════════════════
    # Yayin is akisiyla (deploy.yml `group: pages`) AYRI grup: uzlastirici hicbir yayin
    # adimini beklemez ve hicbir yayin adimini bekletmez.
    #
    # 🔴 NEDEN IS DUZEYINDE: bu is akisi artik IKI koldan kosuyor — cron (kendi kosumu)
    # ve deploy.yml `d1-kadans` (`workflow_call`). Kilit IS AKISI duzeyinde kalsaydi
    # cagrilan kolda uygulanip uygulanmadigi BELIRSIZ olurdu; cagiran job da ayni grubu
    # tutsaydi (kendi kosumunu beklemek) KILITLENME riski dogardi. IS duzeyindeki grup
    # HER IKI kolda da AYNI sekilde ve TEK KEZ uygulanir -> "ayni anda iki uzlastirma"
    # penceresi kapali, kilitlenme riski YOK.
    # 🔴 `cancel-in-progress: false`: D1 yazmasinin ORTASINDA kesmek yerine SIRAYA gir.
    # GitHub grup basina en fazla 1 kosan + 1 bekleyen tutar (yenisi eskiyi kuyrukta
    # duşurur) -> kadans kolu push firtinasinda da yigilmaz.
    # Kablo kapisi: tools/cron-nabiz-kapisi.py::kadans_kablosu bu grubu BURADAN okur.
    concurrency:
      group: d1-uzlastirici
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # npx wrangler (d1-sync'in D1 istemcisi) icin.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ═══════════════════════════════════════════════════════════════════════
      # UCA TAZELE — "dogustan bayat checkout" halinin ONARIMI (OLCULDU 31 Tem)
      # ═══════════════════════════════════════════════════════════════════════
      # Zamanlanmis kosum `github.sha`'yi (tetikleme anindaki main ucu) checkout eder.
      # Kuyruk + kurulum gecikmesi boyunca main ilerlerse agac DOGUSTAN bayattir.
      # OLCULDU (kosum 30664207786, 20:47:18Z): checkout ca0376e7c448, uzak uc
      # 2d4975f4bf85; on-kosul 20:51:07Z'de (3 dk 49 sn sonra) BAYAT dedi ve
      # OLCUM/ONARIM/TEYIT adimlarinin HEPSI `skipped` oldu -> kosum SUCCESS, denetim SIFIR.
      # Bu adim agaci uzak main'in UCUNA getirir: 15 dakikalik cadans, donmus bir SHA'nin
      # degil GUNCEL katalogun denetimi olur.
      - name: Uca tazele — agaci uzak main ucuna getir (donmus github.sha DEGIL)
        run: |
          git fetch --depth=1 origin main
          git reset --hard FETCH_HEAD
          git rev-parse HEAD

      # ON-KOSUL: tazeleme TUTTU mu? Tutmadiysa OLCUM DE ONARIM DA yapilmaz (bayat
      # agacla "sapma var" demek SAHTE ALARM, onarmak ise KACAGIN TA KENDISI olurdu).
      # Bu adim artik bir MUHTEMELLIK degil TAZELEMENIN TEYIDIDIR.
      - name: On-kosul — tazeleme tuttu mu (agac uzak main'in ucunda mi)
        id: bayatlik
        run: |
          if python3 tools/d1-sync.py --bayatlik; then
            echo "uc=evet" >> "$GITHUB_OUTPUT"
          else
            echo "uc=hayir" >> "$GITHUB_OUTPUT"
            echo "BAYAT AGAC — tazelemeden SONRA da uc degil (kosum sirasinda yeni push). Bu kosum olcum/onarim YAPMAZ." >> "$GITHUB_STEP_SUMMARY"
          fi

      # OLCUM: sayi ekseni + ICERIK ekseni (urun_hash) — tam kapsam, salt-okuma.
      # Sapma varsa d1-sync --durum SIFIR-DISI doner; burada onu YUTMUYORUZ, bir
      # sonraki adima "sapma var mi" bilgisi olarak tasiyoruz (adim kirmizi olsa
      # is kirmizi olur ve onarim hic kosmazdi).
      - name: Olcum — D1 == urunler.json (sayi + icerik ekseni)
        if: steps.bayatlik.outputs.uc == 'evet'
        id: olcum
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secret yok — uzlastirici OLCEMEDI." >> "$GITHUB_STEP_SUMMARY"
            echo "sapma=olculemedi" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          rc=0
          python3 tools/d1-sync.py --durum > durum-once.txt 2>&1 || rc=1
          cat durum-once.txt
          if [ "$rc" = "0" ]; then
            echo "sapma=yok" >> "$GITHUB_OUTPUT"
            echo "D1 == urunler.json ✅ (sapma yok)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "sapma=var" >> "$GITHUB_OUTPUT"
            echo "🔴 D1 SAPMASI OLCULDU — onarim kosuyor:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -30 durum-once.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # ONARIM: ayni bayatlik kapisindan gecer (d1-sync icindeki kapi silmeyi ancak
      # agac UCTA iken uygular). Kosum sirasinda yeni bir push gelirse kapi devreye girer.
      #
      # 🔴 NEDEN SURUCU ILE (OLCULDU 31 Tem, kosum 30650256818): on-kosul 17:12:47.458Z'de
      # "UC" dedi; 28,79 sn SONRA onarim adimi bayatlik kapisina takildi (uzak uc
      # 0db2aafbb580'e ilerlemisti) ve 21 bayat hash'in 0'i yazildi. Kok neden KOD/AKIS
      # (on-kosul ile yazma arasindaki TOCTOU yarisi), ALTYAPI DEGIL: log'da wrangler
      # hatasi / D1 7429 CPU tavani / ag hatasi YOKTU.
      # tools/uzlastirici-onarim.py her denemede agaci UCA TAZELER ve YALNIZ bayatlik
      # kapisi reddinde geri cekilip TEKRAR dener (olculen: 15 sn, 45 sn; tek denemede
      # carpisma %1,47 -> uc denemede 3,2e-6). BASKA her hata (wrangler/D1/sema/kod)
      # YENIDEN DENENMEZ, rc 1 ile GORUNUR kalir.
      - name: Onarim — uzlastirici surucusu (uca tazele + yaris yeniden denemesi)
        if: steps.olcum.outputs.sapma == 'var'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 tools/uzlastirici-onarim.py

      # Geri yazilan satir TASLAK dogar; Ege taslagi GORMEZ. Canlida 200 donen
      # taslaklari yayina al -> onarim fiilen musteriye ulasir.
      - name: Onarim sonrasi atomik yayin (canlida 200 donen taslaklar)
        if: steps.olcum.outputs.sapma == 'var'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 tools/yayin-kapisi.py --yayinla

      # TEYIT: onarim IDDIA degil, KANIT olsun. Hala sapma varsa is KIRMIZI kalir
      # (GitHub bildirimi) — sessizce yesil donmek bu kacagi dogurmus olan hataydi.
      - name: Teyit — onarimdan sonra sapma SIFIR mi
        if: steps.olcum.outputs.sapma == 'var'
        id: teyit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 tools/d1-sync.py --durum
          echo "✅ Onarim DOGRULANDI (D1 == urunler.json)" >> "$GITHUB_STEP_SUMMARY"

      # ═══════════════════════════════════════════════════════════════════════
      # DAMGA — "denetim FIILEN yapildi" kaydi (tools/cron-nabiz-kapisi.py A0 ekseni)
      # ═══════════════════════════════════════════════════════════════════════
      # 🔴 NEDEN: bir kosumun YESIL olmasi denetim yapildigi ANLAMINA GELMEZ. OLCULDU
      # (kosum 30664207786, 20:47:18Z): conclusion=success · olcum/onarim/teyit adimlarinin
      # HEPSI `skipped`. Alarm ekseni bu yuzden "cron atesledi mi"dan "son basarili
      # UZLASTIRMA ne kadar eski"ye tasindi; bu adim o eksenin KAYNAGIDIR.
      #
      # NEDEN ARTIFACT, depoda IZLENEN dosya DEGIL: uzlastirici 15 dakikada bir main'e
      # PUSH etseydi main'in ucu surekli oynardi — 17:12Z kosumunu DUSUREN sey tam olarak
      # main ucunun yazma penceresinde ilerlemesiydi. Damga mekanizmasi, olcmesi gereken
      # hastaligi URETEMEZ. Artifact ise: depoya yazmaz · makine-okunur (ad + created_at +
      # expired + workflow_run TEK API cagrisinda) · saklamasi OLCULDU 24 saat (esik N=9
      # saatin 2,67 kati) · ve YALNIZ bu adim kosarsa dogar.
      #
      # KOSMA KOSULU (fail-closed): sapma YOKTU (olcum fiilen kostu) YA DA sapma vardi ve
      # TEYIT gecti. Onceki adimlardan biri duserse GitHub bu adimi zaten atlar -> damga
      # DOGMAZ -> bir sonraki nabiz olcumu KIRMIZI yanar. Tazeleme tutmadiysa (uc=hayir)
      # olcum `skipped` olur, `sapma` bos kalir ve damga YINE dogmaz.
      - name: Damga — son basarili uzlastirma kaydi
        if: steps.olcum.outputs.sapma == 'yok' || steps.teyit.outcome == 'success'
        run: |
          python3 tools/cron-nabiz-kapisi.py --damga-yaz uzlastirma-damgasi.json
          cat uzlastirma-damgasi.json
      - name: Damgayi yukle (artifact — nabiz kapisinin A0 ekseni bunu okur)
        if: steps.olcum.outputs.sapma == 'yok' || steps.teyit.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: uzlastirma-damgasi
          path: uzlastirma-damgasi.json
          if-no-files-found: error

      # ═══════════════════════════════════════════════════════════════════════
      # GORUNURLUK — UC AYRI HUKUM, UC AYRI ADIM (4 Agu 2026 kol ayrimi)
      # ═══════════════════════════════════════════════════════════════════════
      # NEDEN GORUNURLUK HIC KALKMAZ: "sessizce onarip yesil donmek" bu isin var olma
      # sebebinin ta kendisini gizler. Sapma OLMASI, ustteki bir yolun (pre-push kancasi /
      # CI D1 adimi / elle push) KACIRDIGININ kanitidir; onarildi diye o kacak yok olmaz.
      # 31 Tem'de D1'de 56 kayitta icerik ekseni bayat bulundu ve ELLE senkronlandi —
      # hicbir yerde kirmizi yanmadigi icin fark edilmesi TESADUFE kalmisti.
      #
      # NEDEN UC ADIM (tek adim DEGIL): ayni kosumda UC AYRI SORU cevaplaniyor ve bunlari
      # TEK cikis koduna yigmak "kirmizi"yi okunamaz kilar ([[hukum-yanlis-birimde]]):
      #   1. CRON/ELLE kolu + sapma  -> kosumun TEK isi budur, `exit 1` MESRU (DEGISMEDI).
      #   2. KADANS kolu + sapma ONARILDI -> cagiran kosum (deploy.yml) YAYIN kosumudur;
      #      onun conclusion'i YALNIZ yayin sagligini gostermeli. Sapma SUSTURULMAZ,
      #      `d1-sapma-damgasi` artifact'ine yazilir ve d1-sapma-alarmi.yml (AYRI kosum,
      #      AYRI conclusion) onu KIRMIZI yakar.
      #   3. ONARILAMADI -> "onarildi" ile AYNI HUKUM DEGILDIR: emniyet aginin KENDISI
      #      tutmamistir. Her IKI kolda da KIRMIZI, bayraktan BAGIMSIZ.
      # tools/cron-nabiz-kapisi.py::kadans_kablosu bu UC adimin VARLIGINI, KOSULLARINI ve
      # BIRBIRINDEN AYRI olduklarini GERCEK dosyadan olcer; ikisi tek hale yigilirsa ya da
      # biri silinirse KIRMIZI yanar.

      # (1) CRON / ELLE KOLU — DAVRANIS 4 AGU ONCESIYLE BIREBIR AYNI.
      # Bu kosumun TEK isi katalog denetimidir; burada tek cikis kodu iki soruyu
      # KARISTIRMAZ, o yuzden `exit 1` dogru sinyaldir ve KALIR.
      - name: "Sapma gorunurlugu (cron/elle kolu): sapma olduysa kosum KIRMIZI"
        if: steps.olcum.outputs.sapma == 'var' && inputs.kadans_kolu != true
        run: |
          echo "🔴 D1 SAPMASI OLDU — onarim kosturuldu ve teyit edildi; kosum GORUNURLUK icin KIRMIZI."
          echo "### 🔴 D1 sapmasi olustu ve onarildi (kosum bilerek KIRMIZI)" >> "$GITHUB_STEP_SUMMARY"
          echo "Sapma sayilari (onarimdan ONCE olculen):" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "icerik ekseni|hash UYUSMAZ|EKSIK|FAZLA|urun sayisi" durum-once.txt >> "$GITHUB_STEP_SUMMARY" || echo "(sapma satirlari ayiklanamadi — tam cikti olcum adiminda)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Sapmanin KENDISI bir ust-yol kacagidir (pre-push kancasi / CI D1 adimi / elle push)." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # (2) KADANS KOLU — SAPMA KANALI. Cikis kodu 0'dir (cagiran YAYIN kosumunun
      # conclusion'i kirlenmesin) AMA sapma BURADA BITMEZ: damga artifact'e yazilir ve
      # d1-sapma-alarmi.yml AYRI bir kosumda KIRMIZI yakar. Damga DOGMAZSA (yazma ya da
      # yukleme duserse) bu adim KIRMIZI olur -> sessizlestirme yolu FAIL-CLOSED kapali.
      - name: "Sapma damgasi (kadans kolu): sapma AYRI kanaldan KIRMIZI yakar"
        if: steps.olcum.outputs.sapma == 'var' && inputs.kadans_kolu == true
        run: |
          python3 tools/cron-nabiz-kapisi.py --damga-yaz d1-sapma-damgasi.json --damga-adi d1-sapma-damgasi
          cat d1-sapma-damgasi.json
          echo "### 🔴 D1 sapmasi olustu ve onarildi — ALARM AYRI KANALDA" >> "$GITHUB_STEP_SUMMARY"
          echo "Bu kosum YAYIN kosumudur; conclusion'i YALNIZ yayin sagligini gosterir." >> "$GITHUB_STEP_SUMMARY"
          echo "Sapma \`d1-sapma-damgasi\` artifact'ine yazildi -> d1-sapma-alarmi.yml KIRMIZI yakar." >> "$GITHUB_STEP_SUMMARY"
          echo "Sapma sayilari (onarimdan ONCE olculen):" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "icerik ekseni|hash UYUSMAZ|EKSIK|FAZLA|urun sayisi" durum-once.txt >> "$GITHUB_STEP_SUMMARY" || echo "(sapma satirlari ayiklanamadi — tam cikti olcum adiminda)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Sapmanin KENDISI bir ust-yol kacagidir (pre-push kancasi / CI D1 adimi / elle push)." >> "$GITHUB_STEP_SUMMARY"
      - name: "Sapma damgasini yukle (artifact — d1-sapma-alarmi.yml bunu OKUR)"
        if: steps.olcum.outputs.sapma == 'var' && inputs.kadans_kolu == true
        uses: actions/upload-artifact@v4
        with:
          name: d1-sapma-damgasi
          path: d1-sapma-damgasi.json
          if-no-files-found: error

      # (3) ONARILAMADI — AYRI HUKUM. Yukaridaki iki adim ortuk `success()` tasidigi icin
      # onarim/teyit duserse ZATEN atlanir; bu adim o hali ADIYLA beyan eder ve HER IKI
      # kolda KIRMIZI birakir. Emniyet aginin tutmamasi bir YAYIN kusuru degildir ama
      # "onarildi" ile ayni kutuya konamaz: onarilmayan sapma Ege'de SURER.
      #
      # 🔴 DUZELTME (7 Agu 2026, OLCULDU kosum 31214568441): eski kosul `failure() &&
      # sapma=='var'` idi. `failure()` bu JOB'daki HERHANGI bir onceki adim dustuyse
      # true olur — ve cron/elle kolunda "(1) Sapma gorunurlugu" adimi sapma=='var'
      # oldugunda KASITLI OLARAK exit 1 verir (GORUNURLUK sinyali, o adim DEGISMEDI).
      # Sonuc: bu adim, teyidin GERCEK sonucuna bakmadan, o kasitli kirmiziyi kendi
      # `failure()` girdisi sanip "onarim ve/veya teyit DUSTU" diye YANLIS beyan
      # ediyordu — kosum 31214568441'de onarim+teyit ikisi de success oldugu HALDE.
      # `steps.teyit.outcome != 'success'` GERCEK sonucu okur (fail-closed: teyit
      # skipped/cancelled olursa da != 'success' true'dur, adim yine KIRMIZI yanar).
      - name: "ONARILAMADI: sapma KAPANMADI (ayri hukum — her iki kolda KIRMIZI)"
        if: always() && steps.olcum.outputs.sapma == 'var' && steps.teyit.outcome != 'success'
        run: |
          echo "🔴 D1 SAPMASI KAPANMADI — onarim ve/veya teyit adimi DUSTU."
          echo "### 🔴 D1 sapmasi ONARILAMADI (emniyet agi tutmadi)" >> "$GITHUB_STEP_SUMMARY"
          echo "Bu hal 'sapma olustu ve onarildi'den AYRIDIR: katalog SU AN sapmali olabilir," >> "$GITHUB_STEP_SUMMARY"
          echo "yani Ege (WhatsApp botu) katalogun bir kismini GOREMIYOR olabilir." >> "$GITHUB_STEP_SUMMARY"
          echo "Elle teyit: \`python3 tools/d1-sync.py --durum\`" >> "$GITHUB_STEP_SUMMARY"
          exit 1
