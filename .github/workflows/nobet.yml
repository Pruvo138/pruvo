      # filament adimi CI'da SUREKLI kirmizi, Okan'in makinesinde SUREKLI yesildi; kirmizi
      # kosuldugu yerde HIC uretilemiyordu. Onarim ucuncu sinifi ayirir (3 = OLCULEMEDI,
      # ADIYLA gorunur sebep) ve gerileme kolunu 2 = KIRMIZI birakir.
      # 🔴 BATARYA IKI YONLU: M2/M6 tam olarak "bu onarim bir BYPASS'a donusurse" mutantlaridir.
      # AGSIZ + KATALOGSUZ (~1 dk): problar egeKodu() kapisinda doner, urunler.json okunmaz.
      # Mutantlar IZOLE tmp kopyada kosar; canli agaca YAZMAZ (FILO DERSI, 4 Eyl).
      - name: Parite cikis-kodu sinifi mutasyon bataryasi (7 oldurucu + 2 kontrol)
        if: ${{ !cancelled() }}
        run: python3 tools/parite-cikis-sinifi-mutasyon.py

      # EGE-BILGI TAVAN: ege-bilgi.md uzunlugu bot slice(0,6000) esigini asmasin.
      # Olcu UTF-16 kod birimi (JS String.slice birimi) — bayt sayan olcum sahte-kirmizi,
      # Python len(str) astral karakterde sahte-yesil yakar.
      # Bloklayici SADECE gercek zararda, IKI hal: (1) UTF-16 uzunluk >6000 (bot metni
      # SESSIZCE kesiyor, icerik kaybi) (2) fail-loud — dosya yok / okunamiyor / UTF-8 degil
      # (olculecek sey YOK; sessiz yesil verilmez).
      # ILAN duzlemindeki HER hal UYARI'dir (exit 0 + gurultulu uyari), 21 Tem MIMAR KARARI:
      # ILAN/SABIT UYUSMAZLIGI · dar pay · ILAN YOK · CELISKILI ILAN · ILAN BASTA DEGIL ·
      # ILAN BAGLAMA OTURMADI. Gerekce: ilan kontrolu Turkce serbest metinde desen arayan bir
      # NESIR AYRISTIRMASIDIR ve bir HUKUM kaynagi degildir ([[mimar-kapi-parser-taklidi]]);
      # olculdu 21 Tem, BES ayri MASUM tek-satirlik duzenleme kapiyi kirmiziya cekiyordu
      # (uslup kuralindaki baska bir sayi · "6000"->"6.000" kozmetik ayrac · ilan cumlesinin
      # silinmesi · basa icindekiler eklenip ilanin kaymasi · ilanin YERINE "en fazla 300
      # karaktere kadar" gibi bir USLUP kurali yazilmasi) ve continue-on-error olmadigi icin
      # TUM EKIBIN yayinini durduruyordu. Icerik kaybi hukmunu uzunluk olcusu TEK BASINA
