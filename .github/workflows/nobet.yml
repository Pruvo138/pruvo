      # ═══════════════════════════════════════════════════════════════════════
      # MUTASYON SURUCULERI (8 Agu 2026) — KESIF GENISLEMESIYLE KABLOLANANLAR
      # ═══════════════════════════════════════════════════════════════════════
      # 🔴 NEDEN SIMDI: `tools/ci-kapsam-test.py` kesif predikati `*-mutasyon.py`yi
      # GORMUYORDU. Envanter (8 Agu, `git ls-files`): 43 surucu · 8'i OTOMATIK bir is
      # akisinda kosuyor · 35'i kosmuyor; kosmayanlarin 31'i kapiya TUMUYLE GORUNMEZDI.
      # Kosmayan surucu SESSIZCE CURUR — ve zaten curumustu: uc surucu temiz klonda
      # rc=1 bulundu (d1-sapma · gecmis-geri-donus · r2-onek; hepsi "capa bulunamadi").
      # Sinif: [[nobetci-cagri-satiri-nobetsiz]].
      #
      # 🔴 HER SURUCU KENDI DUZ TEK KOMUT ADIMIYLA: zincirlenmis komut (`&&`, `;`,
      # `for`) bu depoda KAPSAM SAYILMIYOR — kapinin icra suzgeci komut govdesinin
      # BASINA capalanir, zincirin ikinci halkasi GORUNMEZ olur.
      # ⚠️ `continue-on-error` KULLANILMADI (fail-open yazimi nobetci ihlalidir).
      #
      # KABLOLAMA ESIGI (olculdu, temiz `git clone --local` + BOS HOME): rc=0 VE
      # sure <= 40 s VE calisma agacini kirletmiyor. Esigi gecemeyen 15 surucu
      # `tools/ci-kapsam-test.py::IZIN_LISTESI`nde TEK TEK ve OLCUMLE muaf.
      # ASAGIDAKI 17 ADIMIN OLCULEN TOPLAM SURESI: 183 s (adim adim toplandi).
      # SERIT-B TABANI: 752 s (kosum 31266293755, 8 Agu 16:10:22Z -> 16:22:54Z) ->
      # beklenen ~935 s. `serit-a4` yayin tavani 32-58 dk oldugu icin bu ek yuk
      # yayin penceresini UZATMAZ (serit-b `deploy`ye `needs:` ile bagli DEGIL).
      # Beyan: tools/is-akisi-kapisi.py :: SERIT_B (her biri AYRI giris).

      # KESIF EKSENININ KENDI SURUCUSU — bu blogun VAR OLMA SEBEBINI olcer:
      # kesif genislemesi HUKUMDE yasiyor mu (daraltma VE gevsetme yonu ayri ayri
      # kirmizi mi), yeni yakalanan dosya sessizce atlanabiliyor mu, kablolanan bir
      # surucunun cagri satiri silinince kapi kirmizi yaniyor mu (RATCHET). Bellekte
      # kosar, canli dosyalara YAZMAZ (sha256 bas=son nobeti icinde).
      - name: "CI kapsam kapisi KESIF ekseni mutasyon bataryasi (ratchet canli mi)"
        if: ${{ !cancelled() }}
        run: python3 tools/kesif-kapsam-mutasyon.py

      - name: "Ata lisans kapisi mutasyon bataryasi (kabul testi gercekten olcuyor mu)"
        if: ${{ !cancelled() }}
        run: python3 tools/ata-lisans-mutasyon.py

      - name: "CTA denge kapisi mutasyon bataryasi (duzen sessizce geri gelirse kirmizi mi)"
        if: ${{ !cancelled() }}
        run: python3 tools/cta-denge-mutasyon.py

      - name: "D1-sync durum kolu mutasyon bataryasi"
        if: ${{ !cancelled() }}
        run: python3 tools/d1-sync-durum-mutasyon.py

      - name: "D1-sync mid-array seq bloku mutasyon bataryasi (K153)"
        if: ${{ !cancelled() }}
        run: python3 tools/d1-seq-mutasyon.py

      - name: "FAZ3 bayrak mutasyon bataryasi (3 mutant)"
        if: ${{ !cancelled() }}
        run: python3 tools/faz3-bayrak-mutasyon.py

      # DEPLOY ACLIK KAPISININ GECICI AG SINIFI (11 Agu 2026). Batarya 5 oldurucu
      # + 1 kontrol mutantla yeniden-deneme sinirlarini olcer; canli GitHub agina
      # cikmaz, kapinin `--kendini-test` kolunu kosar. Mutasyon hedef dosyaya uygulanir
      # ve her turda finally ile bayt-bayt geri yuklenir.
      - name: "Deploy aclik kapisi gecici ag sinifi mutasyon bataryasi"
        if: ${{ !cancelled() }}
        run: python3 tools/deploy-aclik-gh-mutasyon.py

      - name: "duzelt.py uyum kapisi mutasyon bataryasi"
        if: ${{ !cancelled() }}
        run: python3 tools/duzelt-uyum-mutasyon.py

      # D1-SYNC wrangler() ZAMAN ASIMI + TEK UCUS mutasyon bataryasi (4 Eyl, K361).
      # 7 oldurucu + 3 kontrol mutant; her oldurucu HANGI IDDIA KOLUNU oldurdugunu
      # ADIYLA kanitlar (K182) ve "sonuc tabanla AYNI" hali MUTANT ULASMADI diye
      # kirmiziya yazilir. Mutant CANLI govdeye DEGIL gecici bir kopyaya uygulanir
      # (sentetik kok + `konfigur-bundle-kapisi.py` sembolik bagi); kontrol mutantlari
      # sabit oynamalaridir ve batarya onlarda YESIL kalmali — kalmazsa batarya
      # davranisa degil SABITE capalanmis demektir. Offline; D1'e ve aga dokunmaz.
      - name: "D1-sync wrangler zaman asimi + tek ucus mutasyon bataryasi"
        if: ${{ !cancelled() }}
        run: python3 tools/d1-sync-tani-mutasyon.py

      # D1-SYNC KILIT YOLU MENZILI mutasyon bataryasi (4 Eyl, K361 ARDIL ONARIMI).
      # Olculen ariza: K361 kilidi `wrangler()`in basina koyunca kilit yolu cozumu de
      # cagrinin ICINE dustu; kabul fiksturleri `subprocess.run`u sahteledigi icin sahte
      # kilit sorgusunu YUTTU, 5 vaka kendi iddiasina gelmeden oldu, `--kendini-test`
      # 137/5 kirmizi oldu ve `serit-a2` failure -> `deploy`+`yayin` SKIP -> yayin IKI TUR
      # durdu. Onarim yolu DOSYA SISTEMINDEN turetir; bu batarya onarimin nobetsiz
      # kalmadigini olcer: 7 oldurucu + 2 kontrol, her oldurucu oldurdugu iddia kolunu
      # ADIYLA bildirir (K182). Mutant CANLI govdeye DEGIL, gercek depoya SEMBOLIK BAGLA
      # bakan sentetik bir kokun `tools/` kopyasina uygulanir; kosum sonunda canli
      # dosyanin sha256'si KIYASLANIR. Offline; D1'e ve aga dokunmaz.
      - name: "D1-sync kilit yolu menzili mutasyon bataryasi"
        if: ${{ !cancelled() }}
        run: python3 tools/d1-kilit-yolu-mutasyon.py

      # EDGE KART KAPISININ KARDES-DEPO AYRISTIRMASI (11 Agu 2026 onarimi). Eski regex
      # `KART_ALANLARI` sabitinin YALNIZ ILK tirnak ciftini okuyordu; `+` ile eklenen
      # parcalara dusen kolon SELECT'te VARKEN "eksik" raporlaniyordu (kotumser yalan).
      # Batarya 5 oldurucu + 1 kontrol mutantla dort kolu AYRI olcer: cok-parca pozitif,
      # gercek-eksik (fail-open), OLCULEMEDI (sessiz yesil), yanlis-pozitif. Fiksturler
      # SENTETIK — kardes depo diskte olmasa da kosar; katalog OKUNMAZ, ag GEREKTIRMEZ.
      # Mutasyon BELLEKTE uygulanir, canli dosyaya tek bayt yazilmaz (sha256 bas=son).
      - name: "Edge kart kapisi kardes-depo ayristirma mutasyon bataryasi"
        if: ${{ !cancelled() }}
        run: python3 tools/edge-kart-tirnak-mutasyon.py

      # GORSEL-KOKEN TETIK (2) COK-KUME OLCUTU (11 Agu 2026 onarimi). Tetik eskiden
      # LISTE esitligiyle olculuyordu; ayni URL kumesinin saf PERMUTASYONU da "gorsel
      # degisimi" sayilip koken kaniti istiyordu — oysa modulun korudugu olay bir
      # gorselin yayina GIRMESIDIR. Onarim tetigi COK-KUME esitligine daraltir.
      # 🔴 Daraltma, fail-closed bir kapiyi fail-open'a cevirmenin ucuz yoludur: batarya
      # 6 oldurucu + 1 kontrol mutantla ekleme · silme · degistirme (ayni uzunluk) ·
      # tekrar sayisi ([A,A,B] vs [A,B,B]) · yeni urun kolu · kategori-cevirme kolu ve
      # cozulemedi (fail-closed) eksenlerini AYRI AYRI olcer. Fiksturler SENTETIK —
      # katalog OKUNMAZ, koken manifest dizini OKUNMAZ, ag GEREKTIRMEZ.
      # Mutasyon BELLEKTE uygulanir, canli dosyaya tek bayt yazilmaz (sha256 bas=son).
      - name: "Gorsel-koken permutasyon (cok-kume) mutasyon bataryasi"
        if: ${{ !cancelled() }}
        run: python3 tools/gorsel-koken-permutasyon-mutasyon.py

      # GORSEL-KOKEN MANIFEST DIZINI BIRLESTIRMESI (12 Agu 2026 onarimi). Kapi eskiden
      # VAR OLAN ILK dizini secip digerlerine HIC BAKMIYORDU; pruvo/urun-gorsel-koken
      # (2 manifest) var oldugu icin KaaN'in 12 manifestlik deposu okunmuyor ve koken
      # kaniti GERCEKTEN OLAN urun bile eklenemiyordu (olculdu: YESIL 0/16 -> onarimdan
      # sonra 5/16). 🔴 "Daha cok yerde ara" demek kapiyi gevsetmenin ucuz yoludur:
      # batarya 6 oldurucu + 1 kontrol mutantla golgelemenin kalkmasi (pozitif kol) ile
      # BIRLIKTE manifestsiz · celisen (iki dizinde FARKLI icerik) · bozuk (parse
      # edilemeyen) · dizinsiz kollarinin BLOCK kaldigini ve rapor sinif ayriminin
      # ("manifest yok" != "kaynak dosyasi kayip") canli oldugunu AYRI AYRI olcer.
      # Fikstur SENTETIK ve depo DISINDA (tempfile) kurulur: urunler.json OKUNMAZ,
      # gercek koken dizinleri OKUNMAZ, ag GEREKTIRMEZ.
      # Mutasyon BELLEKTE uygulanir, canli dosyaya tek bayt yazilmaz (sha256 bas=son).
      - name: "Gorsel-koken manifest dizini birlestirme mutasyon bataryasi"
        if: ${{ !cancelled() }}
        run: python3 tools/gorsel-koken-dizin-mutasyon.py

      # KONFIGUR SIYAH KAPAK KAPISININ mutasyon bataryasi (11 Agu 2026). Kapi IKI KOLLUDUR
      # ve bir kolu oldurmek digerinden GORUNMEZ; bu yuzden C2/C3 fiksturleri BILEREK
      # birbirinin aynasi degildir: C2'yi YALNIZ eksen A (turetim sonucu), C3'u YALNIZ
      # eksen B (kapak capasi) yakalar. 5 oldurucu + 1 kontrol mutant: turetimin uretim
      # kodundan koparilip sabit renge baglanmasi · kapak capasinin sokulmesi ·
      # OLCULEMEDI kolunun sessiz yesile cevrilmesi · pozitif kolun oldurulmesi
      # (gecerli siyah kapakli urunun reddi) · ihlal listesinin fail-open bosaltilmasi.
      # Fiksturler SENTETIK: urunler.json OKUNMAZ, ag GEREKTIRMEZ. Mutasyon BELLEKTE
      # uygulanir, canli dosyaya tek bayt yazilmaz (sha256 bas=son).
      - name: "Konfigur siyah kapak kapisi mutasyon bataryasi"
        if: ${{ !cancelled() }}
        run: python3 tools/konfigur-siyah-kapak-mutasyon.py

      # URUN SAYFASI / KART AYRIMI (11 Agu, Okan karari). Kartin da yukselmesi ACIKCA
      # REDDEDILEN davranistir; batarya o sizintiyi ve kardeslerini (cip PLA'ya sabitlenmesi,
      # ilan tutarinin cipten ayri turemesi, markup/beslemenin urun koluna baglanmasi,
      # taninmayan malzemenin sessizce cokmesi, kenar kolonunun kaymasi, bilincli-secim
      # notunun sokulmesi/her secimde gosterilmesi) 10 oldurucu mutantla olcer.
      # IKI KONTROL: M0 davranis-notr yeniden adlandirma YESIL kalmali · M9 zehirli girdi +
      # fail-open cevrilmis hukum fonksiyonu YESIL olmali (o satirlarin YUK TASIDIGI kaniti;
      # M3 ayni zehirle KIRMIZI yanar — ikisi bir CIFTTIR).
      # Mutasyon BELLEKTE uygulanir, canli dosyaya tek bayt yazilmaz (sha256 bas=son).
      - name: "Urun sayfasi / kart kapsam ayrimi mutasyon bataryasi"
        if: ${{ !cancelled() }}
        run: python3 tools/urun-vitrin-kapsam-mutasyon.py

      - name: "Ege-bilgi tavan kapisi mutasyon bataryasi"
        if: ${{ !cancelled() }}
        run: python3 tools/ege-bilgi-tavan-mutasyon.py

      - name: "GA4 olay kapisi mutasyon bataryasi (huni olayi sokulunca kirmizi mi)"
        if: ${{ !cancelled() }}
        run: python3 tools/ga4-olay-mutasyon.py

      - name: "Gramer kisaltma kapisi mutasyon bataryasi"
        if: ${{ !cancelled() }}
        run: python3 tools/gramer-kisaltma-mutasyon.py

      - name: "Konfigur nobetcisi mutasyon bataryasi (ayna kaynaga yazamiyor mu)"
        if: ${{ !cancelled() }}
        run: python3 tools/konfigur-nobet-mutasyon.py

      - name: "Parite marka ekseni mutasyon bataryasi (ag/wrangler YOK)"
        if: ${{ !cancelled() }}
        run: node tools/parite-marka-mutasyon.js

      - name: "Reklam etiket kapisi mutasyon bataryasi"
        if: ${{ !cancelled() }}
        run: python3 tools/reklam-etiket-mutasyon.py

      - name: "Serit bolme kapisi mutasyon bataryasi (fail-open kirmizi yaniyor mu)"
        if: ${{ !cancelled() }}
        run: python3 tools/serit-bolme-mutasyon.py

      - name: "Serit beyani sinif kapisi mutasyon bataryasi (T1 turetim + T2 istisna)"
        if: ${{ !cancelled() }}
        run: python3 tools/serit-beyani-mutasyon.py

      - name: "Shop bayatlik kapisi mutasyon bataryasi (wrangler.toml OKUR, CLI degil)"
        if: ${{ !cancelled() }}
        run: python3 tools/shop-bayatlik-mutasyon.py

      # TAVSIYE FILAMENT D1 HATTI (11 Agu 2026) — `tavsiyeFilament` bir FIYAT girdisidir:
      # on-secilen malzeme sepet carpanini ve ilan edilen tutari surer. Kolon canliya
      # eklendi ve HASH KAPSAMINA alindi (mimar karari). Batarya 6 oldurucu + 1 kontrol
      # mutantla ALTI kolu AYRI olcer: hash kapsami (sessiz ayrisma) · fail-closed tip
      # kapisi (fail-open) · sessiz normalizasyon YASAGI (dize -> tek elemanli dizi) ·
      # pozitif kol (yanlis-pozitif) · sayim dokumu · bes-tanim kilidi. Fiksturler
      # SENTETIK: urunler.json OKUNMAZ, canli D1/wrangler/AG GEREKMEZ. Mutasyon BELLEKTE
      # uygulanir, canli dosyaya tek bayt yazilmaz (sha256 bas=son nobeti icinde).
      - name: "Tavsiye filament D1 hatti mutasyon bataryasi (hash kapsami + tip kapisi)"
        if: ${{ !cancelled() }}
        run: python3 tools/tavsiye-filament-mutasyon.py

      # 8 AGU SOMUT VAKASI: kiyas referansi kaydinin bozuk sekilleri (kisa `ref`,
      # JSON DIZISI, sayi, alan yok, bozuk metin, cozulemeyen sha) TEK BASINA rc=2
      # veriyor mu. Ikisi 8 Agu'da FAIL-OPEN'di ve rc=0 verip YANLIS BEYAN basiyordu.
      - name: "Varlik referans kaydi mutasyon bataryasi (bozuk sekil fail-closed mi)"
        if: ${{ !cancelled() }}
        run: python3 tools/varlik-referans-mutasyon.py

      - name: "Vitrin kabul kapisi mutasyon bataryasi"
        if: ${{ !cancelled() }}
        run: python3 tools/vitrin-kabul-mutasyon.py

      - name: "WhatsApp yetki kapisi mutasyon bataryasi"
        if: ${{ !cancelled() }}
        run: python3 tools/wa-yetki-mutasyon.py

      - name: "Yayin erisim nobetcisi mutasyon bataryasi"
        if: ${{ !cancelled() }}
        run: python3 tools/yayin-erisim-mutasyon.py

      - name: "Yedek gorev kapsami mutasyon bataryasi (sahte HOME, gercek HOME'a YAZMAZ)"
        if: ${{ !cancelled() }}
        run: python3 tools/yedek-gorev-kapsam-mutasyon.py
      # MARKA SAYFASI ARTIM/FILTRE DAVRANISI (8 Agu 2026) — SERIT B.
      # Marka sayfasi markanin TUM parcalarini kart olarak listeler; ilk N kart SSR'de,
      # kalani AYNI SAYFADA edge ucundan (`/katalog?ids=`) artimli cizilir ve model cipi
      # sayfa ICINDE filtreler. Bu uc nobetci o davranisi node'da GERCEK JS ile kosturur.
      # 🔴 NEDEN SERIT B: ucu de agsiz/deterministik ama YAYIN DOGRULUGUNU degil
      # ISTEMCI DAVRANISINI olcer; SSR yuzeyi (kart yuzeyi kimligi, bolum ayrimi, agirlik
      # tavani) bloklayici seritteki marka-sayac-kapisi'nda ZATEN olculuyor.
      - name: "Marka sayfasi artim + sayfa-ici model filtresi (davranis, node)"
        if: ${{ !cancelled() }}
        run: python3 tools/marka-artim-test.py
      # KAYNAK LINK TAMAMLA — K152 kabul + mutasyon bataryasi (17 Agu 2026).
      # Gizli kaynak defterindeki eksik uretici linkini tamamlar; urunler.json'a
      # dokunmaz. Hijyen ekseni: kirmizisi musteriye yanlis para odetmez, veri
      # sizdirmaz, siteyi durdurmaz.
      - name: "Kaynak link tamamlama: kabul testi (fikstur + gercek beyan)"
        if: ${{ !cancelled() }}
        run: python3 tools/kaynak-link-test.py
      - name: "Kaynak link tamamlama: mutasyon bataryasi"
        if: ${{ !cancelled() }}
        run: python3 tools/kaynak-link-test.py --mutasyon

      # KAYNAK DUZLEMI TEMIZLEME — K171 kabul + mutasyon bataryasi (18 Agu 2026).
      # `duzelt.py --kaynak-durum` / `--kaynak-temizle` kollarini olcer. SERIT B:
      # kirmizisi musteriye yanlis para odetmez, veri sizdirmaz, siteyi durdurmaz —
      # emsal birebir yukaridaki kaynak-link adimlari (K152).
      # 🔴 `continue-on-error` KULLANILMIYOR (K178b): adim duzeyinde o bayrak adimin
      # kirmizisinin job'u dusurmesini ENGELLER — `conclusion=success` olur ve kirmizi
      # YESIL RAPORLANIR ([[fail-slow-fail-opendir]]). Istenen davranis "onceki adim
      # kirmiziysa da kos"; onu saglayan sey `if` kosuludur. `always()` DEGIL: bu serit
      # kuyrukta sik `cancelled` oluyor ([[cancelled-yigini-yayin-tavani]]).
      - name: "Kaynak duzlemi temizleme: kabul testi (8 eksen)"
        if: ${{ !cancelled() }}
        run: python3 tools/duzelt-kaynak-test.py
      - name: "Kaynak duzlemi temizleme: mutasyon bataryasi"
        if: ${{ !cancelled() }}
        run: python3 tools/duzelt-kaynak-mutasyon.py

      # (KraL-KapiSupurmesi-29Agu: sahiplik haritasi kapisi SILINDI — kapilarin
      # sahiplik envanterini olcen kapi; BaBa 28 Agu filo karari.)

      # (KraL-KapiSupurmesi-29Agu: T3 yonlendirme kapisi SILINDI — sahiplik
      # haritasiyla birlikte; kirmizi-sahipligi cozen meta kat.)

      # T4 PARTI BORC KAPISI — SERIT B (19 Agu 2026, Paket T4).
      # Acik kalemli evde YENI PARTI baslatma makinece REDDEDILIR kapisi. Dort kol:
      # T4-BORC (esik asildi -> RED) · T4-TEMIZ (esik altinda -> GECER) · T4-EV
      # (partiyi baslatan EV'in defteri okunur, baskasi karar vermez) ·
      # T4-OLCULEMEDI (defter okunamazsa fail-closed; "borc yok" SAYILMAZ). Kol
      # ayrimi mesaj onekiyle (T4-BORC / T4-TEMIZ / T4-EV / T4-OLCULEMEDI) saglanir;
      # `acik_kalem_sayisi()` ACIK/UCUSTA/OKAN-KAPISI/🔧 sayar, KAPANDI HARIC.
      # `--kendini-test` GERCEK deftere DOKUNMAZ: tempfile.mkdtemp izolasyonu; her
      # mutant hedef kolunu AYRICA kanitlar. CANLI kablolama (urun-ekle.py on-kosul)
      # BU PAKETTE YOK — yalniz RED kaniti uretilir. Offline, ag YOK. Beyan:
      # tools/is-akisi-kapisi.py :: SERIT_B.
      - name: "T4 parti borc kapisi oz-nobetcisi (4 mutant + curutme, hedef kol kanitli)"
        if: ${{ !cancelled() }}
        run: |
          python3 tools/parti-borc-kapisi.py --kendini-test
          python3 tools/parti-borc-kapisi.py --curutme-test

      # 🔴 K361 (2 Eyl 2026, Okan emri / BaBa) — EV->DIZIN TABLOSU REPO DISINDA.
      # Tablo `tools/parti-borc-kapisi.py` icinde sabitti; sonucu yapisaldi:
      # YENI EV ACMAK PRUVO KODU DEGISTIRMEYI GEREKTIRIYORDU (Faralya/FaR bu
      # yuzden repoda commit'siz bir satir birakmisti) ve depo ZATEN IKI
      # TABLOLUYDU (`sahiplik-kapisi.py:107`, icinde FaR YOK — sessizce
      # ayrismis). Tek kaynak artik `~/.claude/cron/evler.json`.
      # BU ADIM O TASIMANIN EMNIYET CEKIRDEGINI OLCER: konfig yok/bozuk/bos
      # ise tablo BOS SAYILMAZ — kapi `T4-OLCULEMEDI` sinifindan sifir-disi rc
      # ile RED verir (bos tablo "hicbir evde acik kalem yok" demeye gelir ve
      # kapiyi SESSIZCE ACAR).
      # Batarya HERMETIKTIR: her vaka kendi fiksturunu `tempfile.mkdtemp()`
      # altina yazar ve `PRUVO_EVLER_JSON` ile gosterir; CANLI `evler.json`'a
      # DOKUNMAZ. Kosucuda `~/.claude/cron` YOKTUR — yalniz F7 (gerekce
      # yorumlarinin kayipsizligi) yerel-duzlemdir ve orada KAPSAM_DISI sayilir
      # (kusur DEGIL, ayri kovada raporlanir); kapsam tabani (6) SAYIYLA
      # civilidir, altina duserse batarya rc=2 OLCULEMEDI verir. Offline, ag YOK.
      - name: "K361 ev haritasi bataryasi (fail-closed fiksturleri + 3 mutant + esdeger kontrol)"
        if: ${{ !cancelled() }}
        run: |
          python3 tools/ev-haritasi-kapisi-test.py

      # N2 "KIRLETEN ONARIR" — Okan onayli doktrin (19 Agu 2026).
      # Okan'in vakasi: "MaCiT 100-100 urun ekliyor, iletiyi gormedi, isine devam
      # etti; tamirat yapilmadigi icin tum mimarlar MaCiT'i bekledi."
      # Uc mekanizma, hepsi offline + hermetik (gecici dizin, sentetik git deposu,
      # sentetik defter): (A) kirmizinin SAHIBI haritadan turer · (B) acik 🔧
      # varken YENI parti RED — 🔴 suren/yarim is KESILMEZ · (C) 4 saat hareketsiz
      # kalem Tamirci'ye devredilir + ihlal sayaci.
      # `n2-kabul.py` CANLI urunler.json'a ve evlerin defter/posta kutularina
      # DOKUNMADIGINI kendi icinde (Z2) sha256 ile OLCER.
      # Beyan: tools/is-akisi-kapisi.py :: SERIT_B.
      - name: "N2 kirleten onarir oz-nobetcisi (A/B/C mutantlari, hedef kol kanitli)"
        if: ${{ !cancelled() }}
        run: |
          python3 tools/ev-sahip-kapisi.py --kendini-test
          python3 tools/parti-kapisi.py --kendini-test
          python3 tools/devir-kapisi.py --kendini-test
          # N4A (20 Agu 2026): sayac DURUSTLUGU — "USTUSTE_ONARIMSIZ dustu,
          # demek ki bir sey onarildi" iddiasini makinece imkansiz kilar.
          # Kosucuda ~/.claude/cron YOKTUR: batarya bunu KAPSAM_DISI sayar
          # (kusur degil) ve mutant cekirdegini YINE kosar; "dosya var ama
          # bozuk" hali ise OLCULEMEDI'dir (rc=2, kirmizi). Iki hali H1/H2
          # kontrolleri hermetik olarak AYIRIR.
          python3 tools/nobet-sayac-durustluk-test.py

      # (KraL-KapiSupurmesi-29Agu: n2-kabul UCTAN UCA adimi SILINDI — enjekte
      # evlerle mimar-icra dagitimini olcuyordu; o duzlem kaldirildi.)

      # PARA LITERALI KAPISI — K107 (SINIF KAPISI, K106'nin dogus vakasi).
      # K106 (15 Agu 2026): `eski-fiyat-test.py` fikstürü `eski_fiyat="1.200 TL"`
      # SABIT yaziyordu; malzeme politikasi PETG->ABS olunca ILAN tutari
      # 110.500 -> 136.000 kurusa cikti, eski fiyat ilanin ALTINDA kaldi,
      # test kirmizi yandi, `serit-a2` kirmizi oldu, `deploy` SKIPPED kaldi ve
      # CANLI SITE 7,5 SAAT main'in gerisinde kaldi. Tekil yama uygulanmisti;
      # SINIFI koruyan nobetci YOKTU ([[tekil-yama-sinifi-kapatmaz]]).
      # Kapi, hukmu KENDI regex'iyle vermez: `build._birim_kurus`'u IKI YONLU
      # olcekleyip uretim fonksiyonunun ciktisi degisiyor mu diye olcer ->
      # mesru negatif fiksturler (guncelin altinda / baska para birimi /
      # parametrik / eski_fiyat yok) ve kanonik fonksiyondan TUREYEN fiksturler
      # yapisal olarak YESIL kalir.
      # 🔴 SERIT B (defter K107 plani): yanlis-pozitif tum ekibin yayinini
      # durdurur; kapi once bloklamayan seritte kosar, IKI TUR temiz gorulunce
      # serit A'ya alinmasi MIMARIN karari olur.
      # Beyan: yayini BLOKLAMAYAN job (`serit-b`) — `deploy` bu job'a `needs:`
      # ile BAGLI DEGIL. `continue-on-error` KULLANILMADI (fail-open yazimi bu
      # depoda nobetci ihlalidir).
      - name: "Para literali kapisi (K107) — canli tarama + kendini test + iki yonlu mutasyon"
        if: ${{ !cancelled() }}
        run: |
          python3 tools/para-literali-kapisi.py --kendini-test
          python3 tools/para-literali-kapisi.py --mutasyon
          python3 tools/para-literali-kapisi.py

      # SERIT-B MASKELEME KAPISI — Paket K178 (18 Agu 2026, OLCULEN KUSUR).
      # SERIT B'nin 126 adimindan birinin kirmizisi geri kalani 114'u SKIP yapiyor ->
      # kapilar maskeleniyor ([[kirmizi-adim-sonrakini-maskeler]]). Bu kapi taranan
      # job'lardaki her kapi adiminda bagimsizlik isareti olup olmadigini olcer.
      # 🔴 KAPSAM 19 Agu 2026'da GENISLETILDI (SERIT B onarimi): serit-b'ye ek
      # hijyen-a2/a3/build/a4 de taranir — hijyen-a3'te Yayin-acligi kirmizisi
      # Gramer adimini SKIP etmisti (kosum 32201776934), K178 sinifinin tekrari
      # kapi kapsaminin disinda kalmisti. 99 hijyen adimina if: !cancelled()
      # ayni onarimda eklendi. Altyapi adimlari (checkout, setup-*) sayilmaz;
      # taranan job envanteri eksikse OLCULEMEDI+KIRMIZI (fail-closed).
      # Standalone --kendini-test modunda 4 mutant RED + 2 kontrol YESIL uretir.
      # Beyan: tools/is-akisi-kapisi.py :: SERIT_B.
      - name: "Serit-b maskeleme kapisi (her kapi adimi bagimsiz mi)"
        if: ${{ !cancelled() }}
        run: python3 tools/serit-b-maskeleme-test.py --kendini-test

      # KALEM SENKRON KAPISI — K309 (26 Agu 2026, OLCULEN AYRISMA).
      # Kaynak-dogrusu defteri (`memory/acik-kalemler.md`) ile calisma defteri
      # (`DEVAM.md`) AYRISMIS: DEVAM.md'de id'si gecen 101 kalemin 92'sinin
      # kaynak-dogrusunda SATIRI YOK. Defterin kendi kural blogu "deftere satir
      # acmadan VERILMIS SAYILMAZ" ve "nobet kapisi `kabul:` komutunu KENDISI kosar"
      # dedigi icin o 92 kalem nobetin olcum evreninin DISINDADIR
      # ([[kapinin-menzili-cagri-yeridir]] ailesinin en buyuk vakasi).
      #
      # 🔴 NEDEN SERIT B (BLOKLAMAZ): kapi bir SAYIM ratchet'idir, "yanlis icerik
      # canliya cikmasin" sinifinda DEGILDIR; bugunku 92'lik ayrisma kataloju
      # ANINDA kirmiziya yakmamalidir ([[kapi-ambiyansi-olcerse-komsu-kirmiziya-yakar]]).
      # `deploy` bu job'a `needs:` ile BAGLI DEGIL. `continue-on-error` KULLANILMADI.
      #
      # 🔴 NEDEN `--kendini-test` (canli kol DEGIL) — MUAFIYET DEGIL, MENZIL DARALTMASI:
      # olculecek duzlem `~/.claude/projects/.../memory/` CI checkout'unda YOKTUR.
      # Canli kolu burada kosturmak KALICI `OLCULEMEDI` kirmizisi uretir ve `serit-b`yi
      # surekli kirmizi birakarak gercek regresyon sinyalini oldururdu. Bunun yerine CI,
      # kapinin KENDI davranisini fikstur uzerinde olcer — canli kolun fail-closed'ligi
      # DAHIL: V5/V5b/V6 "duzlem/taban YOK -> `OLCULEMEDI` + sifir-disi rc" vakalaridir
      # ve M1 mutanti o kolu sessiz yesile cevirince UCU BIRDEN oluyor. Yani
      # "CI'da dizin yok -> sessizce gecer" hali BURADA olculuyor
      # ([[olculemedi-bypass-degil-menzil-daraltmasi]] — muafiyet listesi KULLANILMADI).
      # Canli kol (`--rapor` / bayraksiz) defterin BULUNDUGU duzlemde kosar.
      #
      # Batarya: 10 vaka + 2 hedef-kol atifli mutant (M1 OLCULEMEDI kolu · M2 taban
      # ratchet kolu) + KONTROL mutanti; ikisi de IZOLASYON olcer (hedef disi vakalar
      # YASAMALI). Mutasyon GECICI KOPYADA kosar, canli dosyaya dokunmaz.
      # Beyan: tools/is-akisi-kapisi.py :: SERIT_B (`serit-b` job'u).
      #
      # 🔴🔴 ADIM KALDIRILDI — 1 Eyl 2026, KraL-Tamirci-1Eyl. ARACIN KENDISI YOK.
      # OLCULDU: `tools/kalem-senkron-kapisi.py` `ca8c3815` supurmesinde silindi
      # ("48 kapi/nobetci/batarya silindi", BaBa filo karari + Okan "supur" emri) ve
      # `b985ebd2`'nin KAPSAM DARALTMASINDA (Okan 30 Agu hukmu, 33 dosya geri geldi)
      # BILEREK geri getirilmedi. CAGRI YERI ise burada KALDI. Sonuc: adim her
      # kosumda `python3: can't open file ... [Errno 2]` -> **rc=2**, yani
      # `serit-b` job'u BU SATIR YUZUNDEN bir daha ASLA yesillenemezdi. Bu bir
      # olcum DEGIL, KURU KIRMIZIDIR: hicbir sey olcmuyordu, yalnizca serit
      # hukmunu korlestiriyordu ([[eskalasyon-kapali-sayilir-duran-kirmizi-korlesir]]).
      # Sinif taramasi ayni gun kosuldu: `.github/workflows`'taki **430** cagri
      # yerinden OKSUZ olan **yalniz bu 2 satirdi** — yayilmis bir hastalik degil,
      # supurmenin tek artigi ([[cagri-yeri-envanterden-duserse-onarildi-sanilir]]).
      #
      # 🔴 KAYIP SESSIZ DEGILDIR — MIMARIN KARARINA BIRAKILIR: adim kalkinca K309
      # (kaynak-dogrusu defteri <-> DEVAM.md ayrismasi) ARTIK HICBIR KAPIYLA
      # OLCULMUYOR. Iki mesru yol var ve ikisi de OKAN/MIMAR duzlemindedir:
      #   (a) araci geri getir (`git show ca8c3815^:tools/kalem-senkron-kapisi.py`)
      #       — bu, Okan'in 30 Agu kapsam daraltmasini GENISLETMEK demektir;
      #   (b) K309'u kapisiz kalem olarak kabul et ve deftere OYLE yaz.
      # Bu cip (b)'yi de (a)'yi da SECMEDI: yalnizca hicbir sey olcmeyen kuru
      # kirmiziyi kaldirdi ve kaybi BURAYA + kaleme YAZDI.

      # ═══════════════════════════════════════════════════════════════════════
      # CLAUDE.md'NIN ZORUNLU KILDIGI KAPILARIN BATARYALARI (30 Agu, Okan hukmu)
      # ═══════════════════════════════════════════════════════════════════════
      # `ca8c3815` supurmesi SURUYOR (BaBa filo karari + Okan "supur" emri) —
      # geri donen TEK sinif, CLAUDE.md'nin ZORUNLU KURAL olarak atif yaptigi
      # araclardir: yazili kural ile canli sistem celisemez. Bu adim o kapilarin
      # NOBETCILERINI kosturur; kapiyi nobetcisiz indirmek bu depoda olculmus bir
      # ariza sinifidir.
      #
      # Kume TAHMIN EDILMEDI, DARALTILMIS AGAC UZERINDE OLCULDU (40'lik onceki
      # olcum DEVREDILMEDI): temiz klon (`git clone --no-local`) + sokulmus HOME
      # ile bu dordu gercek iddia basip rc=0 verdi. Ayni kosumda `sahiplik-kapisi`
      # (rc=1, yerel duzlem) ve `mimar-commit-kapisi` (SIFIR iddia, kapi govdesi)
      # KABLOLANMADI -> ci-kapsam-test.py::IZIN_LISTESI'ne sinif gerekcesiyle
      # yazildi.
      #
      # 🔴 `worktree-tavan-nobeti.py` BU ADIMDA YOK ve bu bir unutma DEGILDIR:
      # DIS bataryasi HIC YOK (olculdu — ne `ca8c3815^`da ne kaynak agacta boyle
      # bir dosya var). Nobetcisi kendi `--kendini-test` kolu; ayrica pre-push'ta
      # rapor-only kosuyor. Uydurma batarya adi YAZILMADI.
      #
      # serit-b `deploy.needs`te DEGIL -> K80 bunu ZINCIR_DISI raporlar, yayin
      # sartina baglamaz. `continue-on-error` KULLANILMADI.
      - name: "CLAUDE.md zorunlu kapilari — chip duzeni + mimar commit kapisi bataryalari"
        if: ${{ !cancelled() }}
        run: |
          python3 tools/chip-duzeni-kapisi.py --kendini-test
          python3 tools/chip-duzeni-test.py
          python3 tools/mimar-commit-kapisi-test.py
          python3 tools/mimar-commit-kapisi-mutasyon.py

      # ⚠️ DORT AGIR MUTASYON BATARYASI BU JOB'DAN CIKARILDI (10 Agu 2026) — bkz.
      # asagidaki `marka-bolum-bataryasi` · `marka-sayfa-bataryasi` ·
      # `model-uyelik-bataryasi` · `model-baslik-bataryasi` joblari. SILINMEDILER,
      # SUSTURULMADILAR, DARALTILMADILAR: ayni adim adi, ayni komut, ayni ortam,
      # ayni fail-closed cikis kodu — yalnizca AYRI JOB'DA ve PARALEL kosuyorlar.
      # Serit degismedi (nobet.yml'in TUM joblari serit B'dir) ve dordunun de
      # SERIT_B beyani tools/is-akisi-kapisi.py'de yeni job id'siyle DURUYOR.



  # ═════════════════════════════════════════════════════════════════════════════
  # AGIR MUTASYON BATARYALARI — SERIT B, `serit-b` JOB'UNDAN AYRILDI (10 Agu 2026)
  # ═════════════════════════════════════════════════════════════════════════════
  # OLCULEN PROBLEM (gh api, son YESIL SERIT B kosumu 31349739698): `serit-b` job'u
  # 142 dakika surdu ve bu dort adim TEK BASINA 7370 sn = 123 dk (job'un %86'si) idi:
  #   model-uyelik   2788 s · marka-bolum 2406 s · marka-sayfa 1277 s · model-baslik 899 s
  # Is akisi `push` tetikli ve `concurrency: nobet-serit-b` + `cancel-in-progress: false`
  # -> saatte birkac katalog partisi inerken son 12 SERIT B kosumunun 8'i kuyrukta
  # `cancelled` oldu. Zarar YAYIN DEGIL (bu joblarin hicbiri `deploy: needs`te degil),
  # GERI BILDIRIM GECIKMESI: bir kapi kirildiginda ~2,5 saat sonra goruluyordu.
  #
  # 🔴 BU BIR TASIMA ISIDIR, OPTIMIZASYON DEGIL: mutant sayisi, mutant listesi, komut,
  # bayrak ve adim adi BIREBIR korundu. Bu evde olculdu — bir adimi baska job'a/seride
  # tasimak, rc=0 kalirken OLCULEN IDDIA SAYISINI sessizce kucultebilir
  # ([[kapi-yan-etkisi-gizli-onkosul]] · [[maliyet-tasimasi-serit-dusurur]]);
  # kabul cikis kodu DEGIL, BASILAN IDDIA SAYISIDIR.
  #
  # 🔴 NEDEN `strategy.matrix` DEGIL, DORT AYRI JOB (olculmus gerekce): matrix kolu
  # `run: ${{ matrix.komut }}` yazmayi gerektirir. tools/is-akisi-kapisi.py ::
  # kapi_cagrilari kapi cagrilarini `run:` SATIRLARINDAN kesfeder; arac yolu bir
  # matrix degiskeninin arkasina girdigi anda dort cagri kapinin gozunden KAYBOLUR ->
  # SERIT_B beyanlari bayatlar (S3) ve ci-kapsam-test.py'nin "CI'da kosan kapi" kumesi
  # dort eksik olcer. Yani matrix, tam da bu spec'in yasakladigi SESSIZ YUZEY
  # KUCULMESINI uretirdi. Dort duz `run:` satiri kapinin gozunde AYNEN durur.
  #
  # 🔴 YAYINI BLOKLAMIYORLAR: `needs:` YOK, hicbir is bunlara bagli DEGIL ve
  # deploy.yml'deki `deploy: needs` listesi DEGISMEDI (deploy.yml'e DOKUNULMADI).
  # ⚠️ `continue-on-error` KULLANILMADI (fail-open yazimi bu depoda nobetci ihlalidir).
  # ⚠️ `timeout-minutes: 90` — olculen en uzun bataryanin (2788 s = 46,5 dk) ~2 kati.
  # Bu evde olculdu: FAIL-SLOW = FAIL-OPEN — asilan bir kol kapiyi 46+ dk sahte-yesil
  # tutar ve kosum sonunda iptal edilir ([[fail-slow-fail-opendir]]).
  # Kurulum adimlari `serit-b` ile BIREBIR AYNIDIR (checkout fetch-depth: 0 · python
  # 3.12 · boto3+pyyaml · node 20) — ortam farki sessiz bir davranis farki uretirdi.

  marka-bolum-bataryasi:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari (boto3 - R2 testleri icin; pyyaml - is akisi kapisi)
        run: pip install boto3 pyyaml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: "Marka bolum kimligi mutasyon bataryasi (iki katman, 5 mutant + kontrol)"
        run: python3 tools/marka-bolum-mutasyon.py

  marka-sayfa-bataryasi:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari (boto3 - R2 testleri icin; pyyaml - is akisi kapisi)
        run: pip install boto3 pyyaml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Adim adindaki kadro 25 Agu 2026'da BAYATTI (13+5 yaziyordu, fiili kadro 18+3).
      # Sayi artik araca da civili (OLDURUCU_TABANI/KONTROL_TABANI/IDDIA_TABANI).
      - name: "Marka tek-sayfa hukmu mutasyon bataryasi (18 oldurucu + 3 kontrol)"
        run: python3 tools/marka-sayfa-mutasyon.py

  # Model kapilarinin GERCEK katalog olcumleri deploy.yml serit-a3'te bloklayici
  # kalir. Buradaki kollar yalniz araclarin KENDINI mutant kopyalariyla sinar.
  model-uyelik-bataryasi:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari (boto3 - R2 testleri icin; pyyaml - is akisi kapisi)
        run: pip install boto3 pyyaml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: "Model uyeligi mutasyon bataryasi (35 oldurucu + 7 kontrol)"
        run: python3 tools/model-uyelik-kapisi.py --kendini-test

  model-baslik-bataryasi:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari (boto3 - R2 testleri icin; pyyaml - is akisi kapisi)
        run: pip install boto3 pyyaml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: "Model baslik kolu mutasyon bataryasi (18 oldurucu + 4 kontrol)"
        run: python3 tools/model-baslik-kolu-test.py --kendini-test

  # SAYFA SAYACI INVARYANTI — CURUTME BATARYASI (12 Agu 2026).
  # Olculen hukum: sayfada BEYAN EDILEN parca sayisi == o yuzeyde ERISILEBILEN kart
  # sayisi. Okan canli ekranda ayni marka icin DORT ayri sayi gordu (beyan 593 ·
  # baslik 80 · kapsam beyani 575 · kapsam basligi 304). Onarim + invaryant ekseni
  # BLOKLAYICI seritteki tools/marka-sayac-kapisi.py'de; bu job o eksenin AYIRT
  # EDICILIGINI 7 oldurucu + 2 kontrol mutantiyla olcer.
  # 🔴 MUTASYON KOPYAYA UYGULANIR: surucu tools/ klasorunu gecici bir koke KOPYALAR,
  # geri kalani sembolik baglar ve canli dosyanin bas/son sha256'sini karsilastirir —
  # kardes surucude (marka-sayac-mutasyon.py) olculen "calisma agacini kirletiyor"
  # arizasi burada YAPISAL olarak imkansizdir.
  # ⚠️ `continue-on-error` KULLANILMADI · `needs:` YOK -> yayin yolunu uzatmaz.
  # ⚠️ `timeout-minutes: 90` — olculen yerel sure ~7 dk; fail-slow = fail-open.
  marka-invaryant-sayac-bataryasi:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari (boto3 - R2 testleri icin; pyyaml - is akisi kapisi)
        run: pip install boto3 pyyaml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: "Sayfa sayaci invaryanti mutasyon bataryasi (7 oldurucu + 2 kontrol)"
        run: python3 tools/marka-invaryant-sayac-mutasyon.py

  # ═════════════════════════════════════════════════════════════════════════════
  # CIKTI_KOK YONLENDIRME MUTASYON BATARYASI (K3, 27 Agu 2026) — SERIT B, AYRI JOB
  # ═════════════════════════════════════════════════════════════════════════════
  # NE OLCER: `tools/build.py --cikti-kok <yol>` ve `PRUVO_CIKTI_KOK` yonlendirmesinin
  # GERCEKTEN onurlandirildigini. M-KOK mutanti parametreyi OKUYUP YOK SAYAR (yine ortak
  # agaca yazar); batarya ortak agacin UC EKSENDE degisip degismedigini olcer
  # (A=izlenen · B=gitignored VARLIK · C=bilinen cikti yollarinin sha256) ve KONTROL
  # mutantiyla yanlis-pozitif kolunu AYRICA kapatir. Kabul cikis kodu DEGIL, basilan
  # bayraklardir: `M_KOK=OLDURULDU` + `KONTROL=YESIL`.
  #
  # 🔴 NEDEN AYRI JOB — `serit-b`ye EKLENMEDI (iki ayri olculmus sinif):
  #   (a) BU ARAC CALISMA AGACINI BILEREK KIRLETIR: M-KOK mutanti build ciktilarini
  #       (taban-fiyatlar.js · index.built.html · urun/ · varlik/ · _yayin/ ...) job'un
  #       checkout KOKUNE yazar, sonra `finally` icinde BILINEN yollardan siler.
  #       `serit-b`de kossaydi o kirletme penceresi 60+ komsu adimla AYNI agaci
  #       paylasirdi; tam o pencerede dosya yuzeyi/`git status` olcen bir komsu adim
  #       SAHTE KIRMIZI yanar ve sebep yanlis adima atfedilirdi
  #       ([[kapi-ambiyansi-olcerse-komsu-kirmiziya-yakar]]). Ayri job = ayri checkout:
  #       kirletme penceresi hicbir komsuyu GOREMEZ.
  #   (b) `hijyen-build` HIC UYGUN DEGIL (ters yonde ayni sinif): orada `tools/build.py`
  #       kosar ve SONRAKI adimlar (JSON-LD brand/sku kapilari) uretilen `urun/`
  #       ciktisina MUHTACTIR — bu aracin temizlik kolu tam o yollari SILER, komsu
  #       adimlar girdisiz kalirdi.
  #   Emsal BIREBIR yukaridadir: agir/izole bataryalar 10 Agu 2026'da `serit-b`den AYRI
  #   job'a alindi — ayni adim adi, ayni komut, ayni ortam, ayni fail-closed cikis kodu.
  #
  # 🔴 YAYINI BLOKLAMAZ: `needs:` YOK ve hicbir is buna bagli DEGIL; `deploy.yml`e
  # DOKUNULMADI -> `deploy` ile PARALEL kosar, yayin penceresini tek saniye uzatmaz.
  # ⚠️ `continue-on-error` KULLANILMADI (fail-open yazimi bu depoda nobetci ihlalidir):
  #    rc dogrudan konusur, job KIRMIZI yanar.
  # ⚠️ Kurulum adimlari `serit-b` ile BIREBIR AYNIDIR (checkout fetch-depth: 0 · python
  #    3.12 · boto3+pyyaml · node 20) — ortam farki sessiz bir davranis farki uretirdi.
  #    `fetch-depth: 0` ZORUNLU: temizlik kolu 4 yasal sayfayi `git show HEAD:<yol>` ile
  #    bilinen HEAD iceriginden yeniden yazar.
  # ⚠️ `timeout-minutes: 30` — batarya `build.py`yi IKI kez (mutant + kontrol) kosar;
  #    asilan bir kol job'u sahte-yesil bekletmesin ([[fail-slow-fail-opendir]]).
  # 🔴 IDDIA SAYISI BURAYA YAZILMAZ (bayat sayi yanlis guven verir) — betigin KENDISI
  #    `M_KOK=` · `KONTROL=` · `YAKALAYAN_EKSEN=` satirlarini basar.
  k3-cikti-kok-bataryasi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari (boto3 - R2 testleri icin; pyyaml - is akisi kapisi)
        run: pip install boto3 pyyaml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # 🔴 K330 (28 Agu 2026) — TABAN SIFIRLAMA KOLLARININ KENDI MUTASYON TESTI.
      #    ~1 sn; bataryanin YERINE GECMEZ, ONUNDE kosar. Neden ayri adim: bu iki
      #    kolun capalari `taban_artik_yollari` / `yapisal_artik_yollari`
      #    kaynagindan TURETILIR; kollar yeniden yazilirsa capa bayatlar ve
      #    bayatlik yalnizca ~590 sn'lik bataryanin SONUNDA gorulurdu.
      #    → [[capa-turetme-altyapisi-kullanilmadan-kaldi]]
      - name: "K330 taban-sifirlama kollari kendini-testi (MUTANT + HEDEF_KOL_ATFI + KONTROL)"
        run: python3 tools/k3-cikti-kok-mutasyon.py --kendini-test
      - name: "CIKTI_KOK yonlendirme mutasyon bataryasi (M-KOK oldurucu + KONTROL)"
        run: python3 tools/k3-cikti-kok-mutasyon.py

  # ═════════════════════════════════════════════════════════════════════════════
  # R2 ONEK GELENEGI NOBETI (7 Agu 2026) — ONCEDEN VAR OLAN CANLI GERCEGI RAPORLAR
  # ═════════════════════════════════════════════════════════════════════════════
  # OLCULEN BOSLUK: tools/r2_anahtar.py ONEKLER tablosu bir kaynak platformu HIC
  # tasimiyordu; gkey() bilinmeyen platformda sessizce "x<id>" uretiyordu ve o
  # anahtar canliya cikti (haftalarca gorunmedi). Onarim (fail-closed gkey + eksik
  # onek) DALDA yapildi; bu job onarimin GERI ALINMASINI ve YENI sapmanin dogmasini
  # gorunur kilar.
  #
  # 🔴 BU JOB BUGUN KIRMIZI YANIYOR VE BU DOGRUDUR — iki ekseni ONCEDEN VAR OLAN
  # canli gercegi raporluyor: (a) canli katalogda "x" onekli 1 bozuk anahtar
  # (duzeltmesi BASKA bir mimarin duzleminde, urun VERISI KraL'a ait degil),
  # (b) ONEKLER ile hasat tarafindaki ikiz tanim arasinda CGTrader ayrismasi
  # (mimar karari bekliyor). Ikisi de bu daldaki kodun kusuru DEGIL.
  #
  # 🔴 NEDEN AYRI IS ve NEDEN BLOKLAMAZ (`envanter` · `cron-nabzi` · `mesaj-nobeti`
  # ile AYNI desen): `needs:` YOK ve hicbir is buna bagli DEGIL -> `deploy` ile
  # PARALEL kosar, yayin yolunu tek saniye uzatmaz.
  #   (a) ONCEDEN VAR OLAN ihlali RAPORLAR, YENI ihlal URETMEZ: taradigi yuzey
  #       canlida ZATEN duran anahtarlardir; onlari yayindan alikoymak sayfayi
  #       404 yapar, gorseli ONARMAZ (ayni R2 anahtarinin uzerine yazmak YASAK).
  #   (b) BEDELI OLCULDU: urunle ILGISIZ bir kapinin yayini durdurmasi bu depoda
  #       6 SAATLIK canli 404 pencereleri acti ([[kapi-birikimi-yayin-gecikmesi]]);
  #       bugun kirmizi yanan bir kapi bloklayici seride konsaydi TUM EKIBIN yayini
  #       durur ve kapi ilk toplu iste devre disi birakilirdi.
  #   (c) ONLEME kolu burada DEGIL: yeni sapmanin dogmasini r2_anahtar.gkey()'in
  #       FAIL-CLOSED yolu (BilinmeyenPlatform) daha yazim aninda engeller; bu kol
  #       GORUNURLUK hattidir.
  # ⚠️ `continue-on-error` KULLANILMADI (fail-open yazimi nobetci ihlalidir):
  #    rc dogrudan konusur, job KIRMIZI yanar, bildirim duser. Katalog OKUNAMAZSA
  #    kapi OLCULEMEDI ile kirmizi yanar — "olcemedim" YESIL degildir.
  # ⚠️ IKIZ ekseni (E3/E4) kardes bir depodaki tanim dosyasini okur; o depo CI
  #    runner'inda YOKTUR -> orada eksen OLCULEMEDI verir. Bu eksenin YESILI YALNIZ
  #    yerelde anlamlidir; sessiz atlama YERINE gorunur kirmizi tercih edildi.
  # 🔴 IDDIA SAYISI BURAYA YAZILMAZ (bayat sayi yanlis guven verir) — betigin
  #    KENDISI "IDDIA: N (taban N)" satirini basar.
  # ===========================================================================
  # (KraL-KapiSupurmesi-29Agu: DEFTER KOTASI job'i SILINDI — kota kapisi K351 ile
  # kaldirildi, bakim harness bataryalari meta katti. defter-rotasyon.py ARAC
  # olarak duruyor; BaBa 28 Agu filo karari.)
  r2-onek-nobeti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "R2 onek gelenegi: canli katalogda sapma + ikiz tanim ayrismasi (ALARM — yayini DURDURMAZ)"
        run: python3 tools/r2-onek-gelenek-kapisi.py

      # R2 PURGE ARACININ KABUL BATARYASI (K114, 16 Agu 2026) — AGSIZ.
      # `tools/r2-purge.py` CF onbellegini temizler; bu batarya onun HATA KOLLARINI ve
      # ANAHTAR BEYAZ LISTESINI mutantlarla olcer (`urlopen` mock'lanir, DIS AG YOK).
      # Iki curutme turu iki kusur buldu ve ikisi de kapandi: (a) gizlilik olcumu yalniz
      # MUTLU YOLDAYDI — hata kollarinda anahtar sizabiliyordu, (b) `--anahtar` KARA
      # listesini bos dize atlatip medya KOK adresini hedefliyordu (kara liste BEYAZ
      # listeye cevrildi).
      # 🔴 NEDEN SERIT B (yayini BLOKLAMAZ): kirmizisi musteriye yanlis para odetmez,
      # veri sizdirmaz ve siteyi durdurmaz — yalnizca bir OPERASYON aracinin bozuldugunu
      # soyler. Turnusol `nobet.yml` SERIT B gerekcesiyle ayni.
      # ⚠️ `continue-on-error` YOK: rc dogrudan konusur.
      - name: "R2 purge araci kabul + mutasyon bataryasi (agsiz — ALARM, yayini DURDURMAZ)"
        run: python3 tools/r2-purge-test.py

  # ===========================================================================
  # HACIM TAM TAKIM (2026-08-02) — GERCEK TEST 1 (kapali-form vs RENDER)
  #
  # NEDEN AYRI IS: serit-b'deki iki jeneratör adimi BILEREK `--kendini-test`
  # kolundadir (nobetcinin KENDI kabulu; hermetik, ~0,5 s). Bayraksiz TAM kosum
  # iki DIS kaynak ister ve ikisi de bu depoda YOKTUR:
  #   (1) motor=pruvo aileleri -> PRUVO'nun kendi ureteclerinin .scad kaynagi,
  #       PRIVATE kardes depo `Pruvo138/pruvo-jenerator` (cross-repo okuma jetonu),
  #   (2) motor=uretim aileleri -> gitignore'lu uretim paketi
  #       (ONIZLEME_PAKET_B64 / R2), cunku hacim.js o ailelerde uretim motoruna
  #       kalibre ve motorun dosya/degisken adlari GIZLIDIR.
  # Bu is ONLARI ACIKCA ISTER. Jeton/secret yoksa OLCULEMEDI der ve KIRMIZI yanar
  # — "yok, o zaman atla" SESSIZ YESIL uretirdi; bu deponun tekrar tekrar isirildigi
  # desen tam olarak budur.
  #
  # 🔴 `deploy` isi buna BAGLANMADI (deploy: needs: build). Gerekce: jeton/secret
  # baglanmadan bu is kirmizi yanar ve TUM EKIBIN yayinini durdururdu. Bagimlilik
  # eklemek = MIMAR + OKAN karari (secret/yetki = Okan kapisi).
  # ===========================================================================
  hacim-tam-takim:
    # 🔴 BUGUN YALNIZ ELLE TETIK. Gerekce OLCULDU (2 Agu, seed 689931, pristine main):
    # `rampa` ailesinin `ust_yuzey=basamakli` kolu hacim.js ile PRUVO'nun kendi
    # ureteci arasinda %15,4-%30,6 sapiyor — DEGISIKLIKTEN ONCE DE sapiyordu
    # (uretim motoru kalibrasyon notu da "rampa(basamakli) SINIR DISI" diyor).
    # Yani bu is BUGUN KIRMIZI yanar ve dogru olani yapar: gercek, onceden GIZLI
    # kalmis bir kusuru gorunur kilar. Ama her push'ta kirmizi yanan bir kapi bu
    # depoda olculmus bir bedele sahiptir (kapi birikmesi -> ilk toplu iste kapi
    # devre disi birakilir). O yuzden once `rampa` basamakli kolu onarilir, SONRA
    # bu satir kaldirilip is push'a baglanir. Sirali adim, susturma DEGIL:
    # is akisinda DURUYOR, elle her an kosturulabilir ve kirmizisi gercektir.
    # AYRICA: dogrula.py tohumu her kosumda RASTGELE -> "yesil" olasiliksaldir;
    # rampa/yay tam bu yuzden haftalarca gorunmedi. Secenek KOLLARINI deterministik
    # tarayan bir kapsam olcutu ayri istir (mimar tablosu).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # On-kosul BEYANI — eksikse ERKEN ve GURULTULU dur (sessiz atlama YOK).
      - name: "On-kosul: kardes depo jetonu + uretim paketi secret'i beyan edilmis mi"
        env:
          JEN_TOKEN: ${{ secrets.PRUVO_JENERATOR_TOKEN }}
          PAKET_B64: ${{ secrets.ONIZLEME_PAKET_B64 }}
        run: |
          eksik=""
          if [ -z "$JEN_TOKEN" ]; then eksik="$eksik PRUVO_JENERATOR_TOKEN"; fi
          if [ -z "$PAKET_B64" ]; then eksik="$eksik ONIZLEME_PAKET_B64"; fi
          if [ -n "$eksik" ]; then
            echo "OLCULEMEDI (fail-closed KIRMIZI): eksik secret ->$eksik"
            echo "Bu bir YESIL DEGILDIR: gercek TEST 1 hic kosmadi."
            exit 1
          fi
          echo "on-kosullar tamam"

      - name: "Kardes depo (PRUVO kendi ureteclerinin .scad kaynagi)"
        uses: actions/checkout@v4
        with:
          repository: Pruvo138/pruvo-jenerator
          token: ${{ secrets.PRUVO_JENERATOR_TOKEN }}
          path: .pruvo-jenerator

      - name: "Gizli uretim paketini geri ac (motor=uretim aileleri icin)"
        env:
          PAKET_B64: ${{ secrets.ONIZLEME_PAKET_B64 }}
        run: |
          printf '%s' "$PAKET_B64" | base64 -d > /tmp/paket.tar.gz
          tar -xzf /tmp/paket.tar.gz -C onizleme/derleyici
          test -f onizleme/derleyici/eslem-ozel.json || {
            echo "OLCULEMEDI: paket acildi ama eslem-ozel.json yok"; exit 1; }

      - name: "OpenSCAD (nightly AppImage + xvfb)"
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-dejavu fonts-liberation \
            libegl1 libgl1 libglu1-mesa libopengl0
          FN=$(curl -s https://files.openscad.org/snapshots/ \
               | grep -oE 'OpenSCAD-[0-9.]+\.ai[0-9]+-x86_64\.AppImage' | sort -u | tail -1)
          wget -q "https://files.openscad.org/snapshots/$FN" -O openscad.AppImage
          chmod +x openscad.AppImage
          ./openscad.AppImage --appimage-extract >/dev/null
          printf '#!/bin/sh\nexec xvfb-run -a "%s/squashfs-root/AppRun" "$@"\n' "$PWD" \
            > /usr/local/bin/openscad
          chmod +x /usr/local/bin/openscad
          openscad --version

      # GERCEK TEST 1: her aile kendi BEYAN ETTIGI motora karsi olculur
      # (esleme/<aile>.json "motor" alani). Beyan yoksa ya da beyan edilen motor
      # bulunamazsa dogrula.py OLCULEMEDI der ve sifir-disi doner (fail-closed).
      - name: "TEST 1 TAM KOSUM — hacim.js vs render (22 aile, motor beyanli)"
        env:
          PRUVO_SCAD_DIR: ${{ github.workspace }}/.pruvo-jenerator/jeneratorler
        run: python3 jenerator/test/dogrula.py --hepsi --set 3

      - name: "Jeneratör kabul takimi TAM KOSUM (8 test; TEST 1 + build.py dahil)"
        env:
          PRUVO_SCAD_DIR: ${{ github.workspace }}/.pruvo-jenerator/jeneratorler
        run: python3 jenerator/test/kabul.py

  hijyen-build:
    runs-on: ubuntu-latest
    steps:
      # 🔴 fetch-depth: 0 ZORUNLU — tools/diriltme-kapisi.py "gecmiste SILINMIS urun id'si"
      # kumesini `git log -p --first-parent -- urunler.json` ile TURETIR (elle liste
      # TUTULMAZ; olculdu 30 Tem: 801 commit, ~68 MB diff, 4,2 s, 990 silinmis id).
      # actions/checkout VARSAYILANI `fetch-depth: 1` (SIG/shallow) ve o halde gecmis YOKTUR.
      # Bu satir dusurulurse kapi SESSIZCE yesile donmez: SIG depoyu tanir ve
      # OLCULEMEDI (rc 2) ile YAYINI DURDURUR (fail-closed).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pyyaml: is akisi BICIM kapisi (tools/is-akisi-kapisi.py) GERCEK bir YAML
      # ayristiricisi ister. Ayristirici YOKSA o kapi YESIL SAYMAZ (exit 2 = OLCULEMEDI)
      # -> bu satirdan pyyaml dusurulurse yayin durur, sessizce korumasiz KALMAZ.
      - name: Python bagimliliklari (boto3 - R2 testleri icin; pyyaml - is akisi kapisi)
        if: ${{ !cancelled() }}
        run: pip install boto3 pyyaml
      # Node: piksel<->katalog parite testinin JS-uc nobeti (index.html pruvoFeedId + olcum.js
      # feedId/metaGovdesi/ga4Govdesi) node ile kosar. FAIL-CLOSED: node yoksa test CI'da exit 1
      # verir (yalanci-yesil olamaz), o yuzden setup-node BLOKLAYICI bir on-kosuldur.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # BOS/ANI-DUSUS + 20 tarihli surum: uc davranis ve iki oldurucu mutant.
      # Mutant ayaklarinin ikisi de KIRMIZI yanmadan test YESIL sayilmaz.
      - name: "Yedek koruma davranisi ve mutasyon kabulu"
        if: ${{ !cancelled() }}
        run: python3 tools/yedek-koruma-test.py

      # SITEMAP DAMGA ONBELLEGI — <lastmod> tarihlerinin HIZLANDIRICISI, KAYNAGI DEGIL.
      # Tarihler git gecmisinden turer (tools/sitemap_damga.py); bu dosya yalnizca ayni
      # yurumeyi her kosumda tekrarlamamak icindir. ONBELLEK DUSERSE HICBIR TARIH
      # YANLIS OLMAZ: build soguk baslar (tavansiz yurume + 240 sn sure butcesi) ve
      # tarihleri yeniden turetir; butce dolarsa cozulemeyen URL lastmod'suz cikar.
      # Bu yuzden `continue-on-error` GEREKMEZ ve adim yayini BLOKLAMAZ.
      # IZLENEN dosya OLARAK TUTULAMAZ (olculdu 11 Agu 2026): 25 bin satirlik defteri
      # tasiyan commit pre-push sizinti nobetcisinde 296.511 aday uretip tavani (150.000)
      # asiyor ve her itmeyi durduruyordu.
      - name: "Sitemap damga onbellegi (lastmod hizlandiricisi — dogruluk buna bagli DEGIL)"
        if: ${{ !cancelled() }}
        uses: actions/cache@v4
        with:
          path: sitemap-damgalari.json
          key: sitemap-damga-${{ github.sha }}
          restore-keys: |
            sitemap-damga-

      - name: Statik sayfalari uret
        if: ${{ !cancelled() }}
        run: python3 tools/build.py

      # (URETICI BUTUNLUK KAPISI 16 Agu 2026'da `build` isine TASINDI — K113: kapi
      # KANONIK ADRESI olcuyor, kirmizisi musterinin actigi URL'i vuruyor, o yuzden
      # `deploy: needs` DISINDA duramaz. Adim BURADAN SILINDI, kopyalanmadi: iki kopya
      # zamanla ayrisir. Gerekcenin tam metni `build` isindeki adimin uzerindedir.)

      # JSON-LD BRAND KAPISI: uretilen TUM urun sayfalarinin JSON-LD bloklari taranir —
      # JSON gecerli + hicbir objede yinelenen anahtar yok + Product.brand TEK deger
      # (cok elemanli Brand dizisi GSC Merchant listings'te "brand alani yineleniyor"
      # KRITIK hatasi uretir; canlida dogrulandi 22 Tem, 3884 sayfa etkilenmisti).
      # build.py'den SONRA kosmak ZORUNDA (urun/ ciktisina muhtac). Offline, stdlib.
      - name: JSON-LD brand kabul testi (uretilen sayfalar)
        if: ${{ !cancelled() }}
        run: python3 tools/test-jsonld-brand.py

      # JSON-LD SKU KAPISI: uretilen TUM urun sayfalarinda Product.sku 50 karakter
      # sinirini asmasin. Google Merchant "sku" 50 karakter kisitlidir; feed g:id/g:mpn
      # bunu feed_id(pid) ile uyguluyordu ama JSON-LD sku HAM pid basiyordu -> uzun
      # urun-id'lerinde «sku gecersiz uzunluk» KRITIK hatasi (GSC WNC-10030322, 24 Tem).
      # Onarim: sku = feed_id(pid) (feed g:id/g:mpn ile TEK KAYNAK; product_url/link TAM
      # pid ile kalir). Test: her sayfa sku<=50 + sku==feed_id(pid) + kisa-id churn yok +
      # merchant-feed.xml g:mpn capraz-kontrol + katalogdan bagimsiz sentetik uzun-id
      # mutasyon nobeti. build.py'den SONRA kosmak ZORUNDA (urun/ + merchant-feed.xml'e
      # muhtac). Offline, stdlib (build'i modul olarak import eder), yazma yok.
      - name: JSON-LD sku kabul testi (uretilen sayfalar + feed capraz-kontrol)
        if: ${{ !cancelled() }}
        run: python3 tools/test-jsonld-sku.py


      # SADECE sitenin ihtiyac duydugu dosyalar yayina girer (beyaz liste).
      # Eskiden path: . tum repoyu yayinliyordu -> tools/*.py canli siteden
      # indirilebiliyordu (ic araclar + ticari mahremiyet; denetim 2026-07-15).
      # 🔴 19 AGU 2026 (K215, IKINCI YARI) — BU ADIM deploy.yml::build'in AYNASIDIR ve
      # oradaki kabuk blogunun SATIR SATIR IKINCI KOPYASIYDI. K215 deploy tarafini
      # tools/yayin-topla.py'ye tasidi; bu kopya birakilsaydi TEK KAYNAK iddiasi
      # yalan olurdu: iki govde zamanla ayrisir ve hijyen seridi, YAYINDA KOSMAYAN
      # bir mantigi "yesil" diye olcmeye devam ederdi (ayni sinif: `uretici butunluk
      # kapisi` 16 Agu'da tam bu sebeple buradan SILINMISTI, kopyalanmamisti).
      # Govde + fail-closed kurallarin TEK KAYNAGI: tools/yayin-topla.py::MANIFESTO.
      - name: Yayin klasorunu topla (beyaz liste)
        if: ${{ !cancelled() }}
        run: python3 tools/yayin-topla.py

      # ══════════════════════════════════════════════════════════════════════════
      # YAYIN OLCEGI OLCUMU (6 Agu 2026) — "OLCULEMEDI" halini kapatir.
      #
      # NEDEN: 6 Agu'da `deploy` isi ust uste `GitHub Pages'e yayinla` adiminda
      # 600 sn'de dustu ve "artefakt olcek duvarina mi carpti" sorusu SAYIYLA
      # cevaplanamadi — elimizde yalnizca SIKISTIRILMIS zip boyu (upload-artifact
      # basar: 5 Agu 211,3 MB -> 6 Agu 220,3 MB) vardi. GitHub Pages'in BELGELENMIS
      # siniri ise ACILMIS site boyudur: "Published GitHub Pages sites may be no
      # larger than 1 GB" (docs.github.com/pages ... /github-pages-limits). Yani
      # bugune dek TAM DA SINIRA GORE OLCULEN sayi hic basilmiyordu.
      #
      # NE BASAR: acilmis toplam bayt, dosya sayisi, dizin sayisi ve en buyuk 10
      # ust dizin. 1 GB'a gore doluluk yuzdesi de basilir ki egri (gun gun) log'dan
      # okunabilsin.
      #
      # 🔴 NEDEN `du -sb _site` DEGIL (olculdu 6 Agu — YANLIS OLCUM TUZAGI): `du`
      # DIZIN inode'larini da sayar (dizin basina 4096 B). Bu agacta 22.359 dizin
      # var -> `du -sb` gercek icerigi ~91 MB SISIRIR (%+10,5) ve 1 GB doluluk
      # %80,8 yerine ~%89 gorunur. Pages'in yayinladigi ve 1 GB'a saydigi sey DOSYA
      # icerigidir; bu yuzden toplam `find -type f -printf '%s'` ile YALNIZ DOSYA
      # baytlarindan toplanir. Yanlis olcum olcumsuzlukten KOTUDUR: sahte esik
      # alarmi uretip yanlis mimari karar dogurur. Referans (ayni agac, kosum
      # 31107527748 artefakt tar'indan sayildi): 867.958.072 B / 22.399 dosya —
      # bu adimin ilk ciktisi buna YAKIN olmali, `du` degeri olmamali.
      #
      # 🔴 NEDEN BLOKLAYICI DEGIL: bu bir OLCUM adimidir, kapi degildir. Esik
      # koymak (ornegin ">%90 ise kirmizi") YAYIN MIMARISI karari olup mimarindir;
      # olcum yokken esik koymak da tanim geregi kor olurdu. `continue-on-error:
      # true` ile bu adim hicbir sekilde yayini durduramaz. Sayi birikince esik
      # AYRI bir kapi olarak eklenebilir.
      - name: "Yayin olcegi olcumu (acilmis _site bayt/dosya dokumu — 1 GB Pages siniri)"
        if: ${{ !cancelled() }}
        run: |
          TOPLAM=$(find _site -type f -printf '%s\n' | awk '{s+=$1} END{printf "%d", s}')
          DOSYA=$(find _site -type f | wc -l)
          DIZIN=$(find _site -type d | wc -l)
          echo "YAYIN-OLCEK toplam_bayt=$TOPLAM"
          echo "YAYIN-OLCEK dosya_sayisi=$DOSYA"
          echo "YAYIN-OLCEK dizin_sayisi=$DIZIN"
          awk -v b="$TOPLAM" 'BEGIN{printf "YAYIN-OLCEK mib=%.1f\n", b/1048576}'
          awk -v b="$TOPLAM" 'BEGIN{printf "YAYIN-OLCEK 1GB_doluluk_yuzde=%.1f\n", b*100/1073741824}'
          echo "YAYIN-OLCEK --- ust dizinler (yalniz dosya baytlari) ---"
          find _site -mindepth 1 -maxdepth 1 -printf '%f\n' | while IFS= read -r ust; do
            find "_site/$ust" -type f -printf '%s\n' \
              | awk -v u="$ust" '{s+=$1; n++} END{printf "%d\t%s\t(%d dosya)\n", s+0, u, n+0}'
          done | sort -rn | head -12

  hijyen-a2:
    runs-on: ubuntu-latest
    steps:
      # 🔴 fetch-depth: 0 ZORUNLU — tools/diriltme-kapisi.py "gecmiste SILINMIS urun id'si"
      # kumesini `git log -p --first-parent -- urunler.json` ile TURETIR (elle liste
      # TUTULMAZ; olculdu 30 Tem: 801 commit, ~68 MB diff, 4,2 s, 990 silinmis id).
      # actions/checkout VARSAYILANI `fetch-depth: 1` (SIG/shallow) ve o halde gecmis YOKTUR.
      # Bu satir dusurulurse kapi SESSIZCE yesile donmez: SIG depoyu tanir ve
      # OLCULEMEDI (rc 2) ile YAYINI DURDURUR (fail-closed).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pyyaml: is akisi BICIM kapisi (tools/is-akisi-kapisi.py) GERCEK bir YAML
      # ayristiricisi ister. Ayristirici YOKSA o kapi YESIL SAYMAZ (exit 2 = OLCULEMEDI)
      # -> bu satirdan pyyaml dusurulurse yayin durur, sessizce korumasiz KALMAZ.
      - name: Python bagimliliklari (boto3 - R2 testleri icin; pyyaml - is akisi kapisi)
        if: ${{ !cancelled() }}
        run: pip install boto3 pyyaml
      # Node: piksel<->katalog parite testinin JS-uc nobeti (index.html pruvoFeedId + olcum.js
      # feedId/metaGovdesi/ga4Govdesi) node ile kosar. FAIL-CLOSED: node yoksa test CI'da exit 1
      # verir (yalanci-yesil olamaz), o yuzden setup-node BLOKLAYICI bir on-kosuldur.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # R2 GORSEL ANAHTARI: anahtar KAYNAK-ID'den turetilir (basliktan DEGIL) — turetme tek
      # modulde (tools/r2_anahtar.py) toplandi, cagiranlar ondan gecer. Bloklayici: anahtar
      # basliga kayarsa iki urun ayni R2 nesnesini EZER (sessiz gorsel kaybi). Offline, yazma yok.
      - name: R2 anahtar turetme kabul testi
        if: ${{ !cancelled() }}
        run: python3 tools/r2-anahtar-test.py

      # YETIM KAYIT KAPISI (K55, 12 Agu 2026) — kaynak kaydi OLMAYAN + R2 anahtari kaynak-id
      # (th/pr/mw/cgt/c3d) yerine BASLIK-slug'undan turetilmis urunler (yetim) yol-dedup
      # tarafindan GORULMEZDI: gorsel-cakisma-onar yalniz URL CAKISAN urunu, mukerrer-kontrol
      # yalniz mukerrer linki tarar. Bu adim kapiyi KENDINI-TEST ile kilitler (siniflandirici
      # ve tarama fiksturde dogru -> dedektor curuyemez). Canli tarama ON-DEMAND kalir:
      # bugun 193 yetim var, veri tek-yazar MaCiT duzlemi -> push'u BLOKLAMAZ; backfill
      # bitince (canli tarama 0) nobet serisine tasinir. Offline, yazma yok, ag yok.
      - name: Yetim kayit kapisi kendini-testi (kayit-yok + baslik-anahtar siniflandiricisi)
        if: ${{ !cancelled() }}
        run: python3 tools/yetim-kayit-kapisi.py --kendini-test

      # FEED POLITIKA KAPISI — IKI KATMANLI. Merchant feed'inin <title> VE <description>
      # metinlerini tarar. BLOKLAYICI katman YALNIZ olculmus/bildirilmis GERCEK Merchant
      # reddinden turemis 3 jeton icerir (e-sigara/vape ailesi; "durbun" BLOKLAMAZ, RAPOR
      # katmanindadir — mesru Marin/Kamera urunu tum ekibin yayinini durdurmasin diye).
      # Tam katalogda 7 isabet, YANLIS-POZITIF 0 (olculdu 2026-07-22, 7650 feed kalemi:
      # 7 isabetin 7'si de gercek e-sigara/vape urunu, tek tek denetlendi ve tabanda yazili).
      # Feed KISMEN taranirsa (ayristirma kirpilir/bozulur) kapi FAIL-CLOSED kirmizi yanar —
      # eskiden cikis 0 veriyordu ve 3000. siradaki gercek bir vape urunu sessizce geciyordu.
      # Bilinen borc tools/feed-politika-
      # taban.json'da (tek yazar MaCiT, KOD DEGISIKLIGI GEREKTIRMEDEN guncellenir);
      # tabanda OLMAYAN yeni bir ihlal ya da tabandaki bir urunun YENI jeton kazanmasi
      # KIRMIZI yakar. Supheli ama kanitsiz jetonlar (kullук/cakmak/susturucu — bunlar
      # mesru Turkce otomotiv parca adlaridir, olculdu: 71 yanlis pozitif) RAPOR katmaninda
      # yalniz SAYILIR, CI'yi KIRMAZ. Offline (feed'i build.py'yi MODUL olarak import edip
      # uretir), olculdu 2,6 s.
      - name: Feed politika jetonu kapisi (bloklayici + rapor)
        if: ${{ !cancelled() }}
        run: python3 tools/feed-politika-kapisi.py

      # ASGARI GORSEL BOYUTU: 100x100 altindaki gorsel Google Merchant'ta "resim cok kucuk"
      # reddi alir (olculen vaka 1000x88). Kapinin KENDISI ekleme hattinda kosar (CI'da
      # 7769 gorseli agdan cekmek kabul edilemez); burada kosan sadece onun OFFLINE kabul
      # testidir (sentetik fikstur, saf Python baslik ayristirma). Test uc ekleme betigini
      # GERCEKTEN import edip process_one'i sahte upload ile uctan uca kosturur (ag/AI/sips
      # yok, urunler.json'a DOKUNMAZ) -> kablolama kopmasi sessiz kalamaz. Olculdu 2,1 s.
      - name: Asgari gorsel boyutu kapisi kabul testi
        if: ${{ !cancelled() }}
        run: python3 tools/gorsel-boyut-test.py

      # MARKA KÜRATÖRLÜĞÜ: ana sayfa marka çip listesi yalnız TANINMIS_MARKALAR'dan oluşur
      # (model/motor kodu çip olamaz), varyantlar (Mercedes-Benz, Toyota 86, KIA/Kia) tek
      # kaleme katlanır ve filtre eşleşmesi katlamayla tutarlıdır. index.html'deki bloğu
      # AYIKLAYIP gerçek urunler.json'a uygular (kopya değil, canlı kod). JS mantığı node
      # ile koşar (setup-node kurulu; node yoksa FAIL-CLOSED exit 1). Offline, ~1 s.
      - name: Marka liste kabul testi (küratörlü çipler + varyant katlama)
        if: ${{ !cancelled() }}
        run: python3 tools/marka-liste-test.py

      - name: Site arac es anlamli fiksturu ve mutasyon nobeti
        if: ${{ !cancelled() }}
        run: node tools/site-esanlam-test.js

      # MARKA SAYFASI UYELIGI (olculdu, 31 Tem): jenerator uyeligi HAM marka[0] ile
      # taniyordu; "Volvo Penta" (21 Marin) ve "Mercedes-Benz" (20) ham halde taninmis
      # listede olmadigi icin 41 urun HICBIR marka sayfasina girmiyordu. Hata SESSIZ:
      # urun aramada cikar, ana sayfa cipi gosterir, /marka/volvo/ sayfasinda YOKTUR.
      # Ikinci sessiz hata: model kirilimi marka[1]'i hep MODEL saniyordu; cok markali
      # uyumluluk kayitlari ("Peugeot"+"Citroen") /marka/peugeot/citroen/ gibi ANLAMSIZ
      # 33 sayfa doguruyor, urun ikinci markanin sayfasinda GORUNMUYORDU. NE KORUR:
      # katlanmis uyelik, marka-adli model sayfasinin URETILMEMESI, gercek MODEL
      # kirilimini (SEO ana ekseni) koruyan regresyon nobeti, index.html marka filtresi
      # ile BIREBIR parite, cip haritasinin birincil markada kalmasi. Sayfalari GERCEK
      # jeneratorle gecici ROOT'a uretir; katlama tablosu okunamazsa YESIL DEMEZ (exit 2).
      # Saf Python, offline, urunler.json'a YAZMAZ.
      - name: Marka uyelik kabul testi (katlanmis uyelik + anlamsiz URL nobeti)
        if: ${{ !cancelled() }}
        run: python3 tools/marka-uyelik-test.py

      # MARKA INVARYANTI (Okan hukmu): "TUM markalarda sayfa ve arama urun adetlerinin
      # AYNI olmasi." Tek tek yama degil, INVARYANT. OLCULEN SESSIZ HATA (4 Agu): uctaki
      # `?marka=` kolunun HAM STRING ESITLIGI site katlamasindan ayrisiyordu -> 128
      # markanin 9'unda 120 urun-kalemi MUSTERI CIPE BASINCA KAYBOLUYORDU. 12 Agu'da uc
      # D1 `marka_kanon` uyeligine gecirildi ve borc tabani 0'a sikilastirildi. Kapi her
      # kanonik marka icin UC KUME kurar (sayfa · ?marka= ·
      # ?q=) ve farklari MARKA MARKA tabana (tools/marka-invaryant-taban.json) karsi olcer:
      # MEVCUT BORC BLOKLAMAZ, REGRESYON BLOKLAR (circir: dusus de kirmizidir, taban
      # bayatlamasin). AG CAGRISI YOK (CI'da deterministik); uc davranisi yerel portla
      # modellenir ve modelin canliyla 128/128 eslestigi bir kez olculdu (kapinin
      # docstring'inde). Totoloji tuzagina karsi 5 POZITIF CAPA + mutasyon bataryasi
      # (tools/marka-invaryant-mutasyon.py). Saf Python, offline, ~2 s.
      - name: Marka invaryant kapisi (sayfa ↔ cip ↔ arama, taban civili)
        if: ${{ !cancelled() }}
        run: python3 tools/marka-invaryant-kapisi.py

      # D1 `marka_kanon` KOLONU (ayni sessiz hatanin KAYNAKTA kapatilmasi): katlama
      # mantigi Worker'a KOPYALANMAZ (ikinci govde = sessiz ayrisma); kanonik marka
      # uyeligi senkron aninda deponun TEK KAYNAGINDAN turetilip D1'e ONCEDEN yazilir.
      # Test gercek d1-sema.sql'i yerel sqlite3'e yukler, gercek d1-sync fonksiyonlarini
      # ve gercek urunler.json'u kullanir; CANLI D1'e/wrangler'a/AGA DOKUNMAZ. NE OLCER:
      # kolonun dogru SINIFTA olmasi (hash'e karismaz -> hedefli UPDATE), kanonik sayimin
      # marka sayfasiyla 128/128 birebir olmasi, 120 kalemlik kaybin KAPANMASI, idempotens,
      # olcek (markasiz urune dokunmama), FAIL-CLOSED yonunun "bosalt" degil "dokunma"
      # olmasi ve SEMA SIRASI (kolon yokken SELECT'e girmez -> kimsenin push'u kirilmaz).
      - name: Marka kanon D1 kolonu kabul testi (120 kalemlik cip kaybi kapaniyor mu)
        if: ${{ !cancelled() }}
        run: python3 tools/marka-kanon-d1-test.py

      # D1 `model_kanon` KOLONU — AYNI sessiz hata sinifinin MODEL EKSENI (5 Agu). Uctaki
      # `model` kolu `uyum[].model` alaninda TAM ESITLIK arar; site ise modeli KUSAK/VARYANT
      # duzeyinde katlar (`Fiesta ST` -> Fiesta, `T4`/`T5` -> Transporter, `Astra H` -> Astra).
      # Olculdu: 553 yayimlanan model kovasinin 96'sinda sayfa suzgecten GENIS, 390 urun-kalemi
      # musteri MODEL CIPINE BASINCA kayboluyor. Cozum marka ekseniyle BIREBIR: katlama Worker'a
      # KOPYALANMAZ, kanonik model uyeligi senkron aninda SAYFA URETICISININ KENDI yukleminden
      # turetilip D1'e onceden yazilir. Test gercek d1-sema.sql'i yerel sqlite3'e yukler,
      # CANLI D1'e/wrangler'a/AGA DOKUNMAZ ve semayi CANLIYA UYGULAMAZ. NE OLCER: kolonun
      # dogru SINIFI (hash'e karismaz -> hedefli UPDATE), 5 AYRI katlama mekanizmasinin
      # POZITIF CAPASI, 390 kalemlik kaybin 0'a inmesi, deger evreninin YAYIMLANAN kova
      # etiketleriyle birebir olmasi (kapali sayfa sizmasin), idempotens/olcek, FAIL-CLOSED
      # yonu ve SEMA SIRASI. Ayrica KAYIPSIZLIK sayisini basar (ucun BIRLESIM karari icin).
      # Mutasyon bataryasi: python3 tools/model-kanon-mutasyon.py (12 mutant).
      - name: Model kanon D1 kolonu kabul testi (390 kalemlik model cip kaybi kapaniyor mu)
        if: ${{ !cancelled() }}
        run: python3 tools/model-kanon-d1-test.py

      # D1 `marka_arama` KOLONU — Okan hukmunun UC ayagi (marka_kanon CIP, model_kanon MODEL
      # CIPI, bu kolon ARAMA). Site tarafi 8913db28 ile duzeltildi (marka adiyla yapilan sorgu
      # artik UYELIK ∪ BASLIKTA TAM KELIME; fark 74 marka/6.089 kalem -> 20/75) ama CANLI arama
      # UCTAN geliyor (index.html EDGE_KATALOG -> Worker /ara) ve uc hala `hs` uzerinde
      # ALT-DIZE ariyor: olculdu `?q=MAN` = 3539 ("Mandali"), `?q=Haval` = 581
      # ("Havalandirma"). Musteri hala eski sonucu goruyor ve iki yuzey de kendi icinde
      # tutarli oldugu icin kimse BILDIRMEZ. Yuklem Worker'a KOPYALANMAZ; deger senkron
      # aninda deponun TEK KAYNAKLARINDAN turetilip ONCEDEN yazilir — ALIAS yazimlari dahil
      # (site `?q=Vauxhall`i Opel'e katlar; kolon alias tasimasaydi uc 493 urunluk markayi
      # HIC bulamazdi, alias tablosunu uca kopyalamak ise ikiz tanim olurdu). Test gercek
      # d1-sema.sql'i yerel sqlite3'e yukler; CANLI D1'e/wrangler'a/AGA DOKUNMAZ ve semayi
      # CANLIYA UYGULAMAZ. NE OLCER: kolonun dogru SINIFI (hash'e karismaz -> hedefli UPDATE),
      # kolondan turetilen kumenin SITENIN kumesiyle 129/129 + alias 1/1 birebir olmasi,
      # `marka_arama ⊇ marka_kanon` sozlesmesi, kayipsizlik (ham `marka` birlesimi 0 kalem
      # ekler -> model_kanon'un AKSINE kolon TEK BASINA okunur), idempotens, olcek,
      # FAIL-CLOSED yonu ve SEMA SIRASI. Mutasyon: python3 tools/marka-arama-mutasyon.py.
      - name: Marka arama D1 kolonu kabul testi (uctaki `?q=<marka>` gurultusu kapaniyor mu)
        if: ${{ !cancelled() }}
        run: python3 tools/marka-arama-d1-test.py

      # 🔴 BAYAT CAPA NOBETI (6 Eyl 2026, KraL-CapaFikstur-6Eyl — OLCULDU). Yukaridaki
      # adimi koruyan mutasyon bataryasinin M7 mutanti `d1-sync.py::ZORUNLU_KOLONLAR`in
      # O GUNKU UCLU yazimina SABIT DIZGE olarak civiliydi. Liste iki kolon buyuyunce
      # (`tavsiye_filament`, `boy_secenekleri`) capa `CAPA-YOK(0)` verdi: mutant HIC
      # UYGULANMADI, yani "kolon zorunlu yapilirsa senkron duser" ekseni SESSIZCE
      # KORUMASIZ kaldi. Capa artik kaynaktan TURETILIR; bu adim TURETICININ KENDISINI
      # olcer (sentetik olarak BUYUTULMUS kolon listesinde capa hala cozuluyor mu +
      # cozulemeyen her hal None mi doner). ~0,1 sn, ag/veritabani YOK.
      # Bataryanin TAMAMI (18 mutant) BILEREK burada kosmuyor: her mutant kapinin tam
      # kosumudur, olculen sure ~20 dk -> SERIT B'yi kilitler. Bayatlama SINIFINI bu ucuz
      # nobetci yakalar; batarya elle kosulur (python3 tools/marka-arama-mutasyon.py).
      - name: Marka arama mutasyon bataryasi — M7 TURETICI CAPA (kendini test + mutasyon)
        if: ${{ !cancelled() }}
        run: |
          python3 tools/marka-arama-mutasyon.py --kendini-test
          python3 tools/marka-arama-mutasyon.py --mutasyon

      # K302 KAPI: urunler.json'da uyum tasir ama top-level marka bos olan kayitlari
      # KIRLI sayar. TABAN_BOS_UYUMLU=0 olculdu — geriye donuk borc yok; kapinin isi
      # yazim ONCESI koruma. CRITIC: girisim sirasinda mevcut 0 kalmazsa bile yeni
      # kayitlar uretmiyor (sadece tara) -> MUTANT gerekmez.
      - name: K302 marka=uyumdan-bos kapisi (uyum tasir + marka bos = KIRLI)
        if: ${{ !cancelled() }}
        run: python3 tools/marka-uyumdan-bos-kapisi.py --ci

      # ANA SAYFA VITRIN SIRALAMASI (Okan kurali, 31 Tem): Ev/Dekorasyon/Ofis urunleri
      # ana sayfanin ILK 20 SLOTUNDA gorunmez, 21. siradan itibaren normal gorunur
      # (urun ELENMEZ, geri itilir). Hata SESSIZ olurdu: ana sayfa kartlari ziyaretciye
      # DORT ayri besleme yolundan gelir (ozet.json ilk boyamasi, ozet inmezse Worker
      # /katalog, Worker duserse edgeYedek havuzu, bayrak kapaliyken HOME_ORDER); kural
      # yollardan birine konsaydi vitrin bazi ziyaretcide dogru bazisinda yanlis gorunur
      # ve kimse fark etmezdi. Test index.html'in inline scriptini node:vm'de SENTETIK
      # fikstur + sahte DOM/fetch ile GERCEKTEN kosturur ve dort yolu AYRI AYRI olcer;
      # ayrica kategori gorunumunun/aramanin ETKILENMEDIGINI, urunlerin ELENMEDIGINI
      # (permutasyon), siranin KARARLI kaldigini ve "yeterli hedef-disi urun yok" halinin
      # SESSIZ gecmedigini iddia eder. Istemci iddialari SENTETIK fikstur uzerinde olculur
      # (kural derleme aninda da uygulandigi icin canli veriyle yazilsalar VACUOUS olurdu).
      # 31 Tem'de IKINCI EKSEN eklendi: vitrin sirasi ARTIK DERLEME ANINDA hesaplaniyor
      # (tools/build.py render_ozet -> ozet.json "yeni"), cunku ilk boyama ozet'ten yalnizca
      # PAGE_SIZE kart aliyor ve katalogun basinda hedef-kategori blogu olusunca istemci
      # siralayicisi YOKTAN hedef-disi urun uretemiyordu. Test ozeti GERCEK build.py ile
      # uretir (kural JS'e kopyalanmaz), iki eksenin birbirini BOZMADIGINI (etkisiz-tekrarli)
      # kanitlar ve CANLI iddiayi veri durumuna degil URETILEN VITRIN SIRASINA bakarak
      # olcer — boylece yeni urun partileri yayini durdurmaz. python3 + node gerekir
      # (ikisi de bu job'da kurulu). Offline, depoya dosya YAZMAZ, ~10 s.
      - name: Vitrin siralama kabul testi (ilk 20 slot + derleme sirasi + 4 besleme yolu)
        if: ${{ !cancelled() }}
        run: node tools/vitrin-siralama-test.js

      # URETIM DOSYASI DRIVE BAGLANTISI — panelin OKUMA/SUNUM tarafi (yeni uc YOK).
      # OLCULEN GERCEK: Drive `fileId` yapisal bir alanda DEGIL, gizli kaynak kaydinin
      # `baski` serbest metnindedir (oradan D1 `urunler.baski` kolonuna, oradan panele
      # gelir). Yani baglanti METIN AYRISTIRMASINDAN turer ve not bicimi degisirse
      # SESSIZCE kaybolabilir — kapinin varlik sebebi tam olarak budur:
      #   * kanonik / yedek / ARSIVDE-BASILMAZ ayrimi ekranda GORUNUR kalir (yanlis
      #     dosyanin basilmasi en pahali uretim hatasidir),
      #   * baglantilar TIKLANABILIR ve target=_blank + rel=noopener tasir,
      #   * SESSIZ BOSLUK YASAK: kaynak yoksa "kaynak yok", sinif isareti var ama fileId
      #     yoksa "baglanti uretilemedi" ACIKCA basilir (bos hucre, "dosya yok" ile
      #     "olculemedi"yi ayni yere dusururdu),
      #   * YETKI YUZEYI SABIT: yonlendirici kolu 10, Content-Disposition 2 (yeni indirme
      #     ucu / proxy / zip acilmadi) — sayilar bu isten ONCEKI HEAD'de olculdu.
      # Iddialar deploy edilen GERCEK kaynaktan (shop/src/yonet.js) cekilir, KOPYA yazilmaz.
      # OLU NOBETCI DEGIL: mutasyon surucusu de REPODA durur VE burada KOSAR (0,7 s; 40 s
      # esiginin cok altinda, o yuzden ci-kapsam muafiyetine girmedi). Kontrol mutanti M1
      # "bos listeyi sessiz gec" -> K28 KIRMIZI; M9/M10 notr mutantlari YESIL kalir.
      # Ikisi de wrangler/ag ISTEMEZ ve calisma agacini KIRLETMEZ. continue-on-error YOK.
      - name: Uretim dosyasi Drive baglantisi (panel sunum kapisi)
        if: ${{ !cancelled() }}
        run: node shop/test/uretim-kaynak.mjs

      - name: Uretim dosyasi Drive baglantisi — mutasyon bataryasi (nobetci canli mi)
        if: ${{ !cancelled() }}
        run: python3 tools/uretim-kaynak-mutasyon.py

      - name: Uretici kaynak linki — mutasyon bataryasi (nobetci canli mi)
        if: ${{ !cancelled() }}
        run: python3 tools/panel-kaynak-mutasyon.py

      # SIPARIS KAYNAGI (kanal + reklam atfi) — mutasyon bataryasi.
      # IKI kabul kolunu (shop/test/panel-atif.mjs + tools/kanal-kirilim-test.py) 11
      # mutantla olcer ve her mutantin HANGI kolu oldurmesi gerektigini BEYAN eder:
      # yanlis koldan yanan kirmizi, o kol icin kanit URETMEZ. Oldurucu mutantlar
      # spec'in adiyla andigi dort hatayi kapsar — M1 'atif-yok' organige katlanir ·
      # M2/M2b `kanal` yokken sessizce 'site' sayilir (panel + rapor ikizi) · M3/M3b
      # fbp beyaz-listeye sizar / ham atif /liste JSON'una konur · M4 'iptal' ciroya
      # girer — ustune M5 (ucuncu sinif yutulur), M6 (sessiz bosluk), M7 (sifir kova
      # tablodan duser). Iki NOTR mutant her iki kolda da YESIL kalmali: batarya "her
      # degisiklige kirmizi" degil. Mutasyon GECICI AYNAYA uygulanir (calisma agacina
      # YAZILMAZ; sha256 her mutanttan sonra dogrulanir, ayna finally ile silinir).
      # ~3,1 s; ag/wrangler ISTEMEZ. continue-on-error YOK.
      - name: Siparis kaynagi (kanal + atif) — mutasyon bataryasi (nobetci canli mi)
        if: ${{ !cancelled() }}
        run: python3 tools/kanal-gorunurluk-mutasyon.py

      # ALT KATEGORI TAKSONOMISI + UC GECISLI SINIFLANDIRICI (tools/altkategori-sinifla.py).
      # Yukaridaki kapi alanin VERI YOLUNU olcer; bu test KUMENIN KENDISINI ve urunu gruba
      # DUSUREN KURALI olcer. OLCULEN BASLANGIC (2 Agu): alt kategori tanimli TEK kategori
      # Marin'di (12 deger) ve katalogun %94'unde alan BOSTU -> kategori sayfalari yiginla
      # aciliyordu. Kume 6 kategoriye / 60 degere cikti. Kilitlenen eksenler:
      #   K KUME    Her deger imza nobetinden AYRI AYRI geciyor; Marin'in 12 MIRAS degeri
      #             BAYT-ESIT korunuyor (935 kayit onlari kullaniyor, bir harf sessizce
      #             hepsini gecersizlestirirdi) ve hicbir iki deger ayni normalize
      #             anahtara katlanmiyor.
      #   E ESIK    <100 urunlu kategoriye kume TANIMLI DEGIL, <15 urunlu grup kumede YOK
      #             — ikisi de GERCEK katalogda olculuyor, kagitta kalmiyor. Elenen
      #             adaylar gerekcesiyle kayitli (yeniden "kesfedilip" tartisilmasin).
      #   S SIRA    Artik kova oncelikte EN SONDA: daha belirgin bir yer/sistem grubuna
      #             dusen urun kovaya GITMEZ (kova one kayarsa yigilma cozulmez, TASINIR).
      #   T TURETME 2. gecis (yakinlik) sozlugu 1. GECIS CIKTISINDAN turer; elle yazilmis
      #             kelime listesi YOK — 1. gecis degisince 2. gecis atamasi da degisiyor.
      #   D DETERM. Ayni girdi ayni cikti; girdi SIRASI sonucu degistirmiyor.
      #   F FAIL-   Siniflandirici kume DISI deger URETEMEZ (tek kaynak arama.py'deki
      #     CLOSED  kumedir) ve urettigi her deger duzelt.py kapisindan da geciyor.
      # 🔴 SINIFLANDIRICI urunler.json'a YAZMAZ, yalniz hesaplar (yazma yolu duzelt.py).
      # OFFLINE: urunler.json yalnizca OKUNUR. Cift yonlu mutasyon (6 oldurucu KIRMIZI +
      # 1 ilgisiz YESIL + mutasyonsuz harness kontrolu) elle:
      #   python3 tools/altkategori-sinifla-test.py --mutasyon
      - name: "Alt kategori taksonomisi + siniflandirici kabul testi"
        if: ${{ !cancelled() }}
        run: python3 tools/altkategori-sinifla-test.py

      - name: "Katalog alan kapisi kabul testi (commit ani altkategori + uyum kolu)"
        if: ${{ !cancelled() }}
        run: python3 tools/katalog-alan-kapisi-test.py

      # KATALOG ALAN-TIP SEMASI KABUL TESTI (13 Agu): tip ekseni tek alandan (`fiyat`)
      # kanonik semaya (arama.KATALOG_ALAN_TIPLERI, 15 alan) cikarildi; kapsam elle
      # sayilmaz, semadan turer ve bilinmeyen alan "TIP TANIMI YOK" diye fail-loud yanar.
      # 9 iddia (mesru varyantlar dahil: bos fiyat/bos marka/marka yok/lisans yok/
      # parametrik false) + 4 oldurucu mutant (M1..M4). Bloklayici: sema ikinci kez
      # kopyalanirsa kapi ile test sessizce ayrisir (ikiz-tanim sinifi).
      - name: Katalog alan-tip semasi kabul + mutant testi
        if: ${{ !cancelled() }}
        run: python3 tools/katalog-tip-sinifi-test.py

      # ALT KATEGORI MUSTERI YUZEYI. Yukaridaki kapi alanin VERI/D1 yolunu korur; bu adim
      # o verinin MUSTERIYE GORUNEN yuzunu korur — ikisi AYRI eksendir, veri yolu yesilken
      # yuzey sessizce yok olabilir (1 Agu'a kadar OYLEYDI: 935 dolu kayit, gorunur yuzey 0).
      # Kilitlenen dort sey:
      #   A YUZEY    dolu kayitta etiket urun sayfasinda GORUNUYOR (12 tekil degerin hepsi
      #              GERCEK urun sayfasinda olculur, fikstur degil).
      #   B SEMA     Product.category "Ust > Alt" yolu; BOS degerde 'Marin > ' gibi ucu acik
      #              yol YOK, YENI anahtar YOK, anahtar SIRASI kaymiyor (test-jsonld-* ile
      #              bayt-esitlik korunur); BreadcrumbList DEGISMEDI (ara dugumun URL'i
      #              henuz yok -> kirik adres yerine dugum HIC acilmiyor).
      #   C REGRESYON dolu sayfa − (cip + category yolu) == bos sayfa BAYT-ESIT; PAYLASILAN
      #              CSS'e kural EKLENMEDI (eklenseydi 15.939 altkategorisiz sayfanin bayti
      #              da kayardi); komsu izolasyonu.
      #   D FAIL-SAFE bos/alan-yok/None/liste/sayi/sozluk/izinsiz/bosluklu/imzali/enjeksiyon
      #              -> URETIM COKMEZ ve cikti ALANSIZ sayfayla BAYT-ESIT (sizma 0).
      #   E TEK KAYNAK etiket arama.altkategori_kanonik'ten gelir; build.py'de izinli kume
      #              KOPYASI YOK ve kume genisleyince yuzey ANINDA gosterir.
      # OFFLINE: ag/D1/wrangler YOK, DISKE YAZMAZ (render_product bellekte). ~10 s.
      # Cift yonlu mutasyon (6 oldurucu KIRMIZI + 2 ilgisiz YESIL + M00 kontrol) elle:
      #   python3 tools/altkategori-yuzey-test.py --mutasyon
      - name: "Alt kategori musteri yuzeyi (urun sayfasi etiketi + JSON-LD + regresyon)"
        if: ${{ !cancelled() }}
        run: python3 tools/altkategori-yuzey-test.py

      # SHOP BAYATLIK KAPISI (tools/shop-bayatlik-kapisi.py) — bu adim OFFLINE kabul testidir.
      # NEDEN VAR: bu is akisinda `wrangler deploy|publish` VURUSU 0'dir (olculdu 3 Agu) —
      # shop Worker'i CI'da HIC yayinlanmiyor, elle deploy bekliyor ve beklerken alarm YOKTU.
      # Olculen bedel: canli bundle 13 sa 15 dk bayat kaldi; main yesil, CI yesil, site taze,
      # ODEME YOLU eski kodu kosuyordu (ayni sinif 30 Tem ve 1 Agu'da da PARA maliyeti uretti).
      # Bu test 39 iddia kosar: bundle dosya kumesinin ITHALAT GRAFINDEN turetilmesi (elle
      # liste `secenekler.js` / `jenerator/*`'i kacirirdi), canli surum yorumu (secret
      # degisimi nesli TAZELEMEZ; geri alma; bilinmeyen tetik -> OLCULEMEDI), 120 dk esiginin
      # IKI YONU (119 -> bekliyor / 121 -> bayat), sig checkout'ta gecmisin acilmasi ve
      # uctan uca OLDURUCU+KONTROL cifti. Curutme kaniti: tools/shop-bayatlik-mutasyon.py
      # (16 mutant, kontrol mutanti dahil; CI adimi DEGIL).
      #
      # 🔴 NEDEN SERIT A (job `build`, BLOKLAYICI): bu kol OFFLINE ve DETERMINISTIK — ag,
      # wrangler, Cloudflare yetkisi ISTEMEZ, dolayisiyla yanlis-pozitif kaynagi degildir.
      # Olculdu: adim once serit B'ye (`serit-b` job'una) dusmustu ve `is-akisi-kapisi.py`
      # BEYANSIZ SERIT B kapisi diye KIRMIZI yakti — hakliydi: orada kirmizi yansa da
      # `deploy` kosardi, yani "bloklayici" iddiasi YALAN olurdu.
      #
      # 🔴 CANLI KOL BURADA KOSMAZ — BILEREK (fiziksel-canli-kapisi ile AYNI gerekce):
      # canli olcum aga + Cloudflare yetkisine bagimlidir, yanlis-pozitifi TUM EKIBIN
      # yayinini durdurur ([[kapi-kapsam-eksen-secimi]]). Canli kolun evi
      # `paket-tazelik-alarmi.yml` (cron 15 dk, `push` tetigi YOK, deploy'a `needs` ile
      # BAGLI DEGIL) — orada kirmizi GORUNUR ama yayin yoluna maliyeti 0 sn'dir.
      # Elle kosum:  python3 tools/shop-bayatlik-kapisi.py
      # Offline, agsiz, wrangler'siz, depo agaci DEGISMEZ, ~2 s.
      - name: Shop bayatlik kapisi — kendini test (offline karar mantigi + esik nobeti)
        if: ${{ !cancelled() }}
        run: python3 tools/shop-bayatlik-kapisi.py --kendini-test


      # MARKA->MODEL PILOT KAPISI: marka_model_build jeneratorunu izole temp ROOT'a kosar ve
      # uretilen HTML'i spec kabul kriterleriyle olcer — collision (F-150 tek URL), >=3 esik,
      # SSR icerik + self-canonical + ItemList/CollectionPage/BreadcrumbList JSON-LD + sitemap
      # lastmod, huni wa.me prefill + attribution modulu, token sizinti, marka kurallari (authored
      # copy'de 3d/baski/filament/sehir/'her renk'/532 YOK), oksuz-yok (pilot markanin tum urunleri
      # linkli). build.py'nin urun/ ciktisina MUHTAC DEGIL (modulu dogrudan cagirir), ~1 s. Offline.
      - name: Marka->model pilot kabul testi (Ford + BMW)
        if: ${{ !cancelled() }}
        run: python3 tools/marka-model-test.py

      # SITEMAP LASTMOD KAPISI: 11 Agu 2026'ya kadar canli sitemap'teki 26.696 URL'in
      # HEPSI ayni <lastmod>'u (build tarihi) tasiyordu -> Google'a her gun "her sey
      # bugun degisti" deniyordu (olculdu: benzersiz lastmod = 1; tarama isteklerinin
      # %93'u Refresh). Tarih artik git gecmisinden TURETILIR (tools/sitemap_damga.py);
      # turetilemeyen URL'de etiket HIC BASILMAZ. Kapi kararliligi (iki uretim birebir
      # ayni), tekil degisimi (yalniz degisen URL'in tarihi oynar), uydurma-tarih
      # yasagini ve 5 mutanti (4 KIRMIZI + 1 KONTROL YESIL) olcer. Sentetik git
      # deposu kurar, gercek depoya YAZMAZ; offline, stdlib, ~25 s.
      - name: "Sitemap lastmod kapisi (gercek icerik-degisim tarihi + mutasyon)"
        if: ${{ !cancelled() }}
        run: python3 tools/sitemap-damga-test.py

      # ROBOTS KAPISI: parametreli URL'ler (?kategori= ?marka= ?ara= ?sepet=) tarama
      # butcesi yiyor. EN BUYUK RISK FAZLADAN KAPATMAK: canli sitemap'te yolunda "ara"
      # gecen 2.169, "marka" gecen 1.147 kanonik URL var — sorguya capalanmamis tek bir
      # desen hepsini kapatir. Kapi, kanonik urun/marka/ana sayfa/sitemap.xml'in ACIK
      # kaldigini ve dort bicimin (hem ?<ad>= hem &<ad>=) KAPALI oldugunu RFC 9309
      # ornek tablosuyla dogrulanmis eslestiriciyle olcer + 5 mutant. Offline, ~10 s.
      - name: "Robots parametreli URL kapisi (yanlis-pozitif + genisletme mutanti)"
        if: ${{ !cancelled() }}
        run: python3 tools/robots-kapisi-test.py

      # YASAL SAYFA DRIFT KAPISI: build.py IZLENEN 4 elle yazilmis sayfayi (gizlilik /
      # hakkimizda / iletisim / sss) YERINDE yeniden yazar. Fault injection ile olculdu
      # (30 Tem): gizlilik/index.html bayatlatildiginda depodaki 6 kapinin 6'si YESIL
      # kaldi (sapmayi yakalayan kapi YOKTU) ve build.py kosunca sayfa kanonige geri
      # yazilip agac temizlendi -> elle/bayat icerik SESSIZCE ezildi. Bu kapi
      # "build.py'nin URETTIGI icerik == HEAD'deki icerik" iddiasini olcer; taban HEAD
      # oldugu icin adimin build'den once ya da sonra gelmesi hukmu DEGISTIRMEZ
      # (sira-bagimli disk karsilastirmasi fail-open olurdu). Kapi kendi kosumunda
      # sayfalari AYNEN geri koyar ve porcelain + sha256 esitligini kendi olcer.
      # Offline, stdlib, ~12 s (suresi build.py'nin kendisidir).
      - name: "Yasal sayfa drift kapisi (build.py uretimi == commit'li icerik)"
        if: ${{ !cancelled() }}
        run: python3 tools/yasal-sayfa-drift-kapisi.py
      # YAYIN EKSENI: uretilen sayfalarda piksel/riza, script surumleme (4 saatlik
      # tarayici onbellegi) ve Google Merchant feed g:id 50-karakter siniri.
      - name: Yayin cikti kabul testleri (meta piksel + surum damgasi + merchant feed)
        if: ${{ !cancelled() }}
        run: |
          python3 tools/meta-piksel-test.py
          python3 tools/surum-test.py
          python3 tools/test-merchant-feed.py

      # YORUM SOYUCU: build.py'nin _yayin/ kopyalarini uretirken kullandigi lexer.
      # Kendini-testi (46 iddia) + BAGIMSIZ tuzak fiksturleri & kirmizi-mutasyon kapisi
      # (17 fikstur / 10 mutant). build.py'den ONCE kosar: soyucu bozuksa yayin
      # kopyasi hic uretilmesin. Offline, stdlib (node varsa `node --check` de kosar).
      - name: Yorum soyucu kabul testi + kirmizi-mutasyon kapisi
        if: ${{ !cancelled() }}
        run: |
          python3 tools/yorum_soy.py --kendini-test
          python3 tools/yorum-soy-test.py
  # ══════════════════════════════════════════════════════════════════════════════
  # SERIT A3 — agir bagimsiz kapilar (piksel<->katalog parite capasi)
  #
  # 🔴 BU IS YAYINI BLOKLAR: `deploy: needs:` listesinde ADI GECER. Kirmizi yanarsa
  # `deploy` ATLANIR (fail-closed sozlesme AYNEN korunur — tek serit oldugu zamanki
  # gibi). Adi `deploy.needs`'ten dusurulurse buradaki kapilarin kirmizisi yayini
  # DURDURMAZ; tools/is-akisi-kapisi.py::_serit_b_joblar bunu GECISLI olarak olcer ve
  # beyansiz kapi basina KIRMIZI yakar (SERIT_B tablosuna giris ekleyerek SUSTURMA —
  # dogru cozum seridi `deploy.needs`'e geri koymaktir).
  #
  # NEDEN BOLUNDU (olculdu, kosum 30838521694): tek serit `build` 1487 sn (24,8 dk)
  # suruyordu ve `concurrency: group: pages` yuzunden yayin tavani 1 deploy/build idi
  # -> parti push'larinin ~%85'i kendi deploy'unu alamiyordu. Kapilar N bloklayici
  # serite bolununce duvar saati max(serit)'e duser; kapi SAYISI ve SEMANTIGI aynidir.
  # Bu bir TASIMA isidir: hicbir kapinin cagri satiri/argumani DEGISMEDI.
  #
  # BEDEL (durust beyan): serit basina checkout+setup tekrari (~21 sn x serit).
  # Toplam runner 1490 sn -> ~1528 sn (+%3); duvar saati 1490 -> ~563 sn (-%62).
  #
  # ⚠️ fetch-depth: 0 HER SERITTE korunur. Gerekce OLCULDU: bu is akisinda git
  # gecmisi okuyan EN AZ 9 kapi var (diriltme-kapisi `git log -p --first-parent`,
  # kisisel-veri-test `rev-list`, konfigur/kalibrasyon `git show`, d1-sync `merge-base`
  # ...). Sig checkout kazanci ~8 sn/serit (checkout 11 sn olculdu) — yani ~%1,5;
  # buna karsilik yanlis serite sig checkout koymak kapiyi OLCULEMEDI'ye (rc 2)
  # dusurur. Kazanc kucuk, risk sessiz: derin checkout HER SERITTE KALIR.
  # ══════════════════════════════════════════════════════════════════════════════

  hijyen-a3:
    runs-on: ubuntu-latest
    steps:
      # 🔴 fetch-depth: 0 ZORUNLU — tools/diriltme-kapisi.py "gecmiste SILINMIS urun id'si"
      # kumesini `git log -p --first-parent -- urunler.json` ile TURETIR (elle liste
      # TUTULMAZ; olculdu 30 Tem: 801 commit, ~68 MB diff, 4,2 s, 990 silinmis id).
      # actions/checkout VARSAYILANI `fetch-depth: 1` (SIG/shallow) ve o halde gecmis YOKTUR.
      # Bu satir dusurulurse kapi SESSIZCE yesile donmez: SIG depoyu tanir ve
      # OLCULEMEDI (rc 2) ile YAYINI DURDURUR (fail-closed).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pyyaml: is akisi BICIM kapisi (tools/is-akisi-kapisi.py) GERCEK bir YAML
      # ayristiricisi ister. Ayristirici YOKSA o kapi YESIL SAYMAZ (exit 2 = OLCULEMEDI)
      # -> bu satirdan pyyaml dusurulurse yayin durur, sessizce korumasiz KALMAZ.
      - name: Python bagimliliklari (boto3 - R2 testleri icin; pyyaml - is akisi kapisi)
        if: ${{ !cancelled() }}
        run: pip install boto3 pyyaml
      # Node: piksel<->katalog parite testinin JS-uc nobeti (index.html pruvoFeedId + olcum.js
      # feedId/metaGovdesi/ga4Govdesi) node ile kosar. FAIL-CLOSED: node yoksa test CI'da exit 1
      # verir (yalanci-yesil olamaz), o yuzden setup-node BLOKLAYICI bir on-kosuldur.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fiyat prova mutasyon bataryasi (M3b acik — HIJYEN, yayini durdurmaz)
        if: ${{ !cancelled() }}
        run: node shop/test/fiyat-prova.mjs --yalniz-mutasyon
      # Kisisel veri sizinti kilidi — BILEREK BLOKLAYICI (continue-on-error YOK;
      # mukerrer-hook felsefesi): bu test kirmiziysa kisisel veri ham HTML'e siziyor
      # demektir, yayini erken durdurmak ucuz, sessiz sizinti pahali. JSON-LD
      # istisnasi testin icinde tanimli.
      # IS AKISI BICIM KAPISI — 29/30 Tem olayinin nobetcisi. deploy.yml'e TIRNAKSIZ, icinde
      # ": " tasiyan bir adim ADI eklendi -> YAML plain-scalar ayristirma hatasi -> GitHub
      # isi HIC baslatmadi (0 sn, startup_failure, is sayisi 0): urun/ uretimi, sitemap, TUM
      # kapilar ve Pages yayini kosmadi, ~7 dk tum ekibin yayini durdu. Hicbir kapi
      # yakalamadi cunku mevcut kapilar is akisi dosyalarinda METIN arar, YAML AYRISTIRMAZ.
      # Bu adim .github/workflows/*.yml dosyalarini GERCEK ayristiriciyla (pyyaml) ayristirir
      # + tekrarlanan anahtar / bos run: / gecersiz on:-jobs: iskeletini olcer + onizleme
      # 2-renk olcumunun CAGRI SATIRINI korur. Offline, dosya YAZMAZ, ~0,2 s.
      # ⚠️ SINIR: deploy.yml'in KENDISI bozulursa bu adim da kosmaz (hicbir adim kosmaz) ->
      # gercek koruma PUSH ONCESIDIR: `python3 tools/is-akisi-kapisi.py` (bkz. dosya basligi).
      # Adim adi BILEREK TIRNAKLI (bugunku hatanin ta kendisi).
      - name: "Is akisi bicim kapisi (YAML ayristirma: startup_failure nobetcisi)"
        if: ${{ !cancelled() }}
        run: python3 tools/is-akisi-kapisi.py

      # D1 UZLASTIRICI "ONARILAMADI" KOSUL KABULU (7 Agu 2026 onariminin nobetcisi).
      # d1-uzlastirici.yml'deki (3) ONARILAMADI adiminin `if:` kosulu GERCEK dosyadan
      # okunur ve GitHub kosul semantigi 5 vakada FIILEN calistirilir; 6. iddia bir
      # KONTROL MUTANTIDIR (eski `failure() && sapma=='var'` kosulu vaka-2'de YANLIS
      # KIRMIZI uretiyordu — kosum 31214568441'de olculdu). Mutant DUSMEZSE test
      # kirmizi yanar, yani "yesil" bos degil OLCULMUS bir iddiadir.
      # Offline, ag ISTEMEZ, dosya YAZMAZ, argumansiz, ~0,05 s. pyyaml ustteki
      # bagimlilik adiminda zaten kuruludur.
      - name: "D1 uzlastirici ONARILAMADI kosul kabul testi (fail-loud kolu)"
        if: ${{ !cancelled() }}
        run: python3 tools/d1-uzlastirici-kosul-test.py

      # YAYIN ACLIGI KAPISI (3 Agu) — "baslamis bir kosum oldurulup icerigi yayinsiz
      # kalabilir mi". Ustteki bicim kapisi YAML'in AYRISTIRILABILIRLIGINI olcer; bu kapi
      # ayni dosyanin ESZAMANLILIK SOZLESMESINI olcer: `concurrency.group` VAR mi,
      # `cancel-in-progress` FALSE mi, `deploy`->build / `yayin`->deploy zinciri kosulsuz
      # mu, ve E1'den OKUNAN ayarla art arda push senaryosu kosturuldugunda BASLAMIS her
      # kosum `deploy`ina ULASIYOR mu.
      # NEDEN `build` (serit-b DEGIL): dosyanin basindaki 20 satirlik gerekce YORUMDUR;
      # `cancel-in-progress: true`ya donen tek bir satir OLCULEN icerik kaybini geri
      # getirir (30 Tem: 7 ardisik iptal, 37,7 dk yayinsiz pencere, o pencerede eklenen
      # her urun canlida 404). Bloklayici serit, o satirin main'e GIREMEMESIDIR.
      # Offline, ag ISTEMEZ, dosya YAZMAZ, ~0,3 s.
      - name: "Yayin acligi kapisi (eszamanlilik sozlesmesi + yayin zinciri + simulasyon)"
        if: ${{ !cancelled() }}
        run: python3 tools/deploy-aclik-kapisi.py
      # Kapinin KENDI hukmu: 7 simulasyon fiksturu (ikisi KONTROL: seyrek push'ta `true` de
      # yesildir -> kirmizi bayragin DEGERINDEN degil senaryo DINAMIGINDEN dogar) + 8
      # mutant (biri KONTROL mutanti). Ustteki adim yesilken bu adim kirmizi ise nobetci
      # OLMUS demektir ([[mutasyon-kaniti-yeniden-uretilebilir]]).
      - name: "Yayin acligi kapisi ic nobetci (fikstur + mutasyon bataryasi)"
        if: ${{ !cancelled() }}
        run: python3 tools/deploy-aclik-kapisi.py --kendini-test

      # IC RAPOR ADI KAPISI (4 Agu) — "isci->mimar rapor dosyasinin protokol adi
      # yorum/docstring METNI olarak PUBLIC repoya sizdi mi". kisisel-veri-test.py
      # ile AYNI eksende DEGIL (kisisel veri degil, sadece ic is akisi gorunurlugu);
      # BLOKLAYICI (continue-on-error YOK), yerel + deterministik, ag ISTEMEZ.
      - name: Ic rapor adi kapisi ic nobetci (fikstur + kontrol bataryasi)
        if: ${{ !cancelled() }}
        run: python3 tools/ic-rapor-adi-kapisi.py --kendini-test
      - name: Ic rapor adi kapisi
        if: ${{ !cancelled() }}
        run: python3 tools/ic-rapor-adi-kapisi.py

      # IC RAPOR ADI KAPISININ PRE-COMMIT KOLU (12 Agu 2026) — yukaridaki adimin
      # KIRMIZI yanmasinin MALIYETINI olcen kol. OLCULEN OLAY (kosum 31549865286):
      # izlenen kok deftere sizan protokol adi bu job'i kirmizi yakti, `deploy` +
      # `yayin` SKIPPED kaldi ve YAYIN DURDU — yani maliyet ihlalin buyuklugunden
      # degil YAKALANDIGI YERDEN geliyordu. Onarim commit anina bir CAGRI NOKTASI
      # ekledi (tools/ic-rapor-index-kolu.py, pre-commit adim 7). Bu batarya o
      # cagri noktasinin hukmunu GERCEK gecici depolarda + GERCEK `git commit`
      # ile yeniden uretir (kanca blogu VERBATIM cikarilir, yeniden yazilmaz).
      # BLOKLAYICI, agsiz, deterministik ([[mutasyon-kaniti-yeniden-uretilebilir]]).
      - name: "Ic rapor adi kapisi pre-commit kolu (19 vaka: arac + gercek kanca)"
        if: ${{ !cancelled() }}
        run: python3 tools/ic-rapor-kanca-test.py


      # Kapinin KENDI hukmu: 22 kirmizi + 29 yesil fikstur, E1 ozet mekanizmasi
