name: Paket tazeligi alarmi (canli fiyat yolu)

# ══════════════════════════════════════════════════════════════════════════════
# NEDEN VAR — OLCULEN SESSIZLIK (1 Agu 2026)
# ══════════════════════════════════════════════════════════════════════════════
# shop Worker'i CI'da YAYINLANMIYOR (elle `wrangler deploy`). 30 Tem 20:30 – 1 Agu 01:58
# arasinda canli paket 14,5 saat BAYAT kaldi; o pencerede `tur == "fiziksel"` olan 676
# hazir ticari malda malzeme/renk carpani hala uygulaniyordu -> %84'e varan FAZLA
# TAHSILAT (16.400 TL'lik bir parca icin canli uc 30.176,00 TL dondu).
#
# 🔴 ASIL KUSUR KORLUKTU: o an mevcut IKI canli kapi da YESIL yaniyordu
# (`konfigur-canli-kapisi.py` rc=0 · `canli-saglik-kapisi.py` rc=0). AYNI SINIF 30 Tem'de
# de yasandi (worker yayinlanmamis, kart kanali 2 gun kapali). Yani bu TEKRAR EDEN,
# YAPISAL bir delik: yayin adimi CI'da olmadigi surece bayatlik kendiliginden geri gelir.
#
# 1 Agu'da `tools/fiziksel-canli-kapisi.py` main'e alindi ve sapmayi FIILEN yakaliyor
# (yayin oncesi rc=1, sonrasi rc=0). Ama CANLI KOLU hicbir yere BAGLANMAMISTI —
# bilerek: ag'a bagimli bir yanlis pozitif TUM EKIBIN yayinini durdurur
# ([[kapi-kapsam-eksen-secimi]]). BU IS AKISI o kolun evidir.
#
# ══════════════════════════════════════════════════════════════════════════════
# 🔴 NEDEN YAYINI DURDURAMAZ (yapisal, beyan degil)
# ══════════════════════════════════════════════════════════════════════════════
#   * `push` tetikleyicisi YOK -> Pages yayin akisi (deploy.yml) bu isi HIC baslatmaz.
#   * deploy.yml'e `needs:` ile BAGLI DEGIL, `workflow_call` ile CAGRILMIYOR ->
#     buradaki kirmizinin yayin yoluna maliyeti 0 sn'dir.
#   * `concurrency` grubu AYRI -> hicbir yayin adimini bekletmez, hicbiri tarafindan
#     bekletilmez.
# Bu uc sart `tools/cron-nabiz-kapisi.py::paket_alarmi_kablosu()` tarafindan OLCULUR:
# bu dosyaya `push:` eklenirse nabiz kapisi KIRMIZI yanar (yani "bloklamaz" iddiasi
# yorum degil, kosulan bir kapidir).
#
# ══════════════════════════════════════════════════════════════════════════════
# GORUNURLUK — `continue-on-error` YOK
# ══════════════════════════════════════════════════════════════════════════════
# Bu depoda beyansiz `continue-on-error` FAIL-OPEN sayilir (is-akisi-kapisi Bolum D).
# Kullanilmadi: olcum adiminin cikis kodu DOGRUDAN konusur, kosum KIRMIZI yanar ve
# GitHub bildirimi duser. Ayrica araç `--gh-ozet` ile kosum ozetine (Actions "Summary")
# ne olduğunu ve NE YAPILACAGINI yazar. Cikis kodunu kabukta yakalamak (`rc=0; ... || rc=1`)
# BILEREK YAPILMADI: o yazim Bolum D'ye gore beyansiz fail-open'dir.
#
# UC HAL, UCU DE ANLAMLI:
#   durum=parite      rc 0 — canli tahsilat liste fiyati, paket depo HEAD'i ile ayni nesil.
#   durum=drift       rc 1 — fazla/eksik tahsilat, bayat paket ya da odenemeyen kalem.
#   durum=olculemedi  rc 2 — ag/uc/node erisilemedi ya da orneklem BOS. SESSIZ YESIL DEGIL:
#                            kosum KIRMIZI yanar ve DAMGA DOGMAZ.
#
# ══════════════════════════════════════════════════════════════════════════════
# NABIZ — "alarmin KENDISI hic kosmadi" hali (OLCULMUS TUZAK)
# ══════════════════════════════════════════════════════════════════════════════
# Bu depoda olculdu (31 Tem): `*/15` cron'lu bir is akisi 4 sa 36 dk boyunca beklenen
# ~18 tetiklemenin SIFIRINI kostu — `*/15` tam olarak dakika 0/15/30/45'e duser ve
# GitHub o yogun dakikalarda kuyruk kisitlayip tetiklemeyi DUSURUR (yeniden denemez).
# Bu yuzden dakika alani ACIK LISTE + SABIT OFSET'tir: 13,28,43,58 (15 dk cadans AYNEN
# korunur, faz kayar; d1-uzlastirici.yml'nin 9,24,39,54 fazina da CARPMAZ).
#
# Alarm IKI KATLI nabizla korunur, ikisi de `tools/cron-nabiz-kapisi.py`de kosar ve
# deploy.yml `cron-nabzi` isinde HER ITMEDE olculur (yayini bloklamayan serit):
#   A1/A2/A3 — bu dosyanin cron BICIMI yogun dakikaya kaymis mi · is akisi GitHub'da
#              `active` mi · son `event=schedule` kosumu esigin icinde mi.
#   A4       — SON BASARILI PAKET TAZELIGI DAMGASI kac saatlik. "Kosum YESIL" ile
#              "olcum FIILEN yapildi" AYNI SEY DEGILDIR (olculdu 31 Tem 20:47:18Z:
#              conclusion=success, adimlarin HEPSI skipped). Damga YALNIZ
#              `durum == 'parite'` iken dogar; drift/olculemedi/atlanan kosum damga
#              URETMEZ ve A4 o sessizligi sayar.
on:
  schedule:
    - cron: "13,28,43,58 * * * *"
  # Elle kosum yolu HER ZAMAN acik (cron kacarsa insan tetikleyebilir).
  workflow_dispatch:

permissions:
  contents: read

# Yayin is akisiyla (deploy.yml `group: pages`) AYRI grup.
concurrency:
  group: paket-tazelik-alarmi
  cancel-in-progress: true

jobs:
  tazelik:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 🔴 node ZORUNLU: YEREL KAHIN (depo HEAD'inin KENDI worker kodu) node ile kosar.
      # node yoksa kapi rc 2 (OLCULEMEDI) verir — sessiz yesil YOKTUR.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ═══════════════════════════════════════════════════════════════════════
      # UCA TAZELE — kahin "YAYINLANMASI GEREKEN kod" olsun
      # ═══════════════════════════════════════════════════════════════════════
      # Zamanlanmis kosum tetikleme anindaki `github.sha`'yi checkout eder. Kuyruk +
      # kurulum gecikmesinde main ilerlerse yerel kahin DOGUSTAN bayat olur ve alarm
      # "canli bayat" derken aslinda KENDI agacinin eski oldugunu olcerdi (yanlis pozitif)
      # — ya da tersine gercek bir bayatligi maskelerdi. Uzlastiricida ayni hal OLCULDU
      # (kosum 30664207786): donmus SHA yuzunden butun adimlar atlandi, kosum YESIL yandi.
      - name: Uca tazele — agaci uzak main ucuna getir (donmus github.sha DEGIL)
        run: |
          git fetch --depth=1 origin main
          git reset --hard FETCH_HEAD
          git rev-parse HEAD

      # ═══════════════════════════════════════════════════════════════════════
      # OLCUM — canli uc NE TAHSIL EDIYOR (yan etkisiz)
      # ═══════════════════════════════════════════════════════════════════════
      # POST /api/shop/fiyat PROVA ucudur: siparis ACMAZ, D1'e YAZMAZ, iyzico'ya GITMEZ,
      # e-posta/Telegram GONDERMEZ, olcum olayi GONDERMEZ. Cikis kodu DOGRUDAN konusur
      # (kabukta yakalanmaz) — `--gh-ozet` durumu $GITHUB_OUTPUT'a ve kosum ozetine yazar.
      - name: "Olcum — canli fiyat yolu paritesi (yayin yolundan AYRI, yayini DURDURMAZ)"
        id: olcum
        run: python3 tools/fiziksel-canli-kapisi.py --gh-ozet

      # ═══════════════════════════════════════════════════════════════════════
      # DAMGA — "olcum FIILEN yapildi ve PARITE cikti" kaydi (nabiz A4 ekseni)
      # ═══════════════════════════════════════════════════════════════════════
      # KOSMA KOSULU FAIL-CLOSED ve OLCUMUN SONUCUNA baglidir: `durum == 'parite'`.
      # `always()` DEGIL, `success()` DE DEGIL — cunku damganin iddiasi "kosum bitti"
      # degil "canli fiyat yolu OLCULDU ve TEMIZ cikti"dir. Olcum duser/atlanirsa damga
      # DOGMAZ ve bir sonraki nabiz olcumu (A4) KIRMIZI yanar.
      # NEDEN ARTIFACT, depoda IZLENEN dosya DEGIL: 15 dakikada bir main'e push etmek
      # main ucunu surekli oynatir ve D1 bayatlik kapisini tetikler — damga mekanizmasi
      # olcmesi gereken hastaligi URETEMEZ. Artifact depoya yazmaz, makine-okunurdur ve
      # saklamasi OLCULDU (24 saat > esik N=9 saat).
      - name: Damga — son basarili paket tazeligi olcumu
        if: steps.olcum.outputs.durum == 'parite'
        run: |
          python3 tools/cron-nabiz-kapisi.py --damga-yaz paket-tazelik-damgasi.json --damga-adi paket-tazelik-damgasi
          cat paket-tazelik-damgasi.json
      - name: Damgayi yukle (artifact — nabiz kapisinin A4 ekseni bunu okur)
        if: steps.olcum.outputs.durum == 'parite'
        uses: actions/upload-artifact@v4
        with:
          name: paket-tazelik-damgasi
          path: paket-tazelik-damgasi.json
          if-no-files-found: error

      # ═══════════════════════════════════════════════════════════════════════
      # NESIL — "canli bundle main'in KAC COMMIT gerisinde" (yayini DURDURMAZ)
      # ═══════════════════════════════════════════════════════════════════════
      # Ustteki olcum TEK BIR ekseni (fiziksel carpan) canlida sorar. Bu adim NESIL
      # sorusunu genel olarak sorar: `wrangler deployments/versions list` ile canli
      # bundle'in KOD surumu okunur (secret degisimleri ATLANARAK — olculen maskeleme
      # tuzagi) ve bundle'i etkileyen commit'lerle karsilastirilir. Esik 120 dk; gerekcesi
      # ve olculen dagilim aracin dosya basinda.
      #
      # 🔴 NEDEN EN SONDA (olculen kablolama tuzagi, 3 Agu): bu adim damga adimlarindan
      # ONCE dururken, kirmizi bir NESIL olcumu damga adimlarini ATLATIYORDU — GitHub
      # `if:` kosullarina ortuk `success()` ekler, yani onceki adimin kirmizisi
      # `if: steps.olcum.outputs.durum == 'parite'` kosulunu de susturur. Sonuc: fiyat
      # olcumu PARITE olsa bile damga DOGMAZ ve nabiz A4 ekseni ("olcum FIILEN yapildi mi")
      # YANLIS alarm verirdi — yani yeni nobetci eski nobetciyi korletirdi. Adim sona
      # alindi: damga semantigi AYNEN korunuyor, iki eksen birbirini sessize ALMIYOR.
      #
      # 🔴 `if: always()` — ustteki olcum kirmizi olsa da BU eksen olculur; ikisi AYRI
      # ariza sinifidir (fiyat kurali kirik ≠ bundle bayat).
      # `continue-on-error` YOK: cikis kodu DOGRUDAN konusur (rc 1 = bayat,
      # rc 2 = OLCULEMEDI; ikisi de kosumu KIRMIZI yakar, yayini DURDURMAZ).
      # 🔴 CLOUDFLARE_API_TOKEN yalniz OKUNUR (deployments/versions list). Bu adim
      # `wrangler deploy` KOSMAZ — yayin karari mimarda/Okan'da.
      - name: "Olcum — canli shop worker nesli (bayatlik; yayini DURDURMAZ)"
        id: nesil
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dbbe2a8620c3c3a57c586b8a98142fb9
        run: python3 tools/shop-bayatlik-kapisi.py --gh-ozet

  # ═══════════════════════════════════════════════════════════════════════════
  # YAYIN HATTININ NABZI — "yayin ne kadar suredir inmiyor" (3 Agu 2026)
  # ═══════════════════════════════════════════════════════════════════════════
  # OLCULEN SESSIZLIK: `tools/yayin-gecikme-nobeti.py` 2 Agu'da yazildi, esikleri 100
  # kosumluk gercek olcumden turetildi ve TIKALI/ACLIK siniflarini ayirt ediyor — ama
  # CANLI kolu HICBIR ZAMANLANMIS EVE BAGLANMAMISTI. Tek cagirani `tools/durum.py`
  # (elle acilan pano) idi; deploy.yml'de yalnizca AGSIZ fikstur kabulu kosuyordu
  # (tools/yayin-gecikme-test.py, serit B). Sonuc: 3 Agu'da yayin 142,1 dk inmedi ve
  # bunu soyleyen ilk sey `tools/parite-test.js`'in rc=3'u oldu — yani hattin kendi
  # nobetcisi degil, BASKA bir kapinin yan hasari. Bu is o kolun EVIDIR.
  #
  # 🔴 NEDEN BURADA, deploy.yml'de DEGIL: nobetci deploy.yml'in KENDISINI olcer. Olctugu
  # hattin icinde kosarsa, hat tikandiginda nobetci de tikanir — tam ihtiyac duyulan
  # dakikada susar. Ayrica `tools/yayin-gecikme-test.py :: Y4` bu bagimsizligi KOSULAN
  # bir kapi olarak olcer: canli kol deploy.yml'e baglanirsa O TEST KIRMIZI YANAR.
  # Bu dosyanin "yayini durduramaz" uc sarti (push/pull_request/workflow_call yok,
  # `needs:` bagi yok, ayri concurrency grubu) bu is icin de AYNEN gecerlidir.
  #
  # 🔴 `tazelik` ISINE EKLENMEDI, AYRI IS: ayni ise eklenseydi yayin gecikmesi olcumu,
  # ondan onceki fiyat/nesil adimlarinin kirmizisinda ATLANIRDI (GitHub `if:`e ortuk
  # `success()` ekler — bu dosyada 3 Agu'da bir kez OLCULEN tuzak). Ayri is = iki ariza
  # sinifi birbirini SESSIZE ALAMAZ ([[hukum-yanlis-birimde]]).
  yayin-nabzi:
    runs-on: ubuntu-latest
    # `actions: read` — kosum/is gecmisi API'si. Is duzeyinde verilir, is akisi duzeyindeki
    # `contents: read` genisletilmez (en dar yetki).
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Bu is DEPO ICERIGINI degil GITHUB API'sini olcer; yerel agac yalniz betikleri
      # tasir, o yuzden `tazelik` isindeki "uca tazele" adimina IHTIYAC YOKTUR.
      #
      # HUKUM ESLEMESI BEYAN EDILMISTIR (cikis kodu kabukta YUTULMAZ — o yazim beyansiz
      # fail-open sayilir, is-akisi-kapisi Bolum D): `--alarm` bayragi YALNIZ GECIKME
      # (rc 1 = UYARI, olculen tabanda 40 dongunun 4'u asar) icin rc 0 dondurur; sinif
      # adi ve gerekce HER HALUKARDA basilir. OLCULEMEDI (2) · TIKALI (3) · ACLIK (4)
      # kendi cikis koduyla kosumu KIRMIZI yakar ve GitHub bildirimi duser.
      - name: "Olcum — yayin gecikmesi / tikanma / aclik (deploy.yml hattinin nabzi)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/yayin-gecikme-nobeti.py --alarm
      # AYRI EKSEN, `always()`: ustteki "icerik ne kadar bayat" der; bu "iptallerin SINIFI
      # ne" der. 3 Agu'daki yanlis teshis tam bu ayrimda dogdu: kuyrukta iptal (jobs bos,
      # ZARARSIZ — main dogrusaldir) ile CALISIRKEN iptal (aclik) raporda ikisi de
      # `cancelled` gorunur. `cancel-in-progress: false` altinda CALISIRKEN iptal
      # OLMAMALIDIR; olursa ayar geri alinmis ya da kosumlar elle iptal ediliyordur.
      - name: "Olcum — iptal siniflari (kuyrukta mi CALISIRKEN mi; E4 canli eksen)"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/deploy-aclik-kapisi.py --canli
