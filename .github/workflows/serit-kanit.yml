name: "SERIT KANITI (gecici — iki yonlu ariza enjeksiyonu, GitHub motorunda)"

# 🔴 GECICI KANIT IS AKISI — YALNIZ `kral/serit-ayrimi` dalinda tetiklenir, `main`'de
# ASLA kosmaz ve merge'den ONCE SILINIR. Amaci tek sey: "serit B kirmiziyken deploy
# job'u GERCEKTEN kosuyor mu / serit A kirmiziyken GERCEKTEN kosmuyor mu" sorusunu
# YEREL SIMULATORLE degil GITHUB'IN KENDI ZAMANLAYICISIYLA olcmek.
#
# Gercek deploy.yml'in graf SEKLINI aynalar (`yayin` job'u YALNIZ A job'una `needs:`
# ile baglidir, B job'una DEGIL) ama hicbir sey yayinlamaz: adimlar sadece `echo`.
# Pages'e DOKUNMAZ, `actions/deploy-pages` KULLANMAZ, secret OKUMAZ.
on:
  push:
    branches: [kral/serit-ayrimi]

jobs:
  # ======================= YON 1: B KIRMIZI -> YAYIN CIKAR ===================
  y1-a-saglikli:
    name: "Y1 · SERIT A (saglikli)"
    runs-on: ubuntu-latest
    steps:
      - run: echo "A adim 1 OK"
      - run: echo "A adim 2 OK"
      - run: echo "A adim 3 OK"

  y1-b-adim1:
    name: "Y1 · SERIT B — 1. adim KIRMIZI"
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
      - run: echo "B adim 2"
      - run: echo "B adim 3"

  y1-b-adim2:
    name: "Y1 · SERIT B — 2. adim KIRMIZI"
    runs-on: ubuntu-latest
    steps:
      - run: echo "B adim 1"
      - run: exit 1
      - run: echo "B adim 3"

  y1-b-adim3:
    name: "Y1 · SERIT B — 3. adim KIRMIZI"
    runs-on: ubuntu-latest
    steps:
      - run: echo "B adim 1"
      - run: echo "B adim 2"
      - run: exit 1

  y1-yayin:
    name: "Y1 · YAYIN (needs: yalniz A) — KOSMALI"
    needs: y1-a-saglikli
    runs-on: ubuntu-latest
    steps:
      - run: echo "YAYIN CIKTI — serit B kirmiziyken bile"

  # ======================= YON 2: A KIRMIZI -> YAYIN CIKMAZ ==================
  y2-a-adim1:
    name: "Y2 · SERIT A — 1. adim KIRMIZI"
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
      - run: echo "A adim 2"
      - run: echo "A adim 3"

  y2-a-adim2:
    name: "Y2 · SERIT A — 2. adim KIRMIZI"
    runs-on: ubuntu-latest
    steps:
      - run: echo "A adim 1"
      - run: exit 1
      - run: echo "A adim 3"

  y2-a-adim3:
    name: "Y2 · SERIT A — 3. adim KIRMIZI"
    runs-on: ubuntu-latest
    steps:
      - run: echo "A adim 1"
      - run: echo "A adim 2"
      - run: exit 1

  y2-yayin-1:
    name: "Y2 · YAYIN (needs: A-adim1) — KOSMAMALI"
    needs: y2-a-adim1
    runs-on: ubuntu-latest
    steps:
      - run: echo "🔴 BU SATIR GORUNURSE KANIT COKTU — A kirmiziyken yayin cikti"

  y2-yayin-2:
    name: "Y2 · YAYIN (needs: A-adim2) — KOSMAMALI"
    needs: y2-a-adim2
    runs-on: ubuntu-latest
    steps:
      - run: echo "🔴 BU SATIR GORUNURSE KANIT COKTU — A kirmiziyken yayin cikti"

  y2-yayin-3:
    name: "Y2 · YAYIN (needs: A-adim3) — KOSMAMALI"
    needs: y2-a-adim3
    runs-on: ubuntu-latest
    steps:
      - run: echo "🔴 BU SATIR GORUNURSE KANIT COKTU — A kirmiziyken yayin cikti"
