name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pyyaml: is akisi BICIM kapisi (tools/is-akisi-kapisi.py) GERCEK bir YAML
      # ayristiricisi ister. Ayristirici YOKSA o kapi YESIL SAYMAZ (exit 2 = OLCULEMEDI)
      # -> bu satirdan pyyaml dusurulurse yayin durur, sessizce korumasiz KALMAZ.
      - name: Python bagimliliklari (boto3 - R2 testleri icin; pyyaml - is akisi kapisi)
        run: pip install boto3 pyyaml
      # Node: piksel<->katalog parite testinin JS-uc nobeti (index.html pruvoFeedId + olcum.js
      # feedId/metaGovdesi/ga4Govdesi) node ile kosar. FAIL-CLOSED: node yoksa test CI'da exit 1
      # verir (yalanci-yesil olamaz), o yuzden setup-node BLOKLAYICI bir on-kosuldur.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Kisisel veri sizinti kilidi — BILEREK BLOKLAYICI (continue-on-error YOK;
      # mukerrer-hook felsefesi): bu test kirmiziysa kisisel veri ham HTML'e siziyor
      # demektir, yayini erken durdurmak ucuz, sessiz sizinti pahali. JSON-LD
      # istisnasi testin icinde tanimli.
      # IS AKISI BICIM KAPISI — 29/30 Tem olayinin nobetcisi. deploy.yml'e TIRNAKSIZ, icinde
      # ": " tasiyan bir adim ADI eklendi -> YAML plain-scalar ayristirma hatasi -> GitHub
      # isi HIC baslatmadi (0 sn, startup_failure, is sayisi 0): urun/ uretimi, sitemap, TUM
      # kapilar ve Pages yayini kosmadi, ~7 dk tum ekibin yayini durdu. Hicbir kapi
      # yakalamadi cunku mevcut kapilar is akisi dosyalarinda METIN arar, YAML AYRISTIRMAZ.
      # Bu adim .github/workflows/*.yml dosyalarini GERCEK ayristiriciyla (pyyaml) ayristirir
      # + tekrarlanan anahtar / bos run: / gecersiz on:-jobs: iskeletini olcer + onizleme
      # 2-renk olcumunun CAGRI SATIRINI korur. Offline, dosya YAZMAZ, ~0,2 s.
      # ⚠️ SINIR: deploy.yml'in KENDISI bozulursa bu adim da kosmaz (hicbir adim kosmaz) ->
      # gercek koruma PUSH ONCESIDIR: `python3 tools/is-akisi-kapisi.py` (bkz. dosya basligi).
      # Adim adi BILEREK TIRNAKLI (bugunku hatanin ta kendisi).
      - name: "Is akisi bicim kapisi (YAML ayristirma: startup_failure nobetcisi)"
        run: python3 tools/is-akisi-kapisi.py

      - name: Kisisel veri korumasi testi
        run: python3 tools/kisisel-veri-test.py

      # RIZA TIK-KIMLIGI (GIZLILIK) — 30 Tem'e kadar CI'da HIC kosmuyordu. Muafiyet gerekcesi
      # "CI build job'u Python-only (setup-node yok)" DIYORDU; olculdu ki YANLIS: yukaridaki
      # actions/setup-node@v4 (node 20) BLOKLAYICI on-kosuldur ve bu is akisinda zaten
      # bes node testi kosuyor. Yani gizlilik ekseninin nobetcisi yalan bir gerekceyle
      # kapi disinda birakilmisti. NE KORUR: alti yayin yuzeyinde (ana sayfa + ic sayfalar)
      # rıza banner'inin GERCEK davranisi — reddedilince olcum kancalari SUSAR, kabul
      # edilince gclid/lead SUNUCUYA gider, "Kabul sonra Reddet" gclid'i SILER, silinemeyen
      # cerez ADIYLA uyarilir. Sessiz hata sinifi: rıza reddedilmisken tek satirlik bir
      # kablolama hatasi kisisel veriyi ucuncu tarafa gonderir ve EKRANDA GORUNMEZ.
      # Offline: ag YOK (fetch/kancalar sahte), commit'li index.html + attribution-ref.js +
      # gizlilik/ + build.py okunur, dosya YAZILMAZ. node ile kosar (setup-node yukarida
      # bloklayici); node yoksa adim FAIL eder (fail-closed). ~0,2 s.
      - name: Riza tik-kimligi kabul testi (gizlilik — 6 yuzeyde banner davranisi)
        run: node tools/riza-tikkimligi-test.js

      # ATIF (LISANS) REFERANS MODULU — ayni R_NODE muafiyet sinifindaydi, ayni yanlis
      # gerekceyle. NE KORUR: attribution-ref.js, CC lisansli urunlerde tasarimci adi +
      # lisans linkinin sayfada DOGRU uretilmesini saglar; bozulursa atif SESSIZCE duser.
      # Bu HUKUKI bir yukumluluktur (CC BY: atif + link VERILIR ve KALIR) ve hatasi
      # gorunmezdir — tam da CI'da kosmasi gereken sinif. Offline, salt-okuma, ~0,1 s.
      - name: Atif (CC lisans) referans modulu kabul testi
        run: node tools/attribution-ref-test.js

      # CATEGORIES / gizli-kategori / WHATSAPP sipariş no'su index.html ile build.py arasında
      # elle senkron tutulur; drift = ana sayfa/ürün sayfası tutarsızlığı ya da siparişin YANLIŞ
      # numaraya gitmesi (kayıp satış). Bloklayıcı (kisisel-veri deseni): drift'te yayını erken durdur.
      - name: Kategori/WHATSAPP parite testi (drift guard)
        run: python3 tools/kategori-parite-test.py

      # SKAN ART: gizli dekor alt-serisi kategorisi + ana sayfa banner'i. Bloklayici
      # (kategori-parite deseni): bu kararin kablolamasi 6 dosyaya yayiliyor (index.html
      # gizli liste + banner + toggle, build.py NAV_GIZLI/FONKSIYONEL/feed taksonomisi,
      # secenekler.js FONKSIYONEL, filamentler.json tavsiye, urunler.json kategori) ve
      # tek bir halka kopunca hata SESSIZ (kart duzeni duser / rozet kaybolur / feed
      # taksonomisiz gider / banner her gorunumde kalir). Offline, build.py'den ONCE kosar.
      # 24 Tem (curutme sonrasi): nobet artik KAYNAK METNI degil DAVRANIS olcuyor —
      # renderCats/applyUrlParams index.html'den ayiklanip node ile GERCEKTEN kosuluyor
      # (nav cipine duz literal eklemek ve derin-link beyaz listesini daraltmak KACIYORDU),
      # secenekler.js fonksiyonelMi/satirOzeti node ile olculuyor (bypass para kaybediyordu),
      # banner GORUNURLUGU + sari taramasi CSS kural bazinda (pencere yok, rgb()/hsl()/renk
      # adi cozulur), kompakt kart icin SENTETIK semasiz fikstur var (gercek urun konfigur'lu
      # oldugu icin FONKSIYONEL uyeligini olcmuyordu). node yoksa FAIL-CLOSED exit 1 —
      # setup-node yukarida BLOKLAYICI on-kosul.
      - name: Skan Art kategori + banner kabul testi
        run: python3 tools/test-skan-art.py

      # ODEME BEYANI: statik yasal sayfalardaki siparis/odeme anlatimi canli akisla uyumlu mu
      # (kart formu/iframe yok, teslim suresi, wa.me/tel numara ayrimi). Bloklayici: uyumsuzluk
      # = musteriye yanlis odeme/teslim beyani. Offline, commit'li sayfalari okur (build.py'den ONCE).
      - name: Odeme beyani kapisi
        run: python3 tools/odeme-beyani-kapisi.py

      # R2 GORSEL ANAHTARI: anahtar KAYNAK-ID'den turetilir (basliktan DEGIL) — turetme tek
      # modulde (tools/r2_anahtar.py) toplandi, cagiranlar ondan gecer. Bloklayici: anahtar
      # basliga kayarsa iki urun ayni R2 nesnesini EZER (sessiz gorsel kaybi). Offline, yazma yok.
      - name: R2 anahtar turetme kabul testi
        run: python3 tools/r2-anahtar-test.py

      # R2 YUKLEME DOGRULAMA: gorsel govdesi/turu ile yukleme-sonrasi boyut okumasini
      # sahte S3 istemcisiyle kanitlar. Offline/mock; gercek R2'ye gitmez, kimlik okumaz.
      - name: R2 yukleme dogrulama kabul testi
        run: python3 tools/r2-upload-test.py

      # DUZELT --toplu: mesru toplu duzeltme yolu (guard'in tek kapisi). Bloklayici: toplu kip
      # kilit/atomiklik kaybederse paralel yazicilar urun kaydi EZER. Test gercek urunler.json'a
      # DOKUNMAZ (tempfile'da sahte repo kurar), ag yok.
      - name: duzelt.py --toplu kabul testi
        run: python3 tools/duzelt-toplu-test.py

      # LANDING/HUKUK KAPISI: huni (landing) sayfasindaki ticari beyanlar ile baglayici yasal
      # sayfalarin (kapsam + revizyon/cayma cercevesi) uyumu. Bloklayici (odeme-beyani deseni):
      # uyumsuzluk = musteriye yanlis hukuki beyan. Offline, build.py'den ONCE kosar.
      - name: Landing/hukuk beyan kapisi
        run: python3 tools/landing-hukuk-kapisi.py

      # MALZEME DAYANAGI: DORT yayin yuzeyinde gecen her malzeme adinin filament envanterinde
      # karsiligi var mi — (A) huni/landing sayfalari, (B) ege-bilgi.md (WhatsApp botu Ege'nin
      # bilgi dosyasi), (C) sss/gizlilik/hakkimizda/iletisim GORUNUR metni, (D) ayni 4 sayfanin
      # JSON-LD bloklari (Google'in okudugu acceptedAnswer). Uretemedigimiz bir sinifi (or. PC /
      # polikarbonat -> kodda KARA LISTE) vaat etmek yanlis ticari beyandir. Ayrica: dayanak
      # kayitlari (PA6-GF/PA12-GF/POM) YALNIZ onaylanan TAM ADI mesrulastirir, satis/uretim
      # duzlemine SIZAMAZ; ege-malzeme.py <-> ege-bilgi.md DRIFT nobeti (F18 uctan uca);
      # 49 bellekte-fikstur ic nobetcisi + 12 davranis fiksturu (main uctan uca, gecici
      # dizinde; exit-kodu kablolarinin HER BIRI solo kilitli — kapi docstring'indeki
      # KABLO ENVANTERI tablosu K1-K12) kapinin kendi yetenegini kilitler. KAPSAM
      # nobeti VARLIK kontroludur (sayi/karakter tabani YASAK SINIF): zorunlu kaynaklar en
      # az 1 govde uretmeli; JSON-LD blogu kaybolursa UYARI (FAQ rich result emekliligi
      # mesru SEO karari, yayini durduramaz). SIZINTI kapsami AD BAZLI: kod tarafindan
      # uretilen 2 degismez cikti ZORUNLU, landing /malzeme-rehberi/ kaybolursa UYARI
      # (slug degisimi tum ekibin yayinini durdurmasin). Bloklayici (landing-hukuk deseni).
      # Offline, stdlib — build.py'den ONCE commit'li kaynagi okur, GERCEK dosyaya YAZMAZ
      # (davranis fiksturleri tempfile dizininde calisir).
      - name: Malzeme dayanak kabul testi (landing + ege-bilgi.md + statik sayfa/JSON-LD)
        run: python3 tools/malzeme-dayanak-test.py

      # EGE-BILGI TAVAN: ege-bilgi.md uzunlugu bot slice(0,6000) esigini asmasin.
      # Olcu UTF-16 kod birimi (JS String.slice birimi) — bayt sayan olcum sahte-kirmizi,
      # Python len(str) astral karakterde sahte-yesil yakar.
      # Bloklayici SADECE gercek zararda, IKI hal: (1) UTF-16 uzunluk >6000 (bot metni
      # SESSIZCE kesiyor, icerik kaybi) (2) fail-loud — dosya yok / okunamiyor / UTF-8 degil
      # (olculecek sey YOK; sessiz yesil verilmez).
      # ILAN duzlemindeki HER hal UYARI'dir (exit 0 + gurultulu uyari), 21 Tem MIMAR KARARI:
      # ILAN/SABIT UYUSMAZLIGI · dar pay · ILAN YOK · CELISKILI ILAN · ILAN BASTA DEGIL ·
      # ILAN BAGLAMA OTURMADI. Gerekce: ilan kontrolu Turkce serbest metinde desen arayan bir
      # NESIR AYRISTIRMASIDIR ve bir HUKUM kaynagi degildir ([[mimar-kapi-parser-taklidi]]);
      # olculdu 21 Tem, BES ayri MASUM tek-satirlik duzenleme kapiyi kirmiziya cekiyordu
      # (uslup kuralindaki baska bir sayi · "6000"->"6.000" kozmetik ayrac · ilan cumlesinin
      # silinmesi · basa icindekiler eklenip ilanin kaymasi · ilanin YERINE "en fazla 300
      # karaktere kadar" gibi bir USLUP kurali yazilmasi) ve continue-on-error olmadigi icin
      # TUM EKIBIN yayinini durduruyordu. Icerik kaybi hukmunu uzunluk olcusu TEK BASINA
      # verir; ilan kontrolu yalnizca BAYATLIK SEZGISIDIR (bagirir, insan bakar).
      # ⚠️ BILEREK KABUL EDILEN RISK: TAVAN sabiti bot reposundakinden KUCUK yonde bayatlarsa
      # kapi durdurmaz, yalniz uyarir. Gercek capraz-repo korumasi
      # pruvo-bot/worker/test/ege-bilgi-nobetci.mjs'de (tavani index.js'ten CANLI okur).
      # "KESIN ilan" = sayi TAVAN bandinda (2000..18000) VE AYNI SATIRDA ilanin oznesi
      # (Ege'ye / bilgi dosyasi / bu dosya) aniliyor; bu ayrim artik hukumde degil TESHIS
      # metninde yasar (fikstur N1/N4/A5* onu korur). Offline, stdlib, ~5 ms.
      - name: Ege-bilgi tavan kabul testi (6000 karakter kesme kapisi)
        run: python3 tools/ege-bilgi-tavan-test.py

      # EGE-BILGI TAVAN — IC NOBETCI: kapinin KENDI hukmunu 30 gecici fiksturle olcer
      # (tavan asimi · sinir 6000/6001 · astral UTF-16 ayrismasi · kesilen kuyruk onizlemesi ·
      # dar/genis pay · dosya yok · dosya OKUNAMIYOR · UTF-8 degil · ilan sapmasi + ters yonu ·
      # mukerrer ilan · binlik ayrac · A1-A5 masum duzenlemeler · capa satir baglami (N1) ·
      # onek zorunlulugu (N4)). Neden ayri adim: curutucu 21 Tem 5/5 kod mutasyonunun
      # (tavan hukmunu oldur / UTF-16'yi len(str) yap / marji oynat / fail-loud dalini
      # return 0 yap / ilan nobetcisini oldur) SAG KALDIGINI olctu — nobetci sessizce olurse
      # ustteki adim yesil yanmaya devam ederdi. Bugun 14/14 mutant oluyor; olcumu
      # tekrarlamak icin: python3 tools/ege-bilgi-tavan-mutasyon.py (kapiyi SALT OKUR,
      # mutasyonu KOPYAYA uygular — CI adimi degil, elde kosulan kanit araci).
      # ⚠️ ILAN duzlemi UYARI'ya indigi icin oradaki mutantlarin cogu artik EXIT KODUNU degil
      # yalniz TESHIS METNINI bozar -> fiksturler "iceren/icermeyen" metin sartiyla yazilir;
      # sadece exit kodu karsilastiran bir fikstur onlari GOREMEZ.
      # Fiksturler tempfile'da; repo dosyalarina DOKUNMAZ. Offline, stdlib, ~40 ms.
      - name: Ege-bilgi tavan kapisi ic nobetci (kapinin kendi mantigi)
        run: python3 tools/ege-bilgi-tavan-test.py --ic-nobetci

      # EGE KABILIYET-SINIRI KAPISI (26 Tem): ege-bilgi.md musteriden URETIM olcusu/cizimi
      # ISTIYOR mu, ya da uretim/fiyat SOZU veriyor mu? Canli SISTEM_TALIMATI bunu katalog-bos
      # dalinda uc yerde yasakliyor (pruvo-bot worker/src/index.js :41, :52, :2467; ayrica :57
      # "yaklasik su kadar tutar' DEME"). ege-bilgi.md her konusmada o talimatin YANINA enjekte
      # edildigi icin buradaki bir "olcu/cizim iste" ya da "ozel uretiriz" satiri AYNI prompt
      # icinde iki zit talimat yaratir -> model rastgele birini secer, yasak SESSIZCE delinir.
      # NEDEN AYRI KAPI: bu hata sinifini olcen test YOKTU — bot tarafindaki
      # ege-bilgi-nobetci.mjs'in 5 ekseninde (ODEME/TESLIM/KARGO/MALZEME/FIYAT) kabiliyet-siniri
      # ekseni yok, musteri-bacagi-nobetci.mjs ise SENTETIK fikstur okur, gercek ege-bilgi.md'ye
      # bakmaz. 26 Tem'de tam bu sinif tum testler YESILken bir dala girdi ("foto/olcu/cizim
      # iste"); kapi o dersin ciktisi. Kapsam BILEREK dar (3 sinif) — genisletmek l.11/l.18/l.38
      # gibi mesru satirlari sahte-kirmizi yakar.
      # ⚠️ (C) sinifi IKI KANATLIDIR: para + GUCLU kip ("800 TL tutar", "diyebiliriz")
      # tek basina yanar; olur/yazar/cikar/gecerlidir gibi ZAYIF kipler ancak YAKLASIK
      # jetonuyla BIRLIKTE yanar — cunku tek baslarina BETIMLEMEdirler ("fiyat sayfada
      # yazar") ve belgenin KENDI l.7/l.9/l.45'i tam o sinifta. (C) ayrica DUZ KESIN
      # FIYAT BEYANINI ("Bu parca 1.200 TL") OLCMEZ. Kapi yesil ciktisinda bu iki kor
      # noktayi ACIKCA ilan eder. Offline, stdlib, ~5 ms.
      - name: Ege kabiliyet-siniri kapisi (olcu/cizim istegi · uretim/fiyat sozu)
        run: python3 tools/ege-kabiliyet-kapisi.py

      # TUR 4 TASARIM NOTU: (C) sinifi POZITIF SART ile calisir — [para jetonu] VE
      # [taahhut kipi]. Onceki NEGATIF VETO ("betimleme varsa susturma") bypass'a acikti:
      # bir fiil EKLEYEREK kural susturulabiliyordu ("... ve sepette GORUNUR" -> yesil).
      # Ilke: kelime EKLEYEREK susturulabilen kural, kural degildir. Ayrica cumlecik
      # bolucusu RAKAM ARASINDAKI nokta/virgulu BOLMEZ — Turkce binlik ayraci ("1.500 TL")
      # (C) sinifini 1.000 TL ustunde TAMAMEN OLDURUYORDU ve fiksturler 3 haneli oldugu
      # icin bunu goremiyordu (ders: fiksturler gercek dagilimi ornekleMEZse yesil bir sey
      # ispatlamaz). (A) sinifi CUMLE penceresinde jeton arar (virgullu devrik tumce),
      # olumsuzlamayi CUMLECIK penceresinde kontrol eder.
      # TUR 5 DERSI (fikstur yerlesimi): TUR 4'te dort fiil BETIMLEME'den TAAHHUT'e
      # tasindi ama hicbir yanlis-pozitif fiksturunde PARA jetonuyla birlikte gecmiyordu
      # -> 36/36 YESIL yandi ve 17 mesru cumlenin 15'i KIRMIZIyken kimse gormedi.
      # Fikstur, degisen davranisin TAM USTUNE oturmali; yanindan gecen test YANILTIR.
      # Z1-Z6 (yesil) + Z7-Z12 (kirmizi) bu sinirin iki tarafini da nobetler.
      # TUR 6: CIPLAK TURKCE KELIMEYE ASILI DESEN = YANLIS-POZITIF URETECI. Uc homograf
      # ayiklandi: "sorun"(=problem) · "çapa"(MARIN kategorisinin CEKIRDEK URUNU) ·
      # "çapak"(baski artigi). Ayrica jenerik 1. cogul fiiller (yaparız/veririz) URUN
      # baglami ister — "Kargo cikisini ayni gun yaparız" bir uretim sozu DEGILDIR ve
      # o cumle yuzunden tum sitenin yayini duramaz.
      # TUR 7: (B) daraltmasi GERI ALINDI (asiri-duzeltmeydi). Olculdu — daraltmanin
      # onledigi yanlis-pozitifler ERISILEBILIR DEGILDI (yaparız/veririz canli belgede x0),
      # bedeli ise 28 cumlelik taahhut korpusunda yakalamanin 27 -> 10'a dusmesiydi;
      # kacanlar arasinda kapinin KURULUS VAKASININ (M2) parafrazlari vardi.
      # ILKE: yanlis-pozitif GURULTULUdur, dakikalar icinde duzeltilir; (B)/(C) kacisi
      # SESSIZdir ve musteriye TICARI BEYAN olarak gider. Onarim bastiriciyla degil
      # BAGLAM GENISLETEREK yapildi (G7-G13 o genislemenin bedelini olcer).
      # TUR 8: "veririz/vereceğiz" ailesi AYRI ve DAR bir baglam listesi kullanir — ciplak
      # zamir ("size/biz") TETIKLEYICI DEGIL. Sebep olculdu: "vermek" bilgi/link/kargo/oneri
      # de verir; tek GENIS listeyle "2.500 TL uzerinde kargoyu SIZE ucretsiz veririz"
      # KIRMIZI yaniyordu ve tetikleyici canli belgede MEVCUT ("size" l.14, "biz" l.13).
      # V1-V7 bu ayrimin iki tarafini da nobetler; MUT8 (listeleri birlestir) V1-V5'i kirar.
      # EGE KABILIYET — IC NOBETCI: kapinin KENDI hukmunu 73 fiksturle olcer. Hem YAKALAMA
      # (eski dal metni · "ozel uretiriz" · mm/kumpas/cap olcu talebi · yaklasik/tahminen/
      # civari/ortalama/bandinda fiyat · ortuk "yapabiliriz") hem YANLIS-POZITIF yonu olculur.
      # 🔴 YANLIS-POZITIF NEDEN OLUMCUL: bu kapi `build` isinde kosuyor ve `deploy: needs: build`
      # -> ege-bilgi.md'ye yapilan MESRU bir duzenleme kapiyi kirmizi yakarsa Ege degil TUM
      # pruvo3d.com yayini durur. Bu yuzden M11-M15 + M21 kalici nobetci: "sorun" homografi
      # (=problem ismi) · arayuz/ucret BETIMLEMESI ("yaklasik tutar GORUNUR", "250 TL EKLENIR")
      # · belgenin KENDI l.9 kargo cumlesi · l.11 "netlestir" dili · duz kesin fiyat beyani
      # (ILAN EDILMIS kor nokta — "duzeltmek" l.9'u kirar).
      # Kritik fikstur M1: olumsuzlama CUMLECIK duzeyinde aranmali — satir duzeyinde arayan bir
      # surum, ayni satirdaki "verme" jetonunu gorup "olcu/cizim iste" emrini MASKELER ve
      # sahte-yesil yanar (olculdu). M16: baglac (cunku/ama/fakat) da ayirici olmali, yoksa
      # "Olcuyu gonderin CUNKU tahmin yeterli DEGIL" maskelenir. Fiksturler bellekte; repo
      # dosyalarina DOKUNMAZ. Offline, stdlib.
      - name: Ege kabiliyet kapisi ic nobetci (kirmizi-mutasyon)
        run: python3 tools/ege-kabiliyet-kapisi.py --ic-nobetci

      # ENJEKSIYON KAPISI: build.py'nin sayfalara inline bastigi JS (attribution/riza + meta)
      # bayt-bayt bozulmadan mi gidiyor. Yasanmis hata: re.sub REPLACEMENT kacisi yorumlayinca
      # ya JS string'i kiriliyor (sayfa acilir, script SESSIZCE hic calismaz) ya da build tumden
      # cokuyor. Bloklayici; tam build kosmaz (fonksiyonlari dogrudan cagirir), olculdu 8,5 s.
      - name: Enjeksiyon kapisi (inline JS bozulmadan mi basiliyor)
        run: python3 tools/enjeksiyon-kapisi.py

      # STL R2 YUKLEYICI: anahtar turetme (yol-gezinme kapisi: ../ , mutlak yol, ters bolu,
      # NUL reddedilir) + 300 MiB ustu cok-parcali (multipart) yolun parca boyutu/sayisi ve
      # kabul mantigi. Bloklayici: anahtar kacarsa yanlis R2 prefix'ine yazilir, multipart
      # esik/parca hesabi kayarsa buyuk STL sessizce BOZUK yuklenir. Offline (gercek R2
      # yazmasi YOK, kimlik okumaz), olculdu ~1 s; build.py'den ONCE kosar.
      - name: STL R2 anahtar/multipart kabul testi
        run: python3 tools/stl-r2-anahtar-test.py

      # 3MF SINIR KUTUSU (bbox_3mf) — 30 Tem'e kadar OLU idi: ankraj fiksturleri GERCEK urun
      # dosyalariydi (stl/pr1173083.3mf, stl/pr912419.3mf) ve stl/ gitignore'da; test her
      # ortamda 0,1 s'de FileNotFoundError ile PATLIYOR, HICBIR iddia kosmuyordu. Muafiyet
      # gerekcesi de yanlisti (R_YAVAS ">30 s" diyordu; olculen 0,1 s'lik cokustu).
      # Ankraj artik DEPODA (tools/fikstur/3mf/, ~3 KB, uretici tools/fikstur/3mf-fikstur-uret.py):
      # cok-.model + transform zinciri, tek-.model duz olcum, inch->mm birim donusumu.
      # NE KORUR: urun aciklamasindaki "Yaklasik dis olculer" satiri bu fonksiyondan gelir;
      # transform zinciri ya da birim carpani dusserse musteriye YANLIS OLCU yayinlanir ve
      # hata tamamen sessizdir. stl/ yoksa regresyon taramasi ACIKCA "ATLANDI" raporlanir
      # (sessiz atlama YOK), ankraj bolumu her ortamda kosar. Offline, ~0,1 s.
      - name: 3MF sinir kutusu (bbox_3mf) kabul testi — cok-model + transform + birim
        run: python3 tools/test-bbox-3mf.py

      # PIKSEL <-> KATALOG PARITE: Meta/Google katalog feed g:id ile tarayici/CAPI pikselinin
      # content_ids'i AYNI KURALDAN (build.feed_id) turer mi. Yasanmis hata: feed uzun urun id'sini
      # <=50 karaktere kisaltirken piksel TAM pid gonderiyordu -> 610/7769 urunde katalog eslesmiyor
      # (Advantage+ kor calisir). Bloklayici: sablon content_ids feed g:id'den saparsa katalog reklami
      # yanlis urun gosterir. Offline (render_product'i cagirir, ag yok); JS-uc paritesi icin
      # setup-node kurulu; node yoksa adim FAIL eder (fail-closed).
      - name: Piksel <-> katalog parite kapisi
        run: python3 tools/piksel-katalog-parite-test.py

      # FEED POLITIKA KAPISI — IKI KATMANLI. Merchant feed'inin <title> VE <description>
      # metinlerini tarar. BLOKLAYICI katman YALNIZ olculmus/bildirilmis GERCEK Merchant
      # reddinden turemis 3 jeton icerir (e-sigara/vape ailesi; "durbun" BLOKLAMAZ, RAPOR
      # katmanindadir — mesru Marin/Kamera urunu tum ekibin yayinini durdurmasin diye).
      # Tam katalogda 7 isabet, YANLIS-POZITIF 0 (olculdu 2026-07-22, 7650 feed kalemi:
      # 7 isabetin 7'si de gercek e-sigara/vape urunu, tek tek denetlendi ve tabanda yazili).
      # Feed KISMEN taranirsa (ayristirma kirpilir/bozulur) kapi FAIL-CLOSED kirmizi yanar —
      # eskiden cikis 0 veriyordu ve 3000. siradaki gercek bir vape urunu sessizce geciyordu.
      # Bilinen borc tools/feed-politika-
      # taban.json'da (tek yazar MaCiT, KOD DEGISIKLIGI GEREKTIRMEDEN guncellenir);
      # tabanda OLMAYAN yeni bir ihlal ya da tabandaki bir urunun YENI jeton kazanmasi
      # KIRMIZI yakar. Supheli ama kanitsiz jetonlar (kullук/cakmak/susturucu — bunlar
      # mesru Turkce otomotiv parca adlaridir, olculdu: 71 yanlis pozitif) RAPOR katmaninda
      # yalniz SAYILIR, CI'yi KIRMAZ. Offline (feed'i build.py'yi MODUL olarak import edip
      # uretir), olculdu 2,6 s.
      - name: Feed politika jetonu kapisi (bloklayici + rapor)
        run: python3 tools/feed-politika-kapisi.py

      # FEED g:id COZUCU: Merchant panelinden gelen KISALTILMIS g:id (50 karakter kurali)
      # gercek urun id'sine geri cozulebiliyor mu. Bloklayici degil ama regresyon nobetcisi:
      # cozum bozulursa panel sikayetleri yine "boyle urun yok / 404" gibi gorunur (yasanmis
      # tanilama koru). Offline (ag nobetcisi testin icinde), olculdu 0,4 s.
      - name: Feed g:id cozucu kabul testi
        run: python3 tools/feed-id-cozucu-test.py

      # ASGARI GORSEL BOYUTU: 100x100 altindaki gorsel Google Merchant'ta "resim cok kucuk"
      # reddi alir (olculen vaka 1000x88). Kapinin KENDISI ekleme hattinda kosar (CI'da
      # 7769 gorseli agdan cekmek kabul edilemez); burada kosan sadece onun OFFLINE kabul
      # testidir (sentetik fikstur, saf Python baslik ayristirma). Test uc ekleme betigini
      # GERCEKTEN import edip process_one'i sahte upload ile uctan uca kosturur (ag/AI/sips
      # yok, urunler.json'a DOKUNMAZ) -> kablolama kopmasi sessiz kalamaz. Olculdu 2,1 s.
      - name: Asgari gorsel boyutu kapisi kabul testi
        run: python3 tools/gorsel-boyut-test.py

      # NOBETCI MUTASYON HARNESS: yukaridaki iki kapinin KENDISINI olcer — bozulunca GERCEKTEN
      # kirmizi yaniyorlar mi. Feed politika kapisinin kirmizi CIKIS YOLU ve _kendini_dogrula()
      # hicbir testle korunmuyordu; olculdu: <title> bulucusunu olduren mutasyon eski kapida
      # exit 0 veriyordu (gercek bir vape urunu SESSIZCE geciyordu). 14 kapi mutasyonu + 3
      # gorsel-kablolama mutasyonu kosulur, hepsi KIRMIZI yanmali; mutasyonsuz kontrol kosumu
      # YESIL yanmali (harness "hep kirmizi" olamaz). Son 4 mutant KENDI sebebiyle yanmak
      # zorunda (isaret metni dogrulanir): feed kirpma + uc nobetci fiksturunun korlestirilmesi
      # (_NEGATIF / _RAPOR_POZITIF / _ASIMETRIK — ucu de tek satirla susturulabiliyordu).
      # Mutasyon DAIMA gecici SYMLINK aynasina uygulanir — canli tools/ dizinine YAZMA YOK.
      # Offline, urunler.json OKUNMAZ (sentetik katalog), olculdu 38 s.
      - name: Nobetci mutasyon harness'i (kapilar bozulunca kirmizi yaniyor mu)
        run: python3 tools/nobetci-mutasyon-test.py

      # MARKA KÜRATÖRLÜĞÜ: ana sayfa marka çip listesi yalnız TANINMIS_MARKALAR'dan oluşur
      # (model/motor kodu çip olamaz), varyantlar (Mercedes-Benz, Toyota 86, KIA/Kia) tek
      # kaleme katlanır ve filtre eşleşmesi katlamayla tutarlıdır. index.html'deki bloğu
      # AYIKLAYIP gerçek urunler.json'a uygular (kopya değil, canlı kod). JS mantığı node
      # ile koşar (setup-node kurulu; node yoksa FAIL-CLOSED exit 1). Offline, ~1 s.
      - name: Marka liste kabul testi (küratörlü çipler + varyant katlama)
        run: python3 tools/marka-liste-test.py

      # MARKA DURUM PANELI: parity-panel/parity-csv/marka-kapsama satır evreni ham defter
      # anahtarları değil KANONIK TANINMIS_MARKALAR'dan gelir; ham defterdeki sayımlar
      # markaKatla ile kanonik markaya KATLANIR (Toyota cover/mount... -> tek Toyota),
      # tanınmayan (tasarımcı-adı/model-kodu) çöp anahtar satır DEĞİL, harvest edilmemiş
      # tanınmış marka (DeWalt...) 🔴 to-do. Saf Python, sentetik fikstür, OFFLINE, ~1 s.
      - name: Marka durum paneli kabul testi (kanonik satır + katlama)
        run: python3 tools/marka-panel-test.py

      # MARKA CIP TAVANI (index.html MARKA_LIMIT) — R_NODE muafiyet sinifindan cikarildi
      # (30 Tem): gerekce "CI build job'u Python-only (setup-node yok)" diyordu, oysa
      # setup-node BLOKLAYICI on-kosul olarak VAR. NE KORUR: ana sayfadaki marka cipi
      # tavani ve `brands.slice(0, MARKA_LIMIT)` uygulamasi + emekli edilmis eski
      # mekanizmalarin (BRAND_COLLAPSED / brandsExpanded / "daha fazla goster") GERI
      # GELMEMESI. Tavan kalkarsa ana sayfa yuzlerce cip basar (mobil duzen coker); hata
      # sessizdir cunku sayfa "calisiyor" gorunur. Offline, index.html'i okur, ~0,1 s.
      - name: Marka cip tavani kabul testi (MARKA_LIMIT + slice)
        run: node tools/marka-limit-test.js

      # ARAMA/FILTRE URL SENKRONU (index.html) — ayni sinif, ayni yanlis gerekce.
      # NE KORUR: arama/kategori/marka secimlerinin URL'ye yazilmasi (syncUrl), derin
      # linkin geri okunmasi, aramayi temizleyince URL'nin temizlenmesi ve "yukari cik"
      # okunun sepet FAB'i ile cakismamasi. Bozulursa paylasilan/reklamla gelen derin
      # link YANLIS ekrani acar — kayip satis, ekranda gorunmez. Offline, ~0,1 s.
      - name: Arama/filtre URL senkron kabul testi (derin link + temizleme)
        run: node tools/url-senkron-test.js

      # KONFIGUR KABUL TESTI: konfigure edilebilir dekor urunu (renk + boy kaydirici)
      # altyapisi. (a) konfigur sema dogrulamasi fail-closed (bozuk sema/capa build'i
      # dusurur), (b) afin capa fiyat modeli — node ile GERCEK /konfigur.js kosulur
      # (setup-node kurulu; node yoksa test FAIL-CLOSED kirmizi): kesin artanlik + capa
      # tam-tutar dogrulugu + tam-TL yuvarlama + Python aynasi drift nobeti, (c)
      # konfigur'suz urun sayfasi geri-uyumlu — REFERANSSIZ ve KALICI uc iddia: c1 konfigur
      # izi yok, c2 sayfa sinifinin yapisal cekirdegi (#filCipler / KART_SECIM / #opsiyonlar /
      # #boySec / .attribution / jenerator modulleri) yerinde, c3 malzeme arayuzu XOR
      # (kart bolumu YA DA secici, ikisi birden ya da hicbiri degil). c4 (merge-base build.py
      # ile bayt-esitlik) ANA HATTA YAPISAL OLARAK OLCULEMEZ — main'e push'ta merge-base ==
      # HEAD oldugu icin referans build.py CALISANLA AYNI cikar, karsilastirma totolojiye
      # doner; bu yuzden "--anahat" ile kosuyoruz: ⚪ OLCULEMEDI GURULTULU raporlanir ama
      # yayini kilitlemez (surekli-kirmizi = yayin kilidi de en az sessiz-yesil kadar
      # yanlis). Bloklayici koruma c1/c2/c3 + (a)/(b)/(d)/(e) uzerindedir; continue-on-error
      # YOK. (d) konfigur'lu sayfada JSON-LD Offer.price = minimum (capa-1) fiyat + feed
      # ayni fiyat. Offline, sentetik fikstur, urunler.json OKUNMAZ, dosya yazmaz;
      # build.py'den ONCE kosar (render_product'i dogrudan cagirir).
      - name: Konfigur (dekor konfigurator) kabul testi
        run: python3 tools/konfigur-test.py --anahat

      # KONFIGUR FAIL-CLOSED (shop odeme yolu — SESSIZ EKSIK TAHSILAT kapisi). Konfigurlu urun
      # D1'e senkronlanip Worker ELLE deploy edilmediginde kalem eskiden sessizce SABIT katalog
      # fiyatiyla satiliyordu (olculdu: 30 cm/PLA 1.500 TL yerine 500 TL -> 1.000 TL eksik
      # tahsilat, hicbir uyari yok). Bu adim shop/src/index.js'in KENDISINI node'a yukleyip
      # (setup-node yukarida BLOKLAYICI on-kosul; node yoksa FAIL-CLOSED kirmizi) sahte D1 +
      # sahte iyzico ile kosar: (a) 39/39 konfigur kaleminde fiyat DEGISMEDI, (b) bundle'da
      # olmayan konfigur urunu 400 aliyor ve sabit fiyat HESAPLANMIYOR, (c) 250 siradan urun +
      # TUM katalog taramasinda 0 yanlis-pozitif, (d) kapi silinince YALNIZ (b)
      # kirmizi yaniyor (olu-nobetci korumasi), (e) musteriye gosterilen metin jenerik degil.
      # OFFLINE: wrangler YOK, ag YOK, gercek/sahte SIPARIS YOK, dosya yazmaz. ~6 s.
      # NOT: shop/test'in diger dosyalari (kabul.js vb.) wrangler dev istedigi icin ci-kapsam
      # izin listesinde muaf; BU dosya wrangler istemedigi icin muaf DEGIL, fiilen kosar.
      - name: Konfigur fail-closed kabul testi (shop sessiz eksik-tahsilat kapisi)
        run: node shop/test/konfigur-fail-closed.mjs

      # KONFIGUR BUNDLE KAPISI (drift): shop/src/konfigurlar.js artik ELLE BAKIMLI AYNA DEGIL,
      # urunler.json'daki "konfigur" alanlarindan URETILEN bir artefakt. Bu adim artefakti
      # yeniden turetip BIREBIR karsilastirir; yeni konfigurlu urun eklenip artefakt
      # uretilmemisse (ya da artefakt elle kurcalanmissa) CI KIRMIZI yanar. Cozum tek komut:
      # python3 tools/konfigur-bundle-kapisi.py --yaz
      # KAPSAM DAR (jeton ekseni): yalniz konfigur alanlarindan TURETILEN icerik karsilastirilir
      # -> konfigursuz urun ekleme/silme, fiyat/aciklama/gorsel/CSS degisikligi, katalog sirasi
      # ve konfigur objesi ICI anahtar sirasi kapiyi YAKMAZ (olculdu: --kendini-test'te 9
      # yanlis-pozitif senaryosunun 9'u yesil). Saf Python, offline, dosya YAZMAZ, ~1 s.
      - name: Konfigur bundle kapisi (urunler.json -> shop/src/konfigurlar.js drift)
        run: python3 tools/konfigur-bundle-kapisi.py

      # ... ve kapinin KENDI kabulu (nobetci olu kalmasin): 9 yanlis-pozitif senaryosu YESIL
      # kalmali, 4 gercek drift mutanti KIRMIZI yanmali, CLI cikis kodlari (esit=0 / drift=1 /
      # dosya-yok=1) dogru olmali, bozuk konfigur semasi artefakt URETIMINI reddetmeli
      # (fail-closed: yarim/bozuk artefakt ship edilmez). Gecici dizinde calisir, repo dosyasi
      # DEGISMEZ. ~2 s.
      - name: Konfigur bundle kapisi — kendini test (yanlis-pozitif + kirmizi-mutasyon)
        run: python3 tools/konfigur-bundle-kapisi.py --kendini-test

      # KONFIGUR SEMASI -> D1 (FAZ 1+2). Konfigur semasi artik SADECE Worker bundle'inda degil,
      # D1 'konfigur' kolonunda da yasar (urun eklenince pre-push hook zaten senkronlar).
      # Bu adimin ASIL kaniti: arama.urun_hash() konfigur'u KAPSAMIYOR -> konfigur icerik-upsert
      # yoluna konsaydi degisim SESSIZCE eskirdi. Test bunu dogrudan olcer (alan degistir ->
      # hash birebir ayni -> diff_plan 0 UPDATE) ve hedefli konfigur_plan'in AYNI degisimi
      # yakaladigini gosterir; ayrica 17/17 JSON birebir, idempotens, temizleme, fail-closed
      # bozuk-sema ve 3 no-op mutasyon guardi.
      # OFFLINE: canli D1/wrangler/AG YOK — gercek d1-sema.sql bellek-ici sqlite3'e yuklenir.
      # fts5-trigram CI'da YOK; test bunu OLCER ve yalniz "FTS thrash" iddiasini ACIKCA
      # ATLANDI der (kalan 33 iddia kosar) -> kardesi taban-fiyat-d1-test.py gibi MUAF olmasi
      # gerekmez, burada BLOKLAYICI kosar. ~2 s.
      - name: Konfigur D1 semasi kabul testi (hash-kor alan + hedefli UPDATE)
        run: python3 tools/konfigur-d1-test.py

      # KONFIGUR GOLGE MODU (FAZ 3). Worker D1'den `konfigur`u OKUR ama fiyati HALA bundle'dan
      # hesaplar; bu adim iki seyi birden kilitler:
      # (1) MUSTERI DAVRANISI DEGISMEDI — capa 150/PLA=73600, 300/ASA=150000, anka-kusu
      #     150/PLA tutar '986,00 TL' (kargo dahil), konfigursuz urun aynen; hepsi konfigur
      #     kolonu VARKEN ve YOKKEN birebir ayni (17 urun x 3 nokta = 51 kalem dahil).
      # (2) FARK OLCULEBILIR — bundle==D1 iken fark 0 ve HIC log yok; kasten farklilastirilmis
      #     fiksturde ayrisan ALAN YOLU + KURUS farki gorunur, ama tahsilat DEGISMEZ.
      # Ayrica: d1-eksik/bundle-eksik/d1-bozuk siniflari, kolon yokken fail-safe odeme,
      # /yonet/konfigur-golge rapor ucu (anahtarsiz 404, YAZMA 0) ve 4 no-op mutasyonu.
      # OFFLINE: wrangler YOK, ag YOK, siparis YOK, dosya yazmaz. ~10 s.
      - name: Konfigur golge modu kabul testi (davranis degismedi + fark olculebilir)
        run: node shop/test/konfigur-golge.mjs

      # FIYAT ESDEGERLIGI + PROVA UCU (shop/test/fiyat-prova.mjs). Iki seyi birden kilitler:
      # (1) ESDEGERLIK — konfigur aynasinin uretilmis artefakta cevrilmesi ve fiyat hesabinin
      #     sepetiFiyatla()'ya cikarilmasi fiyati DEGISTIRMEDI: ESKI kod (git HEAD: elle ayna)
      #     ile YENI kod 14 urun x 6 kombinasyonda AYNI kurusu uretmeli (fark 0) + 3x tavan
      #     (150000 kurus) hala uygulanmali.
      # (2) PROVA — POST /api/shop/fiyat yan etkisiz olmali: D1 YAZMA sayaci 0, ag (iyzico/
      #     Telegram/e-posta) cagri sayaci 0, siparis_no sorgusu 0; AYNI kosumda /baslat ikisini
      #     de artirmali (sayaclarin olu olmadigi kaniti). Ayrica prova tutari tahsilat tutariyla
      #     BIREBIR, cevap BEYAZ LISTE (baslik/kategori/gorsel/hacim/PII/token sizmaz), dogrulama
      #     /baslat ile ayni, hiz siniri calisiyor, artefaktta olmayan konfigur urunu provada da
      #     400 (fail-closed). 4 KIRMIZI-MUTASYON: bayat artefakt / fail-closed kol silinmis /
      #     kapinin CI cagrisi silinmis / prova yan etki uretiyor.
      # OFFLINE: wrangler YOK, ag YOK, gercek/sahte SIPARIS YOK, repo dosyasi YAZILMAZ. ~40 s.
      - name: Fiyat esdegerligi + prova ucu kabul testi (yan etkisiz fiyat sorgusu)
        run: node shop/test/fiyat-prova.mjs

      # 2-RENK YAZI EK UCRETI (shop odeme yolu — KARSILIGI OLMAYAN TAHSILAT kapisi). Cerceve
      # ailesinde yazi rengi farkli secilince fiyata +75 TL ekleniyordu; olcum bunu curuttu
      # (ayni geometriyle yazi='' / 'OKAN' / 'WWWWWWWWWWWW' -> uc STL de 65284 bayt / 1304
      # ucgen / SHA-256 BIREBIR AYNI: yazi uretilen govdeye HIC girmiyor). Ucret secenekler.js
      # IKI_RENK_EK_KURUS TEK KAYNAGINDAN 0'a cekildi. Bu adim shop/src/index.js'in KENDISINI
      # node'a yukleyip (setup-node yukarida BLOKLAYICI on-kosul) sahte D1 + sahte iyzico ile
      # kosar ve fiyati Worker'in D1'e YAZDIGI satirdan okur: (1) 2-renk kalem tam 7500 kurus
      # UCUZLADI, yazisiz/ayni-renk kalem DEGISMEDI, 3x tavan ve dar-kenar reddi DEGISMEDI,
      # (2) ON YUZ (jenerator/konfigurator.js, sahte DOM ile gercek satiraYaz) ile Worker
      # kurusu kurusuna ESIT — ayrisirsa gosterilen != tahsil edilen olurdu, (3) 23 parametrik
      # ailede varsayilan olcu fiyatlari BIREBIR ayni, (4) VAKUM: sabit 7500'e geri alinirsa
      # iddia KIRMIZI yanar (olu-nobetci korumasi), (5) front/Worker kaynaginda IKINCI bir
      # 7500 sabiti kalmadi. "ESKI" fiyatlar git HEAD kaynaklarindan AYNI yolla olculur.
      # OFFLINE: wrangler YOK, ag YOK, gercek/sahte SIPARIS YOK, repo dosyasi YAZILMAZ. ~2 s.
      - name: 2-renk yazi ek ucreti kabul testi (karsiliksiz tahsilat kapisi)
        run: node shop/test/iki-renk-ucret.mjs

      # OLCUM KABLOLAMA KAPISI (shop/test/olcum.mjs) — 30 Tem'e kadar CI'da HIC kosmuyordu.
      # NE KORUR: Meta CAPI + GA4 Purchase kablolamasi (currency/value/event_id dedup), havale
      # akisinda /durum 'odendi' -> Purchase, idempotens (ayni siparis iki kez -> TEK olay),
      # eszamanlilik/CAS, basarisiz odemede olay GONDERILMEMESI, kart akisinin olcum izi ve
      # GIZLILIK ekseni (Okan'in yonetim IP/UA'si Meta'ya GITMEZ + token loga yazilmaz).
      # Hepsi SESSIZ hata sinifi: yanlis ciro/cift sayim reklam optimizasyonunu bozar, kimse
      # ekranda gormez.
      # NEDEN SIMDI KOSABILIYOR: test shop/src/{index,yonet}.js'i node'a yukluyor; o kaynaklar
      # JSON'u STATIK import ediyor ve Node ESM `with { type: "json" }` istiyor. Attribute
      # enjeksiyonu eskiden `module.registerHooks` (v22.15+) ile yapiliyordu -> Node 20 runner'da
      # 6 iddia (18/19/22/24/25/26) HER kosuda kirmizi, 129/6. Hook `module.register` (v20.6+)
      # API'sine cevrildi: TEK kod yolu, surum dali YOK -> Node 20.20.2'de de 25.x'te de
      # 188/0 (ikisinde de olculdu). FAIL-CLOSED: modul yuklenemezse o 6 iddia GERCEK hata
      # metniyle KIRMIZI yanar (mutasyonla kanitlandi), asla "atlandi/yesil" olmaz.
      # OFFLINE: ag YOK (fetch stub'lanir), wrangler YOK, sahte D1, GERCEK SIPARIS YOK,
      # repo dosyasi YAZILMAZ. Secret degeri basilmaz. ~1 s.
      - name: "Olcum kablolama kabul testi (Meta CAPI + GA4 Purchase, havale/kart + gizlilik)"
        run: node shop/test/olcum.mjs

      # OLCUM TEST KAPISI (shop/test/olcum-kapisi.cjs) — 30 Tem'e kadar OLU idi. Dosya SAF
      # MODULDU (`module.exports` var, `require.main` kolu YOK): `node shop/test/olcum-kapisi.cjs`
      # rc=0 verip SIFIR IDDIA kosuyordu; shop/.dev.vars'a SAHTE bir META_CAPI_TOKEN konsa
      # bile rc=0 kaliyordu. Tek tuketicisi shop/test/kabul.js, o da wrangler dev istedigi
      # icin hicbir hatta kosmuyor -> "yerel test GERCEK Meta pikseline sahte Purchase
      # basmasin" fail-closed kapisi FIILEN YOKTU (izin listesindeki R_AYRI gerekcesi de
      # olcumle yanlis cikti: oyle bir CI hatti yok). Artik ciplak kosulabilir:
      #   A) OZ-NOBET — kapinin karar mantigi sentetik girdiyle olculur (izlenen anahtarlar,
      #      taranan dosyalar, yanlis-pozitif kenarlari, override akil saglami).
      #   B) GERCEK DURUM — bu ortamdaki env + shop/{.dev.vars,.env,.env.local} + wrangler.toml
      #      okunur; gercek bir CAPI token'i / GA4 api_secret'i gorurse KIRMIZI.
      # Sebep metinleri anahtarin ADINI tasir, DEGERINI TASIMAZ -> loga sir basilmaz.
      # Offline: ag YOK, wrangler YOK, dosya YAZMAZ, gercek Meta/GA4 ucuna ISTEK ATMAZ. ~0,1 s.
      - name: Olcum test kapisi (yerel test gercek piksele basmasin — fail-closed)
        run: node shop/test/olcum-kapisi.cjs

      # SEPET PANELI + KONFIGUR ODENEBILIRLIK PROVASI (shop/test/sepet-panel.js). index.html'in
      # inline sepet scriptini node:vm'de GERCEKTEN kosar (kod kopyalanmaz): kayip satir,
      # bos sepet, firsat tazelemesi, bozuk unicode, savunma kacisi, odeme payload'i VE
      # (30 Tem) konfigur kart-yolu provasi -> bundle'da olmayan konfigur urunu sepette
      # KAPALI gorunur, musteri odeme formunu doldurmadan WhatsApp'a yonlendirilir; ag
      # hatasi/zaman asimi/cop govde/celiskili 400 hallerinde de KAPALI (fail-closed);
      # konfigursuz sepette /fiyat ucuna KOR ISTEK ATILMAZ (hiz siniri).
      # 🔴 MUAFIYET KALDIRILDI (30 Tem): bu dosya ci-kapsam izin listesinde R_AYRI ("shop ayri
      # Worker hedefi") gerekcesiyle muaf duruyordu; gerekce OLCULEREK YANLIS bulundu — test
      # wrangler/ag/D1 ISTEMEZ (kardesleri konfigur-fail-closed.mjs, fiyat-prova.mjs, olcum.mjs
      # zaten burada kosuyor). Muaf oldugu icin hic kosulmadi ve EDGE_KATALOG acildiginda
      # SESSIZCE OLDU: 9 nobetcinin 9'u "TEST ALTYAPI HATASI" verip hicbir iddiayi
      # kosturmuyordu (sahte fetch edge uclarini tanimiyordu). Sahte fetch edge'e uyarlandi,
      # 14/14 yesil; artik CI'da BLOKLAYICI kosar.
      # OFFLINE: ag YOK (fetch stub), wrangler YOK, GERCEK SIPARIS YOK, dosya YAZMAZ. ~1 s.
      - name: Sepet paneli + konfigur odenebilirlik provasi kabul testi
        run: node shop/test/sepet-panel.js

      # EDGE_KATALOG FLIP HAZIRLIK KAPISI (tools/edge-flip-hazirlik.py) — bu adim onun OFFLINE
      # kabul testidir. Aracin SAF karar mantigini (bant/flip-mesafesi, adim degerlendirme,
      # genel GO/NO-GO, worker 403->BLOKLU(HocA), d1 kimlik-hatasi->BLOKLU(Okan), origin turetme,
      # bayrak ayiklama) sentetik girdilerle KIRMIZI-MUTASYON uslubunda kanitlar. Agsiz, stdlib:
      # araci yalnizca IMPORT eder (main() cagrilmaz -> import-aninda subprocess/HTTP/d1 I/O YOK,
      # tum canli I/O fonksiyon govdesinde ve __main__'de). Bloklayici: kapinin karar mantigi
      # bozulursa (or. sahte-GO / yanlis band / 12.000 esik kaymasi) bu test kirmizi yanar.
      # build.py'den ONCE kosar, ~40 ms.
      - name: Edge flip hazirlik kapisi kabul testi (saf karar mantigi)
        run: python3 tools/edge-flip-hazirlik-test.py

      # D1-SYNC HATA TANISI: gecici ag ve gercek kimlik hatalarinin retry/teshis ayrimini
      # sahte subprocess sonuclariyla kanitlar. Offline/mock; D1'e ve aga dokunmaz.
      - name: D1-sync hata tanisi kabul testi
        run: python3 tools/d1-sync-tani-test.py

      # FAZ3 GECIKME NOBETCISI (tools/faz3-gecikme.js) — YANLIS-POZITIF/NEGATIF kapisi.
      # (Bu blok ile alttaki YEDEK TAZELIK blogu BAGIMSIZ iki hunk'tir; merge cakismasinda
      # ikisi de KORUNUR — biri digerinin yerine gecmez.)
      # O betik eskiden uctan uca RTT'yi butceyle karsilastiriyordu: Fethiye→Cloudflare ag
      # gecikmesi tek basina 300 ms'i asabildigi icin SAGLIKLI sistemde KIRMIZI yaniyordu,
      # simetrigi de vardi (hizli agda yavas Worker YESIL). Karar artik yalniz worker-ici
      # sureye ("ms") gore verilir; RTT bilgi olarak raporlanir. Bu adim kusrun geri
      # gelmesini engeller: sahte bir uc kaldirip AG gecikmesi ile WORKER-ICI sureyi
      # BAGIMSIZ oynatir (tek eksenli fikstur RTT'ye bakan betigi de yesil yakar, yani
      # hicbir sey olcmez). 6 senaryo: yavas-ag/saglikli -> exit 0, yavas-worker -> exit 1,
      # hizli-ag/yavas-worker -> exit 1, "ms" alani yok -> exit 2 (OLCULEMEDI),
      # uc kapali -> exit 2, kismi hata -> exit 1 ("butce" diye raporlanmaz).
      # OFFLINE: yalniz 127.0.0.1; urunler.json/D1/R2/canli Worker OKUNMAZ. node gerekir
      # (setup-node yukarida bloklayici on-kosul; node yoksa FAIL-CLOSED exit 1). ~23 s.
      - name: Faz3 gecikme nobetcisi (RTT degil worker-ici sure ile karar)
        run: python3 tools/faz3-gecikme-test.py

      # YEDEK TAZELIK PANOSU (durum.py bolum 7): yedegin kendisi degil, YEDEGIN SESSIZCE
      # DURMASI oldurucu — pano bayatligi/atlanmis kosumu/asili kilidi GORUNUR kilan tek
      # kanaldir (pre-push yedek ciktisini /dev/null'a yutar). Testin iddiasi "pano yalan
      # soylemiyor mu": bayat/kismi/gelecek-tarihli/atlanmis/asili-kilit hallerinde "taze"
      # DEMEMELI, kapsanmis atlamada da bosuna uyarmamali (gurultulu pano = olu pano).
      # Fiksturler tempdir + sentetik damga uzerinde kosar; Drive/ag GEREKMEZ ve betik
      # DOSYA YAZMAZ. "Hermetik" DEMIYORUZ: kontrollerin bir kismi makinenin ORTAMINI
      # (asagidaki eksenler) sorgular, o yuzden kontrol sayisi makineden makineye
      # DEGISIR — sayiyi buraya YAZMA, betigin KENDI ozetinden oku.
      # Kontrol SAYISI ve sure betigin KENDI ciktisindadir — buraya SABIT SAYI YAZILMAZ.
      # Gerekce: yoruma gomulu sayi bir VERI CAPASIDIR, her yeni nobetciyle sessizce
      # bayatlar ve okuyani yaniltir — bu yorumun onceki surumlerinde tekrar tekrar
      # oldu (kontrol sayisi, sure, eksen sayisi). Bloklayici, continue-on-error YOK.
      #
      # ⚠️ SUREYI/RC'YI OLCERKEN: bu betik bolum 9'da KENDINI `ps`siz bir PATH ile
      # YENIDEN CAGIRIR (alt kosum, `--ps-yok-alt-kosum`). Alt kosumun ciktisi ve suresi
      # BU ADIMIN DEGILDIR — alt kosum bolum 9'u atlar, yani kapinin kirmizisini yakan
      # kontrolleri de atlar (bu yuzden ana kosum alt kosumdan HEP UZUN surer). Bu hat
      # iki ayri turda tam bu yuzden YANLIS olctu (bir kez rc, bir kez sure). Olcum
      # DAIMA yukaridaki `run:` satirinin BIREBIR komutuyla, bayraksiz yapilir.
      #
      # ORTAM BAGIMLILIKLARI: dis binary / kaynak kumesi yoklugu GORUNUR ⚪ OLCULEMEDI
      # verir ve cikis kodunu BOZMAZ; sessiz yesile de cevrilmez. EKSENLERIN SAYISINI
      # BURAYA YAZMA — betigin ozeti her ekseni AYRI satirda kendisi sayar ("PS/GIT/
      # KAYNAK/FIKSTUR EKSEN OLCULEMEDI") ve ilan edilmemis her ⚪'yi "EKSENSIZ
      # OLCULEMEDI" ile yakalar. Her ⚪ satiri hangi eksende oldugunu kendi basar.
      #   - `ps` (procps) — pid KIMLIK dogrulamasi onunla olculur.
      #   - `git` — ANA calisma agaci cozumu onunla yapilir (yoksa kok WORKTREE'ye duser).
      #   Ikisi de UC HALLI: PATH'te YOK -> ⚪, deploy BLOKLANMAZ · VAR ama BOZUK ->
      #   KIRMIZI, fail-closed (bozuk bagimlilik eksik bagimliliktan farklidir) ·
      #   VAR ve calisiyor -> kontroller NORMAL, bloklayici.
      #   - YEDEKLENECEK KAYNAK KUMESI (~/.claude/{projects/*/memory,skills} + repo
      #     kokundeki beklenen dosyalar) — K5 canli-imza olcumunun GERCEK ucu buna
      #     baglidir. CI fresh checkout'unda HOME BOS ve o dosyalar gitignore'lu
      #     (izlenen DEGIL) -> kaynak kumesi YOKTUR, o kontroller ⚪ olur.
      # Gerekce (hepsi icin): bloklayici bir kapinin dis bagimlilik/ortam yoklugunda
      # TUM SITE YAYININI durdurmasi bu depoda YASANMIS bir ariza sinifidir
      # ([[kapi-kapsam-eksen-secimi]]) — bu adimda tekrar tekrar yasandi: `ps`siz
      # makinede rc 1, CI taklidinde kaynak kumesi yoklugundan rc 1, `git`siz makinede
      # rc 1 + yakalanmamis FileNotFoundError.
      # EKSEN AYRIMI SART: "ps VARKEN ⚪ 0" nobetcisi TOPLAM ⚪'ya bakarsa alakasiz bir
      # eksenin ⚪'si onu kirmiziya cevirir (CI taklidinde olculdu).
      # 🔴 NOBETCIYI, KORUDUGU KOSULUN ICINE KOYMA: kimlik nobetleri ve gitsiz-pano
      # nobeti SENTETIK PATH fiksturuyle kosar (ozet "BAGIMSIZ NOBET" diye sayar),
      # yani makinede `ps`/`git` olsa da olmasa da AYNI olcumu yapar. Onceki surumde
      # nobetcinin kendisi `ps`e bagliydi ve `ps`siz makinede iki gercek mutant sessiz
      # YESIL geciyordu (olculdu).
      - name: Yedek tazelik panosu kabul testi (durum.py bolum 7 — sessiz-hata nobeti)
        run: python3 tools/durum-yedek-test.py

      # WA PREFILL KAPISI: urun sayfasindaki BAGLAM-KOR olmamasi gereken iki WhatsApp
      # linki (organik "Bizimle Iletisime Gecin" help-cta-btn + mühendislik malzeme notu)
      # prefill'inde urun ADI + canonical URL tasir; Turkce karakterler TEK KEZ dogru
      # percent-kodlanir (double-encode yok, numara = WHATSAPP sabiti, arama 4005 asla).
      # NIYET EKSENI de olculur: help-cta "aradigimi bulamadim" niyetini tasir ve
      # "bu urunu istiyorum" DEMEZ (yanlis niyet Ege'yi yanlis akisa sokar, baglamsizdan
      # beter); malzeme notu ise KENDI niyetini (malzeme/ozel uretim) korur. REF/atif
      # butonu (orderAlt) regresyon nobeti: ad+URL+"ilgileniyorum" bozulmamis olmali.
      # NUMARA NOBETI 4 DUZLEMDE: urun sayfasi + index.html + tools/sayfalar.py'nin
      # URETILEN cikti korpusu (168 icerik/yasal sayfa) + elle yazilmis statik yasal
      # sayfalar. Her belgede: tum WhatsApp URL bicimleri (wa.me/api./web.whatsapp.com/
      # whatsapp://), ters yon (tel:/JSON-LD telephone-contactPoint/pv-kodlu kunye
      # telefonu), JS telefon sabitleri (var WHATSAPP / TARGET_PHONE) ve GORUNUR metne
      # basilan +90 literalleri dogrulanir; ayristirilamayan numara fail-closed KIRMIZI.
      # NOT: "toplu link silme" sinifi (CTA'larin komple kaybi) BILEREK olculmuyor —
      # denenen kapinin yakalama katkisi 0, sahte-kirmizi bedeli devasadi (bkz. testin
      # kor nokta 9 maddesi). O ariza gorunur/gurultuludur; sessiz olan numara ihlalidir.
      # Test kendi kabul fiksturlerini de kosar: 11 kirmizi mutasyon + 14 "ILGISIZ rutin
      # duzenleme YESIL kalmali" fiksturu (kapinin kapsamini yanlis eksene kaymaktan korur;
      # ikincisi olmadan renk/etiket/tipografi gibi alakasiz duzenlemeler TUM deploy'u
      # durduruyordu — bagimsiz curutucu olcumu). Fikstur capasi kaybolursa KIRMIZI degil
      # "OLCULEMEDI" basar; hicbir kirmizi fikstur kosamazsa (olu nobetci) kirmizi yanar.
      # Offline, sentetik fikstur, urunler.json OKUNMAZ, dosya yazmaz; render_product ve
      # render_content_page'i dogrudan cagirir -> build.py'den ONCE kosar, ~1,6 s.
      - name: WhatsApp numara/prefill kabul testi (urun + ana sayfa + yasal sayfalar)
        run: python3 tools/test-wa-prefill-organik.py

      # METIN ESLEM KAPISI (sessiz teslimat hatasi, 29 Tem): parametrik ailelerde musteri
      # yazisi ("kasenin uzerinde ne yazsin", "cerceveye isim") derleyiciye ULASMIYORDU —
      # canli olcum: cerceve/cetvel/kase'de '' vs 'OKAN' vs 'ZZZZZZZZ' AYNI SHA-256'li STL
      # uretiyordu (kase her musteriye "PRUVO" yaziyordu). Bu adim `tip: "metin"` parametresi
      # olan HER aileyi (jenerator/urunler dizin taramasi; elle liste YOK) alir ve iki farkli
      # metnin derleyiciye giden -D bayrak kumesini FARKLI uretmesini sart kosar. Gizli-eslem
      # aileleri Pages CI'da (sir yok) ⚪ OLCULEMEDI sayilir ve raporlanir; TAM kapsam gizli
      # paketi ceken onizleme-imaj.yml'de --paket ile kosar. Offline, <1 s. Oz-nobetcileri
      # (govde inertlik) HER kosumda bloklayici isler.
      - name: Metin eslem kapisi (musteri yazisi derleyiciye ulasiyor mu)
        run: python3 tools/metin-eslem-test.py

      # METIN BEYAZ LISTE KAPISI (sessiz kusur, 29 Tem): sunucu derleyicisi
      # (onizleme/derleyici/server.py metin_temizle) beyaz liste DISI karakteri
      # (& / ( ) : ...) SESSIZCE DUSURUR; konfiguratorde uyari yalniz cerceve `yazi`
      # alanina (cerceveDurumu) bagliydi, dogrula()nin generic `metin` dalina DEGIL —
      # olculdu: kaseye "AHMET & OGULLARI", jetona "A/B (1)" HIC uyari cikmadan geciyor,
      # musteri istediginden FARKLI urun aliyordu. Kontrol dogrula() yoluna tasindi ->
      # ayni kapiyi Worker da (shop/src/parametrik.js KONF.dogrula) kullanir; sunucu
      # tavani/beyaz listesi GEVSEMEDI, sizdirdigi sinif kapandi. Bu adim `tip: "metin"`
      # parametresi olan HER aileyi jenerator/urunler DIZIN TARAMASIYLA bulur (elle liste
      # YOK) ve dort ekseni olcer: (A) kesif bos degil + taban degerler gecerli,
      # (B) 7 kirli vaka × her alan GORUNUR hata uretir, (C) 8 temiz vaka × her alan
      # gecerli kalir (yanlis-pozitif = 0 — bu eksen olmadan "her metni reddet" mutanti
      # yesil kalirdi), (D) Worker kirliyi "parametre-araligi" ile REDDEDER.
      # KIRMIZI-MUTASYON (olculdu): kontrol satiri silinir / no-op yapilir -> 24 iddia
      # kirmizi; tersine cevrilir -> 31 iddia kirmizi. OFFLINE: ag/wrangler/openscad YOK,
      # urunler.json OKUNMAZ, dosya yazmaz, <1 s. node gerekir (setup-node yukarida
      # bloklayici on-kosul).
      - name: Metin beyaz liste kapisi (musteri metni sessizce budanmiyor mu)
        run: node jenerator/test/metin-beyaz-liste.mjs

      # VITRIN KABUL KAPISI (jenerator/test/vitrin-kabul.js) — 30 Tem'e kadar CI'da HIC
      # kosmuyordu ve YERELDE DE kirmizi duruyordu (7 testten 6'si HIC calismiyordu).
      # NE KORUR (ana sayfanin kendisi, jenerator degil): gizli "Jeneratör" kategorisi nav'da
      # GORUNMEZ + 12 gorunur kategori tam · ?kategori=Jeneratör gorunumu yalniz sari urun
      # cizer · sari kart fiyati sema tabanFiyatTL'siyle BIREBIR (+ harita yokken fallback) ·
      # banner yalniz ana sayfada · ilk 4 kart sari · taban-fiyatlar.js semalarla birebir ·
      # edge kart sekli build.py kart_ozeti ile birebir · edge uc/parametre sozlesmesi ve
      # "ana sayfa AGA CIKMAZ" iddiasi. index.html'in GERCEK inline scripti node:vm'de kosar.
      # NEDEN SIMDI YESIL: index.html'de EDGE_KATALOG=true oldugu icin acilis ozet.json +
      # Worker /katalog|/ara isterken testin sahte fetch'i `ok`/`status` TASIMIYORDU ->
      # sayfa "HTTP undefined" basip test ALTYAPI HATASI veriyordu. Artik test bagimliligi
      # KENDI KURUYOR: ozet.json'u `build.py --sadece-ozet` uretir (sekil tek kaynak) ve
      # /katalog|/ara icin sunucusuz TASIMA taklidi kullanilir. Ag/sunucu/openscad YOK.
      # FAIL-CLOSED: bayrak/damga/artefakt dogrulanamazsa test PATLAR (mutasyonla kanitlandi) —
      # bayat ozet.json'la ya da kazara TAM BUILD ile sessizce yesil yanamaz.
      # Arama SEMANTIGI burada iddia EDILMEZ (o parite-test.js/parite-ege.js isi).
      # Node 20.20.2 ve 25.x'te 9/0 olculdu. build.py'nin yalniz erken-donus kollari cagrilir
      # (--sadece-ozet / --sadece-taban) -> 14k sayfa uretimi ve yasal sayfa damgasi TETIKLENMEZ.
      - name: "Vitrin kabul kapisi (gizli Jeneratör kategorisi + sari kart fiyati + banner + edge sozlesmesi)"
        run: node jenerator/test/vitrin-kabul.js

      # ONBELLEK SURUM KAPISI (metin onariminin IKINCI kanadi, 29 Tem): eslem duzelse bile
      # /olustur once R2 onbelleginden servis eder -> ONBELLEK_SURUM bump'lanmazsa onceden
      # onizlenmis her parametre seti YAZISIZ mesh'i (kase: herkese "PRUVO") servis etmeye
      # DEVAM eder. Bu adim GERCEK worker'i (onizleme/src/index.js) node'a yukleyip sahte R2
      # ile anahtari yakalar: surum bump'i anahtari degistiriyor mu + surum ZEHIRLI SURUM
      # TABANI'nin (bugun v7; v5 yazisiz mesh, v6 rollout penceresi zehirlenmesi) altina
      # dusmus mu + yalniz `yazi` degisince anahtar ayrisiyor mu. Taban SAYISAL: ileri
      # bump testi elle duzeltmeden yesil kalir, geri alma KIRMIZI. Node 20'de olculdu
      # (module.registerHooks gibi Node 22+ API'si YOK; JSON import'lari gomulur).
      # OFFLINE: ag yok, R2 yok, wrangler yok, repo dosyasi YAZILMAZ (gecici dizin). ~0,5 s.
      - name: Onizleme onbellek surum kapisi (bayat mesh servis edilmesin)
        run: node onizleme/test/onbellek-surum.mjs

      # ONIZLEME GORUNURLUK KAPISI (Okan canli sikayeti, 29 Tem — olcuye-ozel-cerceve):
      # (1) "renk secimi onizlemeyi degistirmiyor": sayfa scripti rengi YALNIZ aile
      # sabit tablosundan okuyordu, musteri secimi viewer'a HIC gitmiyordu. (2) "yazi
      # gorunmuyor": kabartma geometri mesh'te VARDI (canli: 1304 -> 2666 ucgen, 1,2 mm
      # kabartma) ama yazinin ust yuzu cerceve on yuzuyle AYNI normale sahip oldugundan
      # koyu renkte yalniz ~15/255 tonluk bir fark uretiyordu = gorunmuyordu.
      # Bu adim GERCEK kodu olcer: build.py'nin sayfaya BASTIGI ONIZLEME_JS metni sahte
      # DOM'da (canli sayfanin renk-BUTONU duzeni) kosar, altinda GERCEK jenerator/viewer.js
      # + WebGL cagrilarini kaydeden sahte baglam vardir -> GPU'ya giden uRenk uniform'u
      # olculur. Yazi ekseni CPU rasterlestiricisiyle piksel farki olcer (kamera + golgeleme
      # viewer'in KENDI fonksiyonlarindan; kopya matematik yok).
      # KIRMIZI-MUTASYON (olculdu, 5/5 yakalandi): kParlak 0 (eski isik) -> B2 kirmizi;
      # ONIZLEME_RENK_SECIMI bosaltilir -> A2/A3 kirmizi; sayfa scripti eski satira
      # dondurulur -> A4b kirmizi; renk dinleyicisi silinir -> A4c kirmizi; viewer kolu
      # renkAyarla dondurmez -> A4c kirmizi.
      # OFFLINE: ag YOK, openscad YOK, R2/wrangler YOK, urunler.json OKUNMAZ, dosya yazmaz.
      # Node 20'de olculdu (Node 22+ API'si kullanilmaz). ~1 s.
      - name: Onizleme gorunurluk kapisi (secilen renk + kabartma yazi ekranda mi)
        run: node onizleme/test/renk-yazi-gorunurluk.mjs

      # IKI GOVDE (2-RENK YAZI) SOZLESMESI — Okan canli sikayeti, 29 Tem:
      # /urun/olcuye-ozel-cerceve/ "Yazı rengi (2. renk)" seciyor ama uretim TEK GOVDE
      # donduruyordu (Output="frame") -> yazi cerceveyle AYNI filamandan basiliyordu.
      # (a) ESLEM/-D ekseni: iki parca ailesi (<aile>#govde / <aile>#yazi) ayni .scad'i
      #     ayni bayraklarla, YALNIZ `Output` farkiyla surer (hizalama yapisal garanti);
      #     taban aile BIREBIR AYNI kalir (geriye donuk uyum). Fail-closed uretim.
      # (b) WORKER/VIEWER/SAYFA ekseni: parcasiz onbellek anahtari BIT-AYNI (donmus capa),
      #     parcali anahtar ayri ad uzayinda, gecersiz parca 400, viewer iki govdeyi iki
      #     renkte ve KAYDIRMADAN cizer, sayfa 2-renk secilince IKI istek atar.
      # KIRMIZI-MUTASYON: kapilarin kendi --kendini-test turlarinda olculur
      # (5/5 + 1/1 yakalandi; ham cikti dal raporunda).
      # OFFLINE: ag YOK, openscad YOK, R2/wrangler YOK, urunler.json OKUNMAZ. ~2 s.
      # MESH ekseni (ucgen/bbox/hacim) openscad ister -> onizleme-imaj.yml
      # (onizleme/test/iki-govde-olcum.py); burada BILEREK kosmaz.
      # ⚠️ TIRNAK ZORUNLU: YAML plain scalar'da ": " (iki nokta + bosluk) AYRISTIRMA
      # HATASIDIR -> is HIC baslamaz (startup_failure) ve TUM EKIBIN yayini durur.
      # 29 Tem'de bu satir tirnaksiz gitti, deploy.yml 0 sn'de "workflow file issue"
      # verdi (hicbir is baslamadi; ci-kapsam-test.py metin arar, YAML AYRISTIRMAZ).
      - name: "Iki govde eslem kapisi (2-renk: -D farki yalniz Output)"
        run: python3 tools/iki-govde-kapisi.py
      - name: Iki govde eslem kapisi oz-nobetcisi
        run: python3 tools/iki-govde-kapisi.py --kendini-test
      - name: Iki govde kabul kapisi (worker parca ucu + viewer iki renk + sayfa)
        run: node onizleme/test/iki-govde-kabul.mjs
      - name: Iki govde kabul kapisi kirmizi-mutasyon turu
        run: node onizleme/test/iki-govde-kabul.mjs --kendini-test

      # PAKET TAZELIK KAPISI — OFFLINE kip. Bloklayici PAKET olcumu BILEREK burada DEGIL,
      # onizleme-imaj.yml'de kosar (bayat paket TUM SITE yayinini durdurmasin). Burada
      # kosan sey UC nobetci: (a) kapinin govdesi inert mi (5 sentetik fikstur),
      # (b) GERCEK cagri satiri onizleme-imaj.yml'de DURUYOR mu — ci-kapsam-test.py yalniz
      # deploy.yml'e baktigi icin o satirin silinmesini baska hicbir nobetci gormez
      # (olculdu: imaj is akisindaki adim silinince ci-kapsam RC=0, bu kapi RC=1),
      # (c) SURUMLU ANAHTAR: sabit 'guncel' takma adina yazma / sabit s3 nesne yolundan
      # cekme geri geldi mi. R2'de VAR OLAN anahtarin uzerine yazma bu bucket'ta
      # "Upload complete." + RC=0 dondugu halde nesneyi DEGISTIRMIYOR (olculdu 29 Tem,
      # 4 deneme + silme denemesi) -> takma ad bayat kalir, CI onarilmis main'e ragmen
      # ESKI eslemle imaj derler. Yukleyici ekseni METIN ARAMAZ: yuklenecek_anahtarlar()
      # fiilen cagrilir (fault-injection ile test edilir).
      # Bu kip yalnizca kendi fiksturlerini ve onizleme-imaj.yml METNINI okur; urunler.json /
      # index.html / sema dosyalari OKUNMAZ -> rutin degisiklikte yanlis-pozitif uretemez.
      - name: Paket tazelik kapisi oz-nobetcileri (cagri satiri + govde inertligi)
        run: python3 tools/paket-tazelik-kapisi.py

      # CI KAPSAM KAPISI: repodaki her IZLENEN kabul testi ya bu is akisinda kosulur ya da
      # tools/ci-kapsam-test.py IZIN_LISTESI'nde gerekceyle muaf tutulur. Yeni bir test sessizce
      # CI-disi kalirsa (olu nobetci CI'dan success alirsa) bu adim KIRMIZI yanar. Offline.
      - name: CI kapsam kapisi (her kabul testi kosuluyor mu / gerekceli muaf mi)
        run: python3 tools/ci-kapsam-test.py

      # KAPININ KENDI NOBETCILERI — ayri adim olmak ZORUNDA (olculdu 27 Tem):
      # ci-kapsam-test.py'nin kendi mutasyon nobetcileri (bulgu1_mutasyon_kontrol +
      # muaf_sayaci_kontrol) yukaridaki BAYRAKSIZ kosumda YALNIZ denetle(..., kontroller=True)
      # yolundan cagriliyor. Bu iki mutant sinifi orada SESSIZ kaliyordu:
      #   (1) denetle() icindeki nobetci CAGRILARI silinirse -> bayraksiz kosum exit 0,
      #       nobetcinin korudugu bug (muaf sayaci kapsamsizi sayar / yalniz-yorum mensiyonu
      #       'kosuluyor' sayilir) geri gelse bile CI YESIL.
      #   (2) denetle()'nin KIRMIZI CIKIS YOLU sakatlanirsa (return 1 -> return 0) ekrana
      #       "SONUC: KIRMIZI ❌" basilsa da adim exit 0 verir -> Actions BASARILI sayar.
      # --kendini-test nobetcileri DOGRUDAN cagirir ve exit kodunu kendi uretir -> her iki
      # sinif BLOKLAYICI olur. Offline, deploy.yml disinda girdi okumaz, <1 s.
      - name: CI kapsam kapisi oz-nobetcileri (bulgu1 + muaf sayaci, dogrudan)
        run: python3 tools/ci-kapsam-test.py --kendini-test

      # MARKA->MODEL PILOT KAPISI: marka_model_build jeneratorunu izole temp ROOT'a kosar ve
      # uretilen HTML'i spec kabul kriterleriyle olcer — collision (F-150 tek URL), >=3 esik,
      # SSR icerik + self-canonical + ItemList/CollectionPage/BreadcrumbList JSON-LD + sitemap
      # lastmod, huni wa.me prefill + attribution modulu, token sizinti, marka kurallari (authored
      # copy'de 3d/baski/filament/sehir/'her renk'/532 YOK), oksuz-yok (pilot markanin tum urunleri
      # linkli). build.py'nin urun/ ciktisina MUHTAC DEGIL (modulu dogrudan cagirir), ~1 s. Offline.
      - name: Marka->model pilot kabul testi (Ford + BMW)
        run: python3 tools/marka-model-test.py

      # YASAL SAYFA DRIFT KAPISI: build.py IZLENEN 4 elle yazilmis sayfayi (gizlilik /
      # hakkimizda / iletisim / sss) YERINDE yeniden yazar. Fault injection ile olculdu
      # (30 Tem): gizlilik/index.html bayatlatildiginda depodaki 6 kapinin 6'si YESIL
      # kaldi (sapmayi yakalayan kapi YOKTU) ve build.py kosunca sayfa kanonige geri
      # yazilip agac temizlendi -> elle/bayat icerik SESSIZCE ezildi. Bu kapi
      # "build.py'nin URETTIGI icerik == HEAD'deki icerik" iddiasini olcer; taban HEAD
      # oldugu icin adimin build'den once ya da sonra gelmesi hukmu DEGISTIRMEZ
      # (sira-bagimli disk karsilastirmasi fail-open olurdu). Kapi kendi kosumunda
      # sayfalari AYNEN geri koyar ve porcelain + sha256 esitligini kendi olcer.
      # Offline, stdlib, ~12 s (suresi build.py'nin kendisidir).
      - name: "Yasal sayfa drift kapisi (build.py uretimi == commit'li icerik)"
        run: python3 tools/yasal-sayfa-drift-kapisi.py

      # KAPININ KENDI NOBETCISI — ayri adim olmak ZORUNDA: yukaridaki kosum kapinin
      # KIRMIZI yolunu hic denemez (agac temizse daima yesil). Bu adim hermetik bir depo
      # kopyasinda 4 sayfayi tek tek bayatlatir (4/4 KIRMIZI bekler), kapsam daraltmayi
      # (TABAN slug fail-closed) ve blok-DISI mesru duzenlemeyi (yanlis-pozitif yok)
      # sinar, sonra kapinin karsilastirma/hukum/build-cagrisi/cikis-kodu satirlarini
      # KOPYA uzerinde mutasyona ugratip her mutantin sapmayi KACIRDIGINI dogrular.
      # Ana checkout'a DOKUNMAZ (git archive kopyasi + kirpik katalog), ~3 s.
      - name: "Yasal sayfa drift kapisi ic nobetcisi (bayatlatma + kirmizi-mutasyon)"
        run: python3 tools/yasal-sayfa-drift-kapisi.py --kendini-test

      # CANLI SAGLIK NOBETCISI — YALNIZ KENDINI TEST (AGSIZ). Nobetcinin kendisi CANLIYA
      # bakar (canli katalog sayisi / urun sayfasi 200 / CI hali / kart kanali / D1+gorsel)
      # ve BILEREK CI'da KOSMAZ: ag ve canli durum oynaktir, tek gecici DNS hatasi tum
      # ekibin yayinini durdururdu ([[kapi-kapsam-eksen-secimi]]). CI'da kosan sey yalniz
      # KARAR MANTIGININ fiksturlu kabulu: bugunku uc gercek vaka (18 urun sayfasi CF
      # onbellekli 404 / CI kirmizi -> 23 urun canlia cikmadi / worker bayat -> kart kanali
      # kapali) 3/3 YAKALANMALI; yayin-penceresi ikizi (AYNI sayilar, tek fark CI'nin hali)
      # BEKLENIYOR ile SAPMA'yi AYIRT ETMELI; ag koptugunda SESSIZ YESIL verilmemeli; ve
      # 8 KIRMIZI-MUTASYON (6 kontrol no-op + `age` esigi + cf HIT listesi) mutantin
      # sapmayi KACIRDIGINI kanitlamali. Offline, stdlib, git/ag GEREKTIRMEZ, <1 s.
      - name: "Canli saglik nobetcisi — kendini test (3 vaka + yanlis-pozitif + mutasyon)"
        run: python3 tools/canli-saglik-kapisi.py --kendini-test

      - name: Statik sayfalari uret
        run: python3 tools/build.py

      # JSON-LD BRAND KAPISI: uretilen TUM urun sayfalarinin JSON-LD bloklari taranir —
      # JSON gecerli + hicbir objede yinelenen anahtar yok + Product.brand TEK deger
      # (cok elemanli Brand dizisi GSC Merchant listings'te "brand alani yineleniyor"
      # KRITIK hatasi uretir; canlida dogrulandi 22 Tem, 3884 sayfa etkilenmisti).
      # build.py'den SONRA kosmak ZORUNDA (urun/ ciktisina muhtac). Offline, stdlib.
      - name: JSON-LD brand kabul testi (uretilen sayfalar)
        run: python3 tools/test-jsonld-brand.py

      # JSON-LD OFFERS KAPISI: uretilen TUM urun sayfalarinda Product.offers varsa
      # icindeki her Offer'da price/lowPrice SAYISAL + priceCurrency ZORUNLU; yinelenen
      # anahtar yok. Fiyatsiz Offer GSC Merchant listings'te «"price" alani eksik»
      # KRITIK hatasi uretir (canlida dogrulandi 22 Tem, 21 parametrik/sari sayfa
      # etkilenmisti — taban fiyat semadan basilir, bulunamazsa offers HIC basilmaz).
      # build.py'den SONRA kosmak ZORUNDA (urun/ ciktisina muhtac). Offline, stdlib.
      - name: JSON-LD offers kabul testi (uretilen sayfalar)
        run: python3 tools/test-jsonld-offers.py

      # JSON-LD SKU KAPISI: uretilen TUM urun sayfalarinda Product.sku 50 karakter
      # sinirini asmasin. Google Merchant "sku" 50 karakter kisitlidir; feed g:id/g:mpn
      # bunu feed_id(pid) ile uyguluyordu ama JSON-LD sku HAM pid basiyordu -> uzun
      # urun-id'lerinde «sku gecersiz uzunluk» KRITIK hatasi (GSC WNC-10030322, 24 Tem).
      # Onarim: sku = feed_id(pid) (feed g:id/g:mpn ile TEK KAYNAK; product_url/link TAM
      # pid ile kalir). Test: her sayfa sku<=50 + sku==feed_id(pid) + kisa-id churn yok +
      # merchant-feed.xml g:mpn capraz-kontrol + katalogdan bagimsiz sentetik uzun-id
      # mutasyon nobeti. build.py'den SONRA kosmak ZORUNDA (urun/ + merchant-feed.xml'e
      # muhtac). Offline, stdlib (build'i modul olarak import eder), yazma yok.
      - name: JSON-LD sku kabul testi (uretilen sayfalar + feed capraz-kontrol)
        run: python3 tools/test-jsonld-sku.py

      # SADECE sitenin ihtiyac duydugu dosyalar yayina girer (beyaz liste).
      # Eskiden path: . tum repoyu yayinliyordu -> tools/*.py canli siteden
      # indirilebiliyordu (ic araclar + ticari mahremiyet; denetim 2026-07-15).
      - name: Yayin klasorunu topla (beyaz liste)
        run: |
          mkdir _site
          # Ana sayfa: build.py'nin urettigi YAYIN kopyasi (script src'leri ?v=<hash>
          # ile onbellek-kirici surumlu). KAYNAK index.html yayina girmez.
          cp index.built.html _site/index.html
          # ozet.json = FAZ 3 ilk-boyama dosyasi (build.py render_ozet uretir). Bayrak
          # (index.html EDGE_KATALOG) KAPALIYKEN site onu cekmez; yine de yayina girer ki
          # bayrak acildigi an dosya CDN'de hazir olsun (eklenmeseydi bayrak acilinca
          # ana sayfa 404 alip bos kalirdi).
          # konfigur.js = dekor konfiguratoru modulu (urunler.json "konfigur" alanli urun
          # sayfalari yukler; bugun urun yok, dosya yayinda hazir bekler — taban-fiyatlar deseni).
          cp secenekler.js konfigur.js urunler.json ozet.json CNAME ege-bilgi.md robots.txt sitemap.xml merchant-feed.xml filament-veri.js taban-fiyatlar.js .nojekyll _site/
          cp -r urun _site/
          # Icerik/yasal sayfa dizinleri: build.py'nin urettigi _yayin-icerik-dizinleri.txt'ten
          # (TEK KAYNAK sayfalar.py SITEMAP_SLUGS) kopyalanir -> yeni CONTENT_PAGES otomatik
          # yayina girer, elle beyaz-liste tutulmaz (eskiden buraya eklenmeyen sayfa sessizce 404'tu).
          if [ ! -s _yayin-icerik-dizinleri.txt ]; then echo "HATA: _yayin-icerik-dizinleri.txt bos/yok (build.py kosmadi mi?)"; exit 1; fi
          while IFS= read -r slug; do
            if [ -z "$slug" ]; then continue; fi
            if [ ! -d "$slug" ]; then echo "HATA: icerik dizini yok: $slug"; exit 1; fi
            cp -r "$slug" "_site/$slug"
          done < _yayin-icerik-dizinleri.txt
          # Parametrik konfigurator varliklari — SADECE public dosyalar (test/ girmez):
          # hacim.js tek kaynak (kabul testi #4), semalar Worker'in ileride sunucu-tarafi
          # yeniden hesabi icin de ayni adresten okunur.
          mkdir _site/jenerator
          cp jenerator/hacim.js jenerator/konfigurator.js jenerator/viewer.js _site/jenerator/
          cp -r jenerator/urunler _site/jenerator/urunler
      - name: Pages artefaktini yukle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Katalogu D1'e senkronla (Ege'nin aramasi + ileride site aramasi buradan).
      # DIFF-UPSERT: sadece degisen/yeni urunler yazilir (D1 gunluk 100.000 yazma siniri;
      # olculdu: urun basina 5 satir -> tam rebuild 6.086 urunde 30.432 yazma, 50k'da 250.000
      # = limitin 2,5 kati. Degismeyen urune dokunulmaz, tipik push birkac yuz yazma eder).
      # continue-on-error: D1 senkronu SITE YAYININI BLOKLAMAZ — site urunler.json'dan calisir,
      # D1 sadece Ege'nin aramasini besler. Senkron kacarsa bir sonraki push'ta kendini toparlar.
      - name: Katalogu D1'e senkronla
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dbbe2a8620c3c3a57c586b8a98142fb9
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret yok — D1 senkronu atlandi."
            exit 0
          fi
          python3 tools/d1-sync.py

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e yayinla
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Cloudflare cache temizle
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret yok — cache purge atlandi (Cloudflare edge TTL ile ~5 dk icinde yenilenir)."
            exit 0
          fi
          sleep 10   # Pages origin'in yeni icerigi sunmasi icin kisa bekleme
          echo "Cloudflare cache temizleniyor (purge_everything)..."
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/d3a78b8c8ce2a25c127bf02e728ac7b1/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
