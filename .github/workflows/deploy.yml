name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 🔴 cancel-in-progress: FALSE — BILEREK. Eskiden `true` idi ve OLCULEN sonucu su oldu:
# yeni eklenen urunun /urun/<id>/ sayfasi canlida 404 kaliyordu (Okan'in tekrarlayan
# sikayeti; ornek 30 Tem 22:25 `yan-birakmali-kayis-tokasi`).
# MEKANIZMA (olculdu 30 Tem, son 120 kosum / ~28 s): basarili kosum ORTANCA 5,3 dk surer;
# push araligi ortanca 9,2 dk AMA parti ekleme sirasinda 3-5 dk'ya duser. Kosum bitmeden
# yeni push gelince `cancel-in-progress: true` KOSUMU OLDURUR -> o push'un icerigi HIC
# yayinlanmaz. Ard arda gelen push'larda bu ACLIGA (starvation) donusur:
#   * 120 kosumun 25'i (%21) IPTAL; iptal edilenlerin 6'si URUN EKLEME commit'i.
#   * en uzun zincir 7 ARDISIK IPTAL (18:24:05 -> 18:30:45) = o pencerede HIC yayin yok.
#   * iki BASARILI yayin arasindaki en uzun bosluk 37,7 dk -> o bosluga dusen her yeni
#     urun 37,7 dk boyunca canlida 404; katalogda VAR, karti GORUNUYOR, sayfasi YOK.
# `false` ile: calisan kosum HER ZAMAN bitip yayinlar. GitHub ayni grupta EN FAZLA 1
# BEKLEYEN kosum tutar (yeni bekleyen gelince ONCEKI BEKLEYEN iptal edilir) -> KUYRUK
# SISMEZ: tavan 1 calisan + 1 bekleyen. Yayin gecikmesi boylece SINIRLI olur (en kotu
# ~2 x 5,3 = ~11 dk) ve SINIRSIZ acliktan cikar.
# EN GUNCEL MAIN GARANTISI: grup serilestirdigi icin kosumlar SIRAYLA biter; zincirin
# SONUNCUSU daima o an main'in TEPESIDIR (main dogrusaldir, bekleyen kosum en yeni SHA'ya
# tazelenir) -> son yayin daima en guncel main'dir.
# BEDEL (durust beyan): iptal edilirken bosa giden kosumlar artik tamamlanir; kabaca
# gunde ~25 kosum x ~5 dk = ~2 saat ek runner suresi. Yayin butunlugu bu bedele deger.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 🔴 fetch-depth: 0 ZORUNLU — tools/diriltme-kapisi.py "gecmiste SILINMIS urun id'si"
      # kumesini `git log -p --first-parent -- urunler.json` ile TURETIR (elle liste
      # TUTULMAZ; olculdu 30 Tem: 801 commit, ~68 MB diff, 4,2 s, 990 silinmis id).
      # actions/checkout VARSAYILANI `fetch-depth: 1` (SIG/shallow) ve o halde gecmis YOKTUR.
      # Bu satir dusurulurse kapi SESSIZCE yesile donmez: SIG depoyu tanir ve
      # OLCULEMEDI (rc 2) ile YAYINI DURDURUR (fail-closed).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pyyaml: is akisi BICIM kapisi (tools/is-akisi-kapisi.py) GERCEK bir YAML
      # ayristiricisi ister. Ayristirici YOKSA o kapi YESIL SAYMAZ (exit 2 = OLCULEMEDI)
      # -> bu satirdan pyyaml dusurulurse yayin durur, sessizce korumasiz KALMAZ.
      - name: Python bagimliliklari (boto3 - R2 testleri icin; pyyaml - is akisi kapisi)
        run: pip install boto3 pyyaml
      # Node: piksel<->katalog parite testinin JS-uc nobeti (index.html pruvoFeedId + olcum.js
      # feedId/metaGovdesi/ga4Govdesi) node ile kosar. FAIL-CLOSED: node yoksa test CI'da exit 1
      # verir (yalanci-yesil olamaz), o yuzden setup-node BLOKLAYICI bir on-kosuldur.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # GIZLI KAYNAK KASASI IZOLASYONU — Worker kaynagi ve tum wrangler
      # yapilandirmalarinda kasa adi/binding'i gecerse fail-closed yayini durdurur.
      # Kasa yalniz yerel yazicidan erisilir; tarayiciya acilan Worker yolu YOKTUR.
      - name: "Kaynak kasasi Worker/binding izolasyon kapisi"
        run: python3 tools/kasa-izolasyon-kapisi.py

      # BOS/ANI-DUSUS + 20 tarihli surum: uc davranis ve iki oldurucu mutant.
      # Mutant ayaklarinin ikisi de KIRMIZI yanmadan test YESIL sayilmaz.
      - name: "Yedek koruma davranisi ve mutasyon kabulu"
        run: python3 tools/yedek-koruma-test.py

      # URUNLER-GUARD PROVENANS + FAIL-LOUD (4 Agu 2026 olayi): bir muhendis
      # worktree'sinde `origin/main` dala merge edilirken guard, merge'in GETIRDIGI
      # guncel katalogu dalin BAYAT haline SESSIZCE geri sardi (5 ekleme / 11 silme;
      # bir uründen `lisans` ATFI + gorsel dustu, aciklama 461 -> 378 karaktere
      # bayatladi). Cikis kodu 0, stdout/stderr BOS — HICBIR KAPI CALMADI; olay
      # yalnizca isci kendi raporunda itiraf ettigi icin gorüldü. Atfin sessizce
      # dusmesi ayrica HUKUKI risktir (CC BY sinifi atif KALMAK ZORUNDA).
      #
      # 🔴 NEDEN SERIT A (`build`), SERIT B DEGIL: bu kapinin korudugu sey urun
      # VERISININ butunlugudur ve kendisi FAIL-LOUD bir korumadir. `serit-b` job'u
      # `deploy.needs` listesinde YOKTUR -> oradaki kirmizi yayini DURDURMAZ; fail-loud
      # bir korumanin kabul testini bloklamayan seride koymak korumayi KAGIT USTUNDE
      # birakirdi (tam da bu kapinin kapattigi sinif). Bagimliligi yok, ~7 sn surer,
      # kendi gecici git depolarini kurar; build.py'den ONCE kosar ki bozuk bir koruma
      # ile sayfa uretilmesin.
      - name: "urunler-guard provenans + fail-loud kabulu"
        run: python3 tools/urunler-guard-provenans-test.py

      # 🔴 SERIT A (BLOKLAYICI) — bu adim 2b19c28e'de nobet.yml serit-b'ye dusmustu
      # (bloklamayan) ve is-akisi-kapisi beyansiz diye KIRMIZI yakti; geri SERIT A'ya.
      # 13 Agu 2026 DAIRESEL KILIT: `diff_plan` mid-array yeni id icin tam sayi bosluk
      # bulamayip `--seq-normalize` isterken, `seq_normalize` de "D1 id kumesi == katalog"
      # on-kosuluyla duruyordu -> INSERT normalize'i, normalize INSERT'i bekledi. 136 urun
      # D1'e HIC girmedi: site gosteriyordu, Ege (D1'den okur) ONEREMIYORDU = SESSIZ satis
      # kaybi ve hicbir eksen bunu KENDILIGINDEN acmiyordu. On-kosul FAZLA>0 eksenine
      # cekildi (gevseme DEGIL: FAZLA'da hala fail-loud). Bu adim hem yeni ekseni hem
      # DEGISMEMESI gerekenleri (kesirli seq yasagi, geri alma kolu) cakar.
      # Ikinci satir mutasyon bataryasidir: dort oldurucu mutant kanonik dosyanin GECICI
      # kopyasina uygulanir (kaynak DEGISMEZ, kopya finally ile silinir); biri hayatta
      # kalirsa kapi KIRMIZI yanar -> "kabul testi var" iddiasi olcume baglanir.
      # K49: ayni origin/main ucundaki iki tam-katalog yazicisi bayatlik kapisindan
      # birlikte gecebildigi icin yazici yolu ortak non-blocking flock ile tekillestirildi.
      # Eşzamanlilik testi gercek iki surecle ikinci yazicinin fail-closed durdugunu,
      # birinci bitince kilidin yeniden alinabildigini ve salt-okuma kiplerinin kilitsiz
      # kaldigini olcer. Offline, stdlib, agsiz/wrangler'siz (~2 s).
      # K71: flock makineler-arasi degildir. Ikinci test iki farkli yerel inode'u
      # (iki makine) ortak SQLite-D1 fiksturune baglar; D1 kosullu lease'inin ikinci
      # yaziciyi reddettigini, normal cikista birakildigini, crash lease'inin sona
      # erdigini ve main/finally kablosunun canli kaldigini olcer.
      - name: D1 seq ve tam-katalog yazici kilidi kabul testleri
        run: |
          python3 tools/d1-seq-kilit-test.py
          python3 tools/d1-seq-kilit-test.py --mutasyon
          python3 tools/d1-yazici-kilit-test.py
          python3 tools/d1-dagitik-kilit-test.py

      # SITEMAP DAMGA ONBELLEGI — <lastmod> tarihlerinin HIZLANDIRICISI, KAYNAGI DEGIL.
      # Tarihler git gecmisinden turer (tools/sitemap_damga.py); bu dosya yalnizca ayni
      # yurumeyi her kosumda tekrarlamamak icindir. ONBELLEK DUSERSE HICBIR TARIH
      # YANLIS OLMAZ: build soguk baslar (tavansiz yurume + 240 sn sure butcesi) ve
      # tarihleri yeniden turetir; butce dolarsa cozulemeyen URL lastmod'suz cikar.
      # Bu yuzden `continue-on-error` GEREKMEZ ve adim yayini BLOKLAMAZ.
      # IZLENEN dosya OLARAK TUTULAMAZ (olculdu 11 Agu 2026): 25 bin satirlik defteri
      # tasiyan commit pre-push sizinti nobetcisinde 296.511 aday uretip tavani (150.000)
      # asiyor ve her itmeyi durduruyordu.
      - name: "Sitemap damga onbellegi (lastmod hizlandiricisi — dogruluk buna bagli DEGIL)"
        uses: actions/cache@v4
        with:
          path: sitemap-damgalari.json
          key: sitemap-damga-${{ github.sha }}
          restore-keys: |
            sitemap-damga-

      - name: Statik sayfalari uret
        run: python3 tools/build.py

      # URETICI BUTUNLUK KAPISI (ATOMIK YAYIN — EKSEN 2, 31 Tem): yayinlanan
      # urunler.json'daki HER benzersiz id icin urun/<id>/index.html VAR mi? Ters yon
      # (oksuz sayfa), sitemap.xml + merchant-feed.xml'deki her urun URL'inin dosyasi ve
      # id'lerin URL-guvenligi de olculur. NEDEN: site tarafinda JSON ile sayfalar AYNI
      # `_site` artefaktinda gider (zaman penceresi YOK), geriye tek ayrisma yolu URETIM
      # kalir — ve bugune dek hicbir kapi "JSON'da var, sayfasi yok" halini olcmuyordu.
      # build.py'den SONRA kosmak ZORUNDA (urun/ ciktisina muhtac); urun/ yoksa OLCULEMEDI
      # ile KIRMIZI yanar, sessiz YESIL imkansiz. continue-on-error YOK (fail-closed).
      # Offline, stdlib, yazma yok. Gercek agacta olculdu (15.479/15.479 YESIL) + 4 mutant
      # (sayfa silindi / sayfa 0 bayt / sitemap'te sayfasiz URL / oksuz sayfa) 4/4 KIRMIZI.
      - name: "Uretici butunluk kapisi (yayinlanan her id'nin sayfasi var mi)"
        run: python3 tools/uretim-butunluk-kapisi.py

      # YAYIN KOPYASI PARITE KAPISI: soyma PARAYI degistirdi mi. Kaynak JS ile _yayin/
      # (soyulmus) JS ayri ayri yuklenip TAM KUME fiyat karsilastirmasi yapilir
      # (23 sema x 25 olcu x 4 filament x 4 renk = 9200 kombinasyon, orneklem YOK) +
      # uretilen TUM sayfalarin `?v=` referanslari YAYINLANAN bayta baglaniyor mu.
      # build.py'den SONRA kosmak ZORUNDA (_yayin/ + urun/ ciktisina muhtac; yoksa
      # OLCULEMEDI ile exit 3 — sessiz YESIL imkansiz). Offline, ~60 s.
      - name: Yayin kopyasi fiyat paritesi + `?v=` surum hatti (tam kume)
        run: node jenerator/test/yayin-fiyat-parite.mjs

      # JSON-LD BRAND KAPISI: uretilen TUM urun sayfalarinin JSON-LD bloklari taranir —
      # JSON gecerli + hicbir objede yinelenen anahtar yok + Product.brand TEK deger
      # (cok elemanli Brand dizisi GSC Merchant listings'te "brand alani yineleniyor"
      # KRITIK hatasi uretir; canlida dogrulandi 22 Tem, 3884 sayfa etkilenmisti).
      # build.py'den SONRA kosmak ZORUNDA (urun/ ciktisina muhtac). Offline, stdlib.
      - name: JSON-LD brand kabul testi (uretilen sayfalar)
        run: python3 tools/test-jsonld-brand.py

      # JSON-LD OFFERS KAPISI: uretilen TUM urun sayfalarinda Product.offers varsa
      # icindeki her Offer'da price/lowPrice SAYISAL + priceCurrency ZORUNLU; yinelenen
      # anahtar yok. Fiyatsiz Offer GSC Merchant listings'te «"price" alani eksik»
      # KRITIK hatasi uretir (canlida dogrulandi 22 Tem, 21 parametrik/sari sayfa
      # etkilenmisti — taban fiyat semadan basilir, bulunamazsa offers HIC basilmaz).
      # build.py'den SONRA kosmak ZORUNDA (urun/ ciktisina muhtac). Offline, stdlib.
      - name: JSON-LD offers kabul testi (uretilen sayfalar)
        run: python3 tools/test-jsonld-offers.py

      # JSON-LD SKU KAPISI: uretilen TUM urun sayfalarinda Product.sku 50 karakter
      # sinirini asmasin. Google Merchant "sku" 50 karakter kisitlidir; feed g:id/g:mpn
      # bunu feed_id(pid) ile uyguluyordu ama JSON-LD sku HAM pid basiyordu -> uzun
      # urun-id'lerinde «sku gecersiz uzunluk» KRITIK hatasi (GSC WNC-10030322, 24 Tem).
      # Onarim: sku = feed_id(pid) (feed g:id/g:mpn ile TEK KAYNAK; product_url/link TAM
      # pid ile kalir). Test: her sayfa sku<=50 + sku==feed_id(pid) + kisa-id churn yok +
      # merchant-feed.xml g:mpn capraz-kontrol + katalogdan bagimsiz sentetik uzun-id
      # mutasyon nobeti. build.py'den SONRA kosmak ZORUNDA (urun/ + merchant-feed.xml'e
      # muhtac). Offline, stdlib (build'i modul olarak import eder), yazma yok.
      - name: JSON-LD sku kabul testi (uretilen sayfalar + feed capraz-kontrol)
        run: python3 tools/test-jsonld-sku.py

      # KAPALI AILE FIYAT BEYANI KAPISI (para/sessiz hata, 4 Agu): hacmi DOGRULANMAMIS
      # ailede secenekler.js parametrikFiyatKurus null dondurur ve Worker sepeti 400
      # `hacim-dogrulanmamis` ile reddeder — urun SATILAMAZ. Buna ragmen sayfa JS
      # oncesi HTML'de "200,00 TL'den baslayan" ve JSON-LD'de price + InStock beyan
      # ediyordu (5 aile: cetvel/kase/petek/rulman/vida). Kapi URETILEN sayfalari
      # olcer: KAPALI ailede sayisal TL + JSON-LD price + InStock YOK, aciklayici
      # metin VAR; ACIK ailede fiyat ve JSON-LD price AYNEN VAR (pozitif nobetci —
      # kapi asiri hevesli olamaz). Kume secenekler.js'ten TURETILIR (sayi gomulu
      # degil) ve build.py'nin metin okuyucusu node kosumuyla KARSILASTIRILIR
      # (ikiz-tanim ayrismasi kirmizi yakar; node yoksa OLCULEMEDI = kirmizi).
      # IKINCI YUZEY (4 Agu): ayni kusur ANA SAYFA KARTINDA da vardi — sayfa yuzeyi
      # kapatildiktan sonra kart hala "130,00 TL'den baslayan" gosteriyordu (canlida
      # olculdu). Kapi artik kart eksenini de olcer: node, uretilmis taban-fiyatlar.js +
      # secenekler.js'i yukleyip index.html'deki `kartFiyatMetni` fonksiyonunun KENDI
      # kaynagini kosturur; KAPALI ailede kartta sayisal TL YOK + sayfayla AYNI cumle VAR,
      # ACIK ailede tutar AYNEN VAR.
      # UCUNCU YUZEY (4 Agu): CAP CAPALI FIYAT — `rulman` fiyati dis capla dogru
      # orantili (10 TL/mm -> 60/80/100 mm = 600/800/1000 TL), diger ayarlar capanin
      # etrafinda hacim oraninca module eder. Fiyat fonksiyonu TUM ailelerce
      # PAYLASILDIGI icin kapi H bolumu hem capa noktalarini (birebir kurus), hem
      # egrinin kesin artan oldugunu, hem modulasyonun canliligini (flans/eleman
      # bedava DEGIL), hem de capasiz 18 ailenin kurusunun + 3x tavaninin
      # DEGISMEDIGINI ayri ayri olcer.
      # build.py'den SONRA kosmak ZORUNDA (urun/ + taban-fiyatlar.js ciktisina muhtac).
      # Offline, ~10 s. Mutasyon surucusu repoda (CI'da kosmaz — her mutant tam build ister):
      #   python3 tools/kapali-aile-fiyat-kapisi.py --mutasyon   (11 mutant: 8 kirmizi, 3 kontrol)
      - name: Kapali aile fiyat beyani kapisi (uretilen sayfalar + ana sayfa karti)
        run: python3 tools/kapali-aile-fiyat-kapisi.py

      # YAYIN IC-DIL KAPISI: tarayiciya INEN kod metninde (HTML yorumu + <style> icindeki
      # CSS yorumu + JS yorumlari) ic gelistirici dili aramaz. Olculdu 31 Tem: katalog
      # metninde yasakladigimiz uretim-sureci dili ('filament', '.scad'/'OpenSCAD', 'STL',
      # 'brim') sitenin KENDI yorumlarinda 209 TEKIL yerde duruyordu ve YAYINLANIYORDU;
      # ustune IC DOSYA YOLU (tools/*.py, shop/src/*.js — 2026-07-15 denetiminde tam da bu
      # envanter yayindan cikarilmisti) ve isletme sahibinin adi TICARI KARARLARLA birlikte
      # ("KARGO (<ad>, 16 Tem — KESIN)"). Hicbir kapi bakmiyordu. Sozluk denetim-kapisi.py
      # _IFSA_SERT_RE'den IMPORT edilir (ikinci kopya YOK). build.py'den SONRA kosmak
      # ZORUNDA (urun/ + index.built.html'e muhtac; urun/ bos ise OLCULEMEDI ile kirmizi
      # yanar, sessiz YESIL imkansiz). Offline, stdlib, ~10 s.
      - name: Yayin ic-dil kapisi (uretilen ciktinin yorum yuzeyi)
        run: python3 tools/yayin-ic-dil-kapisi.py


      # SADECE sitenin ihtiyac duydugu dosyalar yayina girer (beyaz liste).
      # Eskiden path: . tum repoyu yayinliyordu -> tools/*.py canli siteden
      # indirilebiliyordu (ic araclar + ticari mahremiyet; denetim 2026-07-15).
      - name: Yayin klasorunu topla (beyaz liste)
        run: |
          mkdir _site
          # Ana sayfa: build.py'nin urettigi YAYIN kopyasi (script src'leri ?v=<hash>
          # ile onbellek-kirici surumlu). KAYNAK index.html yayina girmez.
          cp index.built.html _site/index.html
          # ozet.json = FAZ 3 ilk-boyama dosyasi (build.py render_ozet uretir). Bayrak
          # (index.html EDGE_KATALOG) KAPALIYKEN site onu cekmez; yine de yayina girer ki
          # bayrak acildigi an dosya CDN'de hazir olsun (eklenmeseydi bayrak acilinca
          # ana sayfa 404 alip bos kalirdi).
          # konfigur.js = dekor konfiguratoru modulu (urunler.json "konfigur" alanli urun
          # sayfalari yukler; bugun urun yok, dosya yayinda hazir bekler — taban-fiyatlar deseni).
          # JS varliklari _yayin/'dan gelir: build.py onlarin YORUMU SOYULMUS yayin
          # kopyasini oraya yazar (kaynak dosyalar depoda tam dokumantasyonla KALIR,
          # tarayiciya inmez). _yayin/ yoksa/eksikse `cp` HATA verir -> yayin durur
          # (fail-closed; sessizce yorumlu kaynak yayinlanamaz).
          cp _yayin/secenekler.js _yayin/konfigur.js _yayin/filament-veri.js _yayin/taban-fiyatlar.js _site/
          cp urunler.json ozet.json CNAME ege-bilgi.md robots.txt sitemap.xml merchant-feed.xml .nojekyll _site/
          cp -r urun _site/
          # SAYFA VARLIKLARI (/varlik/*.css,*.js): build.py'nin urettigi icerik-adresli
          # same-origin dosyalar. Sayfalar bunlara REFERANS verir (gomulu degil) -> dizin
          # eksik/bos gelirse tum sayfalar CIPLAK yayinlanirdi; fail-closed kontrol edilir.
          # Yorumlari uretim aninda soyulmustur (build.varlik_adres), bu yuzden _yayin/ yok.
          if [ ! -d varlik ] || [ -z "$(ls -A varlik)" ]; then echo "HATA: varlik/ yok veya bos (build.py kosmadi mi?) -> sayfalar ciplak kalir"; exit 1; fi
          cp -r varlik _site/varlik
          # Icerik/yasal sayfa dizinleri: build.py'nin urettigi _yayin-icerik-dizinleri.txt'ten
          # (TEK KAYNAK sayfalar.py SITEMAP_SLUGS) kopyalanir -> yeni CONTENT_PAGES otomatik
          # yayina girer, elle beyaz-liste tutulmaz (eskiden buraya eklenmeyen sayfa sessizce 404'tu).
          if [ ! -s _yayin-icerik-dizinleri.txt ]; then echo "HATA: _yayin-icerik-dizinleri.txt bos/yok (build.py kosmadi mi?)"; exit 1; fi
          while IFS= read -r slug; do
            if [ -z "$slug" ]; then continue; fi
            if [ ! -d "$slug" ]; then echo "HATA: icerik dizini yok: $slug"; exit 1; fi
            cp -r "$slug" "_site/$slug"
          done < _yayin-icerik-dizinleri.txt
          # Parametrik konfigurator varliklari — SADECE public dosyalar (test/ girmez):
          # hacim.js tek kaynak (kabul testi #4), semalar Worker'in ileride sunucu-tarafi
          # yeniden hesabi icin de ayni adresten okunur.
          mkdir _site/jenerator
          # ... ayni sekilde yorumu soyulmus kopyalar (_yayin/jenerator/).
          cp _yayin/jenerator/hacim.js _yayin/jenerator/konfigurator.js _yayin/jenerator/viewer.js _site/jenerator/
          cp -r jenerator/urunler _site/jenerator/urunler

      # ══════════════════════════════════════════════════════════════════════════
      # YAYIN OLCEGI OLCUMU (6 Agu 2026) — "OLCULEMEDI" halini kapatir.
      #
      # NEDEN: 6 Agu'da `deploy` isi ust uste `GitHub Pages'e yayinla` adiminda
      # 600 sn'de dustu ve "artefakt olcek duvarina mi carpti" sorusu SAYIYLA
      # cevaplanamadi — elimizde yalnizca SIKISTIRILMIS zip boyu (upload-artifact
      # basar: 5 Agu 211,3 MB -> 6 Agu 220,3 MB) vardi. GitHub Pages'in BELGELENMIS
      # siniri ise ACILMIS site boyudur: "Published GitHub Pages sites may be no
      # larger than 1 GB" (docs.github.com/pages ... /github-pages-limits). Yani
      # bugune dek TAM DA SINIRA GORE OLCULEN sayi hic basilmiyordu.
      #
      # NE BASAR: acilmis toplam bayt, dosya sayisi, dizin sayisi ve en buyuk 10
      # ust dizin. 1 GB'a gore doluluk yuzdesi de basilir ki egri (gun gun) log'dan
      # okunabilsin.
      #
      # 🔴 NEDEN `du -sb _site` DEGIL (olculdu 6 Agu — YANLIS OLCUM TUZAGI): `du`
      # DIZIN inode'larini da sayar (dizin basina 4096 B). Bu agacta 22.359 dizin
      # var -> `du -sb` gercek icerigi ~91 MB SISIRIR (%+10,5) ve 1 GB doluluk
      # %80,8 yerine ~%89 gorunur. Pages'in yayinladigi ve 1 GB'a saydigi sey DOSYA
      # icerigidir; bu yuzden toplam `find -type f -printf '%s'` ile YALNIZ DOSYA
      # baytlarindan toplanir. Yanlis olcum olcumsuzlukten KOTUDUR: sahte esik
      # alarmi uretip yanlis mimari karar dogurur. Referans (ayni agac, kosum
      # 31107527748 artefakt tar'indan sayildi): 867.958.072 B / 22.399 dosya —
      # bu adimin ilk ciktisi buna YAKIN olmali, `du` degeri olmamali.
      #
      # 🔴 NEDEN BLOKLAYICI DEGIL: bu bir OLCUM adimidir, kapi degildir. Esik
      # koymak (ornegin ">%90 ise kirmizi") YAYIN MIMARISI karari olup mimarindir;
      # olcum yokken esik koymak da tanim geregi kor olurdu. `continue-on-error:
      # true` ile bu adim hicbir sekilde yayini durduramaz. Sayi birikince esik
      # AYRI bir kapi olarak eklenebilir.
      - name: "Yayin olcegi olcumu (acilmis _site bayt/dosya dokumu — 1 GB Pages siniri)"
        run: |
          TOPLAM=$(find _site -type f -printf '%s\n' | awk '{s+=$1} END{printf "%d", s}')
          DOSYA=$(find _site -type f | wc -l)
          DIZIN=$(find _site -type d | wc -l)
          echo "YAYIN-OLCEK toplam_bayt=$TOPLAM"
          echo "YAYIN-OLCEK dosya_sayisi=$DOSYA"
          echo "YAYIN-OLCEK dizin_sayisi=$DIZIN"
          awk -v b="$TOPLAM" 'BEGIN{printf "YAYIN-OLCEK mib=%.1f\n", b/1048576}'
          awk -v b="$TOPLAM" 'BEGIN{printf "YAYIN-OLCEK 1GB_doluluk_yuzde=%.1f\n", b*100/1073741824}'
          echo "YAYIN-OLCEK --- ust dizinler (yalniz dosya baytlari) ---"
          find _site -mindepth 1 -maxdepth 1 -printf '%f\n' | while IFS= read -r ust; do
            find "_site/$ust" -type f -printf '%s\n' \
              | awk -v u="$ust" '{s+=$1; n++} END{printf "%d\t%s\t(%d dosya)\n", s+0, u, n+0}'
          done | sort -rn | head -12
        continue-on-error: true

      - name: Pages artefaktini yukle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Katalogu D1'e senkronla (Ege'nin aramasi + ileride site aramasi buradan).
      # DIFF-UPSERT: sadece degisen/yeni urunler yazilir (D1 gunluk 100.000 yazma siniri;
      # olculdu: urun basina 5 satir -> tam rebuild 6.086 urunde 30.432 yazma, 50k'da 250.000
      # = limitin 2,5 kati. Degismeyen urune dokunulmaz, tipik push birkac yuz yazma eder).
      # continue-on-error: D1 senkronu SITE YAYININI BLOKLAMAZ — site urunler.json'dan calisir,
      # D1 sadece Ege'nin aramasini besler. Senkron kacarsa bir sonraki push'ta kendini toparlar.
      #
      # 🔴 BAYATLIK ON-KOSULU (31 Tem, adli olcum — 9 olay / 367 id sessizce silindi):
      # Bu adim KENDI checkout'undan kosar. Sirada bekleyen bir kosum yayina cikana kadar
      # daha yeni bir push, pre-push hook'uyla D1'i ZATEN guncellemis olur; o zaman bu ESKI
      # agac diff-upsert'un DELETE koluyla YENI partiyi D1'den siler (olculen 9 olayin 9'unda
      # adim `success` gorundu — sessiz hata). d1-sync.py icindeki bayatlik kapisi bayat
      # agactan gelen HER YAZMAYI (silme + upsert) zaten fail-closed durdurur; buradaki
      # on-kosul ise BAYAT KOSUMU HIC BASLATMAZ:
      #   - D1'e tek satir bile yazilmaz ve bosuna D1 okumasi da yapilmaz,
      #   - olculen 18-27 s'lik adim suresi yayin yolundan DUSER.
      # `--bayatlik` D1'e DOKUNMAZ (yalniz `git ls-remote` + `merge-base`), UC ise 0 doner.
      # Fail-open KALIR: bayat/olculemez kosumda adim exit 0 ile ATLAR, yayin durmaz;
      # kalintiyi d1-uzlastirici.yml (yayin yolu disinda, 15 dk) kapatir.
      - name: Katalogu D1'e senkronla
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Kimlik IKI parcali: token + hesap kimligi (kimlik 5 Agu 2026'da kaynaktan
          # secret'a tasindi). Ikisinden biri yoksa wrangler zaten calisamaz -> ayni
          # atlama kolu, ayni sesle.
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secret yok — D1 senkronu atlandi."
            exit 0
          fi
          if ! python3 tools/d1-sync.py --bayatlik; then
            echo "BAYAT KOSUM — bu checkout uzak main'in ucunda DEGIL; D1 senkronu ATLANDI."
            echo "(Ucta kosan is + pre-push hook + d1-uzlastirici.yml katalogu senkron tutar.)"
            exit 0
          fi
          python3 tools/d1-sync.py

  # ══════════════════════════════════════════════════════════════════════════════
  # SERIT A2 — agir bagimsiz kapilar (yasal sayfa drift capasi)
  #
  # 🔴 BU IS YAYINI BLOKLAR: `deploy: needs:` listesinde ADI GECER. Kirmizi yanarsa
  # `deploy` ATLANIR (fail-closed sozlesme AYNEN korunur — tek serit oldugu zamanki
  # gibi). Adi `deploy.needs`'ten dusurulurse buradaki kapilarin kirmizisi yayini
  # DURDURMAZ; tools/is-akisi-kapisi.py::_serit_b_joblar bunu GECISLI olarak olcer ve
  # beyansiz kapi basina KIRMIZI yakar (SERIT_B tablosuna giris ekleyerek SUSTURMA —
  # dogru cozum seridi `deploy.needs`'e geri koymaktir).
  #
  # NEDEN BOLUNDU (olculdu, kosum 30838521694): tek serit `build` 1487 sn (24,8 dk)
  # suruyordu ve `concurrency: group: pages` yuzunden yayin tavani 1 deploy/build idi
  # -> parti push'larinin ~%85'i kendi deploy'unu alamiyordu. Kapilar N bloklayici
  # serite bolununce duvar saati max(serit)'e duser; kapi SAYISI ve SEMANTIGI aynidir.
  # Bu bir TASIMA isidir: hicbir kapinin cagri satiri/argumani DEGISMEDI.
  #
  # BEDEL (durust beyan): serit basina checkout+setup tekrari (~21 sn x serit).
  # Toplam runner 1490 sn -> ~1528 sn (+%3); duvar saati 1490 -> ~563 sn (-%62).
  #
  # ⚠️ fetch-depth: 0 HER SERITTE korunur. Gerekce OLCULDU: bu is akisinda git
  # gecmisi okuyan EN AZ 9 kapi var (diriltme-kapisi `git log -p --first-parent`,
  # kisisel-veri-test `rev-list`, konfigur/kalibrasyon `git show`, d1-sync `merge-base`
  # ...). Sig checkout kazanci ~8 sn/serit (checkout 11 sn olculdu) — yani ~%1,5;
  # buna karsilik yanlis serite sig checkout koymak kapiyi OLCULEMEDI'ye (rc 2)
  # dusurur. Kazanc kucuk, risk sessiz: derin checkout HER SERITTE KALIR.
  # ══════════════════════════════════════════════════════════════════════════════
  serit-a2:
    runs-on: ubuntu-latest
    steps:
      # 🔴 fetch-depth: 0 ZORUNLU — tools/diriltme-kapisi.py "gecmiste SILINMIS urun id'si"
      # kumesini `git log -p --first-parent -- urunler.json` ile TURETIR (elle liste
      # TUTULMAZ; olculdu 30 Tem: 801 commit, ~68 MB diff, 4,2 s, 990 silinmis id).
      # actions/checkout VARSAYILANI `fetch-depth: 1` (SIG/shallow) ve o halde gecmis YOKTUR.
      # Bu satir dusurulurse kapi SESSIZCE yesile donmez: SIG depoyu tanir ve
      # OLCULEMEDI (rc 2) ile YAYINI DURDURUR (fail-closed).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pyyaml: is akisi BICIM kapisi (tools/is-akisi-kapisi.py) GERCEK bir YAML
      # ayristiricisi ister. Ayristirici YOKSA o kapi YESIL SAYMAZ (exit 2 = OLCULEMEDI)
      # -> bu satirdan pyyaml dusurulurse yayin durur, sessizce korumasiz KALMAZ.
      - name: Python bagimliliklari (boto3 - R2 testleri icin; pyyaml - is akisi kapisi)
        run: pip install boto3 pyyaml
      # Node: piksel<->katalog parite testinin JS-uc nobeti (index.html pruvoFeedId + olcum.js
      # feedId/metaGovdesi/ga4Govdesi) node ile kosar. FAIL-CLOSED: node yoksa test CI'da exit 1
      # verir (yalanci-yesil olamaz), o yuzden setup-node BLOKLAYICI bir on-kosuldur.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # DEVAM SINIF KAPISI (1 Agu) — IZLENEN KOK DEFTERLERININ **ICERIK SINIFI**.
      # NEDEN BURADA (yer secimi): `DEVAM.md` 31 Tem'de git takibine ALINDI ve o
      # tarihten beri bes ev / cok sayida oturum ayni dosyaya yaziyor; ne yazildiginin
      # SINIFINI kimse denetlemiyordu. Depo PUBLIC: bir kez commit'lenen blob silinse
      # bile anonim cekilebilir -> sessiz-hata sinifi.
      # NEDEN COMMIT-MSG DEGIL: ihlal MESAJDA degil DOSYA ICERIGINDE.
      # NEDEN KANCA DEGIL: git kancalari COMMIT EDILMEZ; bes evde/her klonda kurulu
      # olduklari GARANTI DEGILDIR ve `--no-verify` atlar. Buradaki kablo ise
      # tools/ci-kapsam-test.py tarafindan KESFEDILIR (tools/*-kapisi.py) -> silinirse
      # ya da `echo`/`--help` mensiyonuna cevrilirse O kapi kirmizi yanar.
      # NEDEN `build` (serit-b DEGIL): `deploy` -> needs: build, `yayin` -> needs: deploy.
      # Yani bu adim kirmizi yanarsa YAYIN CIKMAZ. serit-b'ye konsaydi "bagiran ama
      # bloklamayan" olurdu (bkz. tools/is-akisi-kapisi.py :: SERIT_B).
      # MEVCUT NOBETCILER BU EKSENI GORMEZ: kisisel-veri-test.py DEVAM.md'yi AD
      # ekseninde IZIN LISTESINE aldi (icerik bakmaz); commit-mesaji-kapisi.py
      # --kaynak-tara yalniz kendi bes dosyasini tarar.
      # Tedarikci/satici ADI ekseni commit-mesaji-kapisi.py'nin PBKDF2 OZET
      # mekanizmasindan MODUL olarak gelir -> yasakli ad hicbir yere YAZILMAZ.
      # Eslesen METIN BASILMAZ (CI gunlugu PUBLIC). Offline, ~4 s.
      - name: Devam sinif kapisi (izlenen kok defterlerinin icerik sinifi)
        run: python3 tools/devam-sinif-kapisi.py

      # R2 GORSEL ANAHTARI: anahtar KAYNAK-ID'den turetilir (basliktan DEGIL) — turetme tek
      # modulde (tools/r2_anahtar.py) toplandi, cagiranlar ondan gecer. Bloklayici: anahtar
      # basliga kayarsa iki urun ayni R2 nesnesini EZER (sessiz gorsel kaybi). Offline, yazma yok.
      - name: R2 anahtar turetme kabul testi
        run: python3 tools/r2-anahtar-test.py

      # YETIM KAYIT KAPISI (K55, 12 Agu 2026) — kaynak kaydi OLMAYAN + R2 anahtari kaynak-id
      # (th/pr/mw/cgt/c3d) yerine BASLIK-slug'undan turetilmis urunler (yetim) yol-dedup
      # tarafindan GORULMEZDI: gorsel-cakisma-onar yalniz URL CAKISAN urunu, mukerrer-kontrol
      # yalniz mukerrer linki tarar. Bu adim kapiyi KENDINI-TEST ile kilitler (siniflandirici
      # ve tarama fiksturde dogru -> dedektor curuyemez). Canli tarama ON-DEMAND kalir:
      # bugun 193 yetim var, veri tek-yazar MaCiT duzlemi -> push'u BLOKLAMAZ; backfill
      # bitince (canli tarama 0) nobet serisine tasinir. Offline, yazma yok, ag yok.
      - name: Yetim kayit kapisi kendini-testi (kayit-yok + baslik-anahtar siniflandiricisi)
        run: python3 tools/yetim-kayit-kapisi.py --kendini-test

      # FEED POLITIKA KAPISI — IKI KATMANLI. Merchant feed'inin <title> VE <description>
      # metinlerini tarar. BLOKLAYICI katman YALNIZ olculmus/bildirilmis GERCEK Merchant
      # reddinden turemis 3 jeton icerir (e-sigara/vape ailesi; "durbun" BLOKLAMAZ, RAPOR
      # katmanindadir — mesru Marin/Kamera urunu tum ekibin yayinini durdurmasin diye).
      # Tam katalogda 7 isabet, YANLIS-POZITIF 0 (olculdu 2026-07-22, 7650 feed kalemi:
      # 7 isabetin 7'si de gercek e-sigara/vape urunu, tek tek denetlendi ve tabanda yazili).
      # Feed KISMEN taranirsa (ayristirma kirpilir/bozulur) kapi FAIL-CLOSED kirmizi yanar —
      # eskiden cikis 0 veriyordu ve 3000. siradaki gercek bir vape urunu sessizce geciyordu.
      # Bilinen borc tools/feed-politika-
      # taban.json'da (tek yazar MaCiT, KOD DEGISIKLIGI GEREKTIRMEDEN guncellenir);
      # tabanda OLMAYAN yeni bir ihlal ya da tabandaki bir urunun YENI jeton kazanmasi
      # KIRMIZI yakar. Supheli ama kanitsiz jetonlar (kullук/cakmak/susturucu — bunlar
      # mesru Turkce otomotiv parca adlaridir, olculdu: 71 yanlis pozitif) RAPOR katmaninda
      # yalniz SAYILIR, CI'yi KIRMAZ. Offline (feed'i build.py'yi MODUL olarak import edip
      # uretir), olculdu 2,6 s.
      - name: Feed politika jetonu kapisi (bloklayici + rapor)
        run: python3 tools/feed-politika-kapisi.py

      # ASGARI GORSEL BOYUTU: 100x100 altindaki gorsel Google Merchant'ta "resim cok kucuk"
      # reddi alir (olculen vaka 1000x88). Kapinin KENDISI ekleme hattinda kosar (CI'da
      # 7769 gorseli agdan cekmek kabul edilemez); burada kosan sadece onun OFFLINE kabul
      # testidir (sentetik fikstur, saf Python baslik ayristirma). Test uc ekleme betigini
      # GERCEKTEN import edip process_one'i sahte upload ile uctan uca kosturur (ag/AI/sips
      # yok, urunler.json'a DOKUNMAZ) -> kablolama kopmasi sessiz kalamaz. Olculdu 2,1 s.
      - name: Asgari gorsel boyutu kapisi kabul testi
        run: python3 tools/gorsel-boyut-test.py

      # MARKA KÜRATÖRLÜĞÜ: ana sayfa marka çip listesi yalnız TANINMIS_MARKALAR'dan oluşur
      # (model/motor kodu çip olamaz), varyantlar (Mercedes-Benz, Toyota 86, KIA/Kia) tek
      # kaleme katlanır ve filtre eşleşmesi katlamayla tutarlıdır. index.html'deki bloğu
      # AYIKLAYIP gerçek urunler.json'a uygular (kopya değil, canlı kod). JS mantığı node
      # ile koşar (setup-node kurulu; node yoksa FAIL-CLOSED exit 1). Offline, ~1 s.
      - name: Marka liste kabul testi (küratörlü çipler + varyant katlama)
        run: python3 tools/marka-liste-test.py

      - name: Site arac es anlamli fiksturu ve mutasyon nobeti
        run: node tools/site-esanlam-test.js

      # MARKA SAYFASI UYELIGI (olculdu, 31 Tem): jenerator uyeligi HAM marka[0] ile
      # taniyordu; "Volvo Penta" (21 Marin) ve "Mercedes-Benz" (20) ham halde taninmis
      # listede olmadigi icin 41 urun HICBIR marka sayfasina girmiyordu. Hata SESSIZ:
      # urun aramada cikar, ana sayfa cipi gosterir, /marka/volvo/ sayfasinda YOKTUR.
      # Ikinci sessiz hata: model kirilimi marka[1]'i hep MODEL saniyordu; cok markali
      # uyumluluk kayitlari ("Peugeot"+"Citroen") /marka/peugeot/citroen/ gibi ANLAMSIZ
      # 33 sayfa doguruyor, urun ikinci markanin sayfasinda GORUNMUYORDU. NE KORUR:
      # katlanmis uyelik, marka-adli model sayfasinin URETILMEMESI, gercek MODEL
      # kirilimini (SEO ana ekseni) koruyan regresyon nobeti, index.html marka filtresi
      # ile BIREBIR parite, cip haritasinin birincil markada kalmasi. Sayfalari GERCEK
      # jeneratorle gecici ROOT'a uretir; katlama tablosu okunamazsa YESIL DEMEZ (exit 2).
      # Saf Python, offline, urunler.json'a YAZMAZ.
      - name: Marka uyelik kabul testi (katlanmis uyelik + anlamsiz URL nobeti)
        run: python3 tools/marka-uyelik-test.py

      # MARKA INVARYANTI (Okan hukmu): "TUM markalarda sayfa ve arama urun adetlerinin
      # AYNI olmasi." Tek tek yama degil, INVARYANT. OLCULEN SESSIZ HATA (4 Agu): uctaki
      # `?marka=` kolunun HAM STRING ESITLIGI site katlamasindan ayrisiyordu -> 128
      # markanin 9'unda 120 urun-kalemi MUSTERI CIPE BASINCA KAYBOLUYORDU. 12 Agu'da uc
      # D1 `marka_kanon` uyeligine gecirildi ve borc tabani 0'a sikilastirildi. Kapi her
      # kanonik marka icin UC KUME kurar (sayfa · ?marka= ·
      # ?q=) ve farklari MARKA MARKA tabana (tools/marka-invaryant-taban.json) karsi olcer:
      # MEVCUT BORC BLOKLAMAZ, REGRESYON BLOKLAR (circir: dusus de kirmizidir, taban
      # bayatlamasin). AG CAGRISI YOK (CI'da deterministik); uc davranisi yerel portla
      # modellenir ve modelin canliyla 128/128 eslestigi bir kez olculdu (kapinin
      # docstring'inde). Totoloji tuzagina karsi 5 POZITIF CAPA + mutasyon bataryasi
      # (tools/marka-invaryant-mutasyon.py). Saf Python, offline, ~2 s.
      - name: Marka invaryant kapisi (sayfa ↔ cip ↔ arama, taban civili)
        run: python3 tools/marka-invaryant-kapisi.py

      # D1 `marka_kanon` KOLONU (ayni sessiz hatanin KAYNAKTA kapatilmasi): katlama
      # mantigi Worker'a KOPYALANMAZ (ikinci govde = sessiz ayrisma); kanonik marka
      # uyeligi senkron aninda deponun TEK KAYNAGINDAN turetilip D1'e ONCEDEN yazilir.
      # Test gercek d1-sema.sql'i yerel sqlite3'e yukler, gercek d1-sync fonksiyonlarini
      # ve gercek urunler.json'u kullanir; CANLI D1'e/wrangler'a/AGA DOKUNMAZ. NE OLCER:
      # kolonun dogru SINIFTA olmasi (hash'e karismaz -> hedefli UPDATE), kanonik sayimin
      # marka sayfasiyla 128/128 birebir olmasi, 120 kalemlik kaybin KAPANMASI, idempotens,
      # olcek (markasiz urune dokunmama), FAIL-CLOSED yonunun "bosalt" degil "dokunma"
      # olmasi ve SEMA SIRASI (kolon yokken SELECT'e girmez -> kimsenin push'u kirilmaz).
      - name: Marka kanon D1 kolonu kabul testi (120 kalemlik cip kaybi kapaniyor mu)
        run: python3 tools/marka-kanon-d1-test.py

      # D1 `model_kanon` KOLONU — AYNI sessiz hata sinifinin MODEL EKSENI (5 Agu). Uctaki
      # `model` kolu `uyum[].model` alaninda TAM ESITLIK arar; site ise modeli KUSAK/VARYANT
      # duzeyinde katlar (`Fiesta ST` -> Fiesta, `T4`/`T5` -> Transporter, `Astra H` -> Astra).
      # Olculdu: 553 yayimlanan model kovasinin 96'sinda sayfa suzgecten GENIS, 390 urun-kalemi
      # musteri MODEL CIPINE BASINCA kayboluyor. Cozum marka ekseniyle BIREBIR: katlama Worker'a
      # KOPYALANMAZ, kanonik model uyeligi senkron aninda SAYFA URETICISININ KENDI yukleminden
      # turetilip D1'e onceden yazilir. Test gercek d1-sema.sql'i yerel sqlite3'e yukler,
      # CANLI D1'e/wrangler'a/AGA DOKUNMAZ ve semayi CANLIYA UYGULAMAZ. NE OLCER: kolonun
      # dogru SINIFI (hash'e karismaz -> hedefli UPDATE), 5 AYRI katlama mekanizmasinin
      # POZITIF CAPASI, 390 kalemlik kaybin 0'a inmesi, deger evreninin YAYIMLANAN kova
      # etiketleriyle birebir olmasi (kapali sayfa sizmasin), idempotens/olcek, FAIL-CLOSED
      # yonu ve SEMA SIRASI. Ayrica KAYIPSIZLIK sayisini basar (ucun BIRLESIM karari icin).
      # Mutasyon bataryasi: python3 tools/model-kanon-mutasyon.py (12 mutant).
      - name: Model kanon D1 kolonu kabul testi (390 kalemlik model cip kaybi kapaniyor mu)
        run: python3 tools/model-kanon-d1-test.py

      # KATALOG KAYNAGI BAYRAGI (5 Agu) — d1-sync katalogu DAIMA calisma agacindan okuyordu,
      # yani agacta baska bir oturumun COMMIT'LENMEMIS urunleri varsa senkron ONLARI CANLIYA
      # yazardi ve hicbir sey kirmizi yanmazdi: bayatlik kapisi COMMIT GRAFIGINI olcer,
      # calisma agacinin o commit'ten SAPMASINI OLCMEZ. Ayni gun iki kez karsimiza cikti.
      # Artik kaynak ACIKCA secilebiliyor (`--head` / `--kaynak`) ve secim GURULTULU basiliyor.
      # Test GERCEK bir git fiksturunde (2 urun commit'li, 1 urun agacta) iki yolun FARKLI
      # sonuc verdigini olcer, fail-closed dallari (yok dosya / bicimsiz kaynak / iki bayrak
      # birden) sinar ve 🔴 BAYRAKSIZ DAVRANISIN DEGISMEDIGINI iki yonlu olcer — 5 evin push
      # kancasi bugunku davranisa baglidir. Offline; D1'e/aga DOKUNMAZ.
      # Mutasyon bataryasi: python3 tools/d1-kaynak-mutasyon.py (7 mutant).
      - name: D1 katalog kaynagi kabul testi (commit'lenmemis urun canliya yazilmasin)
        run: python3 tools/d1-kaynak-test.py

      # KANCA KABLOLAMASI (9 Agu) — yukaridaki `--head` bayragi 5 Agu'dan beri VARDI ama
      # pre-push kancasi d1-sync'i BAYRAKSIZ cagiriyordu: bayrak yazilmis, BAGLANMAMIS.
      # Bes ev ayni checkout'u paylasiyor; bir oturumun YARIM parti urun degisikligi agacta
      # dururken BASKA bir oturum push edince o yarim parti CANLI D1'e (Ege'nin katalogu)
      # yaziliyordu ve push YESIL donuyordu. Bu test BEYAN degil DAVRANIS olcer: sentetik
      # gercek depolarda (calisan uzak + kurulu kanca) GERCEK `git push` kosar ve senkronun
      # FIILEN okudugu katalogu olcer — commit'siz urun GIRMEZ, commit'li urun GIRER (kontrol
      # ayagi), bayrak sokulunce eksen KIRMIZI yanar (kontrol mutanti), `dal:main` kopru kolu
      # push edilen commit'i okur, kaynak cozulemezse senkron KOSMAZ (agaca dusmez) ve push
      # bloklanmaz, her push <= 30 sn. CANLI D1'e/wrangler'a/AGA DOKUNMAZ.
      - name: pre-push D1 kaynagi kabul testi (senkron PUSH EDILEN commit'i mi okuyor)
        run: python3 tools/prepush-d1-kaynak-test.py

      # D1 `marka_arama` KOLONU — Okan hukmunun UC ayagi (marka_kanon CIP, model_kanon MODEL
      # CIPI, bu kolon ARAMA). Site tarafi 8913db28 ile duzeltildi (marka adiyla yapilan sorgu
      # artik UYELIK ∪ BASLIKTA TAM KELIME; fark 74 marka/6.089 kalem -> 20/75) ama CANLI arama
      # UCTAN geliyor (index.html EDGE_KATALOG -> Worker /ara) ve uc hala `hs` uzerinde
      # ALT-DIZE ariyor: olculdu `?q=MAN` = 3539 ("Mandali"), `?q=Haval` = 581
      # ("Havalandirma"). Musteri hala eski sonucu goruyor ve iki yuzey de kendi icinde
      # tutarli oldugu icin kimse BILDIRMEZ. Yuklem Worker'a KOPYALANMAZ; deger senkron
      # aninda deponun TEK KAYNAKLARINDAN turetilip ONCEDEN yazilir — ALIAS yazimlari dahil
      # (site `?q=Vauxhall`i Opel'e katlar; kolon alias tasimasaydi uc 493 urunluk markayi
      # HIC bulamazdi, alias tablosunu uca kopyalamak ise ikiz tanim olurdu). Test gercek
      # d1-sema.sql'i yerel sqlite3'e yukler; CANLI D1'e/wrangler'a/AGA DOKUNMAZ ve semayi
      # CANLIYA UYGULAMAZ. NE OLCER: kolonun dogru SINIFI (hash'e karismaz -> hedefli UPDATE),
      # kolondan turetilen kumenin SITENIN kumesiyle 129/129 + alias 1/1 birebir olmasi,
      # `marka_arama ⊇ marka_kanon` sozlesmesi, kayipsizlik (ham `marka` birlesimi 0 kalem
      # ekler -> model_kanon'un AKSINE kolon TEK BASINA okunur), idempotens, olcek,
      # FAIL-CLOSED yonu ve SEMA SIRASI. Mutasyon: python3 tools/marka-arama-mutasyon.py.
      - name: Marka arama D1 kolonu kabul testi (uctaki `?q=<marka>` gurultusu kapaniyor mu)
        run: python3 tools/marka-arama-d1-test.py

      # ANA SAYFA VITRIN SIRALAMASI (Okan kurali, 31 Tem): Ev/Dekorasyon/Ofis urunleri
      # ana sayfanin ILK 20 SLOTUNDA gorunmez, 21. siradan itibaren normal gorunur
      # (urun ELENMEZ, geri itilir). Hata SESSIZ olurdu: ana sayfa kartlari ziyaretciye
      # DORT ayri besleme yolundan gelir (ozet.json ilk boyamasi, ozet inmezse Worker
      # /katalog, Worker duserse edgeYedek havuzu, bayrak kapaliyken HOME_ORDER); kural
      # yollardan birine konsaydi vitrin bazi ziyaretcide dogru bazisinda yanlis gorunur
      # ve kimse fark etmezdi. Test index.html'in inline scriptini node:vm'de SENTETIK
      # fikstur + sahte DOM/fetch ile GERCEKTEN kosturur ve dort yolu AYRI AYRI olcer;
      # ayrica kategori gorunumunun/aramanin ETKILENMEDIGINI, urunlerin ELENMEDIGINI
      # (permutasyon), siranin KARARLI kaldigini ve "yeterli hedef-disi urun yok" halinin
      # SESSIZ gecmedigini iddia eder. Istemci iddialari SENTETIK fikstur uzerinde olculur
      # (kural derleme aninda da uygulandigi icin canli veriyle yazilsalar VACUOUS olurdu).
      # 31 Tem'de IKINCI EKSEN eklendi: vitrin sirasi ARTIK DERLEME ANINDA hesaplaniyor
      # (tools/build.py render_ozet -> ozet.json "yeni"), cunku ilk boyama ozet'ten yalnizca
      # PAGE_SIZE kart aliyor ve katalogun basinda hedef-kategori blogu olusunca istemci
      # siralayicisi YOKTAN hedef-disi urun uretemiyordu. Test ozeti GERCEK build.py ile
      # uretir (kural JS'e kopyalanmaz), iki eksenin birbirini BOZMADIGINI (etkisiz-tekrarli)
      # kanitlar ve CANLI iddiayi veri durumuna degil URETILEN VITRIN SIRASINA bakarak
      # olcer — boylece yeni urun partileri yayini durdurmaz. python3 + node gerekir
      # (ikisi de bu job'da kurulu). Offline, depoya dosya YAZMAZ, ~10 s.
      - name: Vitrin siralama kabul testi (ilk 20 slot + derleme sirasi + 4 besleme yolu)
        run: node tools/vitrin-siralama-test.js

      # ESKI FIYAT (ustu cizili indirim) KABUL TESTI — opsiyonel `eski_fiyat` alani.
      # HATA SINIFI SESSIZ: yanlis gosterim musteriye YANILTICI indirim gosterir, sayfa
      # duzgun gorunur, kimse hata mesaji gormez. Kural FAIL-CLOSED (supheli her durumda
      # HIC gosterme) ve burada CALISTIRILARAK olculur: (a) Python kurali 29 vakalik tablo,
      # (b) index.html'in GERCEK kart cizicisi node:vm'de AYNI tabloda AYNI hukmu verir
      # (iki dilde iki kalip = drift; bu bolum o drifti yakar), (c) render_product ciktisi —
      # gecersiz vakada cikti alan HIC YOKKEN uretilenle BAYT-ESIT (sifir iz), (d) uretilen
      # sayfanin KENDI JS'i secim fiyati eski fiyati asinca ustu cizili fiyati GIZLER,
      # (e) PARA EKSENI iki eksende: e1 YAPISAL/referanssiz (para ilkellerinin kaynaginda
      # eski_fiyat gecmez + fiyat fonksiyonu urunu HIC almaz + sayfa A/B: gosterim blogu
      # soyulunca cikti alansiz haliyle BAYT-ESIT), e2 TARIHSEL: 1275 konfigur kombinasyonu
      # (17 urun x 25 boy x 3 malzeme, ORNEKLEME YOK) degisiklik ONCESI build.py ile kurusu
      # kurusuna esit + JSON-LD/feed fiyati degismedi. 🔴 e2'nin referansi HEAD'e GORELI
      # DEGILDIR (merge-base HEAD..origin/main referansi dal main'e girer girmez totolojiye
      # dusup testi kalici OLCULEMEDI/exit 2 yapiyordu — olculdu 31 Tem): referans, capayi
      # tasimayan EN YENI ATA BLOB'udur; totoloji nobeti duruyor,
      # (f) kart_ozeti alani yalniz kurali gecen urunde tasir + ozet A/B (alan enjekte
      # edilince ozet YALNIZ eski_fiyat anahtari kadar degisir),
      # (g) duzelt.py/diriltme-kapisi.py alani mesru sayar. Offline, node + python3 gerekir
      # (ikisi de bu job'da kurulu), depoya YAZMAZ, ~2 s. Mutasyon turu (13/13 kirmizi)
      # elle: python3 tools/eski-fiyat-test.py --mutasyon (CI'da kosmaz — her mutant node
      # kosuyor, sure yayin hattina yuk olur).
      - name: Eski fiyat (ustu cizili indirim) kabul testi
        run: python3 tools/eski-fiyat-test.py

      # TICARI HAL KAPISI (TEK YONLU KAPI = TUZAK). `gorselsiz` muafiyet beyani ve `tur`
      # sinif alani duzelt.py'nin DEGISTIRILEBILIR kumesinde YOKTU: bayrak bir kez konunca
      # mesru yoldan geri alinamiyordu (bu depoda ayni sinif iki kez cikti, ikisinde de
      # ELLE temizlik gerekti). Ikinci olculen delik: `--alan-sil` izinli kumeye bakmadigi
      # icin `--alan-sil tur` gecerken `gorselsiz: true` kayitta ASILI kaliyordu — hicbir
      # kolun kabul etmeyecegi ara durum sessizce uretilebiliyordu. Kapi hem geri alma
      # yolunun ACIK oldugunu hem SINIRLARINI olcer: `tur` yalniz kanonik sinif dizesini
      # alir (donus --alan-sil ile), `gorselsiz` yalniz boolean true ve yalniz GORSELSIZ
      # HAZIR MALDA durur, 🔴 SINIF ATLAMASI (hazir mal <-> ozel uretim = fiyat carpani +
      # cayma hakki rejimi) --gerekce ZORUNLU tutar ve .urunler-guard.log'a yazilir.
      # parti-kontrol.py'nin BACKFILL yasagi GEVSETILMEDI (P1 iddiasi bunu olcer).
      # GERCEK duzelt.py sentetik repoda SUREC olarak kosturulur (cikis kodlari olculur),
      # gercek urunler.json'a DOKUNULMAZ, offline. Mutasyon turu (8/8 kirmizi) elle:
      #   python3 tools/ticari-hal-kapisi.py --mutasyon
      - name: Ticari hal kapisi (tur/gorselsiz geri alma yolu + sinif atlamasi gerekcesi)
        run: python3 tools/ticari-hal-kapisi.py

      # KONFIGUR FAIL-CLOSED (shop odeme yolu — SESSIZ EKSIK TAHSILAT kapisi). Konfigurlu urun
      # D1'e senkronlanip Worker ELLE deploy edilmediginde kalem eskiden sessizce SABIT katalog
      # fiyatiyla satiliyordu (olculdu: 30 cm/PLA 1.500 TL yerine 500 TL -> 1.000 TL eksik
      # tahsilat, hicbir uyari yok). Bu adim shop/src/index.js'in KENDISINI node'a yukleyip
      # (setup-node yukarida BLOKLAYICI on-kosul; node yoksa FAIL-CLOSED kirmizi) sahte D1 +
      # sahte iyzico ile kosar: (a) 39/39 konfigur kaleminde fiyat DEGISMEDI, (b) bundle'da
      # olmayan konfigur urunu 400 aliyor ve sabit fiyat HESAPLANMIYOR, (c) 250 siradan urun +
      # TUM katalog taramasinda 0 yanlis-pozitif, (d) kapi silinince YALNIZ (b)
      # kirmizi yaniyor (olu-nobetci korumasi), (e) musteriye gosterilen metin jenerik degil.
      # OFFLINE: wrangler YOK, ag YOK, gercek/sahte SIPARIS YOK, dosya yazmaz. ~6 s.
      # NOT: shop/test'in diger dosyalari (kabul.js vb.) wrangler dev istedigi icin ci-kapsam
      # izin listesinde muaf; BU dosya wrangler istemedigi icin muaf DEGIL, fiilen kosar.
      - name: Konfigur fail-closed kabul testi (shop sessiz eksik-tahsilat kapisi)
        run: node shop/test/konfigur-fail-closed.mjs

      # YONET (ADMIN GIRIS) KAPISI — deterministik alt kume. AG YOK, WRANGLER YOK,
      # D1 YOK: shop/src/yonet.js (deploy edilen dosya, kopya DEGIL) dogrudan yuklenir, ~0,3 s.
      # 🔴 IDDIA SAYISI BURAYA YAZILMAZ (ayni depoda olculdu; bkz. bu dosyada `mesaj-nobeti`
      # ve `uzlastirma nabiz` adimlarindaki ayni kural): bayat sayi kosumun neyi olctugu
      # hakkinda yanlis bilgi verir ve kimse duzeltmez — "63 IDDIA" yaziyordu, iddia
      # ikiye bolununce gercek degisti. Gercek sayiyi betigin KENDISI son satirda
      # "SONUC: N gecti, M kaldi" + "IDDIA SAYISI: N" olarak basar.
      # OLCULDU — CI TABANI NODE 20'de YESIL: node v20.20.2 ve v22.23.2 -> ayni sonuc,
      # 0 kaldi, exit 0. Surum dali YOK, tek kod yolu.
      # 🔴 BU DELIK NEDEN VARDI: tools/ci-kapsam-test.py DOSYA kesfeder, BAYRAK KESFETMEZ.
      # shop/test/kabul.js deploy.yml'de `--sema-paritesi` ile kosuldugu icin kapsam kapisi
      # dosyayi "kosuluyor" sayiyordu -> ayni dosyaya sonradan eklenen `--yonet-cerez`
      # guvenlik alt kumesi CI'da SESSIZCE HIC KOSMUYORDU ve hicbir kapi kirmizi yakmiyordu.
      # (Ayni sinif tuzak: [[nobetci-cagri-satiri-nobetsiz]].)
      # NE KORUYOR (yetkisiz kisi katalogu/siparisleri yonetebilir -> dogrudan ticari zarar):
      #   * HttpOnly cerez oturumu — oturum jetonu JS'e acilmaz,
      #   * `?anahtar=` SORGU PARAMETRESININ KALDIRILMIS olmasi — anahtar URL'de, tarayici
      #     gecmisinde, Referer'da ve CDN loglarinda birakilmaz; GET /yonet?anahtar=<dogru>
      #     panel DEGIL giris formu doner, /yonet/liste?anahtar=<dogru> 404,
      #   * HTML ikame enjeksiyonu — istek yolundaki `$&` `$\`` `$'` `$$` sablon govdeyi
      #     bozmuyor (govde boyu sabit, action harfi harfine),
      #   * fail-closed SABIT-ZAMANLI karsilastirma — sabitEsit('', '') / (x, undefined)
      #     daima false; secret tanimsizken POST+GET 404 (form BILE cikmaz); bos govde ve
      #     sinir ustu govde -> Set-Cookie YOK,
      #   * HIZ SINIRI — art arda basarisiz denemeden sonra DOGRU sifre bile reddedilir,
      #   * KABA KUVVET GECIKMESI — basarisiz/bloke her denemede sabit bekleme ISTENIR
      #     (C23; ALT SINIR >= 100 ms, UST SINIR YOK — duvar saati degil, istenen setTimeout
      #     gecikmesi olculur, o yuzden yavas kosucuda yanlis-kirmizi YAKMAZ). 2 Agu'a kadar
      #     bu eksen NOBETSIZDI: `GIRIS_GECIKME_MS` 250 -> 0 mutanti SURVIVOR'di (olculdu),
      #   * YANLIS-PAROLA AYIRT EDILEMEZLIGI — bloke/bos-govde yaniti hic-denememis GET ile
      #     kod + govde + TUM BASLIKLAR duzeyinde BIREBIR ayni (oracle sizintisi yok).
      # OLU NOBETCI DEGIL: mutasyon surucusu REPODA durur -> `python3 tools/yonet-cerez-
      # mutasyon.py` (CI'da kosmaz; gelistirici/curutucu araci). Kirmizi-beklentili ve
      # kontrol mutantlarinin listesi, beklenen iddia kodlari ve olculen matris O DOSYADA
      # (sayilar da kosumda basilir — buraya kopyalanmaz, bkz. yukaridaki kural).
      # 2 Agu EKI: iki SECRET KAPISI artik AYRI AYRI olculuyor (C22a girisYap'in kendi
      # kapisi — yonet() bypass edilerek IZOLE; C22b yonet()'in ust kapisi). Onceden tek
      # iddia ikisinin VEYA'sini olcuyordu: girisYap'in kapisi TEK BASINA silinince alt
      # kume YESIL kaliyordu (olculdu) — surucude "K4 SURVIVOR" olarak BEYAN EDILMISTI.
      # Simdi o mutant KIRMIZI yaniyor ve surucude M10 olarak kirmizi-beklentilidir.
      # ⚠️ YUKLEYICI: semalar.js'in JSON import'lari icin `node:module` **register** (v20.6+)
      # kancasi kullanilir — `registerHooks` (v22.15+) DEGIL. Bu bilincli: CI tabani Node 20
      # ve [[shop/test/olcum.mjs ~481]] ayni kararla ayni deseni tasiyor; surum dali BILEREK
      # YOK. Bu adim ugruna setup-node surumunu yukseltmek GEREKMEZ. continue-on-error YOK.
      - name: Yonet anahtar/cerez kabul testi (admin giris kapisi — deterministik alt kume)
        run: node shop/test/kabul.js --yonet-cerez

      # URETIM DOSYASI DRIVE BAGLANTISI — panelin OKUMA/SUNUM tarafi (yeni uc YOK).
      # OLCULEN GERCEK: Drive `fileId` yapisal bir alanda DEGIL, gizli kaynak kaydinin
      # `baski` serbest metnindedir (oradan D1 `urunler.baski` kolonuna, oradan panele
      # gelir). Yani baglanti METIN AYRISTIRMASINDAN turer ve not bicimi degisirse
      # SESSIZCE kaybolabilir — kapinin varlik sebebi tam olarak budur:
      #   * kanonik / yedek / ARSIVDE-BASILMAZ ayrimi ekranda GORUNUR kalir (yanlis
      #     dosyanin basilmasi en pahali uretim hatasidir),
      #   * baglantilar TIKLANABILIR ve target=_blank + rel=noopener tasir,
      #   * SESSIZ BOSLUK YASAK: kaynak yoksa "kaynak yok", sinif isareti var ama fileId
      #     yoksa "baglanti uretilemedi" ACIKCA basilir (bos hucre, "dosya yok" ile
      #     "olculemedi"yi ayni yere dusururdu),
      #   * YETKI YUZEYI SABIT: yonlendirici kolu 10, Content-Disposition 2 (yeni indirme
      #     ucu / proxy / zip acilmadi) — sayilar bu isten ONCEKI HEAD'de olculdu.
      # Iddialar deploy edilen GERCEK kaynaktan (shop/src/yonet.js) cekilir, KOPYA yazilmaz.
      # OLU NOBETCI DEGIL: mutasyon surucusu de REPODA durur VE burada KOSAR (0,7 s; 40 s
      # esiginin cok altinda, o yuzden ci-kapsam muafiyetine girmedi). Kontrol mutanti M1
      # "bos listeyi sessiz gec" -> K28 KIRMIZI; M9/M10 notr mutantlari YESIL kalir.
      # Ikisi de wrangler/ag ISTEMEZ ve calisma agacini KIRLETMEZ. continue-on-error YOK.
      - name: Uretim dosyasi Drive baglantisi (panel sunum kapisi)
        run: node shop/test/uretim-kaynak.mjs

      - name: Uretim dosyasi Drive baglantisi — mutasyon bataryasi (nobetci canli mi)
        run: python3 tools/uretim-kaynak-mutasyon.py

      # URETICI KAYNAK LINKI + ACILIR/KAPANIR SIPARIS KARTI (panel sunum + GIZLILIK kapisi).
      # OLCULEN GERCEK: kaynak linki AYRI bir D1 tablosunda (`urun_kaynak`) yasar cunku
      # `urunler` tablosunu EGE (WhatsApp botu) OKUYOR — linki oraya koymak, botun agzindan
      # musteriye tedarikci sizmasi icin yol acardi. Bu kapi o ayrimin ACIK kalmasini olcer:
      #   * G2  `urun_kaynak`a DEGEN TEK kaynak dosyasi shop/src/yonet.js (yonetim ucu);
      #         musteriye donen yollar (shop/src/index.js, webhook, onizleme) HIC dokunmaz,
      #   * G3  kalem nesnesi YALNIZ `link` tasir — tasarimci/uyelik/lisans/alis_fiyati
      #         ne Worker kolunda ne uretilen panel HTML'inde GECMEZ,
      #   * G1  `urunler` tablosunda kaynak/link/tasarimci/uyelik kolonu YOK (kolon adlari
      #         d1-sema.sql'den AYIKLANARAK olculur, alt-dize taramasiyla degil),
      #   * FAIL-CLOSED SUZGEC: yalniz https:// gecer; javascript:/data:/bagil/`//host`
      #     degeri href'e GIRMEZ ve ham deger HTML'e SIZMAZ (XSS regresyonu + esc kacisi),
      #   * SESSIZ BOSLUK YASAK: kayit yoksa "kaynak kaydı yok" ACIKCA yazilir,
      #   * OMUZ-USTU GIZLILIGI: kapali <summary>'de musteri adi/telefon/e-posta/adres
      #     GECMEZ (acilinca govdede gorunur); varsayilan KAPALI, yalniz 'odendi' ACIK,
      #   * LAZY: uretim dosyasi listesi kart ILK acildiginda BIR KEZ cekilir.
      # Iddialar deploy edilen GERCEK kaynaktan cekilir, KOPYA yazilmaz. Senkron araci
      # (tools/d1-kaynak-sync.py) CI'da KOSMAZ ve KOSAMAZ: gizli kayit CI'da YOKTUR, arac
      # orada fail-closed durur. Ag/wrangler GEREKMEZ; calisma agaci KIRLENMEZ.
      # continue-on-error YOK.
      - name: Uretici kaynak linki + acilir kart (panel gizlilik kapisi)
        run: node shop/test/panel-kaynak.mjs

      - name: Uretici kaynak linki — mutasyon bataryasi (nobetci canli mi)
        run: python3 tools/panel-kaynak-mutasyon.py

      # ALT KATEGORI (`altkategori`) veri yolu — kategori ICINDEKI daraltma etiketi.
      # OLCULEN BASLANGIC DURUMU (1 Agu): alan urunler.json'da 134 kayitta DOLUYDU ama
      # hicbir yerde ISLENMIYORDU (index.html/build.py/d1-sync/arama/d1-sema/duzelt YOK)
      # -> veri vardi, musteriye ULASMIYORDU. Yol acildi; bu kapi acik KALMASINI olcer:
      #   A VERI   (kategori, altkategori) ikilisi izinli kumeye uymali. Izinli kume
      #            arama.ALTKATEGORI_IZINLI'de DONDURULMUS bir listedir — urunler.json'dan
      #            yeniden HESAPLANMAZ (hesaplansa kapi tautoloji olurdu: her yeni deger
      #            kendini izinli yapardi). Bos/eksik deger GECERLI (alan opsiyonel).
      #   B IMZA   Degerler bir TEDARIKCI VITRININDEN olculerek turuyor ve depo PUBLIC:
      #            deger marka/firma adi, alan adi, urun kodu/SKU oneki tasiyamaz. Kural
      #            BEYAZ LISTE (gorulmemis imza turu sessizce gecmesin) + katalogun marka
      #            adlariyla carpisma taramasi.
      #   C YOL    duzelt.py alani YAZABILIYOR (yoksa veri asla dolmaz) ama KOR KABUL
      #            ETMIYOR: bilinmeyen/yanlis-kategorili deger rc=5 ile reddedilir ve
      #            urunler.json BYTE-ESIT kalir (tek-urun + TOPLU kip; kategori cevirme
      #            deligi dahil). GERCEK duzelt.py sentetik bir repoda kosturulur.
      #   D IKIZ   Kolon BES yerde tanimli (d1-sema.sql · GOC_KOLON · _KT_SEMA · satir_sql
      #     TANIM  INSERT · KOLONLAR) + urun_hash KAPSAMI. Hash kapsamasaydi altkategori
      #            degisimi satiri yeniden yazdirmaz, D1 sessizce bayat alt-filtre servis
      #            ederdi. Uretilen INSERT sqlite'ta FIILEN kosturulur (siralama kaymasi).
      # FAIL-CLOSED: izinli kume disindaki deger D1'e '' gider (pre-push hook d1-sync'i
      # bu kapidan ONCE kosar -> sizan deger Ege'ye/musteriye ULASAMAZ).
      # OFFLINE: canli D1/wrangler/AG YOK. Cift yonlu mutasyon (14 oldurucu KIRMIZI +
      # 2 ilgisiz YESIL + mutasyonsuz harness kontrolu) elle:
      #   python3 tools/altkategori-kapisi.py --mutasyon
      - name: "Alt kategori kapisi (izinli kume + tedarikci imzasi + duzelt yolu + ikiz tanim)"
        run: python3 tools/altkategori-kapisi.py

      # ALT KATEGORI TAKSONOMISI + UC GECISLI SINIFLANDIRICI (tools/altkategori-sinifla.py).
      # Yukaridaki kapi alanin VERI YOLUNU olcer; bu test KUMENIN KENDISINI ve urunu gruba
      # DUSUREN KURALI olcer. OLCULEN BASLANGIC (2 Agu): alt kategori tanimli TEK kategori
      # Marin'di (12 deger) ve katalogun %94'unde alan BOSTU -> kategori sayfalari yiginla
      # aciliyordu. Kume 6 kategoriye / 60 degere cikti. Kilitlenen eksenler:
      #   K KUME    Her deger imza nobetinden AYRI AYRI geciyor; Marin'in 12 MIRAS degeri
      #             BAYT-ESIT korunuyor (935 kayit onlari kullaniyor, bir harf sessizce
      #             hepsini gecersizlestirirdi) ve hicbir iki deger ayni normalize
      #             anahtara katlanmiyor.
      #   E ESIK    <100 urunlu kategoriye kume TANIMLI DEGIL, <15 urunlu grup kumede YOK
      #             — ikisi de GERCEK katalogda olculuyor, kagitta kalmiyor. Elenen
      #             adaylar gerekcesiyle kayitli (yeniden "kesfedilip" tartisilmasin).
      #   S SIRA    Artik kova oncelikte EN SONDA: daha belirgin bir yer/sistem grubuna
      #             dusen urun kovaya GITMEZ (kova one kayarsa yigilma cozulmez, TASINIR).
      #   T TURETME 2. gecis (yakinlik) sozlugu 1. GECIS CIKTISINDAN turer; elle yazilmis
      #             kelime listesi YOK — 1. gecis degisince 2. gecis atamasi da degisiyor.
      #   D DETERM. Ayni girdi ayni cikti; girdi SIRASI sonucu degistirmiyor.
      #   F FAIL-   Siniflandirici kume DISI deger URETEMEZ (tek kaynak arama.py'deki
      #     CLOSED  kumedir) ve urettigi her deger duzelt.py kapisindan da geciyor.
      # 🔴 SINIFLANDIRICI urunler.json'a YAZMAZ, yalniz hesaplar (yazma yolu duzelt.py).
      # OFFLINE: urunler.json yalnizca OKUNUR. Cift yonlu mutasyon (6 oldurucu KIRMIZI +
      # 1 ilgisiz YESIL + mutasyonsuz harness kontrolu) elle:
      #   python3 tools/altkategori-sinifla-test.py --mutasyon
      - name: "Alt kategori taksonomisi + siniflandirici kabul testi"
        run: python3 tools/altkategori-sinifla-test.py

      # UYUM EKSENI (`uyum`: marka/model/motor/yil/oem) — urunun NEYE UYDUGU.
      # Kategori "urun NE" der, uyum "neye takilir" der; ikisi tek agaca binince yigilir
      # (tools/paket-uyum-ekseni.md). Bu ADIMDA TUKETICI YOK — urun_hash'e girmez, D1
      # kolonu yoktur, sayfa uretmez: sozluk main'e ONCE iner, parti SONRA yazilir
      # (ters sira `Elektrik` kaleminde fail-closed reddedildi).
      # Dort sessiz-hata sinifi kilitlenir:
      #   S SOZLUK  Marka KAPALI kume (169 deger). Kume ICINDE ikiz olamaz (`Mini`/`MINI`
      #             ayni normalize degere dusemez) ve ikiz yasagi marka/model SINIRINDA da
      #             gecerlidir (`Kia` kumedeyken `KIA` model olarak yazilamaz). Uretici
      #             markalari (NGK/Tecnoseal/Teleflex/Bosch...) AYRI kumede ve uyum
      #             ekseninde GECERSIZ — "NGK" diye sahte marka sayfasi acilamaz. Budama
      #             SAYIYLA DEGIL KIMLIKLE korunur: yargilanmis bolumlemenin (139/13/17)
      #             IMZASI donmustur, yani bir jetonu ELENEN'den IZINLI'ye TASIMAK —
      #             birlesim sabit kalsa BILE — kapiyi KIRMIZI yakar. Mesru genisleme
      #             MIMAR EKI kumeleridir ve imzaya GIRMEZ.
      #   V SEMA    Kume disi/yakin yazim/bozuk tip/ters yil araligi/enjeksiyon RED; ' Ford'
      #             SESSIZCE KIRPILMAZ (bu depoda `altkategori`de OLCULEN kusur: katalog
      #             ham, D1 kirpilmis deger alir ve hicbir hash ekseni gormez).
      #   K IKIZ    `marka` = tekillestir(uyum[].marka + uyum[].model); elle yazilmis/
      #     TANIM   sirasi kaymis/YALNIZ markadan turetilmis deger KIRMIZI. Model DE girer
      #             cunku `marka` bugun haystack'e giriyor ve model jetonu tasiyor —
      #             yalniz markadan turetmek arama yuzeyini SESSIZCE daraltirdi.
      #             `uyum` bos ESKI kayitta bu dal hic calismaz (regresyon 0).
      #   A KATALOG Gercek 16.874 kayit taranir (yalniz OKUNUR); 13.616 gercek kayitta
      #             turetilen `marka` == bugunku `marka` olculur + backfill hazirligi.
      #             🔴 BLOKLAYAN SEY IHLAL OLMALI, HAZIRLIKSIZLIK DEGIL: temsil edilemeyen
      #             girdi (mukerrer jeton, kanonik olmayan marka yazimi) ELE kovasina
      #             yazilir, SAYILIR, RAPORLANIR ama rc'yi BOZMAZ. Bu adimin tuketicisi
      #             YOK; hazirlik olcumu bes evin yayinini durdurma yetkisine sahip degil.
      # FAIL-CLOSED: gecersiz `uyum` -> [] (urun KAYBOLMAZ, kendi kategorisinde bulunur).
      # OFFLINE: ag/D1/wrangler YOK. Cift yonlu mutasyon bataryasi UC SINIF kosar; sayilari
      # BURADA TUTMUYORUZ (bayat sayi yanlis guven verir) — arac kendi basar:
      #   OLDURUCU    gercek bozulmalar (kapali kume uyelik testinin kalkmasi · ' Ford'un
      #               SESSIZCE kirpilmasi · ikiz tanim kontrolunun silinmesi · turetimin
      #               YALNIZ markaya dusmesi ya da sirasinin kaymasi · marka/model
      #               sinirindaki ikiz yasaginin kalkmasi · jetonun ELENEN'den IZINLI'ye
      #               TASINMASI · ayirac KONUM kuralinin kalkmasi (path/enjeksiyon) ·
      #               arama takmasinin hic eklenmemesi ya da kosulsuz eklenmesi · kapali
      #               bilesik tabloya denetimsiz giris) -> beklenen iddia KIRMIZI, FAZLASI
      #               DA KUSUR: olcut ESIT, "beyan kirmizinin alt kumesi" DEGIL.
      #   KONTROL     bozulma OLMAYAN degisiklikler (davranissiz ad degistirme · tablonun
      #               ayni ICERIKLE farkli sozdiziminde kurulmasi · kapali sinif kumesine
      #               KULLANILMAYAN deger eklenmesi) -> YESIL kalmali; kapi metni degil
      #               icerigi okumali, yanlis-pozitif bes evin yayinini durdurur.
      #   FAIL-CLOSED kanonik dogrulama dusurulmusse ya da red kaydinin BICIMI taninmiyorsa
      #               varsayilana DUSULMEZ, KIRMIZI yanar (bu depoda olculen delik: eskiden
      #               rc=0 ile sessizce geciyordu). Beyan kapisi bozuk/mukerrer kayitta
      #               mutasyonu HIC kosturmaz, rc=1.
      # M00 MUTASYONSUZ HARNESS KONTROLU one kosar ve TABAN IDDIA SAYISINI OLCER (sabit capa
      # DEGIL): bir mutant altinda sayi duserse o KIRMIZI olcum SAYILMAZ, harness bozuk denir.
      # Mutasyon DAIMA KOPYAYA: canli arama.py + marka_katla.py sha256'si bas/son basilir ve
      # esit degilse kirmizi yanar. Elle:
      #   python3 tools/uyum-kapisi.py --mutasyon
      - name: "Uyum kapisi (kapali marka sozlugu + sema + ikiz tanim + enjeksiyon)"
        run: python3 tools/uyum-kapisi.py

      # YAZIM YOLU KOLU — yukaridaki IKI kapi (altkategori + uyum) KATALOG GENELINI
      # olcer ve YAYINDAN SONRA konusur; bu adim onlarin COMMIT ANINDAKI kardesini
      # (tools/katalog-alan-kapisi.py + pre-commit adim 5) olcer.
      # OLCULEN BASLANGIC (8 Agu 2026): toplu ekleme yolu urunler.json'a DOGRUDAN
      # yaziyor ve duzelt.py'nin IKI fail-closed kapisini birden atliyordu
      # (_altkategori_ihlalleri / _uyum_ihlalleri). Bir partide 5 kayit bozuk main'e
      # girdi (1 izinsiz `altkategori`, 5 elle yazilmis `marka` ikizi); ariza SAATLER
      # SONRA bu seritte gorundu ve deploy ATLANDI (3,5+ saat yayin kaybi). Yani
      # CI kolu tek basina YAYIN GECIKMESIDIR, ONLEME DEGIL.
      # Kilitlenen eksenler (surucu kendi sentetik depolarini kurar; gercek
      # urunler.json yalniz OKUNUR, gercek .git'e HICBIR SEY yazilmaz):
      #   A KIRMIZI  iki eksen AYRI vakalarda tek tek kirmizi yakar — tek bir "ikisi
      #              birden bozuk" vaka katmanlarin VEYA'sini olcerdi.
      #   B YESIL    bugunku 22.698 kaydin TAMAMI "yeni" sayildiginda yanlis-pozitif
      #              YOK; mesru fiyat duzeltmesi ve saf siralama degisimi de yesil.
      #   K KAPSAM   HEAD'de duran eski ihlal, ILGISIZ bir commit'i KILITLEMEZ
      #              (paylasilan checkout'ta baska mimarin yarim partisi tuzagi).
      #   E EKSEN    hukum INDEX'ten turer; stage EDILMEMIS bozukluk bloklamaz.
      #   O rc=2     bozuk JSON / arama.py yok / arguman -> OLCULEMEDI, YESIL DEGIL.
      #   KOK+INDEX  kok `__file__`dan turer (kanca GIT_DIR tuzagi) AMA git cagrilarinin
      #              ortami TEMIZLENMEZ (GIT_INDEX_FILE commit'in GERCEK index'idir);
      #              iki tuzak AYRI AYRI, ayirt edici kontrolle olculur.
      #   MUT        iki dogrulama kolu AYRI AYRI oldurulur; her mutant kendi eksenini
      #              dusururken OTEKINI ayakta birakmali.
      # FIYAT TIPI KATALOG GENELI — BLOKLAYICI (continue-on-error YOK). `fiyat` varsa
      # JSON STRING olmalidir; "" sari/parametrik seri icin bilerek gecerlidir. Sayi,
      # null, liste ve sozluk build.py `.strip()` koluna ulasmadan burada durur. Bu
      # dogrudan kapi cagrisi gercek index blob'unu olcer; asagidaki kabul testi ise
      # sentetik iki yonlu fiksturla kapinin kendisini sinar. Job `serit-a2`, `deploy`
      # needs zincirindedir: bozuk katalog yayinlanamaz.
      - name: "Katalog alan kapisi (fiyat tipi + commit ani alanlar)"
        run: python3 tools/katalog-alan-kapisi.py

      - name: "Katalog alan kapisi kabul testi (commit ani altkategori + uyum kolu)"
        run: python3 tools/katalog-alan-kapisi-test.py

      # KATALOG ALAN-TIP SEMASI KABUL TESTI (13 Agu): tip ekseni tek alandan (`fiyat`)
      # kanonik semaya (arama.KATALOG_ALAN_TIPLERI, 15 alan) cikarildi; kapsam elle
      # sayilmaz, semadan turer ve bilinmeyen alan "TIP TANIMI YOK" diye fail-loud yanar.
      # 9 iddia (mesru varyantlar dahil: bos fiyat/bos marka/marka yok/lisans yok/
      # parametrik false) + 4 oldurucu mutant (M1..M4). Bloklayici: sema ikinci kez
      # kopyalanirsa kapi ile test sessizce ayrisir (ikiz-tanim sinifi).
      - name: Katalog alan-tip semasi kabul + mutant testi
        run: python3 tools/katalog-tip-sinifi-test.py

      # ALT KATEGORI MUSTERI YUZEYI. Yukaridaki kapi alanin VERI/D1 yolunu korur; bu adim
      # o verinin MUSTERIYE GORUNEN yuzunu korur — ikisi AYRI eksendir, veri yolu yesilken
      # yuzey sessizce yok olabilir (1 Agu'a kadar OYLEYDI: 935 dolu kayit, gorunur yuzey 0).
      # Kilitlenen dort sey:
      #   A YUZEY    dolu kayitta etiket urun sayfasinda GORUNUYOR (12 tekil degerin hepsi
      #              GERCEK urun sayfasinda olculur, fikstur degil).
      #   B SEMA     Product.category "Ust > Alt" yolu; BOS degerde 'Marin > ' gibi ucu acik
      #              yol YOK, YENI anahtar YOK, anahtar SIRASI kaymiyor (test-jsonld-* ile
      #              bayt-esitlik korunur); BreadcrumbList DEGISMEDI (ara dugumun URL'i
      #              henuz yok -> kirik adres yerine dugum HIC acilmiyor).
      #   C REGRESYON dolu sayfa − (cip + category yolu) == bos sayfa BAYT-ESIT; PAYLASILAN
      #              CSS'e kural EKLENMEDI (eklenseydi 15.939 altkategorisiz sayfanin bayti
      #              da kayardi); komsu izolasyonu.
      #   D FAIL-SAFE bos/alan-yok/None/liste/sayi/sozluk/izinsiz/bosluklu/imzali/enjeksiyon
      #              -> URETIM COKMEZ ve cikti ALANSIZ sayfayla BAYT-ESIT (sizma 0).
      #   E TEK KAYNAK etiket arama.altkategori_kanonik'ten gelir; build.py'de izinli kume
      #              KOPYASI YOK ve kume genisleyince yuzey ANINDA gosterir.
      # OFFLINE: ag/D1/wrangler YOK, DISKE YAZMAZ (render_product bellekte). ~10 s.
      # Cift yonlu mutasyon (6 oldurucu KIRMIZI + 2 ilgisiz YESIL + M00 kontrol) elle:
      #   python3 tools/altkategori-yuzey-test.py --mutasyon
      - name: "Alt kategori musteri yuzeyi (urun sayfasi etiketi + JSON-LD + regresyon)"
        run: python3 tools/altkategori-yuzey-test.py

      # 2-RENK YAZI EK UCRETI (shop odeme yolu — KARSILIGI OLMAYAN TAHSILAT kapisi). Cerceve
      # ailesinde yazi rengi farkli secilince fiyata +75 TL ekleniyordu; olcum bunu curuttu
      # (ayni geometriyle yazi='' / 'OKAN' / 'WWWWWWWWWWWW' -> uc STL de 65284 bayt / 1304
      # ucgen / SHA-256 BIREBIR AYNI: yazi uretilen govdeye HIC girmiyor). Ucret secenekler.js
      # IKI_RENK_EK_KURUS TEK KAYNAGINDAN 0'a cekildi. Bu adim shop/src/index.js'in KENDISINI
      # node'a yukleyip (setup-node yukarida BLOKLAYICI on-kosul) sahte D1 + sahte iyzico ile
      # kosar ve fiyati Worker'in D1'e YAZDIGI satirdan okur: (1) 2-renk kalem tam 7500 kurus
      # UCUZLADI, yazisiz/ayni-renk kalem DEGISMEDI, 3x tavan ve dar-kenar reddi DEGISMEDI,
      # (2) ON YUZ (jenerator/konfigurator.js, sahte DOM ile gercek satiraYaz) ile Worker
      # kurusu kurusuna ESIT — ayrisirsa gosterilen != tahsil edilen olurdu, (3) 23 parametrik
      # ailede varsayilan olcu fiyatlari BIREBIR ayni, (4) VAKUM: sabit 7500'e geri alinirsa
      # iddia KIRMIZI yanar (olu-nobetci korumasi), (5) front/Worker kaynaginda IKINCI bir
      # 7500 sabiti kalmadi. "ESKI" fiyatlar git HEAD kaynaklarindan AYNI yolla olculur.
      # OFFLINE: wrangler YOK, ag YOK, gercek/sahte SIPARIS YOK, repo dosyasi YAZILMAZ. ~2 s.
      - name: 2-renk yazi ek ucreti kabul testi (karsiliksiz tahsilat kapisi)
        run: node shop/test/iki-renk-ucret.mjs

      # D1 YAZMA GERI-OKUMA (write-verify) KABUL TESTI — BLOKLAYICI (continue-on-error YOK).
      # OLCULEN OLAY (31 Tem): d1-sync tek alan degisimini "degisen: 1 / 5 satir yazildi" diye
      # BASIP exit 0 dondu, canli D1'deki deger ESKI KALDI. Hata sinifi SESSIZ: site urunu
      # dogru gosterir (urunler.json'dan), Ege (WhatsApp botu) D1'den okudugu icin BAYAT veri
      # gorur -> musteri urun varken kaybedilir, hicbir yerde alarm calmaz. --durum'un SAYI
      # ekseni bunu GOREMEYECEKTI: alan guncellemesi satir sayisini DEGISTIRMEZ.
      # NE KANITLAR: yazma sonrasi geri-okumanin POZITIF ve NEGATIF vakalari (sahte "yazildi",
      # satir VAR ama alan ESKI = olayin birebir fikstruru, silme kacmasi, hedefli sema kolonu,
      # ornekleme yasagi, yeniden deneme, --kuru'nun yazmamasi, geri-okuma patlayinca
      # OLCULEMEDI) + --durum icerik ekseni + YANLIS-POZITIF nobeti (degisiklik yok / normal
      # urun partisi YESIL kalmali — bu arac pre-push hook'unda kosuyor, yanlis-pozitif TUM
      # mimarlarin push'unu kirar). OFFLINE: sqlite bellek-ici fikstur, ag/wrangler/D1 YOK,
      # urunler.json OKUNMAZ (gecici dosya), ~1 s.
      - name: D1 yazma geri-okuma kabul testi (write-verify + icerik ekseni)
        run: python3 tools/d1-sync.py --kendini-test

      # SHOP BAYATLIK KAPISI (tools/shop-bayatlik-kapisi.py) — bu adim OFFLINE kabul testidir.
      # NEDEN VAR: bu is akisinda `wrangler deploy|publish` VURUSU 0'dir (olculdu 3 Agu) —
      # shop Worker'i CI'da HIC yayinlanmiyor, elle deploy bekliyor ve beklerken alarm YOKTU.
      # Olculen bedel: canli bundle 13 sa 15 dk bayat kaldi; main yesil, CI yesil, site taze,
      # ODEME YOLU eski kodu kosuyordu (ayni sinif 30 Tem ve 1 Agu'da da PARA maliyeti uretti).
      # Bu test 39 iddia kosar: bundle dosya kumesinin ITHALAT GRAFINDEN turetilmesi (elle
      # liste `secenekler.js` / `jenerator/*`'i kacirirdi), canli surum yorumu (secret
      # degisimi nesli TAZELEMEZ; geri alma; bilinmeyen tetik -> OLCULEMEDI), 120 dk esiginin
      # IKI YONU (119 -> bekliyor / 121 -> bayat), sig checkout'ta gecmisin acilmasi ve
      # uctan uca OLDURUCU+KONTROL cifti. Curutme kaniti: tools/shop-bayatlik-mutasyon.py
      # (16 mutant, kontrol mutanti dahil; CI adimi DEGIL).
      #
      # 🔴 NEDEN SERIT A (job `build`, BLOKLAYICI): bu kol OFFLINE ve DETERMINISTIK — ag,
      # wrangler, Cloudflare yetkisi ISTEMEZ, dolayisiyla yanlis-pozitif kaynagi degildir.
      # Olculdu: adim once serit B'ye (`serit-b` job'una) dusmustu ve `is-akisi-kapisi.py`
      # BEYANSIZ SERIT B kapisi diye KIRMIZI yakti — hakliydi: orada kirmizi yansa da
      # `deploy` kosardi, yani "bloklayici" iddiasi YALAN olurdu.
      #
      # 🔴 CANLI KOL BURADA KOSMAZ — BILEREK (fiziksel-canli-kapisi ile AYNI gerekce):
      # canli olcum aga + Cloudflare yetkisine bagimlidir, yanlis-pozitifi TUM EKIBIN
      # yayinini durdurur ([[kapi-kapsam-eksen-secimi]]). Canli kolun evi
      # `paket-tazelik-alarmi.yml` (cron 15 dk, `push` tetigi YOK, deploy'a `needs` ile
      # BAGLI DEGIL) — orada kirmizi GORUNUR ama yayin yoluna maliyeti 0 sn'dir.
      # Elle kosum:  python3 tools/shop-bayatlik-kapisi.py
      # Offline, agsiz, wrangler'siz, depo agaci DEGISMEZ, ~2 s.
      - name: Shop bayatlik kapisi — kendini test (offline karar mantigi + esik nobeti)
        run: python3 tools/shop-bayatlik-kapisi.py --kendini-test

      # WA PREFILL KAPISI: urun sayfasindaki BAGLAM-KOR olmamasi gereken iki WhatsApp
      # linki (organik "Bizimle Iletisime Gecin" help-cta-btn + mühendislik malzeme notu)
      # prefill'inde urun ADI + canonical URL tasir; Turkce karakterler TEK KEZ dogru
      # percent-kodlanir (double-encode yok, numara = WHATSAPP sabiti, arama 4005 asla).
      # NIYET EKSENI de olculur: help-cta "aradigimi bulamadim" niyetini tasir ve
      # "bu urunu istiyorum" DEMEZ (yanlis niyet Ege'yi yanlis akisa sokar, baglamsizdan
      # beter); malzeme notu ise KENDI niyetini (malzeme/ozel uretim) korur. REF/atif
      # butonu (orderAlt) regresyon nobeti: ad+URL+"ilgileniyorum" bozulmamis olmali.
      # NUMARA NOBETI 4 DUZLEMDE: urun sayfasi + index.html + tools/sayfalar.py'nin
      # URETILEN cikti korpusu (168 icerik/yasal sayfa) + elle yazilmis statik yasal
      # sayfalar. Her belgede: tum WhatsApp URL bicimleri (wa.me/api./web.whatsapp.com/
      # whatsapp://), ters yon (tel:/JSON-LD telephone-contactPoint/pv-kodlu kunye
      # telefonu), JS telefon sabitleri (var WHATSAPP / TARGET_PHONE) ve GORUNUR metne
      # basilan +90 literalleri dogrulanir; ayristirilamayan numara fail-closed KIRMIZI.
      # NOT: "toplu link silme" sinifi (CTA'larin komple kaybi) BILEREK olculmuyor —
      # denenen kapinin yakalama katkisi 0, sahte-kirmizi bedeli devasadi (bkz. testin
      # kor nokta 9 maddesi). O ariza gorunur/gurultuludur; sessiz olan numara ihlalidir.
      # Test kendi kabul fiksturlerini de kosar: 11 kirmizi mutasyon + 14 "ILGISIZ rutin
      # duzenleme YESIL kalmali" fiksturu (kapinin kapsamini yanlis eksene kaymaktan korur;
      # ikincisi olmadan renk/etiket/tipografi gibi alakasiz duzenlemeler TUM deploy'u
      # durduruyordu — bagimsiz curutucu olcumu). Fikstur capasi kaybolursa KIRMIZI degil
      # "OLCULEMEDI" basar; hicbir kirmizi fikstur kosamazsa (olu nobetci) kirmizi yanar.
      # Offline, sentetik fikstur, urunler.json OKUNMAZ, dosya yazmaz; render_product ve
      # render_content_page'i dogrudan cagirir -> build.py'den ONCE kosar, ~1,6 s.
      - name: WhatsApp numara/prefill kabul testi (urun + ana sayfa + yasal sayfalar)
        run: python3 tools/test-wa-prefill-organik.py


      # MARKA->MODEL PILOT KAPISI: marka_model_build jeneratorunu izole temp ROOT'a kosar ve
      # uretilen HTML'i spec kabul kriterleriyle olcer — collision (F-150 tek URL), >=3 esik,
      # SSR icerik + self-canonical + ItemList/CollectionPage/BreadcrumbList JSON-LD + sitemap
      # lastmod, huni wa.me prefill + attribution modulu, token sizinti, marka kurallari (authored
      # copy'de 3d/baski/filament/sehir/'her renk'/532 YOK), oksuz-yok (pilot markanin tum urunleri
      # linkli). build.py'nin urun/ ciktisina MUHTAC DEGIL (modulu dogrudan cagirir), ~1 s. Offline.
      - name: Marka->model pilot kabul testi (Ford + BMW)
        run: python3 tools/marka-model-test.py

      # SITEMAP LASTMOD KAPISI: 11 Agu 2026'ya kadar canli sitemap'teki 26.696 URL'in
      # HEPSI ayni <lastmod>'u (build tarihi) tasiyordu -> Google'a her gun "her sey
      # bugun degisti" deniyordu (olculdu: benzersiz lastmod = 1; tarama isteklerinin
      # %93'u Refresh). Tarih artik git gecmisinden TURETILIR (tools/sitemap_damga.py);
      # turetilemeyen URL'de etiket HIC BASILMAZ. Kapi kararliligi (iki uretim birebir
      # ayni), tekil degisimi (yalniz degisen URL'in tarihi oynar), uydurma-tarih
      # yasagini ve 5 mutanti (4 KIRMIZI + 1 KONTROL YESIL) olcer. Sentetik git
      # deposu kurar, gercek depoya YAZMAZ; offline, stdlib, ~25 s.
      - name: "Sitemap lastmod kapisi (gercek icerik-degisim tarihi + mutasyon)"
        run: python3 tools/sitemap-damga-test.py

      # ROBOTS KAPISI: parametreli URL'ler (?kategori= ?marka= ?ara= ?sepet=) tarama
      # butcesi yiyor. EN BUYUK RISK FAZLADAN KAPATMAK: canli sitemap'te yolunda "ara"
      # gecen 2.169, "marka" gecen 1.147 kanonik URL var — sorguya capalanmamis tek bir
      # desen hepsini kapatir. Kapi, kanonik urun/marka/ana sayfa/sitemap.xml'in ACIK
      # kaldigini ve dort bicimin (hem ?<ad>= hem &<ad>=) KAPALI oldugunu RFC 9309
      # ornek tablosuyla dogrulanmis eslestiriciyle olcer + 5 mutant. Offline, ~10 s.
      - name: "Robots parametreli URL kapisi (yanlis-pozitif + genisletme mutanti)"
        run: python3 tools/robots-kapisi-test.py

      # YASAL SAYFA DRIFT KAPISI: build.py IZLENEN 4 elle yazilmis sayfayi (gizlilik /
      # hakkimizda / iletisim / sss) YERINDE yeniden yazar. Fault injection ile olculdu
      # (30 Tem): gizlilik/index.html bayatlatildiginda depodaki 6 kapinin 6'si YESIL
      # kaldi (sapmayi yakalayan kapi YOKTU) ve build.py kosunca sayfa kanonige geri
      # yazilip agac temizlendi -> elle/bayat icerik SESSIZCE ezildi. Bu kapi
      # "build.py'nin URETTIGI icerik == HEAD'deki icerik" iddiasini olcer; taban HEAD
      # oldugu icin adimin build'den once ya da sonra gelmesi hukmu DEGISTIRMEZ
      # (sira-bagimli disk karsilastirmasi fail-open olurdu). Kapi kendi kosumunda
      # sayfalari AYNEN geri koyar ve porcelain + sha256 esitligini kendi olcer.
      # Offline, stdlib, ~12 s (suresi build.py'nin kendisidir).
      - name: "Yasal sayfa drift kapisi (build.py uretimi == commit'li icerik)"
        run: python3 tools/yasal-sayfa-drift-kapisi.py
      # ATA ZINCIRI (ata-lisans-kapisi): depodaki TUM lisans kapilari kaynak-platform-ICI
      # bakiyordu; turev kaydin ATASININ lisansi hicbir kapinin ekseninde DEGILDI. Dort canli
      # emsalde ata referansi `license` BOS + kimlik 0 geldi, ata ANCAK serbest-metin linkin
      # HOST'undan cozuldu ve dordu de NC (SATILAMAZ) cikti — hicbir test kirmizi yanmadi.
      # Buradaki iki cagri OFFLINE'dir (kapinin oz-denetimi + uydurma fiksturlu kabul testi);
      # ag isteyen `--kuru-kosum` kolu CI'da KOSMAZ. Bagimsiz curutucu ilk surumde 12 SESSIZ
      # GECIS olctu (rc=0 ile gecen NC/cozulmemis ata); her delik icin D-iddiasi + AYRI
      # oldurucu mutant eklendi. Mutasyon bataryasi (surucu repoda, sayiyi GUNCEL TUT):
      #   python3 tools/ata-lisans-mutasyon.py   (oldurucu 20/20 KIRMIZI, kontrol 3/3 YESIL)
      - name: Kaynak/lisans kabul testleri (makerworld + printables + havuz + entegrasyon + ata zinciri)
        run: |
          python3 tools/makerworld-ara-test.py
          python3 tools/marka-cok-kelime-test.py
          python3 tools/k63-k64-mutasyon.py
          python3 tools/makerworld-lisans-test.py
          python3 tools/printables-lisans-test.py
          python3 tools/lisans-havuz-test.py
          python3 tools/kaynak-entegrasyon-test.py
          python3 tools/thingiverse-gallery-test.py
          python3 tools/ata-lisans-kapisi.py --kendini-test
          python3 tools/ata-lisans-test.py
      # YAYIN EKSENI: uretilen sayfalarda piksel/riza, script surumleme (4 saatlik
      # tarayici onbellegi) ve Google Merchant feed g:id 50-karakter siniri.
      - name: Yayin cikti kabul testleri (meta piksel + surum damgasi + merchant feed)
        run: |
          python3 tools/meta-piksel-test.py
          python3 tools/surum-test.py
          python3 tools/test-merchant-feed.py
      - name: Jenerator fiyat/sema kabul testi (varsayilan hacim + PLA taban fiyati)
        run: node jenerator/test/fiyat-test.js

      # KALIBRASYON SENKRON KAPISI (PARA — hacim.js parametrik urunun TAHSILAT
      # tabanidir: hacim x malzeme x taban fiyat). 3 Agu'ya kadar CI-MUAFTI ve
      # OLCULDU ki muafiyet gerekcesinin IKI dayanagi da YANLISTI:
      #   (a) "kalan kol TEMIZ checkout'ta 25,2 s surer" -> olculen 1,3 s; 25,2 s
      #       FIGURU kardes-ev katmanini DA iceren TAM kosumundu.
      #   (b) "cekirdek iddia kardes ev olmadan olculemez" -> dogruydu ve TAM DA
      #       BU YUZDEN delik acikti: `yay` ailesine konan +%5 TAHSILAT mutanti
      #       (musteriden fazla para) kardes ev VARKEN 26 kontrolu kirmizi
      #       yakiyor, kardes ev YOKKEN (yani CI'da) TAM YESIL geciyordu. Ayni
      #       mutant `build` + `serit-b` islerinin 134 kosulabilir adiminin
      #       HICBIRINDE kirmizi yakmadi (olculdu 3 Agu, kapi x mutant tablosu).
      # COZUM fikstur: jenerator/test/kaynak-referans.json — kalibrasyon
      # kaynagindan (hacim.js'ten DEGIL) uretilmis 12 aile / 300 set; kapsam
      # DAR ve BEYANLI (motor=uretim aileleri ile bugun sapan rampa/profil
      # `disi_birakilan` tablosunda OLCULEN sapmalariyla durur, beyansiz aile
      # OLCULEMEDI/rc 2 yakar). Fikstur ureteci CI'da KOSMAZ (referansi ezerdi).
      # SERIT A (`build`) BILEREK: `deploy` YALNIZ `build`'e baglidir, yani
      # buradaki kirmizi yayini GERCEKTEN durdurur; serit-b'ye konsaydi delik
      # kapanmis GORUNUR ama kapanmazdi. Kardes ev YOKKEN 39 iddia, ~3,5 s;
      # node ZORUNLU (setup-node yukarida bloklayici on-kosul), offline,
      # depoya YAZMAZ.
      - name: Kalibrasyon senkron kapisi (hacim.js tahsilat tabani — dondurulmus kalibrasyon kaynagi)
        run: node jenerator/test/kalibrasyon-senkron.js

      # YAYIN IC-DIL KAPISI — KAYNAK KOLU (build'den ONCE; asagidaki yayin kolunun ERKEN
      # ikizi). NEDEN: yayin kolu ancak build.py'den SONRA olcebiliyor; tarayiciya AYNEN
      # inen bir KAYNAK dosyaya (index.html satir-ici <script> yorumu) ic dosya yolu yazan
      # bir degisiklik dalda hicbir yerde kirmizi yanmadi, main'e girdi ve CI'yi ~4 dakika
      # sonra dusurdu -> deploy + yayin SKIPPED, yayin durdu (31 Tem). Bu kol AYNI sozlugu
      # ve AYNI yorum lexer'ini build GEREKTIRMEDEN uygular; ikinci sozluk YOK, yalniz
      # kapsam degisir. Yayin kolunun YERINE GECMEZ (uretilen sayfalar orada olculur).
      # SERIT: A (build) — SIZINTI kapisidir, yayini DURDURMALI. SERIT B'ye konsaydi
      # tarayiciya inen kaynak dosyadaki ic-yol ifsasi yayina cikardi.
      - name: Yayin ic-dil kapisi — KAYNAK kolu (build'den once)
        run: python3 tools/yayin-ic-dil-kapisi.py --kaynak

      # YORUM SOYUCU: build.py'nin _yayin/ kopyalarini uretirken kullandigi lexer.
      # Kendini-testi (46 iddia) + BAGIMSIZ tuzak fiksturleri & kirmizi-mutasyon kapisi
      # (17 fikstur / 10 mutant). build.py'den ONCE kosar: soyucu bozuksa yayin
      # kopyasi hic uretilmesin. Offline, stdlib (node varsa `node --check` de kosar).
      - name: Yorum soyucu kabul testi + kirmizi-mutasyon kapisi
        run: |
          python3 tools/yorum_soy.py --kendini-test
          python3 tools/yorum-soy-test.py
  # ══════════════════════════════════════════════════════════════════════════════
  # SERIT A3 — agir bagimsiz kapilar (piksel<->katalog parite capasi)
  #
  # 🔴 BU IS YAYINI BLOKLAR: `deploy: needs:` listesinde ADI GECER. Kirmizi yanarsa
  # `deploy` ATLANIR (fail-closed sozlesme AYNEN korunur — tek serit oldugu zamanki
  # gibi). Adi `deploy.needs`'ten dusurulurse buradaki kapilarin kirmizisi yayini
  # DURDURMAZ; tools/is-akisi-kapisi.py::_serit_b_joblar bunu GECISLI olarak olcer ve
  # beyansiz kapi basina KIRMIZI yakar (SERIT_B tablosuna giris ekleyerek SUSTURMA —
  # dogru cozum seridi `deploy.needs`'e geri koymaktir).
  #
  # NEDEN BOLUNDU (olculdu, kosum 30838521694): tek serit `build` 1487 sn (24,8 dk)
  # suruyordu ve `concurrency: group: pages` yuzunden yayin tavani 1 deploy/build idi
  # -> parti push'larinin ~%85'i kendi deploy'unu alamiyordu. Kapilar N bloklayici
  # serite bolununce duvar saati max(serit)'e duser; kapi SAYISI ve SEMANTIGI aynidir.
  # Bu bir TASIMA isidir: hicbir kapinin cagri satiri/argumani DEGISMEDI.
  #
  # BEDEL (durust beyan): serit basina checkout+setup tekrari (~21 sn x serit).
  # Toplam runner 1490 sn -> ~1528 sn (+%3); duvar saati 1490 -> ~563 sn (-%62).
  #
  # ⚠️ fetch-depth: 0 HER SERITTE korunur. Gerekce OLCULDU: bu is akisinda git
  # gecmisi okuyan EN AZ 9 kapi var (diriltme-kapisi `git log -p --first-parent`,
  # kisisel-veri-test `rev-list`, konfigur/kalibrasyon `git show`, d1-sync `merge-base`
  # ...). Sig checkout kazanci ~8 sn/serit (checkout 11 sn olculdu) — yani ~%1,5;
  # buna karsilik yanlis serite sig checkout koymak kapiyi OLCULEMEDI'ye (rc 2)
  # dusurur. Kazanc kucuk, risk sessiz: derin checkout HER SERITTE KALIR.
  # ══════════════════════════════════════════════════════════════════════════════
  serit-a3:
    runs-on: ubuntu-latest
    steps:
      # 🔴 fetch-depth: 0 ZORUNLU — tools/diriltme-kapisi.py "gecmiste SILINMIS urun id'si"
      # kumesini `git log -p --first-parent -- urunler.json` ile TURETIR (elle liste
      # TUTULMAZ; olculdu 30 Tem: 801 commit, ~68 MB diff, 4,2 s, 990 silinmis id).
      # actions/checkout VARSAYILANI `fetch-depth: 1` (SIG/shallow) ve o halde gecmis YOKTUR.
      # Bu satir dusurulurse kapi SESSIZCE yesile donmez: SIG depoyu tanir ve
      # OLCULEMEDI (rc 2) ile YAYINI DURDURUR (fail-closed).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pyyaml: is akisi BICIM kapisi (tools/is-akisi-kapisi.py) GERCEK bir YAML
      # ayristiricisi ister. Ayristirici YOKSA o kapi YESIL SAYMAZ (exit 2 = OLCULEMEDI)
      # -> bu satirdan pyyaml dusurulurse yayin durur, sessizce korumasiz KALMAZ.
      - name: Python bagimliliklari (boto3 - R2 testleri icin; pyyaml - is akisi kapisi)
        run: pip install boto3 pyyaml
      # Node: piksel<->katalog parite testinin JS-uc nobeti (index.html pruvoFeedId + olcum.js
      # feedId/metaGovdesi/ga4Govdesi) node ile kosar. FAIL-CLOSED: node yoksa test CI'da exit 1
      # verir (yalanci-yesil olamaz), o yuzden setup-node BLOKLAYICI bir on-kosuldur.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Kisisel veri sizinti kilidi — BILEREK BLOKLAYICI (continue-on-error YOK;
      # mukerrer-hook felsefesi): bu test kirmiziysa kisisel veri ham HTML'e siziyor
      # demektir, yayini erken durdurmak ucuz, sessiz sizinti pahali. JSON-LD
      # istisnasi testin icinde tanimli.
      # IS AKISI BICIM KAPISI — 29/30 Tem olayinin nobetcisi. deploy.yml'e TIRNAKSIZ, icinde
      # ": " tasiyan bir adim ADI eklendi -> YAML plain-scalar ayristirma hatasi -> GitHub
      # isi HIC baslatmadi (0 sn, startup_failure, is sayisi 0): urun/ uretimi, sitemap, TUM
      # kapilar ve Pages yayini kosmadi, ~7 dk tum ekibin yayini durdu. Hicbir kapi
      # yakalamadi cunku mevcut kapilar is akisi dosyalarinda METIN arar, YAML AYRISTIRMAZ.
      # Bu adim .github/workflows/*.yml dosyalarini GERCEK ayristiriciyla (pyyaml) ayristirir
      # + tekrarlanan anahtar / bos run: / gecersiz on:-jobs: iskeletini olcer + onizleme
      # 2-renk olcumunun CAGRI SATIRINI korur. Offline, dosya YAZMAZ, ~0,2 s.
      # ⚠️ SINIR: deploy.yml'in KENDISI bozulursa bu adim da kosmaz (hicbir adim kosmaz) ->
      # gercek koruma PUSH ONCESIDIR: `python3 tools/is-akisi-kapisi.py` (bkz. dosya basligi).
      # Adim adi BILEREK TIRNAKLI (bugunku hatanin ta kendisi).
      - name: "Is akisi bicim kapisi (YAML ayristirma: startup_failure nobetcisi)"
        run: python3 tools/is-akisi-kapisi.py

      # D1 UZLASTIRICI "ONARILAMADI" KOSUL KABULU (7 Agu 2026 onariminin nobetcisi).
      # d1-uzlastirici.yml'deki (3) ONARILAMADI adiminin `if:` kosulu GERCEK dosyadan
      # okunur ve GitHub kosul semantigi 5 vakada FIILEN calistirilir; 6. iddia bir
      # KONTROL MUTANTIDIR (eski `failure() && sapma=='var'` kosulu vaka-2'de YANLIS
      # KIRMIZI uretiyordu — kosum 31214568441'de olculdu). Mutant DUSMEZSE test
      # kirmizi yanar, yani "yesil" bos degil OLCULMUS bir iddiadir.
      # Offline, ag ISTEMEZ, dosya YAZMAZ, argumansiz, ~0,05 s. pyyaml ustteki
      # bagimlilik adiminda zaten kuruludur.
      - name: "D1 uzlastirici ONARILAMADI kosul kabul testi (fail-loud kolu)"
        run: python3 tools/d1-uzlastirici-kosul-test.py

      # YAYIN ACLIGI KAPISI (3 Agu) — "baslamis bir kosum oldurulup icerigi yayinsiz
      # kalabilir mi". Ustteki bicim kapisi YAML'in AYRISTIRILABILIRLIGINI olcer; bu kapi
      # ayni dosyanin ESZAMANLILIK SOZLESMESINI olcer: `concurrency.group` VAR mi,
      # `cancel-in-progress` FALSE mi, `deploy`->build / `yayin`->deploy zinciri kosulsuz
      # mu, ve E1'den OKUNAN ayarla art arda push senaryosu kosturuldugunda BASLAMIS her
      # kosum `deploy`ina ULASIYOR mu.
      # NEDEN `build` (serit-b DEGIL): dosyanin basindaki 20 satirlik gerekce YORUMDUR;
      # `cancel-in-progress: true`ya donen tek bir satir OLCULEN icerik kaybini geri
      # getirir (30 Tem: 7 ardisik iptal, 37,7 dk yayinsiz pencere, o pencerede eklenen
      # her urun canlida 404). Bloklayici serit, o satirin main'e GIREMEMESIDIR.
      # Offline, ag ISTEMEZ, dosya YAZMAZ, ~0,3 s.
      - name: "Yayin acligi kapisi (eszamanlilik sozlesmesi + yayin zinciri + simulasyon)"
        run: python3 tools/deploy-aclik-kapisi.py
      # Kapinin KENDI hukmu: 7 simulasyon fiksturu (ikisi KONTROL: seyrek push'ta `true` de
      # yesildir -> kirmizi bayragin DEGERINDEN degil senaryo DINAMIGINDEN dogar) + 8
      # mutant (biri KONTROL mutanti). Ustteki adim yesilken bu adim kirmizi ise nobetci
      # OLMUS demektir ([[mutasyon-kaniti-yeniden-uretilebilir]]).
      - name: "Yayin acligi kapisi ic nobetci (fikstur + mutasyon bataryasi)"
        run: python3 tools/deploy-aclik-kapisi.py --kendini-test

      - name: Kisisel veri korumasi testi
        run: python3 tools/kisisel-veri-test.py

      # IC RAPOR ADI KAPISI (4 Agu) — "isci->mimar rapor dosyasinin protokol adi
      # yorum/docstring METNI olarak PUBLIC repoya sizdi mi". kisisel-veri-test.py
      # ile AYNI eksende DEGIL (kisisel veri degil, sadece ic is akisi gorunurlugu);
      # BLOKLAYICI (continue-on-error YOK), yerel + deterministik, ag ISTEMEZ.
      - name: Ic rapor adi kapisi ic nobetci (fikstur + kontrol bataryasi)
        run: python3 tools/ic-rapor-adi-kapisi.py --kendini-test
      - name: Ic rapor adi kapisi
        run: python3 tools/ic-rapor-adi-kapisi.py

      # IC RAPOR ADI KAPISININ PRE-COMMIT KOLU (12 Agu 2026) — yukaridaki adimin
      # KIRMIZI yanmasinin MALIYETINI olcen kol. OLCULEN OLAY (kosum 31549865286):
      # izlenen kok deftere sizan protokol adi bu job'i kirmizi yakti, `deploy` +
      # `yayin` SKIPPED kaldi ve YAYIN DURDU — yani maliyet ihlalin buyuklugunden
      # degil YAKALANDIGI YERDEN geliyordu. Onarim commit anina bir CAGRI NOKTASI
      # ekledi (tools/ic-rapor-index-kolu.py, pre-commit adim 7). Bu batarya o
      # cagri noktasinin hukmunu GERCEK gecici depolarda + GERCEK `git commit`
      # ile yeniden uretir (kanca blogu VERBATIM cikarilir, yeniden yazilmaz).
      # BLOKLAYICI, agsiz, deterministik ([[mutasyon-kaniti-yeniden-uretilebilir]]).
      - name: "Ic rapor adi kapisi pre-commit kolu (19 vaka: arac + gercek kanca)"
        run: python3 tools/ic-rapor-kanca-test.py

      # KANCA KABLOSU DAVRANIS AYAGI (9 Agu 2026) — pre-push kapsam blogunun
      # HUKMU sentetik depo + BARE uzak uzerinde 45 GERCEK `git push` ile olculur
      # (15 govde x 3 vaka). Regex/metin taklidi DEGIL: kabuk hukmu verir.
      #
      # 🔴 NEDEN BURADA (serit-a3) VE NEDEN AYRI BAYRAK: bu ayak once
      # `--kendini-test` koluna alinmisti; o adim `nobet.yml`de yasiyor ve o dosya
      # SERIT B'dir (yayini BLOKLAMAZ, `deploy: needs` listesinde YOK). Olculdu:
      # rc yeniden atama (N1), `if false` sarmali (N3) ve `[ -z "$GIT_EXEC_PATH" ]`
      # sarmali (X4) sinifi sabotaj push'u DA deploy'u DA geciyordu — sinif KAPI
      # olmaktan cikip ALARMA dusmustu. `--kendini-test`i buraya geri tasimak 5 Agu'daki
      # serit kararini bozardi (bloklamayan alarm joblari yayin kosumunun rengini
      # boyamasin), o yuzden AGIR ayak KENDI bayragina ayrildi ve YALNIZ o adim
      # bloklayici job'a baglandi. `serit-a3` `deploy: needs` listesindedir.
      #
      # NEDEN pre-push'ta DEGIL: olculdu — ayak tek basina 2,40 sn; bayraksiz kol
      # P95'i 6,04 sn'ye cikip 5 sn esigini asiyordu. Push aninda ucuz statik capa
      # (`pre_push_capa_kontrol`) kalir; cagri/`exit`/kosul KAYBINI o yakalar.
      - name: "Kanca kablosu davranis ayagi (45 gercek git push)"
        run: python3 tools/ci-kapsam-test.py --kanca-kablo

      # Kapinin KENDI hukmu: 22 kirmizi + 29 yesil fikstur, E1 ozet mekanizmasi
      # (uydurma adla GERCEK uretim yolu), fail-closed (desen kaynagi yok / dosya
      # UTF-8 cozulemiyor) ve CANLILIK (git rc=0 + bos/kismi liste) dallari.
      # Ustteki adim yesilken bu adim kirmizi ise nobetci OLMUS demektir.
      - name: Devam sinif kapisi ic nobetci (kapinin kendi mantigi)
        run: python3 tools/devam-sinif-kapisi.py --kendini-test

      # DIRILTME KAPISI — "silinmis urun sessizce geri geldi mi". BLOKLAYICI
      # (continue-on-error YOK): yerel + deterministik, ag ISTEMEZ.
      # OLCULEN OLAY (30 Tem): bir dal main'e alinirken urunler.json'un SATIR-DUZEYI
      # 3-yollu merge'i main'in BILEREK sildigi 2 kaydi GERI DIRILTTI (biri YASAK TUR
      # olcekli maket) ve urunler-guard yapisi geregi elle duzeltme IKI KEZ ezildi
      # (15068 -> 15070). Push'tan hemen once ELLE yakalandi — nobetcisi YOKTU.
      # Mevcut kapilar bu sinifi GORMEZ: guard ekseni ters yone calisir, mukerrer-kontrol
      # tek kayda bakar, d1-sync --durum sayi tuttugu icin YESIL yanar.
      # Iki adim: (1) gercek olcum — HEAD^1 -> HEAD; (2) kapinin KENDI kabul testi
      # (POZITIF + NEGATIF vakalar + gercek katalogla yanlis-pozitif kanaryasi).
      # YANLIS-POZITIF NOBETI: YENI id eklemek SERBESTTIR; MaCiT'in normal ekleme
      # partisi bu kapiyi TETIKLEMEZ (kabul testi V9/V15 bunu ayri ayri olcer).
      # SALT-OKUNUR: urunler.json'a ASLA yazmaz (V14/V17 sha256 + porcelain ile olcer).
      - name: Diriltme kapisi (silinmis urun geri gelmis mi)
        run: python3 tools/diriltme-kapisi.py

      # MUKERRER PRECOMMIT KAPSAMI: mukerrer-kontrol.py --pre-commit'in calisma agacini
      # DEGIL commit icerigini (index/HEAD) yargiladigini ve okunamazsa fail-closed eski
      # davranisa dustugunu kanitlar (5 iddia). Bloklayici: kapsam calisma agacina kayarsa
      # baska oturumun yarim urunler.json'i HERKESIN commit'ini kilitler.
      - name: Mukerrer kapisi pre-commit kapsam testi
        run: python3 tools/mukerrer-kapsam-test.py

      # ID-RENAME YOLU KABUL TESTI (13 Agu): kod-kilidinin isci kimlik eksenini
      # kanonik mimar_kimlik.py'den tanidigini (mimar hala fail-closed RED), guard'in
      # id degisimini duplicate uretmeden tek islem saydigini ve duzelt.py'nin yeni id'yi
      # URL-guvenli (ASCII) dogruladigini kanitlar (6 iddia + 5 oldurucu mutant yerelde).
      # Bloklayici: yayin URL-guvenli olmayan id yuzunden kapali; bu kol duzeltme yolunu aciyor.
      - name: Id-rename yolu kabul testi (6 iddia)
        run: python3 tools/id-rename-test.py

      # RIZA TIK-KIMLIGI (GIZLILIK) — 30 Tem'e kadar CI'da HIC kosmuyordu. Muafiyet gerekcesi
      # "CI build job'u Python-only (setup-node yok)" DIYORDU; olculdu ki YANLIS: yukaridaki
      # actions/setup-node@v4 (node 20) BLOKLAYICI on-kosuldur ve bu is akisinda zaten
      # bes node testi kosuyor. Yani gizlilik ekseninin nobetcisi yalan bir gerekceyle
      # kapi disinda birakilmisti. NE KORUR: alti yayin yuzeyinde (ana sayfa + ic sayfalar)
      # rıza banner'inin GERCEK davranisi — reddedilince olcum kancalari SUSAR, kabul
      # edilince gclid/lead SUNUCUYA gider, "Kabul sonra Reddet" gclid'i SILER, silinemeyen
      # cerez ADIYLA uyarilir. Sessiz hata sinifi: rıza reddedilmisken tek satirlik bir
      # kablolama hatasi kisisel veriyi ucuncu tarafa gonderir ve EKRANDA GORUNMEZ.
      # Offline: ag YOK (fetch/kancalar sahte), commit'li index.html + attribution-ref.js +
      # gizlilik/ + build.py okunur, dosya YAZILMAZ. node ile kosar (setup-node yukarida
      # bloklayici); node yoksa adim FAIL eder (fail-closed). ~0,2 s.
      - name: Riza tik-kimligi kabul testi (gizlilik — 6 yuzeyde banner davranisi)
        run: node tools/riza-tikkimligi-test.js

      # ATIF (LISANS) REFERANS MODULU — ayni R_NODE muafiyet sinifindaydi, ayni yanlis
      # gerekceyle. NE KORUR: attribution-ref.js, CC lisansli urunlerde tasarimci adi +
      # lisans linkinin sayfada DOGRU uretilmesini saglar; bozulursa atif SESSIZCE duser.
      # Bu HUKUKI bir yukumluluktur (CC BY: atif + link VERILIR ve KALIR) ve hatasi
      # gorunmezdir — tam da CI'da kosmasi gereken sinif. Offline, salt-okuma, ~0,1 s.
      - name: Atif (CC lisans) referans modulu kabul testi
        run: node tools/attribution-ref-test.js

      # CATEGORIES / gizli-kategori / WHATSAPP sipariş no'su index.html ile build.py arasında
      # elle senkron tutulur; drift = ana sayfa/ürün sayfası tutarsızlığı ya da siparişin YANLIŞ
      # numaraya gitmesi (kayıp satış). Bloklayıcı (kisisel-veri deseni): drift'te yayını erken durdur.
      - name: Kategori/WHATSAPP parite testi (drift guard)
        run: python3 tools/kategori-parite-test.py

      # 🔴 SEPETE EKLE — SESSIZ BASARISIZLIK. 11 Agu'ya kadar zorunlu malzeme secimi
      # butonun ~168 px ALTINDAYDI ve onden secili DEGILDI: secimsiz tiklamada hicbir hata
      # METNI cikmiyordu, sepet bos kaliyordu (kullanici ekledigini saniyor) = DOGRUDAN
      # SATIS KAYBI. Kapi uretilen GERCEK sayfanin KENDI JS'ini node:vm'de tiklayarak
      # surer: (1) secim yapmadan ekleme BASARILI, (2) secim eksiltilince GORUNUR hata,
      # (3) istemci<->sunucu KURUS esitligi. Bloklayici: hata sinifi sessiz ve parali.
      - name: Sepete Ekle sessiz basarisizlik kapisi
        run: python3 tools/sepet-secim-kapisi.py

      # 🔴 SESSIZ ZAM. Onden secili malzeme ile ILAN EDILEN tutar ayri ayri hesaplanirsa
      # hicbir sey alarm calmaz: PETG +%30 / ASA +%60 onden secili gelir, sayfa · kart ·
      # yapilandirilmis veri · besleme hala liste tutarini beyan eder, sepete fazlasi
      # yazilir. Katalogda onerilen malzemesi PLA OLMAYAN urun orani %96,6 -> maruziyet
      # tum katalog. Kapi (1) kuralin iki dildeki yazimini TUM KATALOGDA karsilastirir,
      # (2) bayrak kapaliyken bugunku davranisi, (3) bayrak acikken sayfa/yapilandirilmis
      # veri/sepet/sunucu KURUS esitligini olcer. Bloklayici: hata sinifi sessiz ve parali.
      - name: On-secili malzeme <-> ilan edilen tutar parite kapisi
        run: python3 tools/onsecim-parite-kapisi.py

      # 🔴 IKI AGIZ, IKI FIYAT. Isletme karari (11 Agu, Okan): URUN SAYFASI onerilen
      # malzemeyi on-secer ve tutar ondan turer; KART / BESLEME / MARKUP ise BASLANGIC
      # tabaninda KALIR. Kenar veritabanindaki fiyat kolonu da o tabani tasir ve mesaj
      # kanali ORADAN okur. Kapsam sizarsa (kart da yukselirse) site 455 TL derken mesaj
      # kanali 350 TL der: iki agiz, iki fiyat, SIFIR alarm. Kapi TUM KATALOGDA kart
      # tutari == kenar kolonu tutari olcer (sapan 0), kart yuzeyinin urun sayfasi
      # turetmesini CAGIRMADIGINI capayla dogrular, pozitif taniyiciyla kendi canliligini
      # kanitlar ve malzeme onerisi TASIYIP adi taninmayan urunleri (sessizce tabana
      # dusen veri kusuru) SAYIP basar. Bloklayici: hata sinifi sessiz ve parali.
      # ⚠️ KARDES DEPO KAPSAM DISIDIR: E10 ekseni edge Worker kaynagini (~/dev/pruvo-bot)
      # yalniz DISKTE VARSA okur. CI fresh checkout'unda o agac YOKTUR ve bu bir olcum
      # boslugu DEGIL kapsam disiligidir — kapi `KARDES_AGAC_KAPSAM_DISI` basar, hukum
      # VERMEZ ve cikis kodunu ETKILEMEZ. (Eskiden OLCULEMEDI/rc=2 donuyordu; bu adim
      # CI'da YAPISAL olarak kirmizi yaniyor ve deploy+yayin job'larini dusuruyordu.)
      # Mutasyon bataryasi (12 oldurucu + 3 kontrol): tools/urun-vitrin-kapsam-mutasyon.py
      - name: Vitrin <-> D1 fiyat paritesi + kapsam sizintisi kapisi
        run: python3 tools/d1-fiyat-parite-kapisi.py

      # 🔴 UC YUZEY, UC TUTAR. Okan'in karari (12 Agu): kart BASLANGIC tabanini
      # ("X TL'den baslayan"), urun sayfasi ONERILEN malzemenin tutarini yazar; markup
      # ikisini AggregateOffer lowPrice/highPrice araligiyla beyan eder. Ayni urun BILEREK
      # iki tutar gosterdigi icin ucu de AYNI turetme noktasindan cikmak ZORUNDADIR: biri
      # bagimsiz hesaplanirsa musteri kartta 430 TL gorup sepete 559 TL yazar, arama
      # motoruna 430 beyan edilir ve HICBIR YERDE alarm calmaz. Bu sinif bu depoda IKI KEZ
      # olculdu (11 Agu sessiz zam · 12 Agu markup tabani ile kart tabani ayri ayristirma
      # kuralindaydi: 1 kayitta 300 TL <-> 30.030 TL). Kapi (1) kuralin iki dildeki yazimini
      # TUM KATALOGDA karsilastirir, (2) URETILEN HER URUN SAYFASINI acip lowPrice == kart
      # tutari · lowPrice <= highPrice · gorunur tutar == onerilen malzeme tutari · kart
      # metnindeki ekin ne eksik ne fazla oldugunu olcer (ORNEKLEME YOK; olculemeyen sayfa
      # sifir-disi cikis). Bloklayici: hata sinifi sessiz ve parali.
      # Mutasyon bataryasi (6 oldurucu + 1 kontrol): tools/ilan-tutari-mutasyon.py
      - name: Ilan edilen tutar kapisi (kart <-> markup araligi <-> urun sayfasi)
        run: python3 tools/ilan-tutari-kapisi.py --ozet

      # 🔴 REKLAM OLCUMU — HUNI AYAGI. 11 Agu'ya kadar GA4 tarafina yalniz sayfa
      # goruntuleme gidiyordu: urun goruntuleme / sepete ekleme / odemeye baslama
      # olaylarinin HICBIRI yoktu, oysa Meta huni yuzeyi TAM kuruluydu. Hata SESSIZ
      # (sitede hicbir sey bozulmaz, konsolda iz kalmaz) ama duraklatilan kampanyanin
      # yeniden acilip acilmayacagi OLCUMSUZ kalir. Kapi uretilen GERCEK sayfanin KENDI
      # JS'ini node:vm'de kosturup olay kuyruguna DUSEN cagriyi olcer ("kod eklendi"
      # kabul degil), riza YOKKEN sifir olay bekler ve olay parametrelerini kanonik
      # e-ticaret alan kumesine karsi tarar (kisisel veri 0). Bloklayici.
      - name: GA4 e-ticaret olay kapisi (huni fiilen atesleniyor mu)
        run: python3 tools/ga4-olay-kapisi.py

      - name: GA4 olay kapisi ic nobetcisi
        run: python3 tools/ga4-olay-kapisi.py --kendini-test

      # 🔴 CTA DENGESI — GELIR KAPISI. 11 Agu'ya kadar canlida birincil eylem
      # (Sepete Ekle) 44x44 ETIKETSIZ ikondu; yanindaki sticky WhatsApp bandinin
      # butonu 231x44 idi -> WhatsApp dokunma alaninda 5,22 KAT buyuktu ve bant mobil
      # ekranin %16,6'sini yiyerek urunu ilk ekrandan tumuyle disari itiyordu. Hata
      # SESSIZ: hicbir test yanmaz, bir sonraki CSS dokunusunda sessizce geri gelir.
      # Kapi geometriyi build.PAGE_CSS + GERCEKTEN uretilen sayfa + index.html'den
      # TURETIR (elle defter yok), bes ekseni fail-closed olcer ve olcemedigi durumda
      # "gecti" DEMEZ (rc=3). WhatsApp kanalinin VARLIGI da olculur — denge kanali
      # silerek saglanamaz. Bloklayici. Mutasyon bataryasi (11 oldurucu + 2 kontrol):
      #   python3 tools/cta-denge-mutasyon.py   (nobet.yml serit-b'de kosar)
      - name: CTA denge kapisi (Sepete Ekle vs WhatsApp gorsel agirligi)
        run: python3 tools/cta-denge-kapisi.py

      # 🔴 IC SERI IZI. CLAUDE.md: parametrik seri semasi/ureteci IC bilgidir; seri adi
      # musteriye gorunen yuzeyde GECMEZ. 11 Agu'ya kadar parametrik urun sayfasinin
      # kategori rozetinde/breadcrumb'inda/JSON-LD'sinde ve ana sayfa kartinda "Jeneratör"
      # yaziyordu = aktif kural ihlali. Kapi yasak kumeyi build.py GIZLI_SERI_KARARI'ndan
      # TURETIR (elle defter yok), gorunen yuzeyleri tanimli olarak tarar ve YANLIS-POZITIF
      # eksenini de olcer (ayni kelime 17 GERCEK jenerator yedek parcasinin kategorisidir
      # ve orada KALIR). Bloklayici: ihlal sessizdir, yayina cikar.
      - name: Ic seri izi kapisi (gizli seri adi gorunen yuzeyde YOK)
        run: python3 tools/ic-seri-izi-kapisi.py

      # SKAN ART: gizli dekor alt-serisi kategorisi + ana sayfa banner'i. Bloklayici
      # (kategori-parite deseni): bu kararin kablolamasi 6 dosyaya yayiliyor (index.html
      # gizli liste + banner + toggle, build.py NAV_GIZLI/FONKSIYONEL/feed taksonomisi,
      # secenekler.js FONKSIYONEL, filamentler.json tavsiye, urunler.json kategori) ve
      # tek bir halka kopunca hata SESSIZ (kart duzeni duser / rozet kaybolur / feed
      # taksonomisiz gider / banner her gorunumde kalir). Offline, build.py'den ONCE kosar.
      # 24 Tem (curutme sonrasi): nobet artik KAYNAK METNI degil DAVRANIS olcuyor —
      # renderCats/applyUrlParams index.html'den ayiklanip node ile GERCEKTEN kosuluyor
      # (nav cipine duz literal eklemek ve derin-link beyaz listesini daraltmak KACIYORDU),
      # secenekler.js fonksiyonelMi/satirOzeti node ile olculuyor (bypass para kaybediyordu),
      # banner GORUNURLUGU + sari taramasi CSS kural bazinda (pencere yok, rgb()/hsl()/renk
      # adi cozulur), kompakt kart icin SENTETIK semasiz fikstur var (gercek urun konfigur'lu
      # oldugu icin FONKSIYONEL uyeligini olcmuyordu). node yoksa FAIL-CLOSED exit 1 —
      # setup-node yukarida BLOKLAYICI on-kosul.
      - name: Skan Art kategori + banner kabul testi
        run: python3 tools/test-skan-art.py

      # SKAN ART OZYINELEME KILIDI: uretim kum havuzunun kendini ic ice kopyalamasini
      # onleyen kilidin (derinlik tavani · zaten-varsa yeni seviye acmama · sir tasimama ·
      # fail-closed temizlik) kabul + mutant testi (4 mutant). Bloklayici: bir kol duserse
      # gecici uretim koku diskte buyuyup sir dosyasi tasir (188 GB kacak sinifi).
      - name: Skan Art ozyineleme kilidi kabul + mutant testi
        run: python3 tools/skan-art-ozyineleme-test.py

      # ODEME BEYANI: statik yasal sayfalardaki siparis/odeme anlatimi canli akisla uyumlu mu
      # (kart formu/iframe yok, teslim suresi, wa.me/tel numara ayrimi). Bloklayici: uyumsuzluk
      # = musteriye yanlis odeme/teslim beyani. Offline, commit'li sayfalari okur (build.py'den ONCE).
      - name: Odeme beyani kapisi
        run: python3 tools/odeme-beyani-kapisi.py

      # R2 YUKLEME DOGRULAMA: gorsel govdesi/turu ile yukleme-sonrasi boyut okumasini
      # sahte S3 istemcisiyle kanitlar. Offline/mock; gercek R2'ye gitmez, kimlik okumaz.
      - name: R2 yukleme dogrulama kabul testi
        run: python3 tools/r2-upload-test.py

      # DUZELT --toplu: mesru toplu duzeltme yolu (guard'in tek kapisi). Bloklayici: toplu kip
      # kilit/atomiklik kaybederse paralel yazicilar urun kaydi EZER. Test gercek urunler.json'a
      # DOKUNMAZ (tempfile'da sahte repo kurar), ag yok.
      - name: duzelt.py --toplu kabul testi
        run: python3 tools/duzelt-toplu-test.py

      # LANDING/HUKUK KAPISI: huni (landing) sayfasindaki ticari beyanlar ile baglayici yasal
      # sayfalarin (kapsam + revizyon/cayma cercevesi) uyumu. Bloklayici (odeme-beyani deseni):
      # uyumsuzluk = musteriye yanlis hukuki beyan. Offline, build.py'den ONCE kosar.
      - name: Landing/hukuk beyan kapisi
        run: python3 tools/landing-hukuk-kapisi.py

      # LANDING WHATSAPP KAPISI: CONTENT_PAGES'ten uretilen tum uzun-kuyruk sayfalarda
      # tiklanabilir, dogru numarali ve on-dolu WhatsApp CTA'si bulunur. Orneklem yapmaz;
      # ortak render sablonunun gercek HTML ciktisini ayristirir. Offline ve fail-closed.
      - name: Landing WhatsApp CTA kapisi
        run: python3 tools/landing-wa-kapisi.py

      # KARGO PAZARLAMA KAPISI: anasayfa, kurumsal sayfalar ve CONTENT_PAGES'in gorunur
      # metninde kargo ucreti/bedava-ucretsiz/esik vaadi bulunamaz. Baglayici yasal
      # sayfalarin muafiyeti sayfalar.YASAL_SAYFALAR'dan turer; kapida ikiz slug listesi
      # yoktur. Bloklayici serit-a3'tedir; iki kontrol mutanti kapinin duyarliligini ve
      # yasal metne yanlis-pozitif yakmadigini her push'ta yeniden olcer.
      - name: Kargo pazarlama beyani kapisi
        run: python3 tools/kargo-pazarlama-kapisi.py
      - name: Kargo pazarlama beyani kapisi mutant kabul testi
        run: python3 tools/kargo-pazarlama-kapisi.py --kendini-test

      # MALZEME DAYANAGI: DORT yayin yuzeyinde gecen her malzeme adinin filament envanterinde
      # karsiligi var mi — (A) huni/landing sayfalari, (B) ege-bilgi.md (WhatsApp botu Ege'nin
      # bilgi dosyasi), (C) sss/gizlilik/hakkimizda/iletisim GORUNUR metni, (D) ayni 4 sayfanin
      # JSON-LD bloklari (Google'in okudugu acceptedAnswer). Uretemedigimiz bir sinifi (or. PC /
      # polikarbonat -> kodda KARA LISTE) vaat etmek yanlis ticari beyandir. Ayrica: dayanak
      # kayitlari (PA6-GF/PA12-GF/POM) YALNIZ onaylanan TAM ADI mesrulastirir, satis/uretim
      # duzlemine SIZAMAZ; ege-malzeme.py <-> ege-bilgi.md DRIFT nobeti (F18 uctan uca);
      # 49 bellekte-fikstur ic nobetcisi + 12 davranis fiksturu (main uctan uca, gecici
      # dizinde; exit-kodu kablolarinin HER BIRI solo kilitli — kapi docstring'indeki
      # KABLO ENVANTERI tablosu K1-K12) kapinin kendi yetenegini kilitler. KAPSAM
      # nobeti VARLIK kontroludur (sayi/karakter tabani YASAK SINIF): zorunlu kaynaklar en
      # az 1 govde uretmeli; JSON-LD blogu kaybolursa UYARI (FAQ rich result emekliligi
      # mesru SEO karari, yayini durduramaz). SIZINTI kapsami AD BAZLI: kod tarafindan
      # uretilen 2 degismez cikti ZORUNLU, landing /malzeme-rehberi/ kaybolursa UYARI
      # (slug degisimi tum ekibin yayinini durdurmasin). Bloklayici (landing-hukuk deseni).
      # Offline, stdlib — build.py'den ONCE commit'li kaynagi okur, GERCEK dosyaya YAZMAZ
      # (davranis fiksturleri tempfile dizininde calisir).
      - name: Malzeme dayanak kabul testi (landing + ege-bilgi.md + statik sayfa/JSON-LD)
        run: python3 tools/malzeme-dayanak-test.py

      # EGE-BILGI TAVAN: ege-bilgi.md uzunlugu bot slice(0,6000) esigini asmasin.
      # Olcu UTF-16 kod birimi (JS String.slice birimi) — bayt sayan olcum sahte-kirmizi,
      # Python len(str) astral karakterde sahte-yesil yakar.
      # Bloklayici SADECE gercek zararda, IKI hal: (1) UTF-16 uzunluk >6000 (bot metni
      # SESSIZCE kesiyor, icerik kaybi) (2) fail-loud — dosya yok / okunamiyor / UTF-8 degil
      # (olculecek sey YOK; sessiz yesil verilmez).
      # ILAN duzlemindeki HER hal UYARI'dir (exit 0 + gurultulu uyari), 21 Tem MIMAR KARARI:
      # ILAN/SABIT UYUSMAZLIGI · dar pay · ILAN YOK · CELISKILI ILAN · ILAN BASTA DEGIL ·
      # ILAN BAGLAMA OTURMADI. Gerekce: ilan kontrolu Turkce serbest metinde desen arayan bir
      # NESIR AYRISTIRMASIDIR ve bir HUKUM kaynagi degildir ([[mimar-kapi-parser-taklidi]]);
      # olculdu 21 Tem, BES ayri MASUM tek-satirlik duzenleme kapiyi kirmiziya cekiyordu
      # (uslup kuralindaki baska bir sayi · "6000"->"6.000" kozmetik ayrac · ilan cumlesinin
      # silinmesi · basa icindekiler eklenip ilanin kaymasi · ilanin YERINE "en fazla 300
      # karaktere kadar" gibi bir USLUP kurali yazilmasi) ve continue-on-error olmadigi icin
      # TUM EKIBIN yayinini durduruyordu. Icerik kaybi hukmunu uzunluk olcusu TEK BASINA
      # verir; ilan kontrolu yalnizca BAYATLIK SEZGISIDIR (bagirir, insan bakar).
      # ⚠️ BILEREK KABUL EDILEN RISK: TAVAN sabiti bot reposundakinden KUCUK yonde bayatlarsa
      # kapi durdurmaz, yalniz uyarir. Gercek capraz-repo korumasi
      # pruvo-bot/worker/test/ege-bilgi-nobetci.mjs'de (tavani index.js'ten CANLI okur).
      # "KESIN ilan" = sayi TAVAN bandinda (2000..18000) VE AYNI SATIRDA ilanin oznesi
      # (Ege'ye / bilgi dosyasi / bu dosya) aniliyor; bu ayrim artik hukumde degil TESHIS
      # metninde yasar (fikstur N1/N4/A5* onu korur). Offline, stdlib, ~5 ms.
      - name: Ege-bilgi tavan kabul testi (6000 karakter kesme kapisi)
        run: python3 tools/ege-bilgi-tavan-test.py

      # EGE KABILIYET-SINIRI KAPISI (26 Tem): ege-bilgi.md musteriden URETIM olcusu/cizimi
      # ISTIYOR mu, ya da uretim/fiyat SOZU veriyor mu? Canli SISTEM_TALIMATI bunu katalog-bos
      # dalinda uc yerde yasakliyor (pruvo-bot worker/src/index.js :41, :52, :2467; ayrica :57
      # "yaklasik su kadar tutar' DEME"). ege-bilgi.md her konusmada o talimatin YANINA enjekte
      # edildigi icin buradaki bir "olcu/cizim iste" ya da "ozel uretiriz" satiri AYNI prompt
      # icinde iki zit talimat yaratir -> model rastgele birini secer, yasak SESSIZCE delinir.
      # NEDEN AYRI KAPI: bu hata sinifini olcen test YOKTU — bot tarafindaki
      # ege-bilgi-nobetci.mjs'in 5 ekseninde (ODEME/TESLIM/KARGO/MALZEME/FIYAT) kabiliyet-siniri
      # ekseni yok, musteri-bacagi-nobetci.mjs ise SENTETIK fikstur okur, gercek ege-bilgi.md'ye
      # bakmaz. 26 Tem'de tam bu sinif tum testler YESILken bir dala girdi ("foto/olcu/cizim
      # iste"); kapi o dersin ciktisi. Kapsam BILEREK dar (3 sinif) — genisletmek l.11/l.18/l.38
      # gibi mesru satirlari sahte-kirmizi yakar.
      # ⚠️ (C) sinifi IKI KANATLIDIR: para + GUCLU kip ("800 TL tutar", "diyebiliriz")
      # tek basina yanar; olur/yazar/cikar/gecerlidir gibi ZAYIF kipler ancak YAKLASIK
      # jetonuyla BIRLIKTE yanar — cunku tek baslarina BETIMLEMEdirler ("fiyat sayfada
      # yazar") ve belgenin KENDI l.7/l.9/l.45'i tam o sinifta. (C) ayrica DUZ KESIN
      # FIYAT BEYANINI ("Bu parca 1.200 TL") OLCMEZ. Kapi yesil ciktisinda bu iki kor
      # noktayi ACIKCA ilan eder. Offline, stdlib, ~5 ms.
      - name: Ege kabiliyet-siniri kapisi (olcu/cizim istegi · uretim/fiyat sozu)
        run: python3 tools/ege-kabiliyet-kapisi.py

      # ENJEKSIYON KAPISI: build.py'nin sayfalara inline bastigi JS (attribution/riza + meta)
      # bayt-bayt bozulmadan mi gidiyor. Yasanmis hata: re.sub REPLACEMENT kacisi yorumlayinca
      # ya JS string'i kiriliyor (sayfa acilir, script SESSIZCE hic calismaz) ya da build tumden
      # cokuyor. Bloklayici; tam build kosmaz (fonksiyonlari dogrudan cagirir), olculdu 8,5 s.
      - name: Enjeksiyon kapisi (inline JS bozulmadan mi basiliyor)
        run: python3 tools/enjeksiyon-kapisi.py

      # STL R2 YUKLEYICI: anahtar turetme (yol-gezinme kapisi: ../ , mutlak yol, ters bolu,
      # NUL reddedilir) + 300 MiB ustu cok-parcali (multipart) yolun parca boyutu/sayisi ve
      # kabul mantigi. Bloklayici: anahtar kacarsa yanlis R2 prefix'ine yazilir, multipart
      # esik/parca hesabi kayarsa buyuk STL sessizce BOZUK yuklenir. Offline (gercek R2
      # yazmasi YOK, kimlik okumaz), olculdu ~1 s; build.py'den ONCE kosar.
      - name: STL R2 anahtar/multipart kabul testi
        run: python3 tools/stl-r2-anahtar-test.py

      # 3MF SINIR KUTUSU (bbox_3mf) — 30 Tem'e kadar OLU idi: ankraj fiksturleri GERCEK urun
      # dosyalariydi (stl/pr1173083.3mf, stl/pr912419.3mf) ve stl/ gitignore'da; test her
      # ortamda 0,1 s'de FileNotFoundError ile PATLIYOR, HICBIR iddia kosmuyordu. Muafiyet
      # gerekcesi de yanlisti (R_YAVAS ">30 s" diyordu; olculen 0,1 s'lik cokustu).
      # Ankraj artik DEPODA (tools/fikstur/3mf/, ~3 KB, uretici tools/fikstur/3mf-fikstur-uret.py):
      # cok-.model + transform zinciri, tek-.model duz olcum, inch->mm birim donusumu.
      # NE KORUR: urun aciklamasindaki "Yaklasik dis olculer" satiri bu fonksiyondan gelir;
      # transform zinciri ya da birim carpani dusserse musteriye YANLIS OLCU yayinlanir ve
      # hata tamamen sessizdir. stl/ yoksa regresyon taramasi ACIKCA "ATLANDI" raporlanir
      # (sessiz atlama YOK), ankraj bolumu her ortamda kosar. Offline, ~0,1 s.
      - name: 3MF sinir kutusu (bbox_3mf) kabul testi — cok-model + transform + birim
        run: python3 tools/test-bbox-3mf.py

      # PIKSEL <-> KATALOG PARITE: Meta/Google katalog feed g:id ile tarayici/CAPI pikselinin
      # content_ids'i AYNI KURALDAN (build.feed_id) turer mi. Yasanmis hata: feed uzun urun id'sini
      # <=50 karaktere kisaltirken piksel TAM pid gonderiyordu -> 610/7769 urunde katalog eslesmiyor
      # (Advantage+ kor calisir). Bloklayici: sablon content_ids feed g:id'den saparsa katalog reklami
      # yanlis urun gosterir. Offline (render_product'i cagirir, ag yok); JS-uc paritesi icin
      # setup-node kurulu; node yoksa adim FAIL eder (fail-closed).
      - name: Piksel <-> katalog parite kapisi
        run: python3 tools/piksel-katalog-parite-test.py

      # FEED g:id COZUCU: Merchant panelinden gelen KISALTILMIS g:id (50 karakter kurali)
      # gercek urun id'sine geri cozulebiliyor mu. Bloklayici degil ama regresyon nobetcisi:
      # cozum bozulursa panel sikayetleri yine "boyle urun yok / 404" gibi gorunur (yasanmis
      # tanilama koru). Offline (ag nobetcisi testin icinde), olculdu 0,4 s.
      - name: Feed g:id cozucu kabul testi
        run: python3 tools/feed-id-cozucu-test.py

      # MARKA x KATEGORI KAPSAMI (Okan, 30 Tem): cok-dikeyli markalar (olculdu: Yamaha 6
      # dikey, Suzuki 5, BMW 4, Volvo 2) tek marka kovasinda birlesiyordu — Marin'de
      # "Yamaha" cipine basan musteriye motosiklet/elektronik parcasi cikiyordu. Hata
      # SESSIZ: ekranda hata gorunmez, kimse bildirmez, satis kaybolur. NE KORUR: cip
      # hedefinin kapsami tasimasi, marka/model sayfasinin kapsami UYGULAMASI, gecersiz
      # kapsamda FAIL-CLOSED (bos sonuc; sessizce tum katalog GOSTERILMEZ), kanonik
      # URL'in parametresiz kalmasi ve sitemap'e parametreli girdi girmemesi (SEO).
      # /marka/... sayfalarini GERCEK jeneratorle uretir, kapsam JS'ini node'da KOSAR
      # (setup-node bloklayici on-kosul; node yoksa FAIL-CLOSED exit 1). Offline, ~1 s.
      - name: Marka kapsam kabul testi (marka x kategori + fail-closed)
        run: python3 tools/marka-kapsam-test.py

      # MARKA SAYFASI SAYAC BIRIMI + MUKERRER KART (7 Agu, Okan bildirdi — SESSIZ kusur).
      # Sayac YALNIZ `.card` dugumlerini sayiyordu, model kovalarinin ARDINDAKI parcalari
      # saymiyordu: sayfa "201 parca" derken ulasilabilen tekil kume 330'du (40 marka
      # sayfasi sapiyordu, 9.378 kalem gizli). Ayrica kart birlesimi tekillestirilmiyordu
      # (31 sayfada 282 mukerrer kart). Ekranda hata GORUNMEZ; musteri katalogu eksik sanir.
      # 🔴 NEDEN SERIT A (BLOKLAYICI, `serit-a3` -> `deploy: needs`): kapi TAMAMEN YEREL ve
      # DETERMINISTIK — OLCULDU, beyan degil: kaynakta urllib/requests/socket/http YOK,
      # kardes depo yolu YOK, canli siteye istek YOK; girdi yalniz bu depodaki
      # urunler.json + index.html, sayfalar GECICI dizine uretilir, kapsam JS'i node'da
      # KOSAR (setup-node bu seritte bloklayici on-kosul; node yoksa FAIL-CLOSED).
      # Elle tutulan envanter/allow listesi YOK -> urun partileri kapiyi BAYATLATMAZ
      # ([[envanter-drift-parti-basina]] sinifina girmez). continue-on-error YOK.
      # 1022 marka/model adresinin TAMAMINI olcer (ornekleme yok), yerelde ~35 s.
      - name: Marka sayac kapisi (sayac birimi + mukerrer kart)
        run: python3 tools/marka-sayac-kapisi.py

      # MARKA SAYFASI MODEL CIPI (12 Agu, Okan canlidan): "modeller eksik, cipler dagimik,
      # cipteki sayi urunle tutmuyor, cipe tiklaninca hedef acilmiyor". Dordu de SESSIZ.
      # OLCULDU (canli, GERCEK TARAYICI, cache-bust'siz): 1024 cipin 1024'u HTTP 200 —
      # yani HTTP ekseni TEMIZDI ve hicbir kapi kirmizi yanmiyordu — ama cipe basilinca
      # ekranda 0 KART kaliyordu (uc ayri sayfada 1,9 sn · ~1-3 sn · >6,5 sn) ve o
      # pencerede durum metni ya BOS ya da BIR ONCEKI cipin sayisiydi. Kullanici bunu
      # "cip calismiyor" olarak gorur; `curl` bu ekseni OLCEMEZ (cip AYRI ADRESE GITMEZ,
      # sayfa ICINDE filtreler).
      # NE OLCER (ORNEKLEME YOK, uretilen TUM marka sayfalari · TUM cipler): cip hedefinin
      # COZULMESI + hedefin DOLU olmasi · cipin BASTIGI sayi == sayfa-ici filtre kumesi ==
      # hedef sayfanin beyani · GURULTU sinifi (cip etiketi aslinda AYRI BIR MARKA) ·
      # TIKLAMA DAVRANISI (sayfanin KENDI filtre modulu node'da sahte DOM ile kosturulur:
      # tiklamadan sonra durum metni BOS/BAYAT kalmaz, on-yukleme atilir, yuk gelince
      # gorunen kart sayisi cipin sayisina esitlenir).
      # 🔴 NEDEN SERIT A (BLOKLAYICI): TAMAMEN YEREL ve DETERMINISTIK — girdi yalniz bu
      # depodaki urunler.json + index.html; sayfalar GECICI dizine uretilir; node'da
      # KOSAR (setup-node bu seritte bloklayici on-kosul, yoksa FAIL-CLOSED rc=3).
      # Elle tutulan envanter/allow listesi YOK: gurultu sinifi katalogdan OLCULUR, koda
      # marka adi YAZILMAZ -> urun partileri kapiyi BAYATLATMAZ ([[envanter-drift-parti-basina]]).
      # FAIL-CLOSED: olcum kurulamazsa rc=3 (OLCULEMEDI), sessiz yesil YOK.
      # MUTASYON KANITI ELLE KOSULUR (CI'da 6 kapi turu ~10 dk tutardi; surucu repoda
      # DURUR, anlatilan batarya kanit degildir -> [[mutasyon-kaniti-yeniden-uretilebilir]]):
      #   python3 tools/marka-cip-mutasyon.py     # MUTANT=5/5 KONTROL=YESIL IZ_AYRIMI=DOGRU
      - name: Marka model cipi kapisi (hedef + sayi + gurultu + tiklama)
        run: python3 tools/marka-cip-kapisi.py

      # MARKA CIP TAVANI (index.html MARKA_LIMIT) — R_NODE muafiyet sinifindan cikarildi
      # (30 Tem): gerekce "CI build job'u Python-only (setup-node yok)" diyordu, oysa
      # setup-node BLOKLAYICI on-kosul olarak VAR. NE KORUR: ana sayfadaki marka cipi
      # tavani ve `brands.slice(0, MARKA_LIMIT)` uygulamasi + emekli edilmis eski
      # mekanizmalarin (BRAND_COLLAPSED / brandsExpanded / "daha fazla goster") GERI
      # GELMEMESI. Tavan kalkarsa ana sayfa yuzlerce cip basar (mobil duzen coker); hata
      # sessizdir cunku sayfa "calisiyor" gorunur. Offline, index.html'i okur, ~0,1 s.
      - name: Marka cip tavani kabul testi (MARKA_LIMIT + slice)
        run: node tools/marka-limit-test.js

      # ARAMA/FILTRE URL SENKRONU (index.html) — ayni sinif, ayni yanlis gerekce.
      # NE KORUR: arama/kategori/marka secimlerinin URL'ye yazilmasi (syncUrl), derin
      # linkin geri okunmasi, aramayi temizleyince URL'nin temizlenmesi ve "yukari cik"
      # okunun sepet FAB'i ile cakismamasi. Bozulursa paylasilan/reklamla gelen derin
      # link YANLIS ekrani acar — kayip satis, ekranda gorunmez. Offline, ~0,1 s.
      - name: Arama/filtre URL senkron kabul testi (derin link + temizleme)
        run: node tools/url-senkron-test.js

      # KONFIGUR KABUL TESTI: konfigure edilebilir dekor urunu (renk + boy kaydirici)
      # altyapisi. (a) konfigur sema dogrulamasi fail-closed (bozuk sema/capa build'i
      # dusurur), (b) afin capa fiyat modeli — node ile GERCEK /konfigur.js kosulur
      # (setup-node kurulu; node yoksa test FAIL-CLOSED kirmizi): kesin artanlik + capa
      # tam-tutar dogrulugu + tam-TL yuvarlama + Python aynasi drift nobeti, (c)
      # konfigur'suz urun sayfasi geri-uyumlu — REFERANSSIZ ve KALICI uc iddia: c1 konfigur
      # izi yok, c2 sayfa sinifinin yapisal cekirdegi (#filCipler / KART_SECIM / #opsiyonlar /
      # #boySec / .attribution / jenerator modulleri) yerinde, c3 malzeme arayuzu XOR
      # (kart bolumu YA DA secici, ikisi birden ya da hicbiri degil). c4 (merge-base build.py
      # ile bayt-esitlik) ANA HATTA YAPISAL OLARAK OLCULEMEZ — main'e push'ta merge-base ==
      # HEAD oldugu icin referans build.py CALISANLA AYNI cikar, karsilastirma totolojiye
      # doner; bu yuzden "--anahat" ile kosuyoruz: ⚪ OLCULEMEDI GURULTULU raporlanir ama
      # yayini kilitlemez (surekli-kirmizi = yayin kilidi de en az sessiz-yesil kadar
      # yanlis). Bloklayici koruma c1/c2/c3 + (a)/(b)/(d)/(e) uzerindedir; continue-on-error
      # YOK. (d) konfigur'lu sayfada JSON-LD Offer.price = minimum (capa-1) fiyat + feed
      # ayni fiyat. Offline, sentetik fikstur, urunler.json OKUNMAZ, dosya yazmaz;
      # build.py'den ONCE kosar (render_product'i dogrudan cagirir).
      - name: Konfigur (dekor konfigurator) kabul testi
        run: python3 tools/konfigur-test.py --anahat

      # KONFIGUR SIYAH KAPAK KAPISI (Okan emri, 11 Agu 2026). Konfigur/dekor urununde
      # kapak gorseli siyah + onden secili renk Siyah olacak. Bu IKISI AYNI SEYDIR:
      # on-secim AYRI bir alanda durmaz, build.py::_konfigur_varsayilan_renk onu KAPAK
      # GORSELINDEN turetir (renkGorselIndeks'i 0 olan renk). Yani kapagi griye geri
      # almak on-secimi de geri alir — SESSIZCE, tek bir alan adi bile degismeden;
      # bir sonraki katalog partisinde kimse fark etmez.
      # Kapi kurali VERIDEN degil URETIM KODUNDAN turetir: on-secimi yeniden yazmaz,
      # sayfayi basan fonksiyonun TA KENDISINI cagirir (ikiz tanim ayrismasi olamaz).
      # IKI KOL: (A) turetim sonucu "Siyah" mi · (B) turetim GERCEKTEN kapak gorselinden
      # mi geliyor (rgi["Siyah"]==0). (B) sart: renkGorselIndeks bosaltilirsa uretim
      # fonksiyonu "listenin ilki" koluna duser ve kapak gri olsa bile "Siyah" dondurur.
      # Cozulemeyen kayitta "gecti" DEMEZ -> OLCULEMEDI + KIRMIZI. continue-on-error YOK.
      - name: "Konfigur siyah kapak kapisi (onden secili renk kapak gorseline capali mi)"
        run: python3 tools/konfigur-siyah-kapak-kapisi.py

      # FIZIKSEL URUN KAPISI (PARA — karsiligi olmayan +%15 tahsilati). `tur: "fiziksel"`
      # kayitlari hazir ticari maldir (tekne boyasi/vernik/tiner); 3D baskiyla URETILMEZ,
      # malzeme/renk SECIMI YOKTUR, fiyati SABITTIR. Kategorileri "Marin" oldugu icin sayfalari
      # kart-secim dalina dusuyor ve renk butonlari + malzeme cipleri + "…'den başlayan"
      # basiliyordu. "Diğer (+%15)" secimi sepet satirina renk:"Diğer" yazar, secenekler.js
      # hesaplaFiyatKurus onu x1,15 yapar (Worker sabit-fiyat kolu AYNI fonksiyonu cagirir):
      # olculdu 1.000 TL boya -> ASA+"Diğer" ile 1.840,00 TL. Kapi: fiziksel fiksturde 9 baski
      # kancasinin HICBIRI yok + adet/sepet/WhatsApp duruyor + "Diğer" uretebilecek kanca yok
      # (para capasi GERCEK secenekler.js ile node'da olculur; node yoksa FAIL-CLOSED kirmizi)
      # + `tur`suz 3D urunde HER SEY yerinde + taninmayan `tur` degeri `tur`suzle BAYT-ESIT
      # (fail-closed). Offline, sentetik fikstur, urunler.json OKUNMAZ, dosya YAZMAZ, ~1 s;
      # build.py'den ONCE kosar (render_product'i dogrudan cagirir). Mutasyon turu (2/2
      # kirmizi) elle: python3 tools/fiziksel-urun-kapisi.py --mutasyon
      - name: Fiziksel urun kapisi (3D-baski secim UI + karsiliksiz +%15 renk farki)
        run: python3 tools/fiziksel-urun-kapisi.py

      # CAYMA BEYANI KAPISI (TUKETICI HUKUKU — SESSIZ, TERS YONDE ihlal). `tur` alani uzun
      # sure YALNIZ para yolunu suruyordu; hicbir HUKUKI BEYANI surmuyordu. Olculdu (1 Agu):
      # siparis onay e-postasi (shop/src/eposta.js) KOSULSUZ "Ürünleriniz özel olarak
      # üretilip gönderilecektir" diyordu — oysa sozlesme §6 "bu urunler siparis sirasinda
      # ACIKCA ozel uretim olarak TEYIT EDILIR" der. Yani 659 HAZIR TICARI MAL siparisinde
      # de, musterinin 14 GUNLUK CAYMA HAKKINI reddetmeye yarayacak teyit siparis aninda
      # veriliyordu. Kapi 29 iddiayla dort beyan yuzeyini birden olcer: e-posta (kalem
      # bazinda karma sepet dahil), urun sayfasi, teslimat/mesafeli-satis govdesi, odeme
      # ekrani + tek kaynak (secenekler.js BEYAN; build.py AYNI sozlugu _js_sabiti ile okur,
      # ikiz tanim ayrisirsa E4 kirmizi). Regresyon capalari ozel uretim metnini bayt
      # duzeyinde kilitler; fail-closed eksende 15 taninmayan `tur` degeri `tur`suzle
      # BAYT-ESIT olmali. C4 ayrica iade kargo bedeli cumlesinin YAZILMAMIS kalmasini
      # bekler (Okan karari BEKLENIYOR). node ZORUNLU (yoksa fail-closed kirmizi), offline,
      # urunler.json OKUNMAZ, dosya YAZMAZ. Mutasyon turu (3/3 kirmizi, her biri kendi
      # ekseninde) elle: python3 tools/cayma-beyani-kapisi.py --mutasyon
      - name: Cayma beyani kapisi (hazir/stok vs ozel uretim ayrimi BEYAN yolunda)
        run: python3 tools/cayma-beyani-kapisi.py

      # GORSELSIZ RENDER KAPISI (MUSTERIYE GORUNEN YUZEY — TAMAMEN SESSIZ hata). Gorsel
      # zorunluluguna acilan dar istisna (parti-kontrol.py, 724a69b2) gorselsiz urunun
      # EKLENEBILMESINI olcuyordu; NASIL GORUNDUGUNU degil. Olculdu: kapak
      # `SITE + "/favicon.png"` idi, o dosya depoda YOK ve canlida HTTP 404 -> urun
      # sayfasinda 800x800 KIRIK GORSEL; ayni 404 URL og:image / twitter:image / JSON-LD
      # `image` alanlarina da basiliyordu. Dahasi ILGILI URUNLER kartinda gorselsiz komsu,
      # BULUNULAN SAYFANIN kapagiyla ciziliyordu ("B urunu" yazan kartta A'nin fotografi)
      # — musteri yanlis parcayi siparis edebilirdi. Hicbir kapi kirmizi yakmiyordu.
      # Kapi: gorselsizde ag istegi olmayan data: URI yer tutucu (index.html phData ile
      # BAYT-AYNI; drift node'da GERCEK fonksiyon kosturularak olculur), paylasim/JSON-LD
      # gorsel alanlari HIC basilmaz, komsu kart kendi yer tutucusunu tasir; gorselli
      # urunde HICBIR SEY degismez (gercek katalogda 16.814/16.814 sayfa BAYT-ESIT olculdu).
      # node ZORUNLU (yoksa fail-closed kirmizi), offline, urunler.json OKUNMAZ, dosya
      # YAZMAZ. Mutasyon turu (7/7 kirmizi) elle:
      #   python3 tools/gorselsiz-render-kapisi.py --mutasyon
      - name: Gorselsiz render kapisi (kirik kapak + capraz bulasan komsu kart + SEO gorseli)
        run: python3 tools/gorselsiz-render-kapisi.py

      # EDGE KART ALAN KAPSAMI (PARA — edge modunda SESSIZ fiyat/beyan sapmasi). index.html
      # EDGE_KATALOG=true iken sepet paneli urun objesini urunler.json'dan DEGIL, ozet.json /
      # edge Worker kartindan alir; secenekler.js satirOzeti fiyati O objeden okur. Karttan bir
      # alan eksikse panel sunucudan FARKLI fiyat gosterir. Olculdu (1 Agu): `tur` alani fiyat
      # kuralina girdi ama kart_ozeti'ye eklenmemisti -> antifouling boyada panel 15.842.400 krs,
      # Worker 8.610.000 krs (fark 7.232.400 krs; 103 fiziksel urunde 53.270.280 krs). Kapi
      # ALAN LISTESI ekseninde calisir: `urun.<alan>` okumalarini secenekler.js KAYNAGINDAN
      # cikarir, katalogda deger tasiyan her alani kartta arar (deger tasiyan urunu olmayan alan
      # muaf ama SAYIYLA raporlanir). Boylece YARIN eklenen bir alan da kapsama girer.
      # Kardes depo (edge Worker KART_ALANLARI) YALNIZ OLCULUR, kirmizi yakmaz (CI'da yok).
      # Offline, dosya YAZMAZ (build.py bellekte modul olarak yuklenir), ~3 s.
      # Mutasyon turu (3/3 kirmizi) elle: python3 tools/edge-kart-kapisi.py --mutasyon
      - name: Edge kart alan kapsami (sepet fiyatini etkileyen alan kartta var mi)
        run: python3 tools/edge-kart-kapisi.py

      # OZET.JSON KART TEMSILI (v3: gorsel oneki + `yeni` referansi) — KAYIPSIZLIK KAPISI.
      # HATA SINIFI SESSIZ: temsil kuculdu, bir deger yanlis geri acilirsa ekranda hata
      # CIKMAZ — kart cizilir, edge modunda sepet paneli o karttan fiyat/beyan uretir.
      # Bu adim GERCEK build.py ile fikstur artefakti uretir ve CANLI index.html `ozetAc`
      # fonksiyonuyla geri acar (cozucu kopyasi tutulmaz): geri acilan kart kaynak kartla
      # BIREBIR esit olmali. Ayrica v2/v1 artefaktlarin da acildigini (bayat onbellek),
      # ortusme 0 oldugunda (yarin havuzsuz kategoriye dusen yeni urun) kartin TAM
      # tasindigini ve TEMSIL BAYRAGININ (build.py OZET_TEMSIL_SURUM) beyani ile uretilen
      # artefaktin TUTTUGUNU ayri iddialarla olcer — bayrak yayin N+1'de acilinca da
      # gecerli kalir. Iddia 9 gercek katalogda iki bayrak halini ve bayat istemci
      # penceresini (kapagi kaybolan kart sayisi) LOGA SAYIYLA basar.
      # Offline, depoya dosya YAZMAZ (gecici dizin), ~1 s.
      # Mutasyon turu (7/7 kirmizi) elle: node tools/ozet-temsil-test.js --mutasyon
      - name: Ozet kart temsili kabul testi (kayipsizlik + iki surum + temsil bayragi)
        run: node tools/ozet-temsil-test.js

      # FAZ3 EDGE_KATALOG BAYRAK KABULU (tools/faz3-bayrak.js) — kabul testleri 2, 6, 7.
      # NE KANITLAR: (2) bayrak KAPALI iken sayfa bugunku gibi davranir — urunler.json cekilir,
      # /katalog, /ara ve ozet.json HIC istenmez (geri donus yolu saglam) + kartta "Sepete Ekle"
      # butonu YOKTUR (Okan'in 16 Tem karari); (6) bayrak ACIK iken ilk boyama YALNIZ ozet.json
      # ile yapilir (/katalog cagrilmaz, tek istek) ve parametrik sari vitrin 4 kartla en ustte
      # cizilir; (7) Worker 500/ulasilamaz, hatta ozet.json bile inmez iken sayfa COKMEZ,
      # kullaniciya mesaj cikar ve baslik aramasi calismaya devam eder. 50 kontrol.
      # HATA SINIFI SESSIZ: bayrak kapaliyken kazara eklenen bir ag istegi ya da acikken
      # bozulan zarif-bozulma yolu ekranda HATA gostermez — sadece "site yavasladi"/"bos kaldi".
      # OFFLINE: ag/wrangler/D1/npm YOK. index.html, secenekler.js, urunler.json ve ozet.json
      # DISKTEN okunur; sayfanin kendi inline scripti elde yazilmis mini-DOM'da kosar ve TUM
      # fetch cagrilari taslaktir (olculdu: net.connect/dns.lookup/http(s).request/global fetch
      # on-yuklemeyle patlatildiginda test yine 50/0 ve rc=0 verir).
      # IKI ON KOSUL, IKISI DE BURADA KURULUR (build job'una BAGLI DEGIL — o AYRI runner):
      #   1. taban-fiyatlar.js  <- `build.py --sadece-taban`  (0,06 s, 19 urun)
      #   2. ozet.json          <- `build.py --sadece-ozet`   (0,20 s)
      # IKISI DE .gitignore'ludur (`/taban-fiyatlar.js` · `/ozet.json`), yani CI'in TAZE
      # checkout'unda YOKTUR ve onlari YALNIZ build.py yazar. serit-a3'te build.py'yi cagiran
      # baska satir, download-artifact ya da cache YOKTUR.
      # 🔴 --sadece-taban SATIRI SILINEMEZ: faz3-bayrak.js modul YUKLENIRKEN (tabanHaritasi(),
      # faz3-bayrak.js:125) taban-fiyatlar.js'i okur ve dosya yoksa KOSULSUZ throw eder — tek
      # bir iddia bile kosmadan rc=1. OLCULDU (12 Agu 2026, taze `git clone`): satir yokken
      # `--sadece-ozet` rc=0 verir ama `node tools/faz3-bayrak.js` rc=1 ("taban-fiyatlar.js
      # YOK"); satir eklenince rc=0 ve 50/0. Bu adim BLOKLAYICI oldugu icin bedeli serit-a3'un
      # kirmizi yanmasi, dolayisiyla `deploy: needs [...]` SKIPPED = HER PUSH'TA YAYIN DURMASI.
      # (Yerelde yesil gorunmesi tuzaktir: calisma agacinda onceki TAM build'den kalma
      # IZLENMEYEN bir taban-fiyatlar.js durur; hukum TAZE checkout'ta verilmeli.)
      # NEDEN TAM BUILD DEGIL: tam `python3 tools/build.py` bu katalogda (25 965 urun) 232,6 s
      # surer ve 25 965 sayfa + sitemap + yasal sayfa damgasi yazar; iki dar kol 0,26 s.
      # YAN ETKISIZ: `--sadece-ozet` bayraksiz cagrildiginda temsil surumu build.py'nin TEK
      # KAYNAK sabitinden (OZET_TEMSIL_SURUM = 3) gelir, yani deploy'un yayina koydugu
      # artefaktin AYNISI kalir — bu adim ozet.json'u v2'ye DUSURMEZ ve sonraki adimlara
      # bayat/yanlis surum birakmaz (kardes vitrin-kabul.js zaten kendi kopyasini yeniden uretir).
      # BLOKLAYICI: continue-on-error YOK. rc=1 iddia dustu, rc=2 OLCULEMEDI (index.html'den
      # ozetAc ayiklanamadi / sema kaydi) — ikisi de yayini durdurur, sessizce yesile donmez.
      # Node 20, olculen sure: 0,06 + 0,20 + 2,83 s (toplam ~3,1 s).
      - name: "FAZ3 bayrak kabulu (EDGE_KATALOG kapali/acik + parametrik vitrin + zarif bozulma)"
        run: |
          python3 tools/build.py --sadece-taban
          python3 tools/build.py --sadece-ozet
          node tools/faz3-bayrak.js

      # KONFIGUR BUNDLE KAPISI (drift): shop/src/konfigurlar.js artik ELLE BAKIMLI AYNA DEGIL,
      # urunler.json'daki "konfigur" alanlarindan URETILEN bir artefakt. Bu adim artefakti
      # yeniden turetip BIREBIR karsilastirir; yeni konfigurlu urun eklenip artefakt
      # uretilmemisse (ya da artefakt elle kurcalanmissa) CI KIRMIZI yanar. Cozum tek komut:
      # python3 tools/konfigur-bundle-kapisi.py --yaz
      # KAPSAM DAR (jeton ekseni): yalniz konfigur alanlarindan TURETILEN icerik karsilastirilir
      # -> konfigursuz urun ekleme/silme, fiyat/aciklama/gorsel/CSS degisikligi, katalog sirasi
      # ve konfigur objesi ICI anahtar sirasi kapiyi YAKMAZ (olculdu: --kendini-test'te 9
      # yanlis-pozitif senaryosunun 9'u yesil). Saf Python, offline, dosya YAZMAZ, ~1 s.
      - name: Konfigur bundle kapisi (urunler.json -> shop/src/konfigurlar.js drift)
        run: python3 tools/konfigur-bundle-kapisi.py

      # SEMA BUNDLE KAPISI (sari/parametrik seri — PARA EKSENI, 31 Tem).
      # shop/src/semalar.js 23 satirlik ELLE YAZILMIS bir import listesiydi ve onu olcen tek
      # nobetci (shop/test/kabul.js test 9a) ci-kapsam-test.py'de MUAFTI -> koruma FIILEN
      # KOSMUYORDU. Liste jenerator/urunler/ ile ayrisirsa hata SESSIZDIR: semasi bulunamayan
      # sari urun kartla TAHSIL EDILEMEZ (400 -> WhatsApp), ayni id'yi tasiyan iki sema ise
      # Map'te sessizce SON kaydi birakip YANLIS FIYAT uretir. Kanal ACIK (PARAMETRIK_ODEME_ACIK
      # = true, 23/23 semada tabanFiyatTL dolu) -> dogrudan para.
      # Artefakt artik ELLE YAZILMAZ, dizinden TURETILIR; bu adim drift'i bloklar. Cozum tek
      # komut: python3 tools/sema-bundle-kapisi.py --yaz
      # KAPSAM DAR: yalniz jenerator/urunler/*.json dosya KUMESI + shop/src/semalar.js.
      # urunler.json'a urun eklemek, sema ICERIGINI degistirmek, dizine .json olmayan dosya
      # koymak kapiyi YAKMAZ (olculdu: --kendini-test bolum A). Saf Python, offline, ~0,03 s.
      - name: Sema bundle kapisi (jenerator/urunler -> shop/src/semalar.js drift)
        run: python3 tools/sema-bundle-kapisi.py

      # SARI SERI DETERMINISTIK ALT KUME (shop kabul suite'inin CI'ya BAGLANABILIR yarisi).
      # 🔴 SUITE IKIYE AYRILDI (gerekce dosya basinda): tam kosum `wrangler dev --local` +
      # `npx wrangler@4` indirmesi ve CANLI /ara ucuna vuran parite testi (test 7) icerir ->
      # KARARSIZ; bloklayici baglansaydi tum mimarlarin yayini RASTGELE kirilirdi (olculdu:
      # sorgu sayisi kosumdan kosuma 841 <-> 843 kayiyor, canli D1 + baska oturumlarin
      # urun eklemesi). `--sema-paritesi` kolu AG YOK / WRANGLER YOK / D1 YOK: sema kapsami
      # (9a) + sunucu-tarafi sari fiyat cekirdegi (9b) + 12 negatif fail-closed vakasi + 1
      # pozitif kanarya (26). 12 ard arda kosumda cikti sha256 BIREBIR ayni, ~0,06 s.
      - name: Sari seri sema paritesi + fail-closed nobeti (deterministik alt kume)
        run: node shop/test/kabul.js --sema-paritesi

      # SEMA `kisitlar` x SIPARIS/ODEME YOLU — PARA EKSENI (3 Agu). Sema `kisitlar` bloklari
      # kosullu URETILEBILIRLIK kurallaridir (or. altigen basli civata M5'ten baslar; rulmanda
      # genislik alt siniri cap farkindan turer). OLCULDU: iyi bicimli kural para yolunda
      # UYGULANIYOR (canli /api/shop/fiyat: vida civata M3 -> 400 `parametre-araligi`), AMA
      # taninmayan/okunamayan bir kisit kaydi SESSIZCE ATLANIYORDU ve ayni yol FIYAT
      # URETIYORDU (olculdu: 10.000 ve 29.116 kurus). "Olculemedi" ile "gecerli" ayni sey
      # degildir -> iki fail-closed kol eklendi ve bu adim ikisini de olcer.
      # BU ADIM BLOKLAYICI ve `build` isinde (`deploy: needs: build`) — sessiz yanlis tahsilat
      # ekseni yayini durdurmali. node ZORUNLU (yoksa adim FAIL eder = fail-closed).
      # OFFLINE: ag YOK, wrangler YOK, D1 YOK, siparis YOK; depo dosyasi YAZILMAZ (mutantlar
      # isletim sistemi gecici dizinine kopyalanir, kaynak sha256 bas==son dogrulanir).
      # KAPSAM DAR: `kisitlar` alani OLMAYAN semada (bugun 21/23; satistaki 17 ailenin HEPSI)
      # tek satir davranis degismez — satis kurus imzasi tum mutantlarda BIREBIR SABIT
      # olcuduluyor, yani bu kapi bir aileyi yanlislikla fiyatsiz birakamaz.
      # 🔴 IDDIA/MUTANT SAYISI BURAYA YAZILMAZ (bayat sayi yanlis guven verir; ayni dosyada
      # `yonet-cerez` ve `Uyum kapisi` adimlarinda ayni kural): betik sayilari kendisi basar
      # ("IDDIA SAYISI: N", "MUTANT SAYISI: ... BEYANINA UYMAYAN: N").
      - name: Sema kisit fail-closed kapisi (siparis/odeme yolu uretilebilirligi soruyor mu)
        run: node shop/test/kisit-fail-closed.mjs

      # Ayni nobetcinin OLU olup olmadigi: her fail-closed kol TEK BASINA kaldirilir ve
      # BEYAN EDILEN iddianin kirmizi yanmasi SART kosulur (ortak kolla korunan eksenler
      # iddia EDILMEZ — ayirt edici mutanti olmayan eksen "savunma derinligi" sayilmaz).
      # KONTROL mutantlari (kolu bozmayan degisiklikler) hicbir iddiayi kirmizi yakmamali.
      - name: Sema kisit kapisi ic nobetci (mutasyon — kol gercekten canli mi)
        run: node shop/test/kisit-fail-closed.mjs --kendini-test

      # KONFIGUR SEMASI -> D1 (FAZ 1+2). Konfigur semasi artik SADECE Worker bundle'inda degil,
      # D1 'konfigur' kolonunda da yasar (urun eklenince pre-push hook zaten senkronlar).
      # Bu adimin ASIL kaniti: arama.urun_hash() konfigur'u KAPSAMIYOR -> konfigur icerik-upsert
      # yoluna konsaydi degisim SESSIZCE eskirdi. Test bunu dogrudan olcer (alan degistir ->
      # hash birebir ayni -> diff_plan 0 UPDATE) ve hedefli konfigur_plan'in AYNI degisimi
      # yakaladigini gosterir; ayrica 17/17 JSON birebir, idempotens, temizleme, fail-closed
      # bozuk-sema ve 3 no-op mutasyon guardi.
      # OFFLINE: canli D1/wrangler/AG YOK — gercek d1-sema.sql bellek-ici sqlite3'e yuklenir.
      # fts5-trigram CI'da YOK; test bunu OLCER ve yalniz "FTS thrash" iddiasini ACIKCA
      # ATLANDI der (kalan 33 iddia kosar) -> kardesi taban-fiyat-d1-test.py gibi MUAF olmasi
      # gerekmez, burada BLOKLAYICI kosar. ~2 s.
      - name: Konfigur D1 semasi kabul testi (hash-kor alan + hedefli UPDATE)
        run: python3 tools/konfigur-d1-test.py

      # TICARI HAL (`tur` / `stokta`) D1 hatti — Ege fiziksel urunu ALGILASIN, TUKENMIS
      # urunu STOKTA diye SUNMASIN. Dort sessiz-hata sinifi olculur:
      #   A TIP        `stokta` INTEGER olmali; TEXT olsaydi SQLite 0'i '0' METNINE cevirir
      #                ve uc taraftaki JS'te Boolean('0') === true -> yanlis vaat.
      #   B HASH       tur/stokta urun_hash'e GIRER (taban_fiyat/konfigur'un TERSI karar):
      #                girmeseydi "tukendi" isareti hash'i degistirmez, diff-upsert satiri
      #                yeniden yazmaz ve eski stok hali D1'de KALICILASIRDI.
      #   C IKIZ TANIM Ayni tablo bes yerde tanimli (d1-sema.sql · GOC_KOLON · _KT_SEMA ·
      #                satir_sql INSERT · KOLONLAR). Invaryant besini birbirine kilitler;
      #                INSERT − KOLONLAR farki TAM OLARAK gerekceli KASITLI_DISARIDA olmali.
      #   D FAIL-CLOSED Alan yokken/bozukken uretilen deger "STOKTA" DIYEMEZ (uc degerli:
      #                -1 bilinmiyor · 0 stokta degil · 1 stokta; 'STOKTA' diyen TEK deger 1).
      #   E VERI       Gercek katalogta taninmayan yazim ya da stok bilgisiz fiziksel urun yok.
      # OFFLINE: canli D1/wrangler/AG YOK (gercek d1-sema.sql bellek-ici sqlite3'e yuklenir).
      # Cift yonlu mutasyon (11 oldurucu KIRMIZI + 2 ilgisiz YESIL) elle:
      #   python3 tools/stok-d1-kapisi.py --mutasyon
      - name: "Ticari hal D1 kapisi (tur/stokta: tip + hash kapsami + ikiz tanim + fail-closed)"
        run: python3 tools/stok-d1-kapisi.py

      # UYUM YAZMA YOLU (tools/duzelt.py). Yukaridaki adim `uyum`un SOZLUGUNU ve KATALOG
      # eksenini korur; bu adim o veriyi kataloga YAZAN tek mesru yolu korur — ikisi AYRI
      # eksendir. Alan duzelt.py'nin izinli kumesinde OLMADIGI icin 13.040 temiz kayit
      # mesru yoldan yazilamiyordu (ilk parti rc=2 aldi, atomik dogrulama sayesinde
      # HICBIR SEY yazilmadi). Yol acildi ve dort sessiz-hata sinifi kilitlendi:
      #   TURETIM  `marka` ELLE YAZILMAZ, `uyum`dan arama.marka_uyumdan_turet() ile AYNI
      #            islemde turetilir ve guard izin manifestine de o deger gider (aksi halde
      #            guard turetimi HEAD'e geri alir, turetim sessizce ETKISIZ kalirdi).
      #            🔴 SESSIZ SINIF: `marka` haystack uzerinden ARAMA METNIDIR — yanlis
      #            turetilen bir deger hicbir kirmizi yakmadan arama sonucunu dusurur.
      #   IKI KAYNAK Ayni cagrida hem `uyum` hem `marka` verilmesi REDDEDILIR; hangisinin
      #            kazandigi kod SIRASINA kalamaz.
      #   ATOMIK   Yazimdan HEMEN ONCE, YAZIM SONRASI durumda, yalniz DOKUNULAN kayitlar
      #            arama.uyum_sebebi()'nden gecer; 1500'luk partideki TEK kirli kayit tum
      #            partiyi dusurur ve urunler.json byte-esit kalir. Kapsam bilerek dardir:
      #            katalog geneli eksen tools/uyum-kapisi.py'de KALICI.
      #   KOD AYRIMI gorsel-koken 4 / altkategori 5 / ticari hal 6 / uyum 7 — cagiran
      #            (parti betigi) hangi kapinin reddettigini yalnizca cikis kodundan
      #            ayirt edebilir.
      # GERCEK duzelt.py sentetik repolarda SUREC olarak kosturulur (gercek cikis kodlari,
      # gercek disk sha256'si). OFFLINE: ag/D1/wrangler YOK, gercek urunler.json'a
      # DOKUNULMAZ. Curutme (12 kirmizi-beklentili + 4 kontrol, 8/8 tek-kirmizi eksen) elle:
      #   python3 tools/duzelt-uyum-mutasyon.py
      - name: "Uyum yazma yolu (duzelt.py: turetim + iki kaynak + atomiklik + kod ayrimi)"
        run: python3 tools/duzelt-uyum-test.py

      - name: "Arama lazy yukleme (indexsiz fikstur + fail-closed genisleme)"
        run: python3 tools/arama-lazy-yukleme-test.py

      # ALT KATEGORI CIP SATIRI (ana sayfa daraltma yuzeyi) — tools/altkategori-cip-test.py.
      # NEDEN AYRI BIR ADIM: ustteki iki kapi VERI yolunu (D1/hash/izinli kume) ve URUN
      # SAYFASI etiketini olcer; ANA SAYFA daraltmasi UCUNCU bir eksendir ve ikisi yesilken
      # sessizce yok olabilir (olculdu 2 Agu: D1'de 16.646 dolu kayit + 60 tekil ikili VARDI,
      # index.html `altkategori` parametresini HIC okumuyordu — musteri tiklayip daraltamiyordu).
      # OLCULEN SESSIZ-HATA SINIFI: "cip GORUNUR, TIKLANIR, liste DEGISMEZ, alarm CALMAZ".
      # Bu yuzden her iddianin KONTROL EKSENI var: sayi DEGISMELI (Marin 10 -> Bujiler 5),
      # uydurma deger 0 DONMELI, donen kayitlarin DEGERI secilene ESIT olmali.
      # NASIL: index.html'in GERCEK inline scripti node:vm'de, DOM taklidi + sahte fetch ile
      # calisir (kod kopyalanmaz); cipler GERCEKTEN tiklanir. IKI MOD da kosar — edge
      # (EDGE_KATALOG=true, canli hal: parametre Worker'a gider) ve yerel (geri donus yolu:
      # filtre istemcide). Ayrica IKIZ ekseni: cip evreni arama.ALTKATEGORI_IZINLI ile birebir.
      # OFFLINE: ag YOK, DISKE YAZMAZ, ~15 s. node ZORUNLU (setup-node yukarida).
      # Cift yonlu mutasyon (10 oldurucu KIRMIZI + 3 ilgisiz YESIL + M00 kontrol) elle:
      #   python3 tools/altkategori-cip-test.py --mutasyon
      - name: "Alt kategori cip satiri (ana sayfa daraltma: cip + URL + filtre baglantisi)"
        run: python3 tools/altkategori-cip-test.py

      # CIP SATIRLARI CAPRAZ DARALMA + MODEL EKSENI — tools/cip-indeks-test.py.
      # NEDEN AYRI BIR ADIM (ustteki kapi bu ekseni GORMEZ): altkategori-cip-test.py TEK
      # satirin (GRUP) kendi ekseninde davranisini olcer; bu kapi UC SATIRIN BIRBIRINE gore
      # daralmasini ve YENI MODEL eksenini olcer. Olculen musteri hatasi (2 Agu, CANLI):
      # `Marin`+`Bujiler` secili (136 urun, hepsi ayni marka bujisi) iken MARKA satiri hala
      # Mercury/Volvo/Yamaha/Jeanneau/Beneteau/GoPro/Zodiac gosteriyordu — hicbirinin o
      # grupta urunu YOK, her cip bir OLU UC. Kok neden: cip evrenleri KATEGORIDEN
      # turetiliyordu, filtrelenmis kumeden degil (sabit menude bos kombinasyon: Marin
      # %86,2 · Motosiklet %72 · Otomobil %58).
      # OLCULEN SESSIZ-HATA SINIFLARI: (1) cip gorunur/tiklanir, liste degismez;
      # (2) cip gosterilir ama 0 urun verir; (3) UC parametreyi SESSIZCE YOK SAYAR
      # (olculdu: /katalog?marka=BMW&model=E46 -> toplam 1673 = marka toplaminin AYNISI);
      # (4) satir KENDI secimiyle daralir -> kullanici filtreyi DEGISTIREMEZ.
      # Bu yuzden her iddianin KONTROL EKSENI var ve GORUNEN HER CIP TEK TEK tiklanip >0
      # olculur (ORNEKLEME YOK). Ayrica: gercek katalog uzerinde esik (marka>=15, model>=3,
      # marka basina >=2 model) + "indekste sifirli kombinasyon YOK" iddialari; yayin
      # kopyasina enjeksiyonun fiilen oldugu; mobil cip satirinin kaydirilabilir tek satir
      # oldugu; arama metnine (hs) model EKLENMEDIGI (site<->Ege paritesi).
      # NASIL: index.html'in GERCEK inline scripti node:vm'de kosar (kod kopyalanmaz), IKI
      # MOD da olculur (edge + yerel). Cip indeksi UYDURULMAZ: gercek uretec
      # (tools/cip-indeks.py) fikstur katalogu uzerinde calistirilip verilir.
      # MODEL CIPI KANONIKLESTIRME EKSENI (M1-M8, 4 Agu — olculen CANLI hata): model cipleri
      # HAM jetondu, sayfa ureticisinin kanoniklestirmesi CIP SATIRINA UYGULANMIYORDU.
      # Peugeot secili iken satir `206` ile `Peugeot 206`yi AYRI, `PSA`/`iPhone`i MODEL,
      # `DS` (bagimsiz marque) ve `Berlingo`yu (Citroen rozeti) Peugeot MODELI gosteriyordu.
      # Olculdu (17.914 urun): 5 mukerrer grup · 12 model-olmayan cip · 479 cipin 73'unde
      # cip sayisi ile SAYFA sayisi FARKLI. M3 iki tarafi TEK KAYNAKTAN kiyaslar,
      # M5 ters yonu (asiri eleme) olcer, M6/M8 uc etiketi yolunu olcer.
      # OFFLINE: ag YOK, DISKE YAZMAZ, ~47 s (M ekseni +0,9 s). node ZORUNLU (setup-node).
      # 🔴 IDDIA EDILMEYEN EKSEN (durust kayit): "marka jetonu (PSA/VAG/Geo) CIP OLMAZ"
      # yargisi BU kapida iddia SAYILMIYOR — olculdu (4 Agu): iki koruma katmani da TEK
      # BASINA gozlenemiyor (birini dusuren mutant YESIL kaliyor), ortak kaynagi bozan
      # mutant ise iddianin OKUDUGU yuklemi de bozuyor (totoloji). Eksen BAGIMSIZ oracle
      # ile model uyeligi kapisinda (K7) olculuyor ve orada oldurucu mutanti VAR.
      # Cift yonlu mutasyon (30 oldurucu KIRMIZI + 5 ilgisiz/kontrol YESIL + M00) elle
      # — sayilar 4 Agu'da SAYILARAK duzeltildi (yorumda 17+3 yaziyordu, gercek 25+3 idi):
      #   python3 tools/cip-indeks-test.py --mutasyon
      - name: "Cip satirlari capraz daralma + model ekseni (olu uc + fail-open nobeti)"
        run: python3 tools/cip-indeks-test.py

      # KONFIGUR GOLGE MODU (FAZ 3). Worker D1'den `konfigur`u OKUR ama fiyati HALA bundle'dan
      # hesaplar; bu adim iki seyi birden kilitler:
      # (1) MUSTERI DAVRANISI DEGISMEDI — capa 150/PLA=73600, 300/ASA=150000, anka-kusu
      #     150/PLA tutar '986,00 TL' (kargo dahil), konfigursuz urun aynen; hepsi konfigur
      #     kolonu VARKEN ve YOKKEN birebir ayni (17 urun x 3 nokta = 51 kalem dahil).
      # (2) FARK OLCULEBILIR — bundle==D1 iken fark 0 ve HIC log yok; kasten farklilastirilmis
      #     fiksturde ayrisan ALAN YOLU + KURUS farki gorunur, ama tahsilat DEGISMEZ.
      # Ayrica: d1-eksik/bundle-eksik/d1-bozuk siniflari, kolon yokken fail-safe odeme,
      # /yonet/konfigur-golge rapor ucu (anahtarsiz 404, YAZMA 0) ve 4 no-op mutasyonu.
      # OFFLINE: wrangler YOK, ag YOK, siparis YOK, dosya yazmaz. ~10 s.
      - name: Konfigur golge modu kabul testi (davranis degismedi + fark olculebilir)
        run: node shop/test/konfigur-golge.mjs

      # FIYAT ESDEGERLIGI + PROVA UCU (shop/test/fiyat-prova.mjs). Iki seyi birden kilitler:
      # (1) ESDEGERLIK — konfigur aynasinin uretilmis artefakta cevrilmesi ve fiyat hesabinin
      #     sepetiFiyatla()'ya cikarilmasi fiyati DEGISTIRMEDI: ESKI kod (git HEAD: elle ayna)
      #     ile YENI kod 14 urun x 6 kombinasyonda AYNI kurusu uretmeli (fark 0) + 3x tavan
      #     (150000 kurus) hala uygulanmali.
      # (2) PROVA — POST /api/shop/fiyat yan etkisiz olmali: D1 YAZMA sayaci 0, ag (iyzico/
      #     Telegram/e-posta) cagri sayaci 0, siparis_no sorgusu 0; AYNI kosumda /baslat ikisini
      #     de artirmali (sayaclarin olu olmadigi kaniti). Ayrica prova tutari tahsilat tutariyla
      #     BIREBIR, cevap BEYAZ LISTE (baslik/kategori/gorsel/hacim/PII/token sizmaz), dogrulama
      #     /baslat ile ayni, hiz siniri calisiyor, artefaktta olmayan konfigur urunu provada da
      #     400 (fail-closed). 4 KIRMIZI-MUTASYON: bayat artefakt / fail-closed kol silinmis /
      #     kapinin CI cagrisi silinmis / prova yan etki uretiyor.
      # OFFLINE: wrangler YOK, ag YOK, gercek/sahte SIPARIS YOK, repo dosyasi YAZILMAZ. ~40 s.
      - name: Fiyat esdegerligi + prova ucu kabul testi (yan etkisiz fiyat sorgusu)
        run: node shop/test/fiyat-prova.mjs

      # BOY VARYANTI ZINCIRI (14 Agu 2026) — `boy_secenekleri` alani DORT yuzeyde birden
      # fiyat sürer: urunler.json semasi (arama.py kanonik) -> D1 kolonu + urun hash'i
      # (d1-sync satir_sql) -> edge sepet karti (build.kart_ozeti) -> odeme Worker'i
      # (shop/src/index.js). Biri tasimazsa musteri BIR fiyat gorur, sunucu BASKASINI
      # tahsil eder — sessiz eksik tahsilat ([[ui-kaldirmak-odeme-yolunu-kapatmaz]]).
      # Kapi dort ekseni de tek kosumda olcer: sema RED'leri, D1 geri-okumasi, hash
      # duyarliligi, ve Worker'in 4 fail-closed hukmu (gecerli boy / bilinmeyen etiket /
      # secim atlanmasi / kolon gocu yapilmamis D1). BLOKLAYICI: para yolu.
      # Kardes depo ekseni (pruvo-bot edge Worker'i) kosucuda OLCULEMEDI diye BASILIR —
      # o sozlesmenin sahibi HocA deposudur, KraL CI'sinin kapsaminda degildir.
      - name: "Boy varyanti kabul kapisi (D1 -> edge kart -> odeme fiyat paritesi)"
        run: python3 tools/boy-secenekleri-kabul.py

      # ABS: FIYAT TUREMESI + KATEGORI SUZGECI (shop/test/abs-kapisi.mjs). Okan 14 Agu:
      # ABS satisa geri acildi, fiyati ASA ile BIREBIR; Ev/Ofis/Dekorasyon/Skan Art/
      # Oyun-Hobi'de SECILEMEZ. Iki sessiz-hata sinifi olculur:
      # (1) IKIZ SAYI — "ABS = ASA" iki ayri sayiya yazilirsa biri sessizce ayrisir. Esitlik
      #     TEK BASINA yetmez: test ASA'yi fiksturde degistirip ABS'in TAKIP ETTIGINI olcer
      #     (elle yazilmis 60 esitligi gecer, turemeyi GECEMEZ) — hem JS hem build.py tarafi.
      # (2) UI'DAN GIZLEMEK ODEME YOLUNU KAPATMAZ (bu depoda olculdu): suzgec hem SECIM
      #     LISTESINDE (gercek uretec: build.py cipleri + parametrik dropdown, python3
      #     koprusuyle) hem WORKER KABULUNDE (gercek kod + sahte D1: 400, fiyat DONMEZ,
      #     D1 yazma 0, ag cagrisi 0) ayri ayri olculur. Kategori bos/bilinmeyen -> RED.
      # Ayrica: Skan Art konfigur kolu degismedi (ABS sizmadi), Karbon hala site:false,
      # uc pakette "ABS 1.50 / satisa kapali" beyani kalmadi.
      # OFFLINE: ag YOK, wrangler YOK, D1 sahte, siparis OLUSMAZ, depo dosyasi YAZILMAZ. ~1 s.
      - name: ABS fiyat turemesi + kategori suzgeci kabul testi (fail-closed odeme yolu)
        run: node shop/test/abs-kapisi.mjs

      # ONCE-KIRMIZI KANITI — ustteki kabul testinin OLU OLMADIGI, her kosumda YENIDEN
      # URETILEREK gosterilir ([[mutasyon-kaniti-yeniden-uretilebilir]]: anlatilan batarya
      # kanit degildir). 6 oldurucu mutant (elle sabit katsayi · Worker suzgeci silindi ·
      # haric listesinden bir kategori dustu · fail-open kategori · Skan Art konfigur'une ABS
      # sizdi · Karbon site:true) KIRMIZI, 2 kontrol (yalniz-yorum · daraltilmis fikstur)
      # YESIL yanmali. Mutantlar GECICI KOPYAYA uygulanir; betik bas/son sha256 ile depo
      # dosyalarinin DEGISMEDIGINI kendisi kanitlar. ~2 s.
      - name: ABS kapisi mutasyon bataryasi (nobetci olu mu — 6/6 kirmizi + 2/2 kontrol)
        run: python3 tools/abs-mutasyon.py

      # STL UC-KOPYA NOBETCISININ KABUL TESTI (tools/stl-uc-kopya-nobet.py). Okan kurali
      # "her STL'in kopyasi hem Drive'da hem R2'de" YAZILIYDI ama OLCEN kimse yoktu ->
      # Drive'da olup R2'de olmayan uretim dosyasi sayisi 9'dan 183'e SESSIZCE buyudu
      # (13->14 Agu olcumu). Nobetci dort kovayi (her-ikisinde / sadece-R2 / sadece-Drive /
      # hicbirinde) sayar; HICBIRINDE>0 tek-kopya kaybidir (esik YOK), SADECE_DRIVE>esik
      # musteri yolunu kirar (panel uretim dosyasini R2'den ceker), SADECE_R2 yalniz uyaridir.
      #
      # 🔴 BURADA KOSAN SEY NOBETCI DEGIL, NOBETCININ KABUL TESTIDIR. Nobetcinin KENDISI
      # hicbir is akisina BAGLANMADI: canli R2 listelemesi + Drive mount'u ister, kosucuda
      # ikisi de YOKTUR -> her kosumda sahte kirmizi uretirdi. Kabul testi ise SAF
      # FIKSTURDUR: ag YOK, R2 YOK, Drive YOK, kimlik YOK (~1 s).
      #
      # 🔴 NEDEN SERIT A: adim once nobet.yml'e (serit B) konmustu; is-akisi-kapisi.py
      # "SERIT B'DE BEYANSIZ KAPI" diye KIRMIZI yakti ve HAKLIYDI — bloklamayan seride
      # birakmak, bir kapiyi silmeden etkisizlestirmenin en ucuz yoludur. Muafiyet
      # YAZILMADI, adim buraya TASINDI.
      #
      # Ikinci adim birincinin OLU OLMADIGINI her kosumda YENIDEN URETEREK gosterir:
      # 4 oldurucu mutant (HICBIRINDE kolu kalkti · esik sonsuza cekildi · stub gercek STL
      # sayildi · R2 reddinde fail-open) KIRMIZI, 1 kontrol mutanti YESIL yanmali.
      # Mutantlar gecici AYNA dizinine uygulanir; canli tools/ dizinine YAZILMAZ.
      - name: STL uc-kopya nobetcisi kabul testi (7 vaka — saf fikstur, ag YOK)
        run: python3 tools/stl-uc-kopya-nobet-test.py

      # CI-ALT-KUME: --mutasyon
      - name: STL uc-kopya mutasyon bataryasi (nobetci olu mu — 4/4 kirmizi + kontrol yesil)
        run: python3 tools/stl-uc-kopya-nobet-test.py --mutasyon

      # SERIT A (icerik) — 2-RENK URETIM SOZLESMESI. Serit ayriminda once SERIT B'ye
      # konmustu; denetimde A'ya alindi. GEREKCE: bu kapinin 4. iddiasi YAYINLANAN
      # `secenekler.js` (Pages beyaz listesinde) ONIZLEME_PARCALAR parca listesi ile
      # uretim eslem json'unun TEK KAYNAK paritesidir. Sapinca site, uretimin
      # VEREMEYECEGI bir 2-renk parcasi SUNAR — Okan'in 29 Tem canli vakasinin sinifi
      # (site satiyor, uretim veremiyor). Ucret ekseni yukaridaki adimda; bu adim
      # "sunulan sey uretilebilir mi" eksenidir, ikisi ayri. Oz-nobetci kolu SERIT B'de.
      # OFFLINE: ag YOK, openscad YOK, urunler.json OKUNMAZ. ~2 s.
      - name: "Iki govde eslem kapisi (2-renk: -D farki yalniz Output)"
        run: python3 tools/iki-govde-kapisi.py

      # OLCUM KABLOLAMA KAPISI (shop/test/olcum.mjs) — 30 Tem'e kadar CI'da HIC kosmuyordu.
      # NE KORUR: Meta CAPI + GA4 Purchase kablolamasi (currency/value/event_id dedup), havale
      # akisinda /durum 'odendi' -> Purchase, idempotens (ayni siparis iki kez -> TEK olay),
      # eszamanlilik/CAS, basarisiz odemede olay GONDERILMEMESI, kart akisinin olcum izi ve
      # GIZLILIK ekseni (Okan'in yonetim IP/UA'si Meta'ya GITMEZ + token loga yazilmaz).
      # Hepsi SESSIZ hata sinifi: yanlis ciro/cift sayim reklam optimizasyonunu bozar, kimse
      # ekranda gormez.
      # NEDEN SIMDI KOSABILIYOR: test shop/src/{index,yonet}.js'i node'a yukluyor; o kaynaklar
      # JSON'u STATIK import ediyor ve Node ESM `with { type: "json" }` istiyor. Attribute
      # enjeksiyonu eskiden `module.registerHooks` (v22.15+) ile yapiliyordu -> Node 20 runner'da
      # 6 iddia (18/19/22/24/25/26) HER kosuda kirmizi, 129/6. Hook `module.register` (v20.6+)
      # API'sine cevrildi: TEK kod yolu, surum dali YOK -> Node 20.20.2'de de 25.x'te de
      # 188/0 (ikisinde de olculdu). FAIL-CLOSED: modul yuklenemezse o 6 iddia GERCEK hata
      # metniyle KIRMIZI yanar (mutasyonla kanitlandi), asla "atlandi/yesil" olmaz.
      # OFFLINE: ag YOK (fetch stub'lanir), wrangler YOK, sahte D1, GERCEK SIPARIS YOK,
      # repo dosyasi YAZILMAZ. Secret degeri basilmaz. ~1 s.
      - name: "Olcum kablolama kabul testi (Meta CAPI + GA4 Purchase, havale/kart + gizlilik)"
        run: node shop/test/olcum.mjs

      # OLCUM TEST KAPISI (shop/test/olcum-kapisi.cjs) — 30 Tem'e kadar OLU idi. Dosya SAF
      # MODULDU (`module.exports` var, `require.main` kolu YOK): `node shop/test/olcum-kapisi.cjs`
      # rc=0 verip SIFIR IDDIA kosuyordu; shop/.dev.vars'a SAHTE bir META_CAPI_TOKEN konsa
      # bile rc=0 kaliyordu. Tek tuketicisi shop/test/kabul.js, o da wrangler dev istedigi
      # icin hicbir hatta kosmuyor -> "yerel test GERCEK Meta pikseline sahte Purchase
      # basmasin" fail-closed kapisi FIILEN YOKTU (izin listesindeki R_AYRI gerekcesi de
      # olcumle yanlis cikti: oyle bir CI hatti yok). Artik ciplak kosulabilir:
      #   A) OZ-NOBET — kapinin karar mantigi sentetik girdiyle olculur (izlenen anahtarlar,
      #      taranan dosyalar, yanlis-pozitif kenarlari, override akil saglami).
      #   B) GERCEK DURUM — bu ortamdaki env + shop/{.dev.vars,.env,.env.local} + wrangler.toml
      #      okunur; gercek bir CAPI token'i / GA4 api_secret'i gorurse KIRMIZI.
      # Sebep metinleri anahtarin ADINI tasir, DEGERINI TASIMAZ -> loga sir basilmaz.
      # Offline: ag YOK, wrangler YOK, dosya YAZMAZ, gercek Meta/GA4 ucuna ISTEK ATMAZ. ~0,1 s.
      - name: Olcum test kapisi (yerel test gercek piksele basmasin — fail-closed)
        run: node shop/test/olcum-kapisi.cjs

      # SEPET PANELI + KONFIGUR ODENEBILIRLIK PROVASI (shop/test/sepet-panel.js). index.html'in
      # inline sepet scriptini node:vm'de GERCEKTEN kosar (kod kopyalanmaz): kayip satir,
      # bos sepet, firsat tazelemesi, bozuk unicode, savunma kacisi, odeme payload'i VE
      # (30 Tem) konfigur kart-yolu provasi -> bundle'da olmayan konfigur urunu sepette
      # KAPALI gorunur, musteri odeme formunu doldurmadan WhatsApp'a yonlendirilir; ag
      # hatasi/zaman asimi/cop govde/celiskili 400 hallerinde de KAPALI (fail-closed);
      # konfigursuz sepette /fiyat ucuna KOR ISTEK ATILMAZ (hiz siniri).
      # 🔴 MUAFIYET KALDIRILDI (30 Tem): bu dosya ci-kapsam izin listesinde R_AYRI ("shop ayri
      # Worker hedefi") gerekcesiyle muaf duruyordu; gerekce OLCULEREK YANLIS bulundu — test
      # wrangler/ag/D1 ISTEMEZ (kardesleri konfigur-fail-closed.mjs, fiyat-prova.mjs, olcum.mjs
      # zaten burada kosuyor). Muaf oldugu icin hic kosulmadi ve EDGE_KATALOG acildiginda
      # SESSIZCE OLDU: 9 nobetcinin 9'u "TEST ALTYAPI HATASI" verip hicbir iddiayi
      # kosturmuyordu (sahte fetch edge uclarini tanimiyordu). Sahte fetch edge'e uyarlandi,
      # 14/14 yesil; artik CI'da BLOKLAYICI kosar.
      # OFFLINE: ag YOK (fetch stub), wrangler YOK, GERCEK SIPARIS YOK, dosya YAZMAZ. ~1 s.
      - name: Sepet paneli + konfigur odenebilirlik provasi kabul testi
        run: node shop/test/sepet-panel.js

      # METIN ESLEM KAPISI (sessiz teslimat hatasi, 29 Tem): parametrik ailelerde musteri
      # yazisi ("kasenin uzerinde ne yazsin", "cerceveye isim") derleyiciye ULASMIYORDU —
      # canli olcum: cerceve/cetvel/kase'de '' vs 'OKAN' vs 'ZZZZZZZZ' AYNI SHA-256'li STL
      # uretiyordu (kase her musteriye "PRUVO" yaziyordu). Bu adim `tip: "metin"` parametresi
      # olan HER aileyi (jenerator/urunler dizin taramasi; elle liste YOK) alir ve iki farkli
      # metnin derleyiciye giden -D bayrak kumesini FARKLI uretmesini sart kosar. Gizli-eslem
      # aileleri Pages CI'da (sir yok) ⚪ OLCULEMEDI sayilir ve raporlanir; TAM kapsam gizli
      # paketi ceken onizleme-imaj.yml'de --paket ile kosar. Offline, <1 s. Oz-nobetcileri
      # (govde inertlik) HER kosumda bloklayici isler.
      - name: Metin eslem kapisi (musteri yazisi derleyiciye ulasiyor mu)
        run: python3 tools/metin-eslem-test.py

      # METIN BEYAZ LISTE KAPISI (sessiz kusur, 29 Tem): sunucu derleyicisi
      # (onizleme/derleyici/server.py metin_temizle) beyaz liste DISI karakteri
      # (& / ( ) : ...) SESSIZCE DUSURUR; konfiguratorde uyari yalniz cerceve `yazi`
      # alanina (cerceveDurumu) bagliydi, dogrula()nin generic `metin` dalina DEGIL —
      # olculdu: kaseye "AHMET & OGULLARI", jetona "A/B (1)" HIC uyari cikmadan geciyor,
      # musteri istediginden FARKLI urun aliyordu. Kontrol dogrula() yoluna tasindi ->
      # ayni kapiyi Worker da (shop/src/parametrik.js KONF.dogrula) kullanir; sunucu
      # tavani/beyaz listesi GEVSEMEDI, sizdirdigi sinif kapandi. Bu adim `tip: "metin"`
      # parametresi olan HER aileyi jenerator/urunler DIZIN TARAMASIYLA bulur (elle liste
      # YOK) ve dort ekseni olcer: (A) kesif bos degil + taban degerler gecerli,
      # (B) 7 kirli vaka × her alan GORUNUR hata uretir, (C) 8 temiz vaka × her alan
      # gecerli kalir (yanlis-pozitif = 0 — bu eksen olmadan "her metni reddet" mutanti
      # yesil kalirdi), (D) Worker kirliyi "parametre-araligi" ile REDDEDER.
      # KIRMIZI-MUTASYON (olculdu): kontrol satiri silinir / no-op yapilir -> 24 iddia
      # kirmizi; tersine cevrilir -> 31 iddia kirmizi. OFFLINE: ag/wrangler/openscad YOK,
      # urunler.json OKUNMAZ, dosya yazmaz, <1 s. node gerekir (setup-node yukarida
      # bloklayici on-kosul).
      - name: Metin beyaz liste kapisi (musteri metni sessizce budanmiyor mu)
        run: node jenerator/test/metin-beyaz-liste.mjs

      # VITRIN KABUL KAPISI (jenerator/test/vitrin-kabul.js) — 30 Tem'e kadar CI'da HIC
      # kosmuyordu ve YERELDE DE kirmizi duruyordu (7 testten 6'si HIC calismiyordu).
      # NE KORUR (ana sayfanin kendisi, jenerator degil): gizli "Jeneratör" kategorisi nav'da
      # GORUNMEZ + 12 gorunur kategori tam · ?kategori=Jeneratör gorunumu yalniz sari urun
      # cizer · sari kart fiyati sema tabanFiyatTL'siyle BIREBIR (+ harita yokken fallback) ·
      # banner yalniz ana sayfada · ilk 4 kart sari · taban-fiyatlar.js semalarla birebir ·
      # edge kart sekli build.py kart_ozeti ile birebir · edge uc/parametre sozlesmesi ve
      # "ana sayfa AGA CIKMAZ" iddiasi. index.html'in GERCEK inline scripti node:vm'de kosar.
      # NEDEN SIMDI YESIL: index.html'de EDGE_KATALOG=true oldugu icin acilis ozet.json +
      # Worker /katalog|/ara isterken testin sahte fetch'i `ok`/`status` TASIMIYORDU ->
      # sayfa "HTTP undefined" basip test ALTYAPI HATASI veriyordu. Artik test bagimliligi
      # KENDI KURUYOR: ozet.json'u `build.py --sadece-ozet` uretir (sekil tek kaynak) ve
      # /katalog|/ara icin sunucusuz TASIMA taklidi kullanilir. Ag/sunucu/openscad YOK.
      # FAIL-CLOSED: bayrak/damga/artefakt dogrulanamazsa test PATLAR (mutasyonla kanitlandi) —
      # bayat ozet.json'la ya da kazara TAM BUILD ile sessizce yesil yanamaz.
      # Arama SEMANTIGI burada iddia EDILMEZ (o parite-test.js/parite-ege.js isi).
      # Node 20.20.2 ve 25.x'te 9/0 olculdu. build.py'nin yalniz erken-donus kollari cagrilir
      # (--sadece-ozet / --sadece-taban) -> 14k sayfa uretimi ve yasal sayfa damgasi TETIKLENMEZ.
      - name: "Vitrin kabul kapisi (gizli Jeneratör kategorisi + sari kart fiyati + banner + edge sozlesmesi)"
        run: node jenerator/test/vitrin-kabul.js

      # URUN DENETIM KAPISI (madde 32, 31 Tem). 31 Tem'e kadar urun kurallarinin —
      # uretim-sureci ifsasi ("3D baski" demiyoruz) + fiyat tabani — TEK korumasi bir
      # mimarin bunu ELLE kosturmasiydi. Artik her itmede bloklayici.
      # 🔴 FIYAT TABANI KAPSAMI GENISLEDI (Okan karari 31 Tem): 200 TL taban artik TUM
      # kategorilerde gecerli (eskiden yalniz Marin). Istisna: parametrik/Jeneratör sari
      # seri ve fiyat alani BOS kayit. OLCULDU: canli katalogda 15.907 kapsam ici kaydin
      # 1.761'i taban ALTI — bunlar ONCEDEN VAR OLAN ihlal sayildigi icin (asagidaki
      # 'onceden' filtresi) itmeleri BLOKLAMAZ; YENI/DEGISEN taban-alti fiyat BLOKLAR.
      # 🔴 NEDEN BAYRAKSIZ KOL DEGIL: varsayilan PARTI tanimi "calisma agaci EKSI HEAD"tir;
      # CI fresh checkout'unda ikisi AYNIDIR -> parti DAIMA BOS. OLCULDU: git archive HEAD ile
      # kurulan temiz checkout'ta bayraksiz kol rc=0 / "yeni urun: 0" / tum sayaclar 0 basiyor.
      # Bayraksiz kol baglansaydi OLU NOBETCI olurdu. `--commit-farki` ayni soruyu CI'da
      # anlamli eksende sorar: HEAD^ -> HEAD arasinda urunler.json'a eklenen/DEGISEN kayitlar.
      # (actions/checkout `fetch-depth: 0` yukarida zorunlu on-kosul; shallow olursa kapi
      # sessizce yesile donmez -> OLCULEMEDI rc 3 ile YAYINI DURDURUR.)
      # 🔴 BLOKLAYAN SEY: yalniz BU ITMENIN GETIRDIGI ihlal. Katalogda 332 onceden var olan
      # ihlal duruyor (canli; ayri temizlik isi); ayni (id,kapi,gerekce) HEAD^'te de varsa
      # RAPOR edilir, BLOKLAMAZ. Gevsetme degil AYIRMA: olculdu, ham halde baglansaydi
      # urun-metnine hic dokunmayan toplu fiyat islemi bile (68837f62: 12.458 kayit -> 417
      # ihlal; 1606e166: 12.195 -> 288) tum ekibin itmesini durdururdu.
      # YANLIS-POZITIF NOBETI (OLCULDU): son 25 gercek urun commit'i 25/25 YESIL. Daha derin
      # 6 commit'lik ornekte 1 KIRMIZI cikti (a27010ed marin-d35, 5 ifsa) — ve o GERCEK
      # POZITIF: bir sonraki commit (4e9711e8) tam o kayitlari ELLE temizleyen hijyen
      # commit'i. Yani kapi, insanin sonradan elle onardigi seyi itme aninda yakaliyor.
      # Gizli .urun-kaynaklari.json'a BAGLI DEGIL: cikis kodu yalniz `ihlal` kumesinden
      # turer, lisans ekseni (auto_sil) cikisi hic etkilemez -> gizli kayitli/kayitsiz
      # olcum BIREBIR ayni (332/332). Saf Python, agsiz, ~10 s.
      - name: "Urun denetim kapisi (uretim-sureci ifsasi + 200 TL fiyat tabani/TUM katalog — bu itmenin GETIRDIGI ihlal)"
        run: python3 tools/denetim-kapisi.py --commit-farki

      # GRAMER ARTIGI KAPISI (madde 46'nin eksik halkasi, 31 Tem): 332 kayitlik toplu
      # yeniden yazimda kural tabanli degisim, tetikleyici kelime cumleden cikinca
      # GRAMERSIZ ENKAZ birakiyordu ("En ince bolgesi yla olculur", "dik konumda ve
      # uretilir"). O turda yazilan nobetci ISCININ SCRATCHPAD'INDE kaldi, repoya HIC
      # girmedi -> bir sonraki toplu yazimda ayni enkaz sessizce canliya cikardi.
      # YENI EKSEN: cumle-ICI yetim ek (eski nobetci ancak noktalamaya YAPISIK hali
      # goruyordu). Yanlis-pozitif kurallari CANLI KATALOG uzerinde olculdu: ham 4257
      # aday -> kesme isareti/tire ile bitisik olanlar (WhatsApp'tan = 1881), "de/da"
      # baglaci (1197), "ya da" (599), tek harfli marka eki (e-tron/i-MiEV/U tipi, 28)
      # elenerek 0'a indi. Bugunku canli katalogda (15.597 kayit) vurus 0 -> HAM
      # bloklayici baglanabildi (denetim-kapisi gibi --commit-farki'na AYIRMAK
      # GEREKMEDI). urunler.json DIZI degilse / taban kume altindaysa OLCULEMEDI (3).
      # Saf Python, agsiz, ~1 s.
      # KISALTMA MUAFIYETI (7 Agu 2026): `cift-noktalama` kolunun `\.\s*,` dali 2 gunde
      # IKI kez yayini durdurdu — 5 Agu sira sayisi ("7., 8. ve 9. nesil"), 7 Agu Turkce
      # kisaltma ("Redbull vb., 54mm cap"); ikisi de MESRU yazim, kusur betikteydi ve
      # `serit-a3` kirmizi olunca deploy+yayin SKIPPED kaldi. Kol artik tekil string
      # yamasiyla degil TEK yargi noktasiyla daraltiliyor: nokta oncesi jeton RAKAM ya
      # da KANONIK KISALTMA (`KISALTMALAR`, tek kaynak) ise muaf, BASKA HER SEY ihlal.
      # OLU NOBETCI DEGIL: mutasyon surucusu REPODA durur ->
      #   python3 tools/gramer-kisaltma-mutasyon.py   (8/8 mutant olduruldu; taban
      #   oz-test 96 iddia. Kume bosaltma/genel gevsetme/kol silme/maskeleme/kablo
      #   kopmasi ayri ayri KIRMIZI yakiyor.)
      - name: "Gramer artigi kapisi (toplu yeniden yazim enkazi + cumle-ici yetim ek)"
        run: python3 tools/gramer-artigi-kapisi.py
      - name: Gorsel anahtar + STL bbox kabul testi (R2 anahtar cakismasi + olcu birimi)
        run: |
          python3 tools/gorsel-anahtar-test.py
          python3 tools/stl-bbox-binary-test.py
      - name: Marka filtre + yargi (silah) kabul testi
        run: |
          python3 tools/marka-filtre-test.py
          python3 tools/yargi-firearm-test.py
      # PARA EKSENI: siparis kaydi, olculmemis siparis nobeti, yazdirma dokumu.
      - name: Siparis kabul testleri (siparisler + olculmemis siparis + yazdir)
        run: |
          python3 tools/siparisler-test.py --agsiz
          python3 tools/siparis-maske-test.py
          python3 tools/olculmemis-siparis-test.py
          python3 tools/yazdir-test.py
          python3 tools/siparis-kanal-goc-test.py
      # VARLIK EKSENI: tekrar eden CSS/JS icerik-adresli /varlik/<ad>-<hash> dosyalarina
      # tasindi (yayin ~1,03 GB -> ~0,61 GB; Pages siniri ~1 GB). Iki hata sinifi SESSIZ:
      # ayni adin ustune yazmak (BAYAT varlik servis edilir) ve satir-ici cekirdegin harici
      # dosyayla IKIZLESMESI. Kapi 10 ekseni olcer; mutasyon nobeti kapinin OLU olmadigini
      # (ve M6 kontrol mutantiyla "her seye kirmizi yanan" olmadigini) kanitlar.
      # build.py'den ONCE kosar: kendi sinirli ornegini kendisi render eder.
      - name: Varlik (ortak CSS/JS harici dosya) kabul testi + mutasyon nobeti
        run: |
          python3 tools/varlik-test.py
          python3 tools/varlik-mutasyon.py
      - name: Urun-AI kapisi kabul testi (thing-codex izin kapisi varsayilan KAPALI)
        run: python3 tools/thing-codex-test.py
      # ARAMA PARITE karar-cekirdegi: AGSIZ kollar (canliya 0 istek). Ag'a vuran
      # tools/parite-test.js ve 217 s'lik parite-mutasyon-test.js MUAF KALIR.
      # YAYIN PENCERESI kolu: taslak (yayinda=0) satirin "gecici yayin gecikmesi" ile
      # "GERCEK KAYIP"tan ayrilmasi. Kendi sahte yayin-hali komutunu kullanir; canli D1'e
      # SIFIR sorgu atar, bot deposu yoksa Ege senaryolarini ATLAR (CI'da o depo yoktur).
      # OLCEK EKSENI (tavan): supurme tavani SABIT yazilirsa katalog buyudugunde sahte
      # kirmizi uretir (olculdu: katalog 20.212 > sabit 20.000 -> 526 sahte kirmizi).
      # Bu kol tavanin KATALOGDAN turedigini, ust sinirin DURDUGUNU ve asilirsa hukmun
      # ACIK OLCULEMEDI oldugunu olcer; sahte yerel HTTP ucu kullanir, canliya 0 istek.
      # Tavan kolu `--kendini-test` ile kosar: MUTASYON BATARYASI da BURADA kosar, cunku
      # batarya CI disinda kalirsa mutasyon kaniti SESSIZCE bayatlar (olculdu 10 Agu 2026:
      # mutlak sinir degisince M4 capasi koreldi, kabul kolu YESIL kalirken kanit dusmustu).
      # Batarya da tamamen AGSIZDIR ve ~2 sn surer, bu kolun sozlesmesini bozmaz.
      - name: Arama parite karar-cekirdegi (sozlesme + fikstur + yayin penceresi + tavan, AGSIZ)
        run: |
          python3 tools/parite-sozlesme-test.py
          node tools/parite-fikstur-test.js
          node tools/parite-yayin-fikstur-test.js
          node tools/parite-tavan-test.js --kendini-test
          node tools/parite-etiket-test.js
      # shop birim testleri: wrangler/ag/D1 ISTEMEZ (modulu dogrudan import ederler).
      # OLU NOBETCI DEGIL: `wa-siparis.mjs`in YETKI YUZEYI iddialari (panel koku "Ege
      # anahtari anonimden fazlasini almiyor" + ozellik-kapali "YONET_ANAHTAR yoksa yazma
      # yolu da kapali") icin mutasyon surucusu REPODA durur -> `python3 tools/
      # wa-yetki-mutasyon.py` (CI'da kosmaz; gelistirici/curutucu araci). Cift yonlu:
      # 2 ayirt edici KIRMIZI (her biri TEK-EKSEN) + 1 genis KIRMIZI + 2 kontrol YESIL.
      - name: Shop birim kabul testleri (siparis e-postasi + reklam atif ucu + WhatsApp siparis ucu)
        run: |
          node shop/test/eposta.mjs
          node shop/test/ref-route.mjs
          node shop/test/wa-siparis.mjs

      # ONIZLEME VAAT KAPISI (2026-08-03, PARA + MUSTERI BEYANI — SESSIZ-HATA).
      # OLCULEN ARIZA: sema kapisi (KONF.dogrula) 'gecerli:true' derken uretim ucu
      # (/ic-derle) AYNI seti assert ile reddediyordu; o bolgede fiyat URETILIYOR ve
      # siparis kabul ediliyordu (petek %50,0 / cetvel %66,7 / kase %83,3 uretilemez;
      # olculen ornek: petek kabartma -> 60000 kurus tahsil edilebilir, uretim ucu 400).
      # Ayrica urun sayfasi bu bolgede "siparis verebilirsiniz, uretim etkilenmez"
      # YANLIS VAADINI basiyordu. Kapi iki ekseni birden tutar ve YAPISALDIR:
      # ONIZLEME_KISITLAR'da beyani olan aile HACIM_DOGRULANMIS_AILELER'de OLAMAZ ->
      # yarin yeni bir kisit beyan edilirse o aile kendiliginden satista KALAMAZ.
      # node ZORUNLU (setup-node yukarida BLOKLAYICI on-kosul; yoksa fail-closed
      # kirmizi — regex ile "sanki okumus gibi" yapilmaz, GERCEK secenekler.js kosar).
      # Offline, urunler.json OKUNMAZ, dosya YAZILMAZ. ~1 s.
      - name: Onizleme vaat kapisi (uretilemez konfigurasyonun satis kapisi + musteri metni)
        run: python3 tools/onizleme-vaat-kapisi.py
      # ================= MUAFIYET DENETIMI BLOGU SONU =================================

      # ONIZLEME KISIT KOSUL TESTI (2026-08-03, MUSTERI BEYANI — SESSIZ-HATA).
      # Yukaridaki kapi "beyan VAR mi + metin dogru mu" der; BU test beyanin
      # HUKMUNU kosturur. Vida'nin uretilemez bolgesi KOSULLUDUR (sema: urun_tipi=civata
      # iken cap>=5), kisit beyani da kosullu (`eger`) yazildi. Kosul ele alinmazsa
      # mil/somun/pul x M3-M4 (izgaranin ~%13,6'si) URETILEBILIR oldugu halde bloklanir
      # ve musteriye "bu secenekle siparis alinmiyor" YANLIS vaadi basilir.
      # Ayni 9 vaka UC KATMANDA ayri olculur (sema dogrulamasi · urun sayfasi on-kontrolu ·
      # GERCEK worker) ve 3 oldurucu + 1 kontrol mutanti kosar; mutasyon DAIMA kopyaya,
      # canli agac sha256 basta==sonda. node ZORUNLU (setup-node yukarida BLOKLAYICI
      # on-kosul; yoksa fail-closed KIRMIZI). Offline, urunler.json OKUNMAZ, depoya
      # YAZMAZ, ~3 s.
      - name: Onizleme kisit kosul testi (kosullu `eger` beyani her tuketicide AYNI hukum)
        run: python3 tools/onizleme-kisit-kosul-test.py

      # MODEL UYELIGI — /marka/<marka>/<model>/ SAYFASI ile ANA SAYFA FILTRESI AYNI URUNLERI
      # GOSTERIYOR MU (2026-08-04). OLCULEN SESSIZ HATA: model kirilimi YALNIZ `marka[1]`den
      # aciliyordu, ana sayfa filtresi ise dizinin HER elemanina HAM esitlikle bakiyordu ->
      # 429 marka-model ciftinin 119'unda sayfa filtreden DAR, 28'inde filtre sayfadan dar,
      # 366 urun etkileniyordu. Iki yuzey de KENDI ICINDE tutarli gorundugu icin kimse hata
      # GORMUYOR: musteri sayfada gordugu parcayi filtrede bulamiyor (ya da tersi).
      #
      # KAPI NE OLCER: her yayimlanan model sayfasi icin SAYFA kumesi ile FILTRE kumesini
      # karsilastirip `CIFT/TEMIZ/SAYFA_DAR/FILTRE_DAR/ETKILENEN_URUN` basar; esik
      # SAYFA_DAR=0 · FILTRE_DAR=0 · CAPRAZ=0. FILTRE tarafi YENIDEN YAZILMAZ: index.html'in
      # GERCEK kodu (norm + MARKA KURATORLUGU + KANONIK MODEL ESLEMESI bloklari) AYIKLANIP
      # node ile kosturulur — Python'da bir "filtre portu" yazilsaydi kapi uretimi degil kendi
      # varsayimini aynalardi. node YOKSA / blok ayiklanamazsa / katalog bossa rc=2
      # (OLCULEMEDI), "sapma bulamadim" diye YESIL DEMEZ.
      # Ayrica kilitlenenler: K4 yanlis-pozitif (sayfaya giren her urun o model jetonunu
      # BAGIMSIZ normallestirmeyle GERCEKTEN tasiyor) · K5 her sayfa kendi adiyla
      # sorgulanabilir · K7 bir MARKA'yi MODEL diye sunan sayfa YOK (yargi arama.py KAPALI
      # MARKA KUMESI'nden) · K8 bilesik marka aynasi otoriteyle birebir · K10 bilesik marka
      # anahtari iki tarafta da bolunmemis · K11 rozet disi cift sayfa olmaz VE urun kaybolmaz ·
      # K9/K12 kuratorlu tablolarin kimligi donmus (sessiz genisleme KIRMIZI).
      #
      # KUSAK/VARYANT KATLAMASI EKSENI (2026-08-04): kusak jetonu ayri kovada kaliyordu —
      # `?ara=Golf` 317 urun getirirken /marka/volkswagen/golf/ 182 gosteriyordu; dusenin
      # 21'i `Golf 4`/`Golf Mk4`/`Golf IV`/`Golf R` gibi AYRI kanonik kovalardi ve 9'u
      # ESIK=3 altinda kaldigi icin HICBIR model sayfasinda yoktu. Katalog geneli: B kovasi
      # 735 urun. Katlama TEK YONLUdur (varyant tabana duser, taban varyanta DUSMEZ) ve
      # UYUM VAADI DEGILDIR: katlanan urunler sayfada kusak basligi altinda AYRI bolumde
      # durur. Kilitlenen yeni eksenler: K13 katlama kurali FIKSTURE uyuyor + JS ile Python
      # AYNI okuma (377 sonda) · K14 ayrim RENDER EDILMIS HTML'de duruyor (ana listede
      # kusak-ozel urun 0; veriden degil sayfadan olculur ki renderer mutanti yakalansin) ·
      # K15 farkli-arac istisnasi (kusak-disi jeton tablosu) aynasi+kimligi donmus ve
      # urunu taban sayfaya SIZMIYOR.
      #
      # SIZINTI / DENY / KURATORLU ESLEME EKSENI (2026-08-04, mimar hukmu): canlida
      # /marka/ford/focus-st/ (8 urun) · /fiesta-st/ (3) · /ecoboost/ (3) duruyordu — `ST`
      # donanim paketi, `EcoBoost` motor ailesi, ikisi de MODEL degil; Focus ve Fiesta'yi
      # BOLEREK kendi sayfalarini acmislardi. Ayrica /transporter/ (44 urun) ile /t3/ /t4/
      # /t5/ /t6/ (97 urun) AYNI ARAC oldugu halde ayri duruyordu.
      # K16 "degistirici sekilli" YAYIN kumesi donmus envanterle BIREBIR (birim KUME, sayi
      # DEGIL: bir sayfa olup biri dogunca sayi sabit kalir, sapma gizlenirdi) ·
      # K17 model-olmayan (marka, jeton) ciftinin yayimlanan kovasi 0 VE urunu kaybolmadi
      # (tabloyu OKUYARAK degil, jeneratoru KOSTURARAK olculur) ·
      # K18 kuratorlu kusak eslemesi aynasi+kimligi donmus, urun taban sayfaya ULASTI ve
      # kusagin KENDI sayfasi KAPANMADI ·
      # K19 CAPRAZ-MARKA (ROZET) TUTARLILIGI — ILERIYE DONUK: ayni kanonik model adi IKI
      # markada birden sayfa esigini geciyorsa cift ya deny (ROZET_DISI_CIFT) ya allow
      # (ROZET_CAPRAZ_IZINLI) tablosunda OLMALI; ikisinde de yoksa KIRMIZI. Olculdu (4 Agu):
      # (Peugeot, Berlingo) 9 urunle, (Peugeot, DS) 3 urunle CANLIDA duruyordu, (Opel,
      # Berlingo) esigin dibinde bekliyordu. Birim KUME (sayi DEGIL) ve olcut "sayfa
      # DOGURACAK MI" (yayimlandi mi DEGIL) — aksi halde deny tablosu kendi kanitini silerdi.
      # K20 CIPLAK TEK HARF JETON (kararsiz jeton SINIF 1, 4 Agu): "K" tek basina model adi
      # DEGILDIR, `K Serisi`nin ciplak yazimidir. Olculdu (17.962 urun): BMW altinda `K`
      # (1 urun) ile `K Serisi` (1 urun) AYRI kovalardi; `K` kovasi ESIK'i gectigi gun
      # /marka/bmw/k/ TEK HARFLI sayfasi SESSIZCE dogacakti. Kural fiksturle civili ve
      # ETKISI olculur (ayri kova 0 · tabana ulasmayan urun 0 · kaybolan 0) + POZITIF CAPA:
      # marka-KOR bir kural `Opel Astra K` (12 urun) ve `Renault 5` (11 urun, RAKAM = gercek
      # model) sayfalarini oldururdu; ikisi de yayinda kalmali.
      # Offline (yalniz urunler.json + index.html okunur), diske YAZMAZ.
      # Olculdu: 3,1 s -> 3,6 s (ayni makinede katlama ONCESI 5,7 s idi; kusakTabanlari
      # bellegi hem kapiyi hem ana sayfa filtresini hizlandirdi -> serit A3 UZAMADI).
      - name: "Model uyeligi kapisi (marka/model sayfasi <-> ana sayfa filtresi paritesi)"
        run: python3 tools/model-uyelik-kapisi.py

      # MODEL UYELIK YUKLEMI — UC KOL (5 Agu 2026, mimar hukmu):
      #   ham `uyum[].model` ∪ `model_kanon` (kusak/kanon) ∪ BASLIKTA TAM KELIME
      # Kabul CAKILI CAPALARA karsi olcer (Vitara 27->66 · Transporter 145 · Golf 300 …),
      # kendi urettigi kumeye DEGIL (totoloji). Ayrica kademeli kurali (guvenli jeton /
      # tehlike sinifi) ve bitisikligin `markaKatla()`DAN BAGIMSIZ oldugunu civiler.
      # Mutasyon bataryasi (18 oldurucu + 4 kontrol, 18 AYIRT EDICI kirmizi kume):
      #   python3 tools/model-baslik-kolu-test.py --kendini-test
      # Offline (yalniz urunler.json + index.html okunur), diske YAZMAZ.
      - name: "Model baslik kolu kabul (uc kol + tehlike sinifi + yargisiz sayfa dogmaz)"
        run: python3 tools/model-baslik-kolu-test.py

      # FIYAT TIPI NORMALIZASYONU — `build.load_products()` fiyat alanini tipe gore
      # normalize eder. BLOKLAYICI olmasinin gerekcesi CLAUDE.md'de yazili: odeme-fiyat
      # SESSIZ-HATA sinifidir (int fiyat feed'i cokertirse ya da string fiyat sessizce
      # degisirse ekranda "850 TL" gorunmeye devam eder). Test SENTETIK fikstur uretir:
      # urunler.json'a DOKUNMAZ, diske YAZMAZ, agi KULLANMAZ. Olculdu: 0,1 sn — serit-a3
      # suresine katkisi olcum gurultusu icinde (memory/maliyet-tasimasi-serit-dusurur.md
      # ekseni: adim yayin kritik yolunda BILEREK birakildi, cunku kirmizisi para eksenidir).
      - name: "Fiyat tipi normalizasyonu kabul (int/string/desteklenmeyen tip fail-closed)"
        run: python3 tools/fiyat-tipi-test.py

      # 🔴 AYNI KAPININ MUTASYON BATARYASI `nobet.yml` `serit-b` JOB'UNDADIR.
      # Bayraksiz GERCEK katalog olcumu burada BLOKLAYICI kalir; yalniz aracin
      # KENDINI sinayan pahali mutant kopyalari yayin kritik yolundan ayrilmistir.
      # KANCA KABLOLAMASI (tools/kanca-kablolama-nobeti.py --ci) — kancalar artik
      # `.git/hooks` altinda (commit EDILMEYEN, elle duzenlenen) dosyalar degil,
      # IZLENEN `tools/kancalar` kaynagidir; kablolamayi tools/kanca-kur.py kurar.
      # Bu nobetci tools/kanca-nobeti.py'nin OLCMEDIGI ekseni sahiplenir: bir
      # kanca beklenen araci CAGIRIYOR olup yine de HICBIR SEYI BLOKLAMIYOR
      # olabilir. 4 Agu 2026'da olculen hal tam buydu:
      #     python3 "$guard" --tetik commit >/dev/null 2>&1 || true
      # `tools/urunler-guard.py` FAIL-LOUD bir nobetciye cevrilmisti ama git
      # tarafinda cikis kodunu KIMSE OKUMUYORDU -> koruma yalniz bu makinenin
      # oturum kablosuyla (PreToolUse) blokluyor, DUZ TERMINALDE / CODEX'TE /
      # BASKA MAKINEDE bloklamiyordu.
      #
      # 🔴 NEDEN SERIT-A3 (BLOKLAYICI: `deploy: needs`te) — `envanter`/`ifsa-nobeti`/
      # `mesaj-nobeti`den FARKI: onlar PUSH-SONRASI CANLI durumu raporlar, yayini
      # durdurmanin tamir degeri sifirdir. Bu adim ise izlenen KANCA KAYNAGININ
      # fail-open'a donup donmedigini olcer — biri `|| true` geri koyarsa ya da
      # guard cagrisini silerse. O kaynak main'e girip `kanca-kur.py` ile HER
      # makineye yayilirsa katalog guard'i · D1 senkronu · mimar kapisi · mukerrer ·
      # commit-mesaji sizinti kapisi SESSIZCE susar. Bu PUSH-ONCESI kaynak
      # butunlugu eksenidir ve is-akisi-kapisi'nin kendisi gibi BLOKLAYICI olmali
      # ("SUPHEDE A", is-akisi Bolum D). Kabul testi + mutasyon turu ise "aracin
      # kendini sinamasi"dir ve SERIT B'dedir (orada TEK TEK beyanli).
      #
      # 🔴 NEDEN `--ci`: kablolama `core.hooksPath`te yasar ve `.git/` COMMIT
      # EDILMEZ -> CI checkout'unda ASLA kurulu degildir. O ekseni CI'da kirmizi
      # yakmak yanlis-pozitif olurdu; sessizce yesil saymak ise fail-open'i geri
      # getirirdi. `--ci` hali YALNIZ kablolama/sapma eksenlerini OLCULEMEDI olarak
      # ILAN EDER (log'da GORUNUR) ve cikis kodunu ETKILEMEZ; BASKA bir eksen
      # olculemezse cikis YINE sifir-disidir (muafiyet DAR — kabul testi olcer).
      # CI'da olculen sey IZLENEN KAYNAKTIR: govdeler fail-closed mi, reddetme
      # gerekcesi basiliyor mu, cagrilar duruyor mu, dosyalar git INDEKSINDE 100755
      # mi. Tamamen offline; taze klonda rc=0 oldugu KOSULARAK olculdu.
      - name: "Kanca kablolama nobeti (izlenen kaynak fail-closed mi)"
        run: python3 tools/kanca-kablolama-nobeti.py --ci

  # ═════════════════════════════════════════════════════════════════════════════
  # SERIT A4 — HERMETIK YEDEK GLOB KOD YOLU
  # ═════════════════════════════════════════════════════════════════════════════
  # OLCULEN OLGU (10 Agu 2026, son 3 basarili kosum ortalamasi): serit-a4 3736 sn;
  # model uyeligi KENDINI-TEST 2815 sn, model baslik KENDINI-TEST 907 sn, kalan
  # 9 adim yaklasik 13 sn. Iki arac kendi mutant fiksturunu olcer; canli katalog
  # iddiasi bayraksiz kollarla serit-a3'te kalir. TASIMA SONRASI BEKLENTI:
  # 3736 - 2815 - 907 = 14 sn (TAHMIN; sonraki CI kosumunda olculecek).
  #
  # Iki model KENDINI-TEST bataryasi 10 Agu 2026'da `nobet.yml` `serit-b`ye tasindi.
  # Bayraksiz uretim kollari `serit-a3`te BLOKLAYICI kalir. Bu job yalniz hermetik
  # yedek glob kod yolunu tasir ve `deploy: needs` zincirinde kalir.
  serit-a4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # YEDEK GLOB KOD YOLU — HERMETIK ALT KUME (7 Agu 2026). BLOKLAYICI, continue-on-error YOK.
      # 🔴 NEDEN ALT KUME, TAM BATARYA DEGIL: `tools/yedekle-test.py` bayraksiz kosumu
      # gercek `~/.claude/skills` agacina, Drive mount'una ve repo kokundeki GITIGNORE'LU
      # dosyalara bakar. OLCULDU (temiz klon + bos HOME + kardes ev yok): rc=1, 220 kontrol,
      # 6 ORTAM KAYNAKLI kirmizi -> bloklayici baglansaydi TUM ekibin yayini YANLIS-POZITIF
      # ile dururdu. Ayrica 13/13e/14 bolumleri flock + paralel kosum + 2000 orneklik
      # zamanlama olcer (paylasilan kosucuda FLAKE sinifi). Tam batarya bu yuzden hala
      # ci-kapsam-test.py'de gerekceli MUAF; CI'ya baglanan sey `--hermetik` koludur.
      # 🔴 KABUL CIKIS KODU DEGIL, BASILAN IDDIA SAYISI ([[kapi-yan-etkisi-gizli-onkosul]]):
      # kol "HERMETIK IDDIA SAYISI: <n>" basar ve kendi ASGARI esigini (yedekle-test.py
      # icindeki HERMETIK_ASGARI, TEK KAYNAK — buraya sayi YAZILMAZ) fail-closed olcer.
      # Kume kirpilirsa/bosalirsa kol KIRMIZI yanar, sessizce bos kosamaz. Tam batarya da
      # ayrica SERIT PARITESI olcer: bu kolun bastigi sayi ile yerindeki sayi ESIT olmali.
      # OLCULDU (ayni CI taklidi): rc=0, 60 iddia, 61 kontrol, 0 kirmizi, ~4 s.
      - name: "Yedek glob kod yolu — hermetik alt kume (kok + alt-dizin deger kilidi)"
        run: python3 tools/yedekle-test.py --hermetik
  # ═════════════════════════════════════════════════════════════════════════════
  # BURADA BIR ZAMANLAR 6 BLOKLAMAYAN JOB VARDI -> `.github/workflows/nobet.yml`
  # ═════════════════════════════════════════════════════════════════════════════
  # `envanter · cron-nabzi · d1-kadans · mesaj-nobeti · serit-b · hacim-tam-takim`
  # 5 Agu 2026'da AYRI bir is akisina TASINDI (kopyalanmadi). Gerekce ve olculen
  # maliyet nobet.yml basligindadir; ozet: bu joblar `deploy: needs` zincirinde
  # DEGILDI, yani yayini DURDURMUYORLARDI, ama kirmizilari BU KOSUMUN genel
  # `conclusion`'ini `failure` yapiyor ve "yayin durdu" yanlis hukmunu uretiyordu.
  #
  # 🔴 GERI TASIMA YASAK — KOSULAN KAPIYLA: tools/is-akisi-kapisi.py :: BOLUM G
  # bu dosyadaki HER job'un Pages yayin job'una `needs:` ile (ileri ya da geri)
  # BAGLI olmasini SART kosar. Buraya bloklamayan bir job geri konursa kapi KIRMIZI
  # yanar. Tek muaf: yayin job'unun ARDILLARI (`yayin`), cunku onlarin kirmizisi
  # yayin zincirinin KENDI kusurudur.
  # ⚠️ `deploy: needs` listesi bu ayrimla KUCULMEDI: bir seridi listeden dusurmek
  #    hala SESSIZ FAIL-OPEN'dir ve ayni BOLUM G iddiasi onu KIRMIZI yakar.


  deploy:
    # 🔴 HER SERIT BURADA: bir serit bu listeden dusurulurse o seritteki
    # kapilarin kirmizisi yayini DURDURMAZ (sessiz fail-open).
    # tools/is-akisi-kapisi.py::_serit_b_joblar bunu gecisli olcer;
    # tools/deploy-aclik-kapisi.py::e2_degerlendir URETIM ZINCIRI eksenini olcer.
    needs: [build, serit-a2, serit-a3, serit-a4]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e yayinla
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Cloudflare cache temizle
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret yok — cache purge atlandi (Cloudflare edge TTL ile ~5 dk icinde yenilenir)."
            exit 0
          fi
          sleep 10   # Pages origin'in yeni icerigi sunmasi icin kisa bekleme
          echo "Cloudflare cache temizleniyor (purge_everything)..."
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/d3a78b8c8ce2a25c127bf02e728ac7b1/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

  # ═════════════════════════════════════════════════════════════════════════════
  # ATOMIK YAYIN — "karti gorunen urun asla 404 vermez" (31 Tem)
  # ═════════════════════════════════════════════════════════════════════════════
  # OLCULEN PENCERE (bu isin VAR OLMA SEBEBI): D1 (Ege'nin okudugu yer) push'tan ONCE
  # yazilir (.git/hooks/pre-push), Pages deploy'u ise CI'nin SONUNDA biter. Son 8 basarili
  # kosumda push -> canli MEDYAN 593 sn (9,9 dk), max 740 sn; CI kirmizi olursa pencere
  # kirmizi kaldigi surece surer (run#1079..1082: 3.241 sn = 54 dk, 98 urun D1'de + 404).
  # CANLI TEYIT 31 Tem 07:33Z: 8/8 yeni id D1'de, ornek 3 urun sayfasi 3/3 HTTP 404.
  #
  # BU IS: deploy BITTIKTEN sonra kosar; D1'deki TASLAK (yayinda=0) satirlar icin
  # /urun/<id>/ CANLIDA 200 dondugu FIILEN dogrulanir ve ancak o zaman tek UPDATE ile
  # yayinda=1 yazilir. Dogrulanamayan urun TASLAK KALIR = Ege gostermez = 404 uretilemez.
  #
  # NEDEN `needs: deploy` VE AYRI IS: yayin adimi deploy'dan ONCE kosarsa dogrulayacak
  # sayfa henuz yayinda degildir (kapinin kendisi anlamsizlasir).
  # NEDEN continue-on-error YOK: bu isin kirmizisi SITEYI etkilemez (deploy zaten bitti),
  # yalnizca "yayina alinamadi" halini GORUNUR kilar. Fail-open yapilsaydi taslaklar
  # sessizce birikir, Ege katalogun bir kismini SURESIZ goremezdi.
  yayin:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # npx wrangler (d1-sync'in D1 istemcisi) icin.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: "Atomik yayin: canli 200 dogrulanan taslaklari yayina al"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secret yok — yayin adimi KOSAMADI (taslaklar taslak kalir)."
            exit 1
          fi
          python3 tools/yayin-kapisi.py --yayinla
      - name: "Atomik yayin durumu (taslak/yayinda sayilari)"
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 tools/yayin-kapisi.py --durum
